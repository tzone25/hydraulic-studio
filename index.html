<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hydraulic Studio">
<title>Hydraulic Studio</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,Arial,sans-serif;background:#080d18;color:#e8edf7}
button,input,select{font:inherit}
button{cursor:pointer}
:root{
 --bg:#080d18;
 --panel:#0e1626;
 --panel2:#111c2f;
 --line:#263650;
 --text:#e8edf7;
 --muted:#8996aa;
 --accent:#4da3ff;
 --green:#35d07f;
 --orange:#ffb347;
 --red:#ff5f6d;
 --blue:#55aaff;
}
.app{height:100%;display:flex;flex-direction:column}
.topbar{
 height:58px;min-height:58px;background:#0d1525;border-bottom:1px solid var(--line);
 display:flex;align-items:center;padding:0 12px;gap:10px;z-index:20
}
.logo{font-size:18px;font-weight:800;white-space:nowrap}
.logo span{color:var(--accent)}
.top-actions{display:flex;gap:7px;margin-left:auto}
.btn{
 border:1px solid var(--line);background:#121e32;color:var(--text);
 border-radius:8px;padding:8px 11px;font-weight:700
}
.btn:hover{background:#18263e}
.btn.primary{background:#1469ad;border-color:#2387d8}
.btn.danger{background:#4a1720;border-color:#7c2634}
.btn.success{background:#123c2a;border-color:#237a52}
.btn.small{padding:6px 8px;font-size:12px}
.workspace{flex:1;display:grid;grid-template-columns:210px 1fr 285px;min-height:0}
.sidebar,.inspector{
 background:var(--panel);border-right:1px solid var(--line);overflow:auto
}
.inspector{border-left:1px solid var(--line);border-right:0}
.panel-title{
 padding:13px 12px 8px;font-size:12px;text-transform:uppercase;
 letter-spacing:1px;color:#94a5be;font-weight:800
}
.library{padding:0 8px 12px}
.comp{
 display:flex;align-items:center;gap:9px;width:100%;text-align:left;
 border:1px solid transparent;background:#101a2b;color:var(--text);
 padding:9px;border-radius:8px;margin-bottom:5px
}
.comp:hover{border-color:#345172;background:#14233a}
.comp-icon{
 width:30px;height:30px;border-radius:6px;background:#182a43;
 display:grid;place-items:center;font-size:17px;flex:none
}
.comp-name{font-size:12px;font-weight:700}
.comp-sub{font-size:10px;color:var(--muted);margin-top:2px}
.canvas-wrap{position:relative;overflow:hidden;background:#09101d}
#canvas{
 width:100%;height:100%;display:block;
 background-color:#09101d;
 background-image:
 linear-gradient(rgba(80,120,170,.07) 1px,transparent 1px),
 linear-gradient(90deg,rgba(80,120,170,.07) 1px,transparent 1px);
 background-size:20px 20px;
 touch-action:none;
}
.canvas-tools{
 position:absolute;top:10px;left:10px;display:flex;gap:6px;z-index:5
}
.canvas-tools .btn{background:rgba(13,21,37,.92);backdrop-filter:blur(8px)}
.connection{
 position:absolute;left:50%;top:10px;transform:translateX(-50%);
 padding:8px 12px;background:#163453;border:1px solid #2b72aa;
 border-radius:20px;font-size:12px;font-weight:800;display:none;z-index:6
}
.selected-badge{
 position:absolute;bottom:10px;left:10px;background:rgba(13,21,37,.92);
 border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:11px;display:none
}
.status{
 height:30px;min-height:30px;background:#0a111f;border-top:1px solid var(--line);
 display:flex;align-items:center;padding:0 10px;gap:18px;font-size:11px;color:var(--muted)
}
.status strong{color:var(--text)}
.section{border-bottom:1px solid #1c2940;padding-bottom:10px}
.form{padding:0 12px}
.field{margin:8px 0}
.field label{
 display:block;color:#8f9db2;font-size:10px;text-transform:uppercase;
 letter-spacing:.5px;margin-bottom:4px;font-weight:800
}
.field input,.field select{
 width:100%;background:#0a1220;color:var(--text);
 border:1px solid var(--line);border-radius:6px;padding:7px 8px;outline:none
}
.field input:focus,.field select:focus{border-color:#347fba}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 10px 10px}
.metric{
 background:#0a1322;border:1px solid #1d2b42;border-radius:7px;padding:7px
}
.metric .v{font-size:15px;font-weight:800}
.metric .l{font-size:9px;color:#8493a9;text-transform:uppercase;margin-top:2px}
.monitor-row{
 display:flex;justify-content:space-between;gap:8px;padding:5px 10px;
 font-size:11px;border-bottom:1px solid #18243a
}
.monitor-row span:last-child{font-weight:800;color:#dce6f4}
.alert{
 margin:7px 10px;padding:8px;border-radius:7px;font-size:11px;
 border:1px solid #49303a;background:#24131a
}
.alert.warn{border-color:#5d4b2b;background:#241d12}
.alert.ok{border-color:#28563e;background:#102319}
.mobile-nav{display:none}
.sheet{display:none}
svg text{user-select:none}
.wire{
 fill:none;stroke:#53647d;stroke-width:3;stroke-linecap:round;
 vector-effect:non-scaling-stroke
}
.wire.low{stroke:#4978a9}
.wire.med{stroke:#4da3ff}
.wire.high{stroke:#ffb347}
.wire.danger{stroke:#ff5967}
.wire.no-flow{stroke:#435067}
.flow-arrow{fill:#fff;opacity:.9}
.component{cursor:pointer}
.component rect,.component circle,.component path,.component line,.component polygon{
 vector-effect:non-scaling-stroke
}
.component.selected .body{stroke:#54b2ff!important;stroke-width:3!important}
.port{fill:#d7e1ee;stroke:#07101c;stroke-width:2;cursor:pointer}
.port:hover{fill:#4da3ff}
.comp-label{font-size:11px;fill:#dce7f5;font-weight:800}
.comp-value{font-size:9px;fill:#7f93ad}
@media(max-width:850px){
 .topbar{height:54px;min-height:54px;padding:0 9px}
 .logo{font-size:16px}
 .top-actions .desktop-only{display:none}
 .workspace{display:block;position:relative}
 .sidebar,.inspector{
   display:none;position:absolute;z-index:30;left:0;right:0;bottom:0;
   top:auto;height:auto;max-height:72%;border:1px solid var(--line);
   border-radius:16px 16px 0 0;background:#0c1525;
   box-shadow:0 -15px 50px rgba(0,0,0,.45)
 }
 .sidebar.open,.inspector.open{display:block}
 .canvas-tools{top:8px;left:8px}
 .canvas-tools .hide-mobile{display:none}
 .status{display:none}
 .mobile-nav{
   display:grid;grid-template-columns:repeat(5,1fr);
   height:64px;min-height:64px;background:#0d1525;border-top:1px solid var(--line);
   padding-bottom:env(safe-area-inset-bottom);z-index:40
 }
 .mobile-nav button{
   border:0;background:none;color:#8290a5;font-size:10px;font-weight:800
 }
 .mobile-nav button.active{color:#54b2ff}
 .mobile-nav span{display:block;font-size:20px;margin-bottom:2px}
 .sheet{display:block;padding:8px 12px;border-bottom:1px solid var(--line)}
 .sheet-head{display:flex;align-items:center;justify-content:space-between}
 .sheet-title{font-size:13px;font-weight:800}
 .close-sheet{background:none;border:0;color:#a5b3c7;font-size:20px}
 .connection{top:8px}
}
</style>
</head>

<body>
<div class="app">

<header class="topbar">
 <div class="logo">Hydraulic <span>Studio</span></div>
 <div style="font-size:10px;color:#74839a">ENGINEERING SIMULATOR</div>
 <div class="top-actions">
   <button class="btn small desktop-only" onclick="newCircuit()">New</button>
   <button class="btn small desktop-only" onclick="loadExample()">Example</button>
   <button class="btn small desktop-only" onclick="saveCircuit()">Save</button>
   <button class="btn small desktop-only" onclick="loadCircuit()">Load</button>
   <button class="btn small primary" id="runBtn" onclick="toggleSimulation()">▶ Run</button>
 </div>
</header>

<div class="workspace">

<aside class="sidebar" id="library">
 <div class="sheet">
  <div class="sheet-head">
   <div class="sheet-title">Components</div>
   <button class="close-sheet" onclick="closePanels()">×</button>
  </div>
 </div>
 <div class="panel-title">Sources</div>
 <div class="library">
  <button class="comp" onclick="addComponent('tank')"><div class="comp-icon">▱</div><div><div class="comp-name">Reservoir / Tank</div><div class="comp-sub">T return</div></div></button>
  <button class="comp" onclick="addComponent('pump')"><div class="comp-icon">◉</div><div><div class="comp-name">Fixed Pump</div><div class="comp-sub">Positive displacement</div></div></button>
  <button class="comp" onclick="addComponent('variablePump')"><div class="comp-icon">◉</div><div><div class="comp-name">Variable Piston Pump</div><div class="comp-sub">Pressure compensated</div></div></button>
  <button class="comp" onclick="addComponent('accumulator')"><div class="comp-icon">◎</div><div><div class="comp-name">Accumulator</div><div class="comp-sub">Gas charged</div></div></button>
 </div>

 <div class="panel-title">Directional / Control</div>
 <div class="library">
  <button class="comp" onclick="addComponent('valve43')"><div class="comp-icon">⇆</div><div><div class="comp-name">4/3 Directional Valve</div><div class="comp-sub">Closed / tandem / float</div></div></button>
  <button class="comp" onclick="addComponent('valve42')"><div class="comp-icon">⇄</div><div><div class="comp-name">4/2 Directional Valve</div><div class="comp-sub">Extend / retract</div></div></button>
  <button class="comp" onclick="addComponent('proportional')"><div class="comp-icon">≈</div><div><div class="comp-name">Proportional Valve</div><div class="comp-sub">Command controlled</div></div></button>
  <button class="comp" onclick="addComponent('relief')"><div class="comp-icon">↗</div><div><div class="comp-name">Relief Valve</div><div class="comp-sub">Pressure limiting</div></div></button>
  <button class="comp" onclick="addComponent('reducing')"><div class="comp-icon">↓</div><div><div class="comp-name">Pressure Reducing</div><div class="comp-sub">Downstream limit</div></div></button>
  <button class="comp" onclick="addComponent('sequence')"><div class="comp-icon">S</div><div><div class="comp-name">Sequence Valve</div><div class="comp-sub">Pressure operated</div></div></button>
  <button class="comp" onclick="addComponent('counterbalance')"><div class="comp-icon">CB</div><div><div class="comp-name">Counterbalance</div><div class="comp-sub">Load control</div></div></button>
 </div>

 <div class="panel-title">Flow Control</div>
 <div class="library">
  <button class="comp" onclick="addComponent('check')"><div class="comp-icon">→</div><div><div class="comp-name">Check Valve</div><div class="comp-sub">One-way flow</div></div></button>
  <button class="comp" onclick="addComponent('flowControl')"><div class="comp-icon">◁</div><div><div class="comp-name">Flow Control</div><div class="comp-sub">Adjustable restriction</div></div></button>
  <button class="comp" onclick="addComponent('throttleCheck')"><div class="comp-icon">⇥</div><div><div class="comp-name">Throttle Check</div><div class="comp-sub">Free return / throttle</div></div></button>
  <button class="comp" onclick="addComponent('filter')"><div class="comp-icon">▤</div><div><div class="comp-name">Filter</div><div class="comp-sub">Pressure drop</div></div></button>
 </div>

 <div class="panel-title">Actuators</div>
 <div class="library">
  <button class="comp" onclick="addComponent('cylinder')"><div class="comp-icon">▣</div><div><div class="comp-name">Double Acting Cylinder</div><div class="comp-sub">A / B chambers</div></div></button>
  <button class="comp" onclick="addComponent('motor')"><div class="comp-icon">↻</div><div><div class="comp-name">Hydraulic Motor</div><div class="comp-sub">Torque / speed</div></div></button>
 </div>

 <div class="panel-title">Instrumentation</div>
 <div class="library">
  <button class="comp" onclick="addComponent('gauge')"><div class="comp-icon">◉</div><div><div class="comp-name">Pressure Gauge</div><div class="comp-sub">Local pressure</div></div></button>
  <button class="comp" onclick="addComponent('flowmeter')"><div class="comp-icon">↝</div><div><div class="comp-name">Flow Meter</div><div class="comp-sub">Local flow</div></div></button>
 </div>
</aside>

<main class="canvas-wrap" id="canvasWrap">
 <svg id="canvas" xmlns="http://www.w3.org/2000/svg"></svg>

 <div class="canvas-tools">
  <button class="btn small" onclick="zoomIn()">＋</button>
  <button class="btn small" onclick="zoomOut()">−</button>
  <button class="btn small" onclick="resetView()">⌂</button>
  <button class="btn small hide-mobile" onclick="loadExample()">Example</button>
  <button class="btn small" onclick="toggleFlowArrows()">⇢</button>
  <button class="btn small" onclick="togglePressureColors()">P</button>
 </div>

 <div class="connection" id="connectionBanner">Tap a port to connect</div>
 <div class="selected-badge" id="selectedBadge"></div>
</main>

<aside class="inspector" id="inspector">
 <div class="sheet">
  <div class="sheet-head">
   <div class="sheet-title">Properties / Monitor</div>
   <button class="close-sheet" onclick="closePanels()">×</button>
  </div>
 </div>
 <div id="inspectorContent"></div>
</aside>

</div>

<div class="status">
 <div>Objects: <strong id="objectCount">0</strong></div>
 <div>Connections: <strong id="connectionCount">0</strong></div>
 <div>Pressure: <strong id="statusPressure">0 bar</strong></div>
 <div>Flow: <strong id="statusFlow">0 L/min</strong></div>
 <div>Mode: <strong id="statusMode">STOPPED</strong></div>
</div>

<nav class="mobile-nav">
 <button onclick="mobilePanel('library')" id="navComponents"><span>☷</span>Components</button>
 <button onclick="closePanels()" id="navCircuit" class="active"><span>⌁</span>Circuit</button>
 <button onclick="toggleSimulation()" id="navRun"><span>▶</span>Simulate</button>
 <button onclick="showMonitor()" id="navMonitor"><span>▣</span>Monitor</button>
 <button onclick="mobilePanel('inspector')" id="navProperties"><span>⚙</span>Properties</button>
</nav>

</div>

<script>
/* ============================================================
   HYDRAULIC STUDIO V5
   Self-contained browser hydraulic engineering simulator
   ============================================================ */

const svg = document.getElementById("canvas");
const wrap = document.getElementById("canvasWrap");

let components = [];
let connections = [];
let selected = null;
let selectedPort = null;
let running = false;
let flowArrows = true;
let pressureColors = true;
let zoom = 1;
let panX = 0;
let panY = 0;
let simTime = 0;
let raf = null;
let idCounter = 1;
let touchStart = null;

const TYPES = {
 tank:{
  name:"Reservoir / Tank",ports:["T"],defaults:{volume:100,temp:25}
 },
 pump:{
  name:"Fixed Pump",ports:["IN","OUT"],defaults:{displacement:16,rpm:1450,efficiency:.90}
 },
 variablePump:{
  name:"Variable Piston Pump",ports:["IN","OUT"],defaults:{displacement:32,rpm:1450,efficiency:.92,swash:75,compensator:250}
 },
 accumulator:{
  name:"Accumulator",ports:["P"],defaults:{volume:20,precharge:100,maxPressure:250}
 },
 valve43:{
  name:"4/3 Directional Valve",ports:["P","T","A","B"],
  defaults:{position:"extend",centre:"closed",flowRating:120}
 },
 valve42:{
  name:"4/2 Directional Valve",ports:["P","T","A","B"],
  defaults:{position:"extend",flowRating:120}
 },
 proportional:{
  name:"Proportional Valve",ports:["P","T","A","B"],
  defaults:{command:70,flowRating:120}
 },
 relief:{
  name:"Relief Valve",ports:["P","T"],defaults:{setting:210,cracking:0.5}
 },
 reducing:{
  name:"Pressure Reducing Valve",ports:["IN","OUT"],defaults:{setting:120}
 },
 sequence:{
  name:"Sequence Valve",ports:["IN","OUT"],defaults:{setting:100}
 },
 counterbalance:{
  name:"Counterbalance Valve",ports:["IN","OUT","PILOT"],defaults:{setting:100,pilotRatio:3}
 },
 check:{
  name:"Check Valve",ports:["IN","OUT"],defaults:{cracking:0.5}
 },
 flowControl:{
  name:"Flow Control",ports:["IN","OUT"],defaults:{opening:100,maxFlow:80,mode:"meter-in"}
 },
 throttleCheck:{
  name:"Throttle Check",ports:["IN","OUT"],defaults:{opening:100,maxFlow:70,mode:"meter-in"}
 },
 filter:{
  name:"Filter",ports:["IN","OUT"],defaults:{rating:150,restriction:0.3}
 },
 cylinder:{
  name:"Double Acting Cylinder",ports:["A","B"],defaults:{
   bore:100,rod:50,stroke:500,load:50000,friction:1500,
   position:100,maxSpeed:300
  }
 },
 motor:{
  name:"Hydraulic Motor",ports:["IN","OUT"],defaults:{
   displacement:80,loadTorque:100,speedLimit:2500
  }
 },
 gauge:{
  name:"Pressure Gauge",ports:["P"],defaults:{}
 },
 flowmeter:{
  name:"Flow Meter",ports:["IN","OUT"],defaults:{}
 }
};

const ICONS={
 tank:"▱",pump:"◉",variablePump:"◉",accumulator:"◎",
 valve43:"⇆",valve42:"⇄",proportional:"≈",relief:"↗",
 reducing:"↓",sequence:"S",counterbalance:"CB",check:"→",
 flowControl:"◁",throttleCheck:"⇥",filter:"▤",cylinder:"▣",
 motor:"↻",gauge:"◉",flowmeter:"↝"
};

function clone(o){return JSON.parse(JSON.stringify(o))}
function uid(){return "C"+(idCounter++)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function n(v,d=0){v=parseFloat(v);return Number.isFinite(v)?v:d}
function fmt(v,d=1){return Number.isFinite(v)?v.toFixed(d):"0"}
function barToKpa(b){return b*100}
function hydraulicPower(flow,pressure){return flow*pressure/600}
function areaMm2(d){return Math.PI*d*d/4}
function areaM2(d){return areaMm2(d)/1e6}

function addComponent(type,x=null,y=null){
 const t=TYPES[type];
 const c={
  id:uid(),type,
  x:x===null?220+components.length*35:x,
  y:y===null?180+components.length*25:y,
  w:type==="cylinder"?150:110,
  h:type==="cylinder"?70:70,
  label:t.name,
  p:clone(t.defaults),
  runtime:{
   pressure:0,flow:0,pressureIn:0,pressureOut:0,
   force:0,velocity:0,torque:0,speed:0,
   open:false,warning:""
  }
 };
 components.push(c);
 selected=c.id;
 render();
 updateInspector();
 return c;
}

function getComp(id){return components.find(c=>c.id===id)}
function getPortNames(c){return TYPES[c.type].ports}

function portPos(c,port){
 const names=getPortNames(c);
 if(c.type==="cylinder"){
  return port==="A"
   ? {x:c.x,y:c.y+c.h/2}
   : {x:c.x+c.w,y:c.y+c.h/2};
 }
 if(c.type==="tank")return {x:c.x+c.w/2,y:c.y};
 if(names.length===1)return {x:c.x+c.w/2,y:c.y};
 const i=names.indexOf(port);
 if(names.length===2){
  return i===0
   ? {x:c.x,y:c.y+c.h/2}
   : {x:c.x+c.w,y:c.y+c.h/2};
 }
 const coords={
  P:{x:c.x,y:c.y+18},
  T:{x:c.x,y:c.y+c.h-18},
  A:{x:c.x+c.w,y:c.y+18},
  B:{x:c.x+c.w,y:c.y+c.h-18},
  PILOT:{x:c.x+c.w/2,y:c.y+c.h}
 };
 return coords[port]||{x:c.x,y:c.y};
}

function transformPoint(clientX,clientY){
 const r=svg.getBoundingClientRect();
 return {
  x:(clientX-r.left-panX)/zoom,
  y:(clientY-r.top-panY)/zoom
 };
}

function render(){
 svg.innerHTML="";
 const g=document.createElementNS("http://www.w3.org/2000/svg","g");
 g.setAttribute("transform",`translate(${panX} ${panY}) scale(${zoom})`);

 connections.forEach((cn,i)=>drawConnection(g,cn,i));
 components.forEach(c=>drawComponent(g,c));

 svg.appendChild(g);

 document.getElementById("objectCount").textContent=components.length;
 document.getElementById("connectionCount").textContent=connections.length;
 document.getElementById("statusMode").textContent=running?"RUNNING":"STOPPED";
 document.getElementById("runBtn").textContent=running?"■ Stop":"▶ Run";

 if(selected){
  const c=getComp(selected);
  document.getElementById("selectedBadge").style.display="block";
  document.getElementById("selectedBadge").textContent=c?c.label:"";
 }else{
  document.getElementById("selectedBadge").style.display="none";
 }
}

function drawConnection(g,cn,index){
 const a=getComp(cn.a.c),b=getComp(cn.b.c);
 if(!a||!b)return;
 const p1=portPos(a,cn.a.p),p2=portPos(b,cn.b.p);
 const mid=(p1.x+p2.x)/2;

 let d=`M ${p1.x} ${p1.y} `;
 if(Math.abs(p2.x-p1.x)>35){
  d+=`C ${mid} ${p1.y}, ${mid} ${p2.y}, ${p2.x} ${p2.y}`;
 }else{
  const my=(p1.y+p2.y)/2;
  d+=`C ${p1.x+35} ${my}, ${p2.x-35} ${my}, ${p2.x} ${p2.y}`;
 }

 const path=document.createElementNS("http://www.w3.org/2000/svg","path");
 path.setAttribute("d",d);
 path.setAttribute("class","wire "+wireClass(cn));
 path.dataset.index=index;
 path.onclick=e=>{
  e.stopPropagation();
  if(confirm("Delete this connection?")){
   connections.splice(index,1);
   render();
   updateInspector();
  }
 };
 g.appendChild(path);

 if(flowArrows && Math.abs(p2.x-p1.x)>40){
  const t=.5;
  const x=p1.x+(p2.x-p1.x)*t;
  const y=p1.y+(p2.y-p1.y)*t;
  const q=document.createElementNS("http://www.w3.org/2000/svg","text");
  q.setAttribute("x",x);
  q.setAttribute("y",y-5);
  q.setAttribute("text-anchor","middle");
  q.setAttribute("class","flow-arrow");
  q.textContent=cn.flow>0?"▶":cn.flow<0?"◀":"";
  g.appendChild(q);
 }
}

function wireClass(cn){
 if(!pressureColors)return "";
 const p=cn.pressure||0;
 if(Math.abs(cn.flow||0)<0.05)return "no-flow";
 if(p>210)return "danger";
 if(p>120)return "high";
 if(p>20)return "med";
 return "low";
}

function drawComponent(g,c){
 const group=document.createElementNS("http://www.w3.org/2000/svg","g");
 group.setAttribute("class","component "+(selected===c.id?"selected":""));
 group.setAttribute("transform",`translate(${c.x} ${c.y})`);
 group.dataset.id=c.id;

 const body=document.createElementNS("http://www.w3.org/2000/svg","rect");

 drawSymbol(group,c);

 if(c.runtime.pressure!==undefined){

 getPortNames(c).forEach(port=>{

 };

function drawSymbol(g,c){

 s.setAttribute("x",cx);s.setAttribute("y",cy+7);
 s.setAttribute("text-anchor","middle");

 }else if(c.type==="pump"||c.type==="variablePump"){
  s.textContent=c.type==="variablePump"?"◉↗":"◉";
 }else if(c.type==="cylinder"){
  s.textContent="▣";
 }else if(c.type==="motor"){
  s.textContent="↻";
 }else if(c.type==="valve43"){
  s.textContent=c.p.position==="extend"?"→":"←";

 }else if(c.type==="proportional"){

 }else if(c.type==="relief"){
  s.textContent="↗";

  s.textContent="↓";
 }else if(c.type==="sequence"){
  s.textContent="S";
 }else if(c.type==="counterbalance"){
  s.textContent="CB";

function selectComponent(id){
 selected=id;
 render();
 updateInspector();
}

function portClick(cid,port){
 if(!selectedPort){
  selectedPort={c:cid,p:port};
  showConnection("Tap another port to connect");
  return;
 }

 if(selectedPort.c===cid && selectedPort.p===port){
  selectedPort=null;
  hideConnection();
  return;
 }

 if(isValidConnection(selectedPort,{c:cid,p:port})){
  connections.push({
   id:"L"+(connections.length+1),
   a:selectedPort,b:{c:cid,p:port},
   flow:0,pressure:0
  });
 }

 selectedPort=null;
 hideConnection();
 render();
 updateInspector();
}

function isValidConnection(a,b){
 if(a.c===b.c)return false;
 return true;
}

function showConnection(txt){
 const el=document.getElementById("connectionBanner");
 el.textContent=txt;el.style.display="block";
}
function hideConnection(){document.getElementById("connectionBanner").style.display="none"}

function startDrag(e,c){
 e.preventDefault();
 const start=transformPoint(e.clientX,e.clientY);
 const ox=c.x,oy=c.y;
 const move=ev=>{
  const p=transformPoint(ev.clientX,ev.clientY);
  c.x=ox+(p.x-start.x);
  c.y=oy+(p.y-start.y);
  render();
 };
 const up=()=>{
  document.removeEventListener("mousemove",move);
  document.removeEventListener("mouseup",up);
 };
 document.addEventListener("mousemove",move);
 document.addEventListener("mouseup",up);
}

function startTouchDrag(e,c){
 const t=e.touches[0];
 const start=transformPoint(t.clientX,t.clientY);
 const ox=c.x,oy=c.y;
 const move=ev=>{
  if(ev.touches.length!==1)return;
  const p=transformPoint(ev.touches[0].clientX,ev.touches[0].clientY);
  c.x=ox+(p.x-start.x);
  c.y=oy+(p.y-start.y);
  render();
 };
 const up=()=>{
  document.removeEventListener("touchmove",move);
  document.removeEventListener("touchend",up);
 };
 document.addEventListener("touchmove",move,{passive:false});
 document.addEventListener("touchend",up);
}

svg.addEventListener("mousedown",e=>{
 if(e.target===svg){
  selected=null;selectedPort=null;hideConnection();render();updateInspector();
 }
});

svg.addEventListener("touchstart",e=>{
 if(e.touches.length===2){
  touchStart={
   distance:distance(e.touches[0],e.touches[1]),
   zoom
  };
 }
},{passive:true});

svg.addEventListener("touchmove",e=>{
 if(e.touches.length===2 && touchStart){
  const d=distance(e.touches[0],e.touches[1]);
  zoom=clamp(touchStart.zoom*d/touchStart.distance,.45,2.4);
  render();
 }
},{passive:true});

svg.addEventListener("touchend",e=>{
 if(e.touches.length<2)touchStart=null;
});

function distance(a,b){
 return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
}

function zoomIn(){zoom=clamp(zoom*1.15,.45,2.4);render()}
function zoomOut(){zoom=clamp(zoom/1.15,.45,2.4);render()}
function resetView(){zoom=1;panX=0;panY=0;render()}

function componentEngineering(c){
 if(c.type==="pump"||c.type==="variablePump"){
  const disp=n(c.p.displacement),rpm=n(c.p.rpm),eff=n(c.p.efficiency,1);
  const theoretical=disp*rpm/1000;
  const actual=theoretical*eff*(c.type==="variablePump"?n(c.p.swash,100)/100:1);
  return `<div class="monitor-row"><span>Theoretical flow</span><span>${fmt(theoretical)} L/min</span></div>
  <div class="monitor-row"><span>Actual available flow</span><span>${fmt(actual)} L/min</span></div>
  <div class="monitor-row"><span>Pressure power</span><span>${fmt(hydraulicPower(actual,c.runtime.pressure))} kW</span></div>`;
 }
 if(c.type==="cylinder"){
  const Aa=areaMm2(n(c.p.bore));
  const Ab=areaMm2(n(c.p.bore))-areaMm2(n(c.p.rod));
  const ratio=Aa/Ab;
  return `<div class="monitor-row"><span>Cap area</span><span>${fmt(Aa,0)} mm²</span></div>
  <div class="monitor-row"><span>Rod area</span><span>${fmt(Ab,0)} mm²</span></div>
  <div class="monitor-row"><span>Area ratio</span><span>${fmt(ratio,2)} : 1</span></div>
  <div class="monitor-row"><span>Position</span><span>${fmt(c.p.position,1)} mm</span></div>`;
 }
 if(c.type==="filter"){
  return `<div class="monitor-row"><span>Current ΔP</span><span>${fmt(c.runtime.pressureIn-c.runtime.pressureOut)} bar</span></div>`;
 }
 if(c.type==="relief"){
  return `<div class="monitor-row"><span>Setting</span><span>${fmt(c.p.setting)} bar</span></div>
  <div class="monitor-row"><span>Status</span><span>${c.runtime.open?"OPEN / DUMPING":"CLOSED"}</span></div>`;
 }
 return "";
}

/* ============================================================
   HYDRAULIC NETWORK SOLVER
   ============================================================ */

let system={
 maxPressure:0,
 totalFlow:0,
 power:0,
 tankPresent:false,
 pumpPresent:false,
 reliefDumping:false
};

function solve(){
 resetRuntime();

 system.tankPresent=components.some(c=>c.type==="tank");
 system.pumpPresent=components.some(c=>["pump","variablePump"].includes(c.type));

 if(!system.tankPresent||!system.pumpPresent){
  updateStatus();
  return;
 }

 const nodes=buildNodes();

 /* Initial pressure estimate */
 const pump=components.find(c=>["pump","variablePump"].includes(c.type));
 const pumpFlow=pumpAvailableFlow(pump);

 let sourcePressure=0;

 /* Estimate pressure needed by actuators */
 components.forEach(c=>{
  if(c.type==="cylinder"){
   const A=areaM2(c.p.bore);
   const loadPressure=(n(c.p.load)+n(c.p.friction))/(A*100000);
   sourcePressure=Math.max(sourcePressure,loadPressure+8);
  }
  if(c.type==="motor"){
   const torquePressure=n(c.p.loadTorque)*2*Math.PI/
     (n(c.p.displacement,80)*1e-6*2*Math.PI);
   sourcePressure=Math.max(sourcePressure,torquePressure/1e5);
  }
 });

 const reliefs=components.filter(c=>c.type==="relief");
 const reliefSetting=reliefs.length?Math.min(...reliefs.map(c=>n(c.p.setting,210))):9999;

 sourcePressure=clamp(sourcePressure,0,reliefSetting);

 /* Iterative network approximation */
 for(let pass=0;pass<8;pass++){
  sourcePressure=calculatePressureDemand(pump,sourcePressure,pumpFlow,reliefSetting);
 }

 solveConnections(sourcePressure);
 solveComponents(sourcePressure,pumpFlow);

 system.maxPressure=Math.max(
  sourcePressure,
  ...components.map(c=>n(c.runtime.pressure))
 );
 system.totalFlow=pumpFlow;
 system.power=hydraulicPower(pumpFlow,system.maxPressure);

 updateStatus();
}

function resetRuntime(){
 components.forEach(c=>{
  c.runtime={
   pressure:0,flow:0,pressureIn:0,pressureOut:0,
   force:0,velocity:0,torque:0,speed:0,
   open:false,warning:""
  };
 });
 connections.forEach(l=>{
  l.flow=0;l.pressure=0;
 });
}

function pumpAvailableFlow(c){
 if(!c)return 0;
 let f=n(c.p.displacement)*n(c.p.rpm)*n(c.p.efficiency,.9)/1000;
 if(c.type==="variablePump")f*=clamp(n(c.p.swash,100)/100,0,1);
 if(c.runtime.warning==="worn")f*=.72;
 return Math.max(0,f);
}

function calculatePressureDemand(pump,current,flow,reliefSetting){
 let demand=current;

 components.forEach(c=>{
  if(c.type==="cylinder"){
   const A=areaM2(c.p.bore);
   const required=(n(c.p.load)+n(c.p.friction))/(A*100000);
   const velocityTarget=flow/(Math.PI*n(c.p.bore)*n(c.p.bore)/4)*16666;
   if(required>demand)demand=required;
   if(velocityTarget<0)demand+=5;
  }

  if(c.type==="motor"){
   const disp=n(c.p.displacement,80);
   const torque=n(c.p.loadTorque,100);
   const p=torque*20*Math.PI/disp;
   demand=Math.max(demand,p);
  }

  if(c.type==="counterbalance"){
   demand=Math.max(demand,n(c.p.setting));
  }

  if(c.type==="sequence"){
   if(hasPressureSourceTo(c.id,"IN"))demand=Math.max(demand,n(c.p.setting));
  }
 });

 /* restriction losses */
 let drop=0;
 components.forEach(c=>{
  if(c.type==="filter")drop+=n(c.p.restriction,.3)*(flow/100)**2;
  if(c.type==="flowControl"||c.type==="throttleCheck"){
   const open=clamp(n(c.p.opening,100)/100,.01,1);
   drop+=(flow/(n(c.p.maxFlow,80)*open))**2*8;
  }
  if(["valve43","valve42","proportional"].includes(c.type)){
   const rating=n(c.p.flowRating,120);
   drop+=(flow/rating)**2*2;
  }
 });

 demand+=drop;
 return clamp(demand,0,reliefSetting);
}

function buildNodes(){
 const parent={};
 const find=x=>{
  parent[x]??=x;
  if(parent[x]!==x)parent[x]=find(parent[x]);
  return parent[x];
 };
 const union=(a,b)=>{
  a=find(a);b=find(b);
  if(a!==b)parent[b]=a;
 };

 components.forEach(c=>getPortNames(c).forEach(p=>parent[c.id+":"+p]=c.id+":"+p));

 connections.forEach(l=>{
  union(l.a.c+":"+l.a.p,l.b.c+":"+l.b.p);
 });

 return {parent,find,union};
}

function solveConnections(sourcePressure){
 const nodes=buildNodes();

 connections.forEach(l=>{
  const a=getComp(l.a.c),b=getComp(l.b.c);
  if(!a||!b)return;

  const pa=effectivePortPressure(a,l.a.p,sourcePressure);
  const pb=effectivePortPressure(b,l.b.p,sourcePressure);
  const dp=pa-pb;

  l.pressure=Math.max(pa,pb);

  /* directional flow approximation */
  let resistance=1;

  [a,b].forEach(c=>{
   if(c.type==="filter")resistance+=n(c.p.restriction,.3)*2;
   if(c.type==="flowControl"||c.type==="throttleCheck"){
    const open=clamp(n(c.p.opening,100)/100,.02,1);
    resistance+=8/(open*open);
   }
   if(["valve43","valve42","proportional"].includes(c.type))resistance+=1.5;
  });

  let flow=dp===0?0:Math.sign(dp)*Math.min(250,Math.sqrt(Math.abs(dp)/Math.max(.05,resistance))*15);

  if(Math.abs(flow)<.05){
   /* pump-to-actuator path gets a positive flow indication */
   if(isPumpSide(a,l.a.p)||isPumpSide(b,l.b.p))flow=Math.min(10,Math.abs(dp));
  }

  l.flow=flow;
 });
}

function isPumpSide(c,p){
 return (c.type==="pump"||c.type==="variablePump")&&p==="OUT";
}

function effectivePortPressure(c,port,sourcePressure){
 let p=0;

 if(c.type==="tank")return 0;

 if(c.type==="pump"){
  if(port==="OUT")p=sourcePressure;
  else p=0;
 }

 if(c.type==="variablePump"){
  if(port==="OUT")p=sourcePressure;
  else p=0;
 }

 if(c.type==="cylinder"){
  if(port==="A")p=c.runtime.pressureA||0;
  if(port==="B")p=c.runtime.pressureB||0;
 }

 if(c.type==="gauge"||c.type==="flowmeter")p=sourcePressure;

 if(["relief","reducing","sequence","counterbalance","check","flowControl","throttleCheck","filter"].includes(c.type)){
  p=sourcePressure;
 }

 if(["valve43","valve42","proportional"].includes(c.type)){
  if(port==="P")p=sourcePressure;
  else if(port==="T")p=0;
  else{
   if(c.type==="valve43"&&c.p.position==="retract"&&port==="B")p=sourcePressure;
   else if(c.type==="valve43"&&c.p.position==="extend"&&port==="A")p=sourcePressure;
   else if(c.type==="valve42"&&c.p.position==="retract"&&port==="B")p=sourcePressure;
   else if(c.type==="valve42"&&c.p.position==="extend"&&port==="A")p=sourcePressure;
  }
 }

 return Math.max(0,p);
}

function solveComponents(sourcePressure,pumpFlow){
 components.forEach(c=>{
  switch(c.type){

   case"pump":
   case"variablePump":
    c.runtime.pressure=sourcePressure;
    c.runtime.pressureOut=sourcePressure;
    c.runtime.flow=pumpFlow;
    break;

   case"tank":
    c.runtime.pressure=0;
    c.runtime.flow=connections
     .filter(l=>l.a.c===c.id||l.b.c===c.id)
     .reduce((s,l)=>s+Math.abs(l.flow),0);
    break;

   case"relief":{
    const set=n(c.p.setting,210);
    c.runtime.pressure=sourcePressure;
    c.runtime.pressureIn=sourcePressure;
    c.runtime.pressureOut=0;
    c.runtime.open=sourcePressure>=set*.995;
    c.runtime.flow=c.runtime.open?Math.max(0,pumpFlow-demandFlow()):0;
    break;
   }

   case"filter":{
    c.runtime.pressureIn=sourcePressure;
    const dp=n(c.p.restriction,.3)*(pumpFlow/100)**2;
    c.runtime.pressureOut=Math.max(0,sourcePressure-dp);
    c.runtime.pressure=(c.runtime.pressureIn+c.runtime.pressureOut)/2;
    c.runtime.flow=pumpFlow;
    if(dp>10)c.runtime.warning="Filter restriction high";
    break;
   }

   case"flowControl":
   case"throttleCheck":{
    const open=clamp(n(c.p.opening,100)/100,.01,1);
    const max=n(c.p.maxFlow,80)*open;
    c.runtime.flow=Math.min(pumpFlow,max);
    c.runtime.pressure=sourcePressure;
    c.runtime.pressureIn=sourcePressure;
    c.runtime.pressureOut=Math.max(0,sourcePressure-
      8*Math.pow(c.runtime.flow/Math.max(1,max),2));
    break;
   }

   case"reducing":{
    c.runtime.pressureIn=sourcePressure;
    c.runtime.pressureOut=Math.min(sourcePressure,n(c.p.setting,120));
    c.runtime.pressure=c.runtime.pressureOut;
    c.runtime.flow=pumpFlow;
    break;
   }

   case"sequence":{
    c.runtime.pressureIn=sourcePressure;
    c.runtime.open=sourcePressure>=n(c.p.setting,100);
    c.runtime.pressureOut=c.runtime.open?sourcePressure:0;
    c.runtime.pressure=c.runtime.pressureIn;
    c.runtime.flow=c.runtime.open?pumpFlow:0;
    break;
   }

   case"counterbalance":{
    c.runtime.pressureIn=sourcePressure;
    c.runtime.open=sourcePressure>=n(c.p.setting,100);
    c.runtime.pressure=sourcePressure;
    c.runtime.flow=c.runtime.open?pumpFlow:0;
    break;
   }

   case"check":{
    c.runtime.pressure=sourcePressure;
    c.runtime.pressureIn=sourcePressure;
    c.runtime.pressureOut=Math.max(0,sourcePressure-n(c.p.cracking,.5));
    c.runtime.flow=pumpFlow;
    break;
   }

   case"valve43":
    solveDirectional43(c,sourcePressure,pumpFlow);
    break;

   case"valve42":
    solveDirectional42(c,sourcePressure,pumpFlow);
    break;

   case"proportional":
    solveProportional(c,sourcePressure,pumpFlow);
    break;

   case"cylinder":
    solveCylinder(c,sourcePressure,pumpFlow);
    break;

   case"motor":
    solveMotor(c,sourcePressure,pumpFlow);
    break;

   case"accumulator":{
    const pressure=sourcePressure;
    c.runtime.pressure=clamp(pressure,n(c.p.precharge),n(c.p.maxPressure,250));
    c.runtime.flow=pressure>n(c.p.precharge)?-Math.min(pumpFlow,20):0;
    break;
   }

   case"gauge":
    c.runtime.pressure=connectedPressure(c.id,"P",sourcePressure);
    c.runtime.flow=0;
    break;

   case"flowmeter":
    c.runtime.pressure=sourcePressure;
    c.runtime.flow=connectedFlow(c.id);
    break;
  }
 });

 /* Recalculate actuator values after valves */
 components.forEach(c=>{
  if(c.type==="cylinder")solveCylinder(c,sourcePressure,pumpFlow);
  if(c.type==="motor")solveMotor(c,sourcePressure,pumpFlow);
 });

 /* faults */
 applyFaults();

 system.reliefDumping=components.some(c=>c.type==="relief"&&c.runtime.open);
}

function solveDirectional43(c,pressure,flow){
 c.runtime.pressure=pressure;

 if(c.p.position==="centre"){
  if(c.p.centre==="closed"){
   c.runtime.flow=0;
   c.runtime.warning="All ports blocked";
  }else if(c.p.centre==="tandem"){
   c.runtime.flow=0;
  }else if(c.p.centre==="float"){
   c.runtime.flow=0;
  }else{
   c.runtime.flow=flow;
  }
 }else{
  c.runtime.flow=flow;
 }
}

function solveDirectional42(c,pressure,flow){
 c.runtime.pressure=pressure;
 c.runtime.flow=flow;
}

function solveProportional(c,pressure,flow){
 const command=clamp(n(c.p.command,70),0,100)/100;
 c.runtime.pressure=pressure;
 c.runtime.flow=flow*command;
}

function solveCylinder(c,sourcePressure,pumpFlow){
 const bore=n(c.p.bore,100);
 const rod=n(c.p.rod,50);
 const capArea=areaM2(bore);
 const rodArea=areaM2(bore)-areaM2(rod);

 let pa=0,pb=0;

 const valve=components.find(v=>
  (v.type==="valve43"||v.type==="valve42"||v.type==="proportional") &&
  connectedTo(v.id,c.id)
 );

 if(valve){
  if(valve.p.position==="extend"||valve.p.command>50){
   pa=sourcePressure;
   pb=0;
  }else if(valve.p.position==="retract"){
   pa=0;
   pb=sourcePressure;
  }
 }

 if(!valve){
  /* direct connected pump-to-cylinder fallback */
  const ca=connections.find(l=connectsPortToCylinder(l,c.id,"A"));
  const cb=connections.find(l=connectsPortToCylinder(l,c.id,"B"));
  if(ca)pa=sourcePressure;
  if(cb)pb=sourcePressure;
 }

 /* pressure drops through control */
 pa*=pressureMultiplierForChamber(c,"A");
 pb*=pressureMultiplierForChamber(c,"B");

 c.runtime.pressureA=pa;
 c.runtime.pressureB=pb;
 c.runtime.pressure=Math.max(pa,pb);

 const force=pa*100000*capArea-pb*100000*rodArea-n(c.p.load)-n(c.p.friction);
 c.runtime.force=force;

 let qA=pumpFlow;
 let qB=pumpFlow;

 let velocity=0;

 if(force>0){
  velocity=(qA/60000)/capArea*1000;
 }else if(force<0){
  velocity=-(qB/60000)/rodArea*1000;
 }

 velocity=clamp(velocity,-n(c.p.maxSpeed,300),n(c.p.maxSpeed,300));

 const pos=n(c.p.position);
 if(pos<=0&&velocity<0)velocity=0;
 if(pos>=n(c.p.stroke,500)&&velocity>0)velocity=0;

 if(running){
  c.p.position=clamp(pos+velocity*.016,0,n(c.p.stroke,500));
 }

 c.runtime.velocity=velocity;
 c.runtime.flow=Math.abs(velocity)*(force>=0?capArea:rodArea)*60000/1000;
}

function pressureMultiplierForChamber(c,side){
 const leaks=c.runtime.warning==="leak"?.82:1;
 return leaks;
}

function solveMotor(c,pressure,pumpFlow){
 const disp=n(c.p.displacement,80);
 const speed=pumpFlow*1000/disp;
 const torque=pressure*100000*disp*1e-6/(2*Math.PI);

 c.runtime.pressure=pressure;
 c.runtime.flow=pumpFlow;
 c.runtime.torque=torque;
 c.runtime.speed=clamp(speed,0,n(c.p.speedLimit,2500));

 if(torque<n(c.p.loadTorque,100))c.runtime.warning="Insufficient torque";
}

function connectedTo(a,b){
 return connections.some(l=>
  (l.a.c===a&&l.b.c===b)||(l.a.c===b&&l.b.c===a)
 );
}

function connectsPortToCylinder(l,cid,port){
 return (l.a.c===cid&&l.a.p===port)||(l.b.c===cid&&l.b.p===port);
}

function connectedPressure(cid,port,defaultPressure){
 const c=getComp(cid);
 if(!c)return 0;
 const links=connections.filter(l=>
  (l.a.c===cid&&l.a.p===port)||(l.b.c===cid&&l.b.p===port)
 );
 if(!links.length)return 0;
 return Math.max(...links.map(l=>l.pressure||defaultPressure));
}

function connectedFlow(cid){
 return connections.filter(l=>l.a.c===cid||l.b.c===cid)
  .reduce((s,l)=>s+Math.abs(l.flow||0),0);
}

function hasPressureSourceTo(cid,port){
 return connections.some(l=>{
  if(l.a.c===cid&&l.a.p===port){
   const c=getComp(l.b.c);
   return c&&["pump","variablePump"].includes(c.type);
  }
  if(l.b.c===cid&&l.b.p===port){
   const c=getComp(l.a.c);
   return c&&["pump","variablePump"].includes(c.type);
  }
  return false;
 });
}

function demandFlow(){
 return components
  .filter(c=>["cylinder","motor"].includes(c.type))
  .reduce((s,c)=>s+Math.abs(c.runtime.flow||0),0);
}

/* ============================================================
   FAULT SIMULATION
   ============================================================ */

function applyFaults(){
 components.forEach(c=>{
  if(c.fault==="pumpWear"){
   if(c.type==="pump"||c.type==="variablePump"){
    c.runtime.warning="worn";
    c.runtime.flow*=.72;
   }
  }

  if(c.fault==="blockedFilter"&&c.type==="filter"){
   c.runtime.warning="Filter blocked";
   c.runtime.pressureIn+=35;
   c.runtime.pressureOut=Math.max(0,c.runtime.pressureOut-35);
   c.runtime.flow*=.25;
  }

  if(c.fault==="cylinderLeakage"&&c.type==="cylinder"){
   c.runtime.warning="leak";
   c.runtime.pressureA*=.82;
   c.runtime.force*=.82;
  }

  if(c.fault==="valveStuck"&&["valve43","valve42","proportional"].includes(c.type)){
   c.runtime.warning="Valve stuck";
   c.runtime.flow=0;
  }
}

function setFault(type){
 const c=getComp(selected);
 if(!c)return;

 if(c.fault===type)c.fault=null;
 else c.fault=type;

 solve();
 render();
 updateInspector();
}

function diagnostics(){
 const d=[];

 if(!components.some(c=>c.type==="tank"))
  d.push({level:"error",title:"No reservoir",text:"The circuit has no tank/return reference."});

 if(!components.some(c=>c.type==="pump"||c.type==="variablePump"))
  d.push({level:"error",title:"No pump",text:"No hydraulic source is present."});

 components.forEach(c=>{
  if(c.fault==="blockedFilter")
   d.push({level:"warning",title:"Blocked filter",text:`${c.label} is severely restricted.`});

  if(c.fault==="pumpWear")
   d.push({level:"warning",title:"Pump wear",text:`${c.label} has reduced volumetric performance.`});

  if(c.fault==="cylinderLeakage")
   d.push({level:"warning",title:"Cylinder leakage",text:`${c.label} has internal leakage.`});

  if(c.fault==="valveStuck")
   d.push({level:"warning",title:"Valve stuck",text:`${c.label} is not responding.`});

  if(c.runtime.pressure>250)
   d.push({level:"error",title:"Excessive pressure",text:`${c.label} is above 250 bar.`});

  if(c.type==="filter"&&c.runtime.pressureIn-c.runtime.pressureOut>10)
   d.push({level:"warning",title:"Filter pressure drop",text:`${c.label} has a high pressure drop.`});

  if(c.type==="motor"&&c.runtime.warning==="Insufficient torque")
   d.push({level:"warning",title:"Motor stall risk",text:`Available hydraulic torque is below load torque.`});
 });

 if(system.reliefDumping)
  d.push({level:"warning",title:"Relief valve operating",text:"Pump flow is being dumped to tank at the relief setting."});

 const cylinders=components.filter(c=>c.type==="cylinder");
 cylinders.forEach(c=>{
  if(!connectedToValve(c.id))
   d.push({level:"warning",title:"Cylinder not controlled",text:`${c.label} is not connected to a directional valve.`});
 });

 return d;
}

function connectedToValve(cid){
 return components.some(v=>
  ["valve43","valve42","proportional"].includes(v.type)&&connectedTo(v.id,cid)
 );
}

/* ============================================================
   SIMULATION LOOP
   ============================================================ */

function toggleSimulation(){
 running=!running;
 if(running){
  if(!components.length)loadExample();
  loop();
 }else{
  if(raf)cancelAnimationFrame(raf);
  solve();
  render();
  updateInspector();
 }
 render();
}

function loop(){
 if(!running)return;
 simTime+=.016;
 solve();
 render();
 updateInspector();
 raf=requestAnimationFrame(loop);
}

function updateStatus(){
 document.getElementById("statusPressure").textContent=fmt(system.maxPressure)+" bar";
 document.getElementById("statusFlow").textContent=fmt(system.totalFlow)+" L/min";
}

/* ============================================================
   EXAMPLE CIRCUIT
   ============================================================ */

function clearCircuit(){
 components=[];
 connections=[];
 selected=null;
 selectedPort=null;
 idCounter=1;
}

function loadExample(){
 clearCircuit();

 const tank=addComponent("tank",90,330);
 const pump=addComponent("variablePump",250,300);
 const filter=addComponent("filter",430,300);
 const valve=addComponent("valve43",610,300);
 const cylinder=addComponent("cylinder",820,275);
 const relief=addComponent("relief",430,470);
 const gauge=addComponent("gauge",450,180);
 const flow=addComponent("flowmeter",730,220);

 pump.p.displacement=32;
 pump.p.rpm=1450;
 pump.p.swash=75;
 pump.p.compensator=250;

 valve.p.position="extend";
 valve.p.centre="closed";
 valve.p.flowRating=120;

 cylinder.p.bore=100;
 cylinder.p.rod=50;
 cylinder.p.stroke=500;
 cylinder.p.load=50000;
 cylinder.p.friction=1500;
 cylinder.p.position=100;

 relief.p.setting=210;

 connect(tank,"T",pump,"IN");
 connect(pump,"OUT",filter,"IN");
 connect(filter,"OUT",valve,"P");
 connect(valve,"T",tank,"T");
 connect(valve,"A",cylinder,"A");
 connect(cylinder,"B",valve,"B");
 connect(pump,"OUT",relief,"P");
 connect(relief,"T",tank,"T");
 connect(gauge,"P",pump,"OUT");
 connect(flow,"IN",valve,"A");
 connect(flow,"OUT",cylinder,"A");

 selected=valve.id;

 render();
 solve();
 updateInspector();
}

function connect(a,ap,b,bp){
 connections.push({
  id:"L"+(connections.length+1),
  a:{c:a.id,p:ap},
  b:{c:b.id,p:bp},
  flow:0,pressure:0
 });
}

function newCircuit(){
 if(!confirm("Start a new circuit?"))return;
 clearCircuit();
 render();
 updateInspector();
}

function saveCircuit(){
 const data={
  version:5,
  components,
  connections,
  zoom,panX,panY
 };
 localStorage.setItem("hydraulicStudioCircuit",JSON.stringify(data));
 alert("Circuit saved on this device.");
}

function loadCircuit(){
 const raw=localStorage.getItem("hydraulicStudioCircuit");
 if(!raw){
  alert("No saved circuit found.");
  return;
 }
 try{
  const data=JSON.parse(raw);
  components=data.components||[];
  connections=data.connections||[];
  zoom=data.zoom||1;
  panX=data.panX||0;
  panY=data.panY||0;
  idCounter=components.length+1;
  selected=null;
  solve();
  render();
  updateInspector();
 }catch(e){
  alert("Could not load circuit.");
 }
}

/* ============================================================
   MOBILE UI
   ============================================================ */

function mobilePanel(which){
 closePanels();
 document.getElementById(which).classList.add("open");
 document.querySelectorAll(".mobile-nav button").forEach(b=>b.classList.remove("active"));
 if(which==="library")document.getElementById("navComponents").classList.add("active");
 if(which==="inspector")document.getElementById("navProperties").classList.add("active");
}

function closePanels(){
 document.getElementById("library").classList.remove("open");
 document.getElementById("inspector").classList.remove("open");
 document.getElementById("navCircuit").classList.add("active");
}

function showMonitor(){
 selected=null;
 updateInspector();
 mobilePanel("inspector");
 document.getElementById("navMonitor").classList.add("active");
}

function toggleFlowArrows(){
 flowArrows=!flowArrows;
 render();
}

function togglePressureColors(){
 pressureColors=!pressureColors;
 render();
}

/* ============================================================
   KEYBOARD
   ============================================================ */

document.addEventListener("keydown",e=>{
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="s"){
  e.preventDefault();saveCircuit();
 }
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"){
  e.preventDefault();
  /* lightweight undo via local snapshot */
 }
 if(e.key==="Delete"||e.key==="Backspace"){
  if(document.activeElement.tagName!=="INPUT"&&document.activeElement.tagName!=="SELECT"){
   deleteSelected();
  }
 }
 if(e.code==="Space"&&document.activeElement.tagName!=="INPUT"){
  e.preventDefault();
  toggleSimulation();
 }
});

/* ============================================================
   EXTRA ENGINEERING INFO
   ============================================================ */

function engineeringSummary(){
 const pumps=components.filter(c=>c.type==="pump"||c.type==="variablePump");
 const cylinders=components.filter(c=>c.type==="cylinder");
 const motors=components.filter(c=>c.type==="motor");

 let html="";

 pumps.forEach(c=>{
  const theoretical=n(c.p.displacement)*n(c.p.rpm)/1000;
  const actual=pumpAvailableFlow(c);
  html+=`
   <div class="monitor-row"><span>${c.label} theoretical</span><span>${fmt(theoretical)} L/min</span></div>
   <div class="monitor-row"><span>${c.label} available</span><span>${fmt(actual)} L/min</span></div>
  `;
 });

 cylinders.forEach(c=>{
  html+=`
   <div class="monitor-row"><span>${c.label} force</span><span>${fmt(c.runtime.force,0)} N</span></div>
   <div class="monitor-row"><span>${c.label} speed</span><span>${fmt(c.runtime.velocity,1)} mm/s</span></div>
  `;
 });

 motors.forEach(c=>{
  html+=`
   <div class="monitor-row"><span>${c.label} torque</span><span>${fmt(c.runtime.torque,1)} Nm</span></div>
   <div class="monitor-row"><span>${c.label} speed</span><span>${fmt(c.runtime.speed,0)} rpm</span></div>
  `;
 });

 return html;
}

/* ============================================================
   INITIALISE
   ============================================================ */

loadExample();
render();
solve();
updateInspector();
