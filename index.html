<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Hydraulic Studio</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,Arial,sans-serif;background:#090d18;color:#e9eefb}
button,input,select{font:inherit}
button{border:0;color:#eaf0ff;background:#1b2438;border-radius:8px;padding:9px 11px;cursor:pointer}
button:hover{background:#26324c}
button.active{background:#3867ff}
button.danger{background:#762f3b}
button.good{background:#245e4a}
input,select{background:#11182a;color:#eaf0ff;border:1px solid #34415c;border-radius:7px;padding:8px;width:100%}

#app{display:grid;grid-template-rows:58px 1fr 38px;width:100%;height:100%}

header{
 display:flex;align-items:center;gap:8px;padding:8px 12px;
 background:#0e1525;border-bottom:1px solid #27334b;z-index:20
}
.logo{font-weight:800;font-size:18px;white-space:nowrap;margin-right:8px}
.logo span{color:#5f8cff}
.header-group{display:flex;gap:5px;align-items:center}
.spacer{flex:1}
.mode{display:flex;background:#111a2d;padding:3px;border-radius:9px}
.mode button{padding:7px 10px;background:transparent}
.mode button.active{background:#3564f4}

main{display:grid;grid-template-columns:265px 1fr 285px;min-height:0}

#library{
 background:#0d1423;border-right:1px solid #26334b;overflow:auto;padding:10px
}
.lib-title{font-size:12px;text-transform:uppercase;color:#8290aa;font-weight:700;margin:8px 2px}
.search{margin-bottom:8px}
.category{border:1px solid #202d45;border-radius:9px;margin-bottom:8px;overflow:hidden}
.category-head{
 padding:9px 10px;background:#121b2e;font-weight:700;font-size:13px;
 display:flex;justify-content:space-between;cursor:pointer
}
.category-body{padding:7px;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.comp-btn{
 min-height:54px;padding:6px 4px;background:#151f33;border:1px solid #263650;
 display:flex;flex-direction:column;align-items:center;justify-content:center;
 font-size:10px;gap:3px
}
.comp-btn .icon{font-size:22px;line-height:22px}
.comp-btn:hover{border-color:#5277d9;background:#1a2740}

#workspace{position:relative;overflow:hidden;background:#090e19}
#svg{
 width:100%;height:100%;display:block;
 touch-action:none;user-select:none
}
#canvasBg{fill:#090e19}
.grid-line{stroke:#172238;stroke-width:1}
.grid-major{stroke:#202e47;stroke-width:1.2}

#rightPanel{
 background:#0d1423;border-left:1px solid #26334b;overflow:auto;padding:10px
}
.panel-title{font-size:13px;font-weight:800;margin:4px 0 10px}
.card{background:#111a2c;border:1px solid #25334c;border-radius:9px;padding:10px;margin-bottom:9px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:7px}
.field{margin-bottom:8px}
.field label{display:block;color:#8795ad;font-size:10px;text-transform:uppercase;margin-bottom:4px}
.small{font-size:11px;color:#8996ad}
.value{font-weight:700}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.stat{background:#0c1321;border-radius:7px;padding:8px}
.stat b{display:block;font-size:15px}
.stat span{font-size:9px;color:#8490a5}

#bottom{
 background:#0e1525;border-top:1px solid #27334b;display:flex;align-items:center;
 gap:5px;padding:4px 7px;z-index:20
}
.bottom-tab{padding:6px 12px;font-size:11px}
.bottom-info{margin-left:auto;font-size:10px;color:#8190aa}

#tools{
 position:absolute;left:10px;top:10px;z-index:10;display:flex;flex-wrap:wrap;gap:5px;
 max-width:520px
}
.tool{background:#10192b;border:1px solid #2a3852;padding:7px 9px;font-size:11px}
.tool.active{background:#315de0}

#simbar{
 position:absolute;left:50%;bottom:10px;transform:translateX(-50%);
 background:#10192b;border:1px solid #2b3954;border-radius:11px;padding:6px;
 display:flex;gap:5px;z-index:10
}
#simbar button{font-size:11px}

#toast{
 position:absolute;left:50%;top:65px;transform:translateX(-50%);
 background:#17233a;border:1px solid #3b4c6b;padding:9px 14px;border-radius:8px;
 opacity:0;pointer-events:none;transition:.2s;z-index:100;font-size:12px
}
#toast.show{opacity:1}

.overlay{
 position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;
 z-index:200;padding:15px
}
.modal{
 width:min(620px,100%);max-height:90vh;overflow:auto;background:#0f1728;
 border:1px solid #33435f;border-radius:13px;padding:16px;box-shadow:0 20px 80px #0008
}
.modal h2{margin:0 0 12px;font-size:18px}
.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.modal-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:14px}

.log{font-size:11px;max-height:260px;overflow:auto}
.log div{padding:6px 0;border-bottom:1px solid #202d42}

.mobile-only{display:none}

.component{cursor:grab}
.component.selected .body{stroke:#75a1ff!important;stroke-width:3!important}
.component.failed .body{stroke:#e65b67!important}
.port{cursor:pointer}
.port.hot{fill:#ffd34e!important;stroke:#fff!important}
.port.connected{fill:#56d49a!important}
.port-label{font-size:8px;fill:#8f9cb3;pointer-events:none}
.comp-label{font-size:11px;fill:#dce6fb;font-weight:700;pointer-events:none}
.connection{fill:none;cursor:pointer}
.connection.selected{stroke:#7ca5ff!important;filter:drop-shadow(0 0 4px #5787ff)}
.flow{stroke-dasharray:9 8;animation:flow 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-17}}
.junction{fill:#72a2ff;stroke:#dce8ff;stroke-width:1}
.measure{stroke:#b9c8e5;stroke-width:1.2;stroke-dasharray:5 4}
.measure-text{font-size:10px;fill:#c7d3ea}

@media(max-width:950px){
 #app{grid-template-rows:52px 1fr 38px}
 header{padding:6px}
 .logo{font-size:15px}
 header .desktop-only{display:none}
 main{grid-template-columns:1fr}
 #library{
  position:absolute;left:0;top:52px;bottom:38px;width:280px;z-index:50;
  transform:translateX(-105%);transition:.2s;box-shadow:12px 0 30px #0008
 }
 #library.open{transform:translateX(0)}
 #rightPanel{
  position:absolute;right:0;top:52px;bottom:38px;width:290px;z-index:50;
  transform:translateX(105%);transition:.2s;box-shadow:-12px 0 30px #0008
 }
 #rightPanel.open{transform:translateX(0)}
 .mobile-only{display:block}
 #tools{max-width:calc(100% - 20px)}
 #simbar{bottom:48px}
}
@media(max-width:600px){
 #tools{top:7px}
 #tools .tool{padding:6px 7px;font-size:10px}
 #simbar{width:calc(100% - 20px);justify-content:center}
 #simbar button{padding:7px 8px}
 .bottom-info{display:none}
 .mode button{padding:6px}
}
</style>
</head>

<body>
<div id="app">

<header>
 <button class="mobile-only" id="libraryBtn">☰</button>
 <div class="logo">Hydraulic <span>Studio</span></div>

 <div class="header-group desktop-only">
  <button onclick="newCircuit()">New</button>
  <button onclick="saveCircuit()">Save</button>
  <button onclick="loadCircuit()">Load</button>
  <button onclick="undo()">↶</button>
  <button onclick="redo()">↷</button>
 </div>

 <div class="mode">
  <button id="hydMode" class="active" onclick="setMode('hydraulic')">Hydraulic</button>
  <button id="pneuMode" onclick="setMode('pneumatic')">Pneumatic</button>
 </div>

 <div class="header-group">
  <button onclick="setView('functional')">Functional</button>
  <button onclick="setView('technical')">Technical</button>
  <button onclick="toggleRun()" id="runBtn">▶ Run</button>
 </div>

 <div class="spacer"></div>
 <button class="mobile-only" onclick="toggleInspector()">☷</button>
</header>

<main>

<aside id="library">
 <div class="lib-title">Component Library</div>
 <input class="search" id="componentSearch" placeholder="Search components..." oninput="filterLibrary()">

 <div id="libraryContent"></div>

 <div class="card">
  <div class="small">Quick add</div>
  <div class="row" style="margin-top:7px">
   <button onclick="addComponent('reservoir')">Tank</button>
   <button onclick="addComponent('pump')">Pump</button>
  </div>
  <div class="row">
   <button onclick="addComponent('valve43')">4/3 Valve</button>
   <button onclick="addComponent('cylinderDA')">Cylinder</button>
  </div>
 </div>
</aside>

<section id="workspace">

 <svg id="svg" xmlns="http://www.w3.org/2000/svg">
  <rect id="canvasBg" width="100%" height="100%"></rect>
  <g id="world">
   <g id="grid"></g>
   <g id="connections"></g>
   <g id="components"></g>
   <g id="labels"></g>
   <g id="draft"></g>
  </g>
 </svg>

 <div id="tools">
  <button class="tool active" data-tool="select" onclick="setTool('select')">↖ Select</button>
  <button class="tool" data-tool="hose" onclick="setTool('hose')">〰 Hose</button>
  <button class="tool" data-tool="pipe" onclick="setTool('pipe')">━ Pipe</button>
  <button class="tool" data-tool="junction" onclick="setTool('junction')">● Junction</button>
  <button class="tool" data-tool="label" onclick="setTool('label')">T Label</button>
  <button class="tool" data-tool="measure" onclick="setTool('measure')">↔ Measure</button>
  <button class="tool" onclick="fitView()">Fit</button>
  <button class="tool" onclick="zoomIn()">+</button>
  <button class="tool" onclick="zoomOut()">−</button>
 </div>

 <div id="simbar">
  <button class="good" onclick="toggleRun()" id="simRun">▶ Run</button>
  <button onclick="stopSimulation()">■ Stop</button>
  <button onclick="singleStep()">Step</button>
  <button onclick="openValveBuilder()">Valve Builder</button>
  <button onclick="exampleCircuit()">Example</button>
 </div>

 <div id="toast"></div>
</section>

<aside id="rightPanel">
 <div class="panel-title">Inspector</div>
 <div id="inspector"></div>
</aside>

</main>

<footer id="bottom">
 <button class="bottom-tab active" onclick="showBottom('analysis')">Analysis</button>
 <button class="bottom-tab" onclick="showBottom('faults')">Faults</button>
 <button class="bottom-tab" onclick="showBottom('training')">Training</button>
 <button class="bottom-tab" onclick="showBottom('log')">Log</button>
 <span class="bottom-info" id="status">Ready</span>
</footer>
</div>

<div class="overlay" id="valveModal">
 <div class="modal">
  <h2>Directional Valve Builder</h2>

  <div class="modal-grid">
   <div class="field">
    <label>Valve</label>
    <select id="vType">
     <option value="valve22">2/2</option>
     <option value="valve32">3/2</option>
     <option value="valve42">4/2</option>
     <option value="valve43" selected>4/3</option>
     <option value="valve52">5/2</option>
     <option value="valve53">5/3</option>
     <option value="valve62">6/2</option>
    </select>
   </div>

   <div class="field">
    <label>Centre</label>
    <select id="vCentre">
     <option value="closed">Closed centre</option>
     <option value="open">Open centre</option>
     <option value="tandem">Tandem centre</option>
     <option value="float">Float centre</option>
     <option value="pt">P → T</option>
     <option value="abt">A/B → T</option>
    </select>
   </div>

   <div class="field">
    <label>Left actuation</label>
    <select id="vLeft">
     <option>Solenoid</option>
     <option>Lever</option>
     <option>Push button</option>
     <option>Pedal</option>
     <option>Pilot</option>
     <option>Spring</option>
    </select>
   </div>

   <div class="field">
    <label>Right actuation</label>
    <select id="vRight">
     <option>Solenoid</option>
     <option>Lever</option>
     <option>Push button</option>
     <option>Pedal</option>
     <option>Pilot</option>
     <option>Spring</option>
    </select>
   </div>

   <div class="field">
    <label>Flow rating L/min</label>
    <input id="vFlow" type="number" value="100">
   </div>

   <div class="field">
    <label>Pressure rating bar</label>
    <input id="vPressure" type="number" value="250">
   </div>
  </div>

  <div class="card">
   <div class="small">Simulation position</div>
   <div class="row" style="margin-top:8px">
    <button onclick="setValvePosition('left')">← Left</button>
    <button onclick="setValvePosition('center')">● Centre</button>
   </div>
   <button onclick="setValvePosition('right')" style="width:100%">Right →</button>
  </div>

  <div class="modal-actions">
   <button onclick="closeModal()">Cancel</button>
   <button class="good" onclick="createValve()">Add Valve</button>
  </div>
 </div>
</div>

function uid(prefix="id"){
 return prefix+"_"+Math.random().toString(36).slice(2,8)+"_"+Date.now().toString(36).slice(-5);
}

function clone(o){
 return JSON.parse(JSON.stringify(o));
}

function snapshot(){
 return {
  mode:state.mode,
  view:state.view,
  components:clone(state.components),
  connections:clone(state.connections),
  labels:clone(state.labels),
  junctions:clone(state.junctions)
 };
}

function restore(s){
 state.mode=s.mode||"hydraulic";
 state.view=s.view||"functional";
 state.components=clone(s.components||[]);
 state.connections=clone(s.connections||[]);
 state.labels=clone(s.labels||[]);
 state.junctions=clone(s.junctions||[]);
 state.selected=null;
 state.selectedConnection=null;
 render();
}

function historyPush(){
 state.history.push(snapshot());
 if(state.history.length>80)state.history.shift();
 state.redo=[];
}

function undo(){
 if(!state.history.length)return toast("Nothing to undo");
 state.redo.push(snapshot());
 restore(state.history.pop());
 toast("Undo");
}

function redo(){
 if(!state.redo.length)return toast("Nothing to redo");
 state.history.push(snapshot());
 restore(state.redo.pop());
 toast("Redo");
}

function addComponent(type,x=null,y=null){
 if(!TYPES[type])return toast("Unknown component");

 historyPush();

 const rect=svg.getBoundingClientRect();
 const centre=screenToWorld(rect.width/2,rect.height/2);

 const c={
  id:uid("C"),
  type,
  x:x===null?centre.x:x,
  y:y===null?centre.y:y,
  rotation:0,
  flipX:false,
  flipY:false,
  label:TYPES[type].name,
  params:clone(defaults[type]||{}),
  sim:{
   pressure:0,
   flow:0,
   temperature:25,
   speed:0,
   force:0,
   torque:0,
   state:"Idle",
   angle:0
  },
  fault:null
 };

 if(type.startsWith("valve")){
  c.params.position=type==="valve32"?"normal":"center";
 }

 state.components.push(c);
 state.selected=c.id;
 render();
 toast(`${TYPES[type].name} added`);
 return c;
}

function getComponent(id){
 return state.components.find(c=>c.id===id);
}

function getPortDef(c,p){
 return TYPES[c.type]?.ports.find(x=>x[0]===p);
}

function portWorld(c,p){
 const def=getPortDef(c,p);
 if(!def)return {x:c.x,y:c.y};

 let x=def[1],y=def[2];
 const sx=c.flipX?-1:1;
 const sy=c.flipY?-1:1;
 x*=sx;y*=sy;

 const r=(c.rotation||0)*Math.PI/180;
 return {
  x:c.x+x*Math.cos(r)-y*Math.sin(r),
  y:c.y+x*Math.sin(r)+y*Math.cos(r)
 };
}

function connectionExists(a,p,b,q){
 return state.connections.some(c=>
  (c.from.component===a&&c.from.port===p&&c.to.component===b&&c.to.port===q)||
  (c.from.component===b&&c.from.port===q&&c.to.component===a&&c.to.port===p)
 );
}

function connectPorts(a,p,b,q,type="soft"){
 if(a===b&&p===q)return false;
 if(connectionExists(a,p,b,q))return false;

 const ca=getComponent(a),cb=getComponent(b);
 if(!ca||!cb)return false;

 historyPush();

 const pa=portWorld(ca,p),pb=portWorld(cb,q);

 state.connections.push({
  id:uid("H"),
  from:{component:a,port:p},
  to:{component:b,port:q},
  type,
  diameter:type==="soft"?12:16,
  length:Math.round(Math.hypot(pb.x-pa.x,pb.y-pa.y)),
  rating:type==="soft"?250:315,
  flow:0,
  pressureDrop:0,
  points:[]
 });

 render();
 toast(type==="soft"?"Soft hose connected":"Hard pipe connected");
 return true;
}

function portClick(c,p){
 if(state.tool==="hose"||state.tool==="pipe"){
  if(!hoseStart){
   hoseStart={component:c.id,port:p};
   renderDraft();
   toast("Now select the destination port");
  }else{
   const type=state.tool==="hose"?"soft":"hard";
   if(connectPorts(hoseStart.component,hoseStart.port,c.id,p)){
    hoseStart=null;
    renderDraft();
   }
  }
  return;
 }

 if(state.tool==="select"){
  state.selected=c.id;
  state.selectedConnection=null;
  updateInspector();
  render();
 }
}

function deleteConnection(id){

function screenToWorld(sx,sy){
 const rect=svg.getBoundingClientRect();
 return {
  x:(sx-rect.left-camera.x)/camera.zoom,
  y:(sy-rect.top-camera.y)/camera.zoom
 };
}

function worldToScreen(x,y){
 return {x:x*camera.zoom+camera.x,y:y*camera.zoom+camera.y};
}

function pointerWorld(e){
 return screenToWorld(e.clientX,e.clientY);
}

function componentAt(x,y){
 for(let i=state.components.length-1;i>=0;i--){
  const c=state.components[i];
  const t=TYPES[c.type];
  const dx=x-c.x,dy=y-c.y;
  const r=-(c.rotation||0)*Math.PI/180;
  const lx=dx*Math.cos(r)-dy*Math.sin(r);
  const ly=dx*Math.sin(r)+dy*Math.cos(r);
  if(Math.abs(lx)<=t.w/2+8&&Math.abs(ly)<=t.h/2+8)return c;
 }
 return null;
}

function nearestPort(x,y,limit=18){
 let best=null,dist=limit;
 state.components.forEach(c=>{
  TYPES[c.type].ports.forEach(p=>{
   const q=portWorld(c,p[0]);
   const d=Math.hypot(q.x-x,q.y-y);
   if(d<dist){
    dist=d;
    best={component:c,port:p[0],x:q.x,y:q.y};
   }
  });
 });
 return best;
}

/* Pointer handling: one unified system for touch + mouse */
svg.addEventListener("pointerdown",e=>{
 svg.setPointerCapture(e.pointerId);
 const p=pointerWorld(e);
 pointers.set(e.pointerId,{x:e.clientX,y:e.clientY,world:p});

 if(pointers.size===2){
  drag=null;
  const arr=[...pointers.values()];
  gesture={
   startDist:Math.hypot(arr[0].x-arr[1].x,arr[0].y-arr[1].y),
   startZoom:camera.zoom,
   startCamera:{x:camera.x,y:camera.y},
   startMid:{
    x:(arr[0].x+arr[1].x)/2,
    y:(arr[0].y+arr[1].y)/2
   }
  };
  return;
 }

 if(state.tool==="label"){
  addLabel(p.x,p.y);
  return;
 }

 if(state.tool==="junction"){
  addJunction(p.x,p.y);
  return;
 }

 if(state.tool==="measure"){
  if(!measureStart){
   measureStart=p;
   toast("Select the second point");
  }else{
   addMeasure(measureStart,p);
   measureStart=null;
  }
  return;
 }

 const port=nearestPort(p.x,p.y,20);
 if((state.tool==="hose"||state.tool==="pipe")&&port){
  portClick(port.component,port.port);
  return;
 }

 if(state.tool==="select"){
  const c=componentAt(p.x,p.y);

  if(c){
   state.selected=c.id;
   state.selectedConnection=null;
   drag={
    id:c.id,
    offsetX:p.x-c.x,
    offsetY:p.y-c.y,
    moved:false,
    before:snapshot()
   };
   updateInspector();
   render();
  }else{
   const con=connectionAt(p.x,p.y);
   if(con){
    selectConnection(con.id);
   }else{
    state.selected=null;
    state.selectedConnection=null;
    drag={pan:true,lastX:e.clientX,lastY:e.clientY};
    render();
   }
  }
 }
});

svg.addEventListener("pointermove",e=>{
 const p=pointerWorld(e);
 mouseWorld=p;
 if(pointers.has(e.pointerId))pointers.set(e.pointerId,{x:e.clientX,y:e.clientY,world:p});

 if(pointers.size===2&&gesture){
  const arr=[...pointers.values()];
  const d=Math.hypot(arr[0].x-arr[1].x,arr[0].y-arr[1].y);
  const mid={
   x:(arr[0].x+arr[1].x)/2,
   y:(arr[0].y+arr[1].y)/2
  };
  camera.zoom=Math.max(.25,Math.min(3,gesture.startZoom*d/gesture.startDist));
  camera.x=gesture.startCamera.x+(mid.x-gesture.startMid.x);
  camera.y=gesture.startCamera.y+(mid.y-gesture.startMid.y);
  render();
  return;
 }

 if(!drag)return;

 if(drag.pan){
  camera.x+=e.clientX-drag.lastX;
  camera.y+=e.clientY-drag.lastY;
  drag.lastX=e.clientX;
  drag.lastY=e.clientY;
  render();
  return;
 }

 const c=getComponent(drag.id);
 if(c){
  c.x=snap(p.x-drag.offsetX);
  c.y=snap(p.y-drag.offsetY);
  drag.moved=true;
  render();
 }
});

svg.addEventListener("pointerup",e=>{
 pointers.delete(e.pointerId);

 if(pointers.size<2)gesture=null;

 if(drag&&!drag.pan&&drag.moved){
  state.history.push(drag.before);
  if(state.history.length>80)state.history.shift();
  state.redo=[];
 }

 drag=null;
});

svg.addEventListener("pointercancel",e=>{
 pointers.delete(e.pointerId);
 drag=null;
 gesture=null;
});

svg.addEventListener("wheel",e=>{
 e.preventDefault();
 const before=pointerWorld(e);
 camera.zoom*=e.deltaY<0?1.1:.9;
 camera.zoom=Math.max(.25,Math.min(3,camera.zoom));
 const after=pointerWorld(e);
 camera.x+=(after.x-before.x)*camera.zoom;
 camera.y+=(after.y-before.y)*camera.zoom;
 render();
},{passive:false});

function snap(v){
 const g=20;
 return state.settings?.snap===false?v:Math.round(v/g)*g;
}

function connectionAt(x,y){
 let best=null,dist=12;
 state.connections.forEach(c=>{
  const a=getComponent(c.from.component),b=getComponent(c.to.component);
  if(!a||!b)return;
  const pa=portWorld(a,c.from.port),pb=portWorld(b,c.to.port);
  const d=pointLineDistance(x,y,pa.x,pa.y,pb.x,pb.y);
  if(d<dist){
   dist=d;
   best=c;
  }
 });
 return best;
}

function pointLineDistance(px,py,x1,y1,x2,y2){
 const dx=x2-x1,dy=y2-y1;
 if(dx===0&&dy===0)return Math.hypot(px-x1,py-y1);
 const t=Math.max(0,Math.min(1,((px-x1)*dx+(py-y1)*dy)/(dx*dx+dy*dy)));
 return Math.hypot(px-(x1+t*dx),py-(y1+t*dy));
}

function drawGrid(){
 gridEl.innerHTML="";
 const size=40;
 const left=(-camera.x/camera.zoom)-size;
 const top=(-camera.y/camera.zoom)-size;
 const right=left+svg.clientWidth/camera.zoom+size*2;
 const bottom=top+svg.clientHeight/camera.zoom+size*2;

 for(let x=Math.floor(left/size)*size;x<right;x+=size){
  const l=document.createElementNS(NS,"line");
  l.setAttribute("x1",x);l.setAttribute("x2",x);
  l.setAttribute("y1",top);l.setAttribute("y2",bottom);
  l.setAttribute("class",x%200===0?"grid-major":"grid-line");
  gridEl.appendChild(l);
 }
 for(let y=Math.floor(top/size)*size;y<bottom;y+=size){
  const l=document.createElementNS(NS,"line");
  l.setAttribute("y1",y);l.setAttribute("y2",y);
  l.setAttribute("x1",left);l.setAttribute("x2",right);
  l.setAttribute("class",y%200===0?"grid-major":"grid-line");
  gridEl.appendChild(l);
 }
}

function render(){
 world.setAttribute("transform",`translate(${camera.x},${camera.y}) scale(${camera.zoom})`);
 drawGrid();
 renderConnections();
 renderComponents();
 renderLabels();
 renderDraft();
 updateInspector();
 updateStatus();
}

function renderConnections(){
 conEl.innerHTML="";

 state.connections.forEach(c=>{
  const a=getComponent(c.from.component),b=getComponent(c.to.component);
  if(!a||!b)return;

  const p1=portWorld(a,c.from.port);
  const p2=portWorld(b,c.to.port);

  let d;
  if(c.points&&c.points.length){
   let path=`M ${p1.x} ${p1.y}`;
   c.points.forEach(p=>path+=` L ${p.x} ${p.y}`);
   path+=` L ${p2.x} ${p2.y}`;
   d=path;
  }else{
   const mx=(p1.x+p2.x)/2;
   d=`M ${p1.x} ${p1.y} L ${mx} ${p1.y} L ${mx} ${p2.y} L ${p2.x} ${p2.y}`;
  }

  const path=document.createElementNS(NS,"path");
  path.setAttribute("d",d);
  path.setAttribute("class","connection"+(c.id===state.selectedConnection?" selected":""));
  path.setAttribute("stroke",c.type==="soft"?"#df9a42":c.type==="hard"?"#a8b6cc":c.type==="steel"?"#d2d8df":"#65a8d9");
  path.setAttribute("stroke-width",c.type==="soft"?6:4);
  path.setAttribute("stroke-linecap","round");
  path.setAttribute("pointer-events","stroke");

  if(state.running&&Math.abs(c.flow)>0.01)path.classList.add("flow");

  path.onclick=e=>{
   e.stopPropagation();
   selectConnection(c.id);
  };

  conEl.appendChild(path);

  if(state.view==="technical"||state.running){
   const text=document.createElementNS(NS,"text");
   text.setAttribute("x",(p1.x+p2.x)/2);
   text.setAttribute("y",(p1.y+p2.y)/2-6);
   text.setAttribute("class","measure-text");
   text.textContent=`${c.flow.toFixed(1)} L/min • ΔP ${c.pressureDrop.toFixed(1)} bar`;
   conEl.appendChild(text);
  }
 });
}

function createSVG(tag,attrs={}){
 const el=document.createElementNS(NS,tag);
 Object.entries(attrs).forEach(([k,v])=>el.setAttribute(k,v));
 return el;
}

function renderComponents(){
 compEl.innerHTML="";

 state.components.forEach(c=>{
  const t=TYPES[c.type];
  const g=createSVG("g",{
   class:"component"+(c.id===state.selected?" selected ":"")+(c.fault?" failed":""),
   transform:`translate(${c.x} ${c.y}) rotate(${c.rotation}) scale(${c.flipX?-1:1} ${c.flipY?-1:1})`
  });

  const body=createSVG("g");
  drawSymbol(body,c,t);
  g.appendChild(body);

  if(c.label){
   const label=createSVG("text",{
    x:0,y:t.h/2+18,
    "text-anchor":"middle",
    class:"comp-label"
   });
   label.textContent=c.label;
   g.appendChild(label);
  }

  t.ports.forEach(p=>{
   const circle=createSVG("circle",{
    cx:p[1],cy:p[2],r:6,
    class:"port",
    fill:isPortConnected(c.id,p[0])?"#56d49a":"#5d6d89",
    stroke:"#d7e2f7",
    "stroke-width":1.2
   });

   circle.addEventListener("pointerdown",e=>{
    e.stopPropagation();
    portClick(c,p[0]);
   });

   g.appendChild(circle);

   if(state.view==="technical"){
    const txt=createSVG("text",{
     x:p[1]+9,y:p[2]+3,class:"port-label"
    });
    txt.textContent=p[0];
    g.appendChild(txt);
   }
  });

  if(c.fault){
   const f=createSVG("text",{x:0,y:-t.h/2-9,"text-anchor":"middle",fill:"#ff6974","font-size":11});
   f.textContent="⚠ "+c.fault;
   g.appendChild(f);
  }

  g.addEventListener("pointerdown",e=>{
   if(e.target.classList.contains("port"))return;
   if(state.tool==="select"){
    state.selected=c.id;
    state.selectedConnection=null;
    updateInspector();
    render();
   }
  });

  compEl.appendChild(g);
 });
}

function drawSymbol(g,c,t){
 const type=c.type;
 const stroke="#dce6f8";
 const fill="#101a2d";

 if(type==="reservoir"){
  g.appendChild(createSVG("path",{d:"M -30 -20 L -30 25 Q 0 42 30 25 L 30 -20",fill,stroke,"stroke-width":2}));
  g.appendChild(createSVG("path",{d:"M -25 8 Q 0 0 25 8",fill:"none",stroke,"stroke-width":1}));
  return;
 }

 if(["pump","variablePump","compressor"].includes(type)){
  g.appendChild(createSVG("circle",{cx:0,cy:0,r:28,fill,stroke,"stroke-width":2}));
  g.appendChild(createSVG("path",{d:"M -10 9 L 14 0 L -10 -9 Z",fill:"none",stroke,"stroke-width":2}));
  if(type!=="pump")g.appendChild(createSVG("path",{d:"M -20 -27 L 20 -27",stroke,"stroke-width":1.5}));
  if(state.running){
   const ang=c.sim.angle||0;
   g.appendChild(createSVG("line",{x1:0,y1:-18,x2:0,y2:18,stroke,"stroke-width":2,transform:`rotate(${ang})`}));
  }
  return;
 }

 if(type==="motor"||type==="airMotor"){

function fitView(){
 if(!state.components.length){
  camera={x:svg.clientWidth/2,y:svg.clientHeight/2,zoom:1};
  render();
  return;
 }

 let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
 state.components.forEach(c=>{
  const t=TYPES[c.type];
  minX=Math.min(minX,c.x-t.w);
  maxX=Math.max(maxX,c.x+t.w);
  minY=Math.min(minY,c.y-t.h);
  maxY=Math.max(maxY,c.y+t.h);
 });

 const w=maxX-minX,h=maxY-minY;
 camera.zoom=Math.min(
  svg.clientWidth/(w+100),
  svg.clientHeight/(h+100),
  1.5
 );
 camera.x=svg.clientWidth/2-(minX+maxX)/2*camera.zoom;
 camera.y=svg.clientHeight/2-(minY+maxY)/2*camera.zoom;
 render();
}

function zoomIn(){
 camera.zoom=Math.min(3,camera.zoom*1.2);
 render();
}
function zoomOut(){
 camera.zoom=Math.max(.25,camera.zoom/1.2);
 render();
}

function toggleRun(){
 if(state.running){
  state.running=false;
  document.getElementById("runBtn").textContent="▶ Run";
  document.getElementById("simRun").textContent="▶ Run";
 }else{
  state.running=true;
  document.getElementById("runBtn").textContent="Ⅱ Pause";
  document.getElementById("simRun").textContent="Ⅱ Pause";
  requestAnimationFrame(simLoop);
 }

}

function stopSimulation(){
 state.running=false;
 state.simTime=0;
 state.components.forEach(c=>{
  c.sim.pressure=0;
  c.sim.flow=0;
  c.sim.speed=0;
  c.sim.force=0;
  c.sim.state="Stopped";
  c.sim.angle=0;
 });
 state.connections.forEach(h=>{
  h.flow=0;
  h.pressureDrop=0;
 });
 document.getElementById("runBtn").textContent="▶ Run";
 document.getElementById("simRun").textContent="▶ Run";

}

let lastSim=0;

function simLoop(t){
 if(!state.running)return;
 if(!lastSim)lastSim=t;
 let dt=Math.min(.05,(t-lastSim)/1000);
 lastSim=t;

 simulate(dt);
 render();

 requestAnimationFrame(simLoop);
}

function singleStep(){
 simulate(.05);
 render();
}

function simulate(dt){
 state.simTime+=dt;
 const hydraulic=state.mode==="hydraulic";

 state.components.forEach(c=>{
  c.sim.pressure=0;
  c.sim.flow=0;
  c.sim.force=0;
  c.sim.speed=0;
  c.sim.state="Idle";
 });

 /* Source components */
 state.components.forEach(c=>{
  if(c.fault==="Failed")return;

  if(c.type==="pump"||c.type==="variablePump"){
   c.sim.pressure=c.params.maxPressure||250;
   c.sim.flow=c.params.maxFlow||80;
   c.sim.speed=c.params.rpm||1450;
   c.sim.state="Running";
   c.sim.angle=(c.sim.angle+dt*(c.sim.speed||100)*6)%360;
  }

  if(c.type==="compressor"){
   c.sim.pressure=c.params.pressure||8;
   c.sim.flow=c.params.maxFlow||600;
   c.sim.speed=c.params.rpm||1450;
   c.sim.state="Running";
   c.sim.angle=(c.sim.angle+dt*(c.sim.speed||100)*6)%360;
  }
 });

 /* Iterate network pressure and flow */
 for(let pass=0;pass<4;pass++){
  state.connections.forEach(h=>{
   const a=getComponent(h.from.component);
   const b=getComponent(h.to.component);
   if(!a||!b)return;

   let source=0;
   let target=0;

   source=a.sim.pressure;
   target=b.sim.pressure;

   const restriction=connectionRestriction(h);
   const allowed=componentAllowsConnection(a,h.from.port,b,h.to.port);

   if(!allowed){
    h.flow=0;
    h.pressureDrop=0;
    return;
   }

   let flow=Math.max(0,Math.abs(source-target)*3*restriction);

   if(a.type==="pump"||a.type==="variablePump"||a.type==="compressor"){
    flow=Math.min(flow,a.sim.flow||0);
   }

   if(b.type==="pump"||b.type==="variablePump"||b.type==="compressor"){
    flow=0;
   }

   if(a.fault==="Blocked"||b.fault==="Blocked")flow=0;

   if(h.type==="soft"&&a.fault==="Burst hose")flow=0;
   if(h.type==="soft"&&b.fault==="Burst hose")flow=0;

   h.flow=flow;
   h.pressureDrop=Math.max(0,flow/(h.diameter||12)*.05*h.length/100);

   if(source>target){
    b.sim.pressure=Math.max(b.sim.pressure,source-h.pressureDrop);
   }else if(target>source){
    a.sim.pressure=Math.max(a.sim.pressure,target-h.pressureDrop);
   }
  });

  applyComponentPhysics();
 }

 /* connection leaks */
 state.connections.forEach(h=>{
  const a=getComponent(h.from.component);
  const b=getComponent(h.to.component);
  if(!a||!b)return;

  if(a.fault==="Leak"||b.fault==="Leak"){
   h.flow*=.35;
   h.pressureDrop*=1.7;
  }
 });

 state.components.forEach(c=>{
  if(c.fault==="Failed"){
   c.sim.pressure=0;
   c.sim.flow=0;
   c.sim.state="FAILED";
  }
 });
}

function connectionRestriction(h){
 const d=Math.max(4,h.diameter||12);
 let r=Math.min(1,d/16);

 if(h.type==="soft")r*=.98;
 if(h.type==="hard")r*=1;
 if(h.type==="steel")r*=1.05;
 if(h.type==="flexible")r*=.9;

 return Math.max(.05,Math.min(1,r));
}

function componentAllowsConnection(a,portA,b,portB){
 if(a.type==="reservoir"||b.type==="reservoir")return true;

 if(a.type==="check"||b.type==="check")return true;

 if(a.type.startsWith("valve")||a.type==="proportional"){
  if(!valvePortOpen(a,portA))return false;
 }

 if(b.type.startsWith("valve")||b.type==="proportional"){
  if(!valvePortOpen(b,portB))return false;
 }

 if(a.type==="relief"&&portA==="A"){
  return a.sim.pressure>=(a.params.setting||180);
 }

 if(b.type==="relief"&&portB==="A"){
  return b.sim.pressure>=(b.params.setting||180);
 }

 return true;
}

function valvePortOpen(c,port){
 const pos=c.params.position;

 if(c.type==="valve22"){
  return c.params.open!==false;
 }

 if(c.type==="valve32"){
  if(pos==="normal"){
   return port==="A"||port==="T";
  }
  return port==="P"||port==="A";
 }

 if(c.type==="valve42"||c.type==="valve52"){
  if(pos==="right")return port==="P"||port==="B"||port==="A"||port==="T";
  return port==="P"||port==="A"||port==="B"||port==="T";
 }

 if(c.type==="valve43"||c.type==="valve53"){
  if(pos==="center"){
   const ce=c.params.centre||"closed";
   if(ce==="closed"||ce==="tandem")return false;
   if(ce==="pt")return port==="P"||port==="T";
   if(ce==="float")return port==="A"||port==="B"||port==="T";
   return true;
  }
  return true;
 }

 return true;
}

function applyComponentPhysics(){
 state.components.forEach(c=>{
  if(c.fault==="Failed")return;

  if(c.type==="relief"){
   if(c.sim.pressure>(c.params.setting||180)){
    c.sim.pressure=c.params.setting||180;
    c.sim.state="Relieving";
   }
  }

  if(c.type==="reducing"){
   const setting=c.params.setting||100;
   if(c.sim.pressure>setting)c.sim.pressure=setting;
  }

  if(c.type==="flowControl"||c.type==="oneWayFlow"||c.type==="needle"){
   c.sim.flow=Math.min(c.sim.flow||100,c.params.flow||30);
  }

  if(c.type==="filter"||c.type==="airFilter"){
   if(c.fault==="Blocked")c.sim.flow*=.05;
  }

  if(c.type==="pump"||c.type==="variablePump"){
   if(c.sim.pressure>=(c.params.maxPressure||250)){
    c.sim.state="Pressure limited";
   }
  }

  if(c.type==="motor"||c.type==="airMotor"){
   c.sim.speed=Math.max(0,c.sim.flow*25);
   c.sim.torque=c.sim.pressure*(c.params.displacement||20)/62.8;
   c.sim.angle=(c.sim.angle+simDelta()*(c.sim.speed||0)*6)%360;
   c.sim.state=c.sim.speed>1?"Rotating":"Stopped";
  }

  if(c.type==="cylinderDA"){
   simulateCylinder(c);
  }

  if(c.type==="cylinderSA"){
   const area=Math.PI*Math.pow((c.params.bore||63)/1000,2)/4;
   const flow=c.sim.flow;
   const speed=flow/60000/Math.max(area,.000001);
   c.sim.speed=speed*1000;
   if(c.sim.pressure>1){
    c.params.position=Math.min(c.params.stroke||300,(c.params.position||0)+c.sim.speed*simDelta());
    c.sim.force=c.sim.pressure*1e5*area;
    c.sim.state="Extending";
   }
  }

  if(c.type==="accumulator"){
   if(c.sim.pressure>c.params.pressure){
    c.params.pressure=c.sim.pressure;
   }
  }

  if(c.type==="pressureSwitch"){
   c.sim.state=c.sim.pressure>=(c.params.setting||100)?"ON":"OFF";
  }

  if(c.type==="temperature"){
   c.sim.temperature=25+c.sim.flow*.08;
  }

  if(c.type==="pressureGauge"||c.type==="pressureSensor"){
   c.sim.state=`${c.sim.pressure.toFixed(1)} bar`;
  }
}

function simulateCylinder(c){
 const bore=(c.params.bore||63)/1000;
 const rod=(c.params.rod||32)/1000;
 const stroke=c.params.stroke||500;

 const areaA=Math.PI*bore*bore/4;
 const areaB=areaA-Math.PI*rod*rod/4;

 const attached=state.connections.filter(h=>
  h.from.component===c.id||h.to.component===c.id
 );

 let pa=0,pb=0,fa=0,fb=0;

 attached.forEach(h=>{
  const p=h.from.component===c.id?h.from.port:h.to.port;
  if(p==="A"){pa=Math.max(pa,h.from.component===c.id?getComponent(h.to.component)?.sim.pressure||0:getComponent(h.from.component)?.sim.pressure||0);fa=h.flow}
  if(p==="B"){pb=Math.max(pb,h.from.component===c.id?getComponent(h.to.component)?.sim.pressure||0:getComponent(h.from.component)?.sim.pressure||0);fb=h.flow}
 });

 const net=pa*1e5*areaA-pb*1e5*areaB-(c.params.load||0);

 const flowA=fa||0;
 const flowB=fb||0;

 if(net>0){
  const speed=(flowA/60000)/Math.max(areaA,.000001)*1000;
  c.sim.speed=speed;
  c.sim.force=net;
  c.params.position=Math.min(stroke,(c.params.position||0)+speed*simDelta());
  c.sim.state="Extending";
 }else if(net<0){
  const speed=(flowB/60000)/Math.max(areaB,.000001)*1000;
  c.sim.speed=speed;
  c.sim.force=Math.abs(net);
  c.params.position=Math.max(0,(c.params.position||0)-speed*simDelta());
  c.sim.state="Retracting";
 }else{
  c.sim.speed=0;
  c.sim.force=Math.abs(net);
  c.sim.state="Holding";
 }

 c.sim.pressure=Math.max(pa,pb);
 c.sim.flow=Math.max(flowA,flowB);
}

function simDelta(){
 return .05;
}

/* ============================================================
   SAVE / LOAD
   ============================================================ */

function saveCircuit(){
 const data={
  app:"Hydraulic Studio",
  version:2,
  saved:new Date().toISOString(),
  state:snapshot()
 };

 const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
 const a=document.createElement("a");
 a.href=URL.createObjectURL(blob);
 a.download="hydraulic-studio-circuit.json";
 a.click();
 URL.revokeObjectURL(a.href);
 toast("Circuit saved");
}

function loadCircuit(){
 const input=document.createElement("input");
 input.type="file";
 input.accept=".json,application/json";

 input.onchange=e=>{
  const file=e.target.files[0];
  if(!file)return;

  const reader=new FileReader();
  reader.onload=()=>{
   try{
    const data=JSON.parse(reader.result);
    historyPush();
    restore(data.state||data);
    toast("Circuit loaded");
   }catch(err){
    toast("Invalid circuit file");
   }
  };
  reader.readAsText(file);
 };

 input.click();
}

function newCircuit(){
 if(!confirm("Start a new circuit?"))return;
 historyPush();
 state.components=[];
 state.connections=[];
 state.labels=[];
 state.junctions=[];
 state.selected=null;
 state.selectedConnection=null;
 state.running=false;
 camera={x:svg.clientWidth/2,y:svg.clientHeight/2,zoom:1};
 render();
 toast("New circuit");
}

/* ============================================================
   EXAMPLE CIRCUIT
   ============================================================ */

function exampleCircuit(){
 historyPush();

 state.components=[];
 state.connections=[];
 state.labels=[];
 state.junctions=[];

 const tank=makeComponent("reservoir",250,350,"Tank");
 const pump=makeComponent("pump",430,350,"Pump");
 const valve=makeComponent("valve43",650,350,"4/3 Directional Valve");
 valve.params.position="left";
 valve.params.centre="closed";

 const cyl=makeComponent("cylinderDA",900,300,"Cylinder");
 const filter=makeComponent("filter",340,450,"Filter");
 const relief=makeComponent("relief",520,500,"Relief Valve");

 connectPorts(tank.id,"T",pump.id,"IN","hard");
 connectPorts(pump.id,"OUT",valve.id,"P","soft");
 connectPorts(valve.id,"A",cyl.id,"A","soft");
 connectPorts(cyl.id,"B",valve.id,"B","soft");
 connectPorts(valve.id,"T",tank.id,"R","hard");
 connectPorts(pump.id,"OUT",relief.id,"A","hard");
 connectPorts(relief.id,"T",tank.id,"R","hard");

 state.selected=valve.id;
 fitView();
 render();

 toast("Example hydraulic circuit created");
}

function makeComponent(type,x,y,label){
 const c={
  id:uid("C"),type,x,y,rotation:0,flipX:false,flipY:false,
  label,
  params:clone(defaults[type]||{}),
  sim:{pressure:0,flow:0,temperature:25,speed:0,force:0,torque:0,state:"Idle",angle:0},
  fault:null
 };
 state.components.push(c);
 return c;
}

/* ============================================================
   BOTTOM PANELS
   ============================================================ */

function showBottom(tab){
 document.querySelectorAll(".bottom-tab").forEach((b,i)=>{
  b.classList.toggle("active",b.textContent.toLowerCase().includes(tab));
 });

 if(tab==="analysis")showAnalysis();
 if(tab==="faults")showFaults();
 if(tab==="training")showTraining();
 if(tab==="log")showLog();
}

function showAnalysis(){
 const pressures=state.components
  .filter(c=>c.sim.pressure>0)
  .map(c=>`${c.label}: ${c.sim.pressure.toFixed(1)} bar`);

 state.log.push({
  time:new Date().toLocaleTimeString(),
  text:"Analysis updated"
 });

 toast(
  pressures.length
  ? "Pressures: "+pressures.slice(0,3).join(" • ")
  : "No pressure detected"
 );
}

function showFaults(){
 const faults=state.components.filter(c=>c.fault);
 if(!faults.length){
  toast("No active component faults");
  return;
 }
 toast("Faults: "+faults.map(c=>c.label+" ("+c.fault+")").join(", "));
}

function showTraining(){
 state.training.active=true;
 toast(state.training.target);
}

function showLog(){
 const logs=state.log.slice(-5).map(x=>x.text).join(" • ");
 toast(logs||"No events logged");
}

function updateStatus(){
 const connected=state.connections.length;
 const comps=state.components.length;
 const faults=state.components.filter(c=>c.fault).length;

 document.getElementById("status").textContent=
  `${comps} components • ${connected} connections • ${faults} faults • ${state.running?"SIM RUNNING":"Ready"}`;
}

/* ============================================================
   KEYBOARD
   ============================================================ */

document.addEventListener("keydown",e=>{
 const tag=document.activeElement?.tagName;
 if(tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT")return;

 if(e.key==="Delete"||e.key==="Backspace"){
  e.preventDefault();
  deleteSelected();
 }
 if(e.key.toLowerCase()==="r")rotateSelected();
 if(e.key.toLowerCase()==="h")setTool("hose");
 if(e.key.toLowerCase()==="p")setTool("pipe");
 if(e.key.toLowerCase()==="v")setTool("select");
 if(e.key.toLowerCase()==="c")duplicateSelected();

 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"){
  e.preventDefault();
  undo();
 }
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="y"){
  e.preventDefault();
  redo();
 }
 if(e.key==="Escape"){
  hoseStart=null;
  measureStart=null;
  state.selected=null;
  state.selectedConnection=null;
  render();
 }
});

/* ============================================================
   TOAST
   ============================================================ */

let toastTimer;

function toast(text){
 const el=document.getElementById("toast");
 el.textContent=text;
 el.classList.add("show");
 clearTimeout(toastTimer);
 toastTimer=setTimeout(()=>el.classList.remove("show"),1800);
}

   INITIALISE
   ============================================================ */

renderLibrary();

camera={
 x:window.innerWidth/2,
 y:window.innerHeight/2,
 zoom:1
};

render();

/* Put a starter workspace on screen so the user immediately
   has visible components instead of an empty editor. */
setTimeout(()=>{
 if(!state.components.length){
  const tank=makeComponent("reservoir",-280,0,"Tank");
  const pump=makeComponent("pump",-100,0,"Pump");
  const valve=makeComponent("valve43",120,0,"4/3 Valve");
  const cylinder=makeComponent("cylinderDA",390,0,"Cylinder");

  valve.params.position="left";

  connectPorts(tank.id,"T",pump.id,"IN","hard");
  connectPorts(pump.id,"OUT",valve.id,"P","soft");
  connectPorts(valve.id,"A",cylinder.id,"A","soft");
  connectPorts(cylinder.id,"B",valve.id,"B","soft");
  connectPorts(valve.id,"T",tank.id,"R","hard");

  state.selected=valve.id;
  fitView();
  render();
 }
},100);

/* Responsive resize */
window.addEventListener("resize",()=>{
 render();
});

/* Close mobile panels after placing */
document.addEventListener("click",e=>{
 if(window.innerWidth>950)return;

 if(e.target.closest(".comp-btn")){
  document.getElementById("library").classList.remove("open");
 }
});

/* Double click component opens valve builder when directional */
svg.addEventListener("dblclick",e=>{
 const p=pointerWorld(e);
 const c=componentAt(p.x,p.y);
 if(c&&c.type.startsWith("valve")){
  state.selected=c.id;
  openValveBuilder();
 }
});
