<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hydraulic Studio">

<title>Hydraulic Studio</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:#080d18;
  color:#e7edf7;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
  color:inherit;
}

.app{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
}

/* =========================================================
   DESKTOP
========================================================= */

.desktopTop{
  height:58px;
  min-height:58px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px 12px;
  background:#111827;
  border-bottom:1px solid #263247;
  z-index:20;
}

.brand{
  font-weight:800;
  font-size:17px;
  margin-right:8px;
  white-space:nowrap;
}

.brand span{
  color:#38bdf8;
}

.toolbar{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

.btn{
  min-height:38px;
  padding:8px 12px;
  border:1px solid #334155;
  border-radius:8px;
  background:#172033;
}

.btn:hover{
  background:#1e293b;
}

.btn.primary{
  background:#0ea5e9;
  border-color:#38bdf8;
  color:#00121c;
  font-weight:800;
}

.btn.danger{
  background:#35151b;
  border-color:#7f1d1d;
}

.btn.success{
  background:#123524;
  border-color:#166534;
}

.workspace{
  flex:1;
  min-height:0;
  display:grid;
  grid-template-columns:235px 1fr 290px;
}

.library{
  overflow:auto;
  background:#0f172a;
  border-right:1px solid #263247;
  padding:10px;
}

.panelTitle{
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.12em;
  color:#94a3b8;
  margin:8px 4px;
}

.componentGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}

.componentBtn{
  min-height:62px;
  padding:7px;
  border-radius:9px;
  border:1px solid #334155;
  background:#151e2f;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
}

.componentBtn:hover{
  border-color:#38bdf8;
  background:#1a263a;
}

.componentIcon{
  font-size:22px;
}

.componentName{
  font-size:11px;
  text-align:center;
  color:#dbe5f2;
}

.canvasWrap{
  position:relative;
  min-width:0;
  min-height:0;
  overflow:hidden;
  background:
    linear-gradient(#172033 1px,transparent 1px),
    linear-gradient(90deg,#172033 1px,transparent 1px),
    #0b1020;
  background-size:20px 20px;
}

#svg{
  width:100%;
  height:100%;
  display:block;
  touch-action:none;
  user-select:none;
}

.inspector{
  overflow:auto;
  background:#0f172a;
  border-left:1px solid #263247;
  padding:12px;
}

.statusBar{
  height:30px;
  min-height:30px;
  padding:6px 12px;
  background:#0b1220;
  border-top:1px solid #263247;
  font-size:11px;
  color:#94a3b8;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

/* =========================================================
   MOBILE HEADER
========================================================= */

.mobileTop{
  display:none;
}

.mobileNav{
  display:none;
}

/* =========================================================
   SVG
========================================================= */

.wire{
  fill:none;
  stroke:#38bdf8;
  stroke-width:4;
  stroke-linecap:round;
  stroke-linejoin:round;
  pointer-events:stroke;
}

.wire.return{
  stroke:#64748b;
}

.wire.active{
  stroke:#22c55e;
  stroke-width:5;
}

.wire.flow{
  stroke-dasharray:12 9;
  animation:flowAnim .7s linear infinite;
}

@keyframes flowAnim{
  to{stroke-dashoffset:-21}
}

.component{
  cursor:grab;
}

.component.selected .body{
  stroke:#facc15;
  stroke-width:3;
}

.body{
  fill:#162033;
  stroke:#64748b;
  stroke-width:2;
}

.component text{
  pointer-events:none;
  user-select:none;
}

.label{
  fill:#f8fafc;
  font-size:13px;
  font-weight:700;
}

.subLabel{
  fill:#94a3b8;
  font-size:10px;
}

.port{
  fill:#0b1020;
  stroke:#38bdf8;
  stroke-width:2;
  cursor:pointer;
}

.port:hover{
  fill:#38bdf8;
}

.port.connecting{
  fill:#facc15;
  stroke:#fff;
  stroke-width:3;
}

.flowDot{
  fill:#22c55e;
}

/* =========================================================
   INSPECTOR
========================================================= */

.inspectorCard{
  background:#151e2f;
  border:1px solid #2c3a50;
  border-radius:10px;
  padding:11px;
  margin-bottom:10px;
}

.inspector h3{
  margin:0 0 10px;
  font-size:15px;
}

.field{
  margin-bottom:10px;
}

.field label{
  display:block;
  font-size:11px;
  color:#94a3b8;
  margin-bottom:4px;
}

.field input,
.field select{
  width:100%;
  min-height:38px;
  border:1px solid #334155;
  border-radius:7px;
  background:#0b1220;
  color:#f8fafc;
  padding:7px 9px;
}

.rangeRow{
  display:flex;
  gap:8px;
  align-items:center;
}

.rangeRow input[type=range]{
  flex:1;
}

.rangeValue{
  width:60px;
  text-align:right;
  font-size:12px;
}

.bigSegment{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}

.bigSegment button{
  min-height:42px;
  border-radius:8px;
  border:1px solid #334155;
  background:#101827;
}

.bigSegment button.active{
  background:#075985;
  border-color:#38bdf8;
}

.metricGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}

.metric{
  padding:10px;
  background:#0b1220;
  border:1px solid #263247;
  border-radius:8px;
}

.metric small{
  display:block;
  color:#94a3b8;
  font-size:10px;
}

.metric strong{
  display:block;
  margin-top:3px;
  font-size:18px;
}

.diagnostic{
  padding:9px;
  margin-bottom:6px;
  border-radius:8px;
  font-size:12px;
  border:1px solid #334155;
  background:#0b1220;
}

.diagnostic.warn{
  border-color:#854d0e;
  background:#29200c;
}

.diagnostic.bad{
  border-color:#7f1d1d;
  background:#2a1116;
}

.diagnostic.good{
  border-color:#166534;
  background:#0c2518;
}

/* =========================================================
   MOBILE
========================================================= */

/* =========================================================
   MODAL
========================================================= */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.68);
  z-index:300;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal.open{
  display:flex;
}

.modalBox{
  width:min(500px,100%);
  max-height:90vh;
  overflow:auto;
  background:#111827;
  border:1px solid #334155;
  border-radius:15px;
  padding:18px;
}

.modalBox h2{
  margin-top:0;
}

.modalActions{
  display:flex;
  gap:8px;
  justify-content:flex-end;
  margin-top:15px;

<body>

<div class="app">

  <!-- DESKTOP TOP -->
  <header class="desktopTop">
    <div class="brand">Hydraulic <span>Studio</span></div>

    <div class="toolbar">
      <button class="btn primary" onclick="toggleSimulation()">▶ Run</button>
      <button class="btn" onclick="resetSimulation()">↺ Reset</button>
      <button class="btn" onclick="undo()">↶ Undo</button>
      <button class="btn" onclick="redo()">↷ Redo</button>
      <button class="btn" onclick="loadExample()">🧪 Example</button>
      <button class="btn" onclick="saveProject()">💾 Save</button>
      <button class="btn" onclick="loadProject()">📂 Load</button>
      <button class="btn" onclick="runDiagnostics()">🔍 Diagnostics</button>
    </div>

    <div style="margin-left:auto;font-size:12px;color:#94a3b8" id="desktopState">
      STOPPED
    </div>
  </header>

  <!-- MOBILE HEADER -->
  <header class="mobileTop">
    <div class="mobileBrand">Hydraulic <span>Studio</span></div>

    <div class="mobileTopRight">
      <button class="run" id="mobileRunBtn" onclick="toggleSimulation()">▶</button>
      <button onclick="mobileMenu()">⋯</button>
    </div>
  </header>

  <main class="workspace">

    <!-- DESKTOP LIBRARY -->
    <aside class="library">
      <div class="panelTitle">Components</div>
      <div class="componentGrid" id="desktopComponents"></div>

      <div class="panelTitle">System</div>
      <button class="btn" style="width:100%;margin-bottom:6px" onclick="loadExample()">Load Example</button>
      <button class="btn" style="width:100%;margin-bottom:6px" onclick="saveProject()">Save Project</button>
      <button class="btn" style="width:100%" onclick="clearCircuit()">Clear Circuit</button>
    </aside>

    <!-- CANVAS -->
    <section class="canvasWrap" id="canvasWrap">
      <svg id="svg"></svg>
    </section>

    <!-- DESKTOP INSPECTOR -->
    <aside class="inspector" id="desktopInspector"></aside>

  </main>

  <div class="statusBar">
    <span id="statusText">Ready</span>
    <span id="statusMetrics">0 components • 0 connections</span>
  </div>

  <!-- MOBILE CONNECTION BANNER -->
  <div class="connectionBanner" id="connectionBanner">
    <span>Tap another port to connect</span>
    <button onclick="cancelConnection()">Cancel</button>
  </div>

  <div class="selectedBadge" id="selectedBadge" style="display:none"></div>

  <!-- MOBILE SHEET -->
  <section class="mobileSheet" id="mobileSheet">
    <div class="sheetHandle"></div>
    <div id="mobileSheetContent"></div>
  </section>

  <!-- MOBILE NAV -->
  <nav class="mobileNav">
    <button data-tab="components" onclick="setMobileTab('components')">
      <span>🧩</span><span>Components</span>
    </button>

    <button data-tab="circuit" onclick="setMobileTab('circuit')">
      <span>🔗</span><span>Circuit</span>
    </button>

    <button data-tab="simulate" onclick="setMobileTab('simulate')">
      <span>▶️</span><span>Simulate</span>
    </button>

    <button data-tab="monitor" onclick="setMobileTab('monitor')">
      <span>📊</span><span>Monitor</span>
    </button>

    <button data-tab="properties" onclick="setMobileTab('properties')">
      <span>⚙️</span><span>Properties</span>
    </button>
  </nav>

  <div class="mobileToast" id="mobileToast"></div>

</div>

<!-- IMPORT/EXPORT MODAL -->
<div class="modal" id="modal">
  <div class="modalBox">
    <h2>Hydraulic Studio Project</h2>
    <textarea id="projectText"
      style="width:100%;height:300px;background:#080d18;color:#e2e8f0;border:1px solid #334155;border-radius:8px;padding:10px;font-family:monospace"></textarea>

    <div class="modalActions">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn primary" onclick="importProject()">Import</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   HYDRAULIC STUDIO
   Mobile-first hydraulic engineering simulator
========================================================= */

const svg = document.getElementById("svg");
const canvasWrap = document.getElementById("canvasWrap");

let components = [];
let connections = [];

let selectedId = null;
let connectingPort = null;

let simulationRunning = false;
let simulationTime = 0;
let animationFrame = null;

let undoStack = [];
let redoStack = [];

let zoom = 1;
let panX = 0;
let panY = 0;

let mobileTab = null;

const componentDefs = {

  tank:{
    name:"Tank",
    icon:"🛢️",
    ports:["T"],
    defaults:{}
  },

  pump:{
    name:"Fixed Pump",
    icon:"⚙️",
    ports:["IN","OUT"],
    defaults:{
      displacement:16,
      rpm:1450,
      efficiency:.90
    }
  },

  variablePump:{
    name:"Variable Pump",
    icon:"⚙️",
    ports:["IN","OUT"],
    defaults:{
      displacement:32,
      rpm:1450,
      efficiency:.92,
      swash:75,
      compensator:250
    }
  },

  accumulator:{
    name:"Accumulator",
    icon:"🔵",
    ports:["P"],
    defaults:{
      volume:20,
      precharge:100,
      maxPressure:250
    }
  },

  valve43:{
    name:"4/3 Valve",
    icon:"↔️",
    ports:["P","T","A","B"],
    defaults:{
      position:"extend",
      centre:"closed",
      flowRating:120
    }
  },

  valve42:{
    name:"4/2 Valve",
    icon:"↔️",
    ports:["P","T","A","B"],
    defaults:{
      position:"extend",
      flowRating:120
    }
  },

  proportional:{
    name:"Proportional Valve",
    icon:"🎚️",
    ports:["P","T","A","B"],
    defaults:{
      command:70,
      flowRating:120
    }
  },

  relief:{
    name:"Relief Valve",
    icon:"🛡️",
    ports:["P","T"],
    defaults:{
      setting:210,
      cracking:.5
    }
  },

  reducing:{
    name:"Reducing Valve",
    icon:"⬇️",
    ports:["IN","OUT","T"],
    defaults:{
      setting:120

  },

  sequence:{
    name:"Sequence Valve",
    icon:"⏭️",
    ports:["IN","OUT","T"],
    defaults:{
      setting:100
    }
  },

  counterbalance:{
    name:"Counterbalance",

/* =========================================================
   UTILITIES
========================================================= */

function uid(prefix="c"){
  return prefix + Math.random().toString(36).slice(2,9);
}

function clone(o){
  return JSON.parse(JSON.stringify(o));
}

function clamp(v,min,max){
  return Math.max(min,Math.min(max,v));
}

function fmt(v,d=1){
  if(!Number.isFinite(v)) return "0";
  return Number(v).toFixed(d);
}

function componentName(type){
  return componentDefs[type]?.name || type;
}

function toast(msg){
  const el=document.getElementById("mobileToast");
  el.textContent=msg;
  el.classList.add("show");
  clearTimeout(window.toastTimer);
  window.toastTimer=setTimeout(()=>el.classList.remove("show"),1800);
}

/* =========================================================
   HISTORY
========================================================= */

function snapshot(){
  return {
    components:clone(components),
    connections:clone(connections)
  };
}

function pushHistory(){
  undoStack.push(snapshot());

  if(undoStack.length>50){
    undoStack.shift();
  }

  redoStack=[];
}

function restore(s){
  components=clone(s.components);
  connections=clone(s.connections);
  selectedId=null;
  connectingPort=null;
  render();
}

function undo(){
  if(!undoStack.length){
    toast("Nothing to undo");
    return;
  }

  redoStack.push(snapshot());
  restore(undoStack.pop());
}

function redo(){
  if(!redoStack.length){
    toast("Nothing to redo");
    return;
  }

  undoStack.push(snapshot());
  restore(redoStack.pop());
}

/* =========================================================
   COMPONENTS
========================================================= */

function addComponent(type,x=null,y=null){

  pushHistory();

  const def=componentDefs[type];

  if(x===null){
    x=250 + Math.random()*350;
  }

  if(y===null){
    y=180 + Math.random()*220;
  }

  const c={
    id:uid(),
    type,
    x,
    y,
    rotation:0,
    properties:clone(def.defaults)
  };

  components.push(c);

  selectedId=c.id;

  render();
  openProperties();

  toast(componentName(type)+" added");
}

function getComponent(id){
  return components.find(c=>c.id===id);
}

function deleteSelected(){

  if(!selectedId){
    toast("Select a component first");
    return;
  }

  pushHistory();

  connections=connections.filter(
    w=>w.a.component!==selectedId &&
       w.b.component!==selectedId
  );

  components=components.filter(c=>c.id!==selectedId);

  selectedId=null;

  render();
  toast("Component deleted");
}

function clearCircuit(){

  if(!components.length) return;

  if(!confirm("Clear the entire circuit?")) return;

  pushHistory();

  components=[];
  connections=[];
  selectedId=null;

  render();
}

function duplicateSelected(){

  const c=getComponent(selectedId);

  if(!c) return;

  pushHistory();

  const copy=clone(c);

  copy.id=uid();
  copy.x+=40;
  copy.y+=40;

  components.push(copy);
  selectedId=copy.id;

  render();
}

/* =========================================================
   PORT GEOMETRY
========================================================= */

function portPosition(c,port){

  const base={
    IN:{x:-65,y:0},
    OUT:{x:65,y:0},
    P:{x:-65,y:0},
    T:{x:65,y:0},
    A:{x:0,y:-42},
    B:{x:0,y:42},
    PILOT:{x:0,y:-55}
  }[port] || {x:0,y:0};

  let x=base.x;
  let y=base.y;

  const r=(c.rotation||0)*Math.PI/180;

  return {
    x:c.x + x*Math.cos(r)-y*Math.sin(r),
    y:c.y + x*Math.sin(r)+y*Math.cos(r)
  };
}

/* =========================================================
   RENDER
========================================================= */

function render(){

  renderLibrary();
  renderCanvas();
  renderInspector();
  renderMobileSheet();
  updateStatus();
}

function renderLibrary(){

  const el=document.getElementById("desktopComponents");

  el.innerHTML="";

  componentOrder.forEach(type=>{

    const d=componentDefs[type];

    const b=document.createElement("button");

    b.className="componentBtn";

    b.innerHTML=`
      <div class="componentIcon">${d.icon}</div>
      <div class="componentName">${d.name}</div>
    `;

    b.onclick=()=>addComponent(type);

    el.appendChild(b);
  });
}

function renderCanvas(){

  const w=canvasWrap.clientWidth;
  const h=canvasWrap.clientHeight;

  svg.setAttribute("viewBox",`0 0 ${w} ${h}`);

  let html="";

  html+=`
    <g transform="translate(${panX},${panY}) scale(${zoom})">
  `;

  /* wires */
  connections.forEach(wire=>{

    const ca=getComponent(wire.a.component);
    const cb=getComponent(wire.b.component);

    if(!ca||!cb) return;

    const a=portPosition(ca,wire.a.port);
    const b=portPosition(cb,wire.b.port);

    const active=simulationRunning &&
      (ca.type==="pump" ||
       ca.type==="variablePump" ||
       cb.type==="pump" ||
       cb.type==="variablePump");

    html+=`
      <path
        class="wire ${active?"active flow":""}"
        d="M ${a.x} ${a.y} L ${(a.x+b.x)/2} ${a.y} L ${(a.x+b.x)/2} ${b.y} L ${b.x} ${b.y}"
      />
    `;
  });

  /* components */
  components.forEach(c=>{

    const d=componentDefs[c.type];

    const selected=c.id===selectedId;

    html+=`
      <g
        class="component ${selected?"selected":""}"
        transform="translate(${c.x},${c.y}) rotate(${c.rotation||0})"
        data-id="${c.id}"
      >

        ${drawBody(c)}

        <text
          class="label"
          x="0"
          y="62"
          text-anchor="middle"
        >
          ${escapeHtml(d.name)}
        </text>

        ${drawPorts(c)}

      </g>
    `;
  });

  html+="</g>";

  svg.innerHTML=html;

  bindSVGEvents();
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,m=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  }[m]));
}

function drawPorts(c){

  const ports=componentDefs[c.type].ports;

  return ports.map(p=>{

    const pos={
      IN:{x:-65,y:0},
      OUT:{x:65,y:0},
      P:{x:-65,y:0},
      T:{x:65,y:0},
      A:{x:0,y:-42},
      B:{x:0,y:42},
      PILOT:{x:0,y:-55}
    }[p] || {x:0,y:0};

    const connecting=
      connectingPort &&
      connectingPort.component===c.id &&
      connectingPort.port===p;

    return `
      <circle
        class="port ${connecting?"connecting":""}"
        cx="${pos.x}"
        cy="${pos.y}"
        r="${window.innerWidth<=850?10:7}"
        data-port="${p}"
        data-component="${c.id}"
      />
      <text
        x="${pos.x}"
        y="${pos.y-13}"
        text-anchor="middle"
        class="subLabel"
      >${p}</text>
    `;
  }).join("");
}

/* =========================================================
   SVG INTERACTION
========================================================= */

let dragState=null;

function bindSVGEvents(){

  svg.querySelectorAll(".component").forEach(g=>{

    g.addEventListener("pointerdown",startComponentDrag);

    g.addEventListener("click",e=>{

      if(e.target.classList.contains("port")) return;

      const id=g.dataset.id;

      selectedId=id;

      renderInspector();
      updateSelectedBadge();

      if(window.innerWidth<=850){
        setMobileTab("properties");
      }

      e.stopPropagation();
    });
  });

  svg.querySelectorAll(".port").forEach(port=>{

    port.addEventListener("pointerdown",e=>{

      e.stopPropagation();

      const component=port.dataset.component;
      const p=port.dataset.port;

      handlePortTap(component,p);
    });
  });
}

function startComponentDrag(e){

  if(e.target.classList.contains("port")) return;

  const id=e.currentTarget.dataset.id;

  const c=getComponent(id);

  if(!c) return;

  selectedId=id;

  const pt=svgPoint(e);

  dragState={
    id,
    startX:pt.x,
    startY:pt.y,
    origX:c.x,
    origY:c.y,
    moved:false
  };

  e.currentTarget.setPointerCapture?.(e.pointerId);

  e.stopPropagation();
}

svg.addEventListener("pointermove",e=>{

  if(!dragState) return;

  const pt=svgPoint(e);

  const c=getComponent(dragState.id);

  if(!c) return;

  const dx=pt.x-dragState.startX;
  const dy=pt.y-dragState.startY;

  if(Math.abs(dx)+Math.abs(dy)>3){
    dragState.moved=true;
  }

  c.x=snap(dragState.origX+dx);
  c.y=snap(dragState.origY+dy);

  renderCanvas();
});

svg.addEventListener("pointerup",e=>{

  if(!dragState) return;

  if(dragState.moved){
    pushHistory();
  }

  dragState=null;

  renderInspector();
  updateStatus();
});

svg.addEventListener("pointercancel",()=>{
  dragState=null;
});

function snap(v){
  return Math.round(v/10)*10;
}

function svgPoint(e){

  const rect=svg.getBoundingClientRect();

  return {
    x:(e.clientX-rect.left-panX)/zoom,
    y:(e.clientY-rect.top-panY)/zoom
  };
}

/* =========================================================
   CONNECTIONS
========================================================= */

function handlePortTap(component,port){

  if(!connectingPort){

    connectingPort={
      component,
      port
    };

    document.getElementById("connectionBanner")
      .classList.add("show");

    renderCanvas();

    toast("Now tap the second port");

    return;
  }

  if(
    connectingPort.component===component &&
    connectingPort.port===port
  ){
    cancelConnection();
    return;
  }

  pushHistory();

  const exists=connections.some(w=>
    (w.a.component===connectingPort.component &&
     w.a.port===connectingPort.port &&
     w.b.component===component &&
     w.b.port===port) ||
    (w.b.component===connectingPort.component &&
     w.b.port===connectingPort.port &&
     w.a.component===component &&
     w.a.port===port)
  );

  if(!exists){

    connections.push({
      id:uid("w"),
      a:{
        component:connectingPort.component,
        port:connectingPort.port
      },
      b:{
        component,
        port
      }
    });

    toast("Hydraulic connection created");
  }

  cancelConnection();
  render();
}

function cancelConnection(){

  connectingPort=null;

  document.getElementById("connectionBanner")
    .classList.remove("show");

  renderCanvas();
}

    html+=numberField("Displacement","displacement",p.displacement,"cc/rev",mode);
    html+=numberField("Speed","rpm",p.rpm,"rpm",mode);
    html+=rangeField("Swash","swash",p.swash,0,100,"%","swash",mode);
    html+=numberField("Compensator","compensator",p.compensator,"bar",mode);
    html+=numberField("Efficiency","efficiency",p.efficiency*100,"%","",true);
  }

  if(c.type==="accumulator"){

    html+=numberField("Volume","volume",p.volume,"L",mode);
    html+=numberField("Precharge","precharge",p.precharge,"bar",mode);
    html+=numberField("Maximum Pressure","maxPressure",p.maxPressure,"bar",mode);
  }

  if(c.type==="valve43"){

    html+=`
      <div class="field">
        <label>Valve Position</label>
        <div class="${mode==="mobile"?"mobileBigSegment":"bigSegment"}">
          ${["extend","center","retract","float"].map(v=>`
            <button
              class="${p.position===v?"active":""}"
              onclick="setProperty('${c.id}','position','${v}')">
              ${v.toUpperCase()}
            </button>
          `).join("")}
        </div>
      </div>

      <div class="field">
        <label>Centre Condition</label>
        <div class="${mode==="mobile"?"mobileBigSegment":"bigSegment"}">
          ${["closed","open","float"].map(v=>`
            <button
              class="${p.centre===v?"active":""}"
              onclick="setProperty('${c.id}','centre','${v}')">
              ${v.toUpperCase()}
            </button>
          `).join("")}
        </div>
      </div>
    `;

    html+=numberField("Flow Rating","flowRating",p.flowRating,"L/min",mode);
  }

  if(c.type==="valve42"){

    html+=`
      <div class="field">
        <label>Valve Position</label>
        <div class="bigSegment">
          <button class="${p.position==="extend"?"active":""}"
            onclick="setProperty('${c.id}','position','extend')">EXTEND</button>
          <button class="${p.position==="retract"?"active":""}"
            onclick="setProperty('${c.id}','position','retract')">RETRACT</button>
        </div>
      </div>
    `;

    html+=numberField("Flow Rating","flowRating",p.flowRating,"L/min",mode);
  }

  if(c.type==="proportional"){

    html+=rangeField(
      "Command",
      "command",

      0,
      100,
      "%",
      "command",
      mode
    );

    html+=numberField("Flow Rating","flowRating",p.flowRating,"L/min",mode);
  }

  if(["relief","reducing","sequence","counterbalance"].includes(c.type)){

    html+=numberField(
      "Pressure Setting",
      c.type==="relief"?"setting":"setting",
      p.setting,
      "bar",
      mode
    );

    if(c.type==="relief"){
      html+=numberField("Cracking","cracking",p.cracking,"bar",mode);
    }

    if(c.type==="counterbalance"){
      html+=numberField("Pilot Ratio","pilotRatio",p.pilotRatio,":1",mode);
    }

    html+=numberField("Cracking Pressure","cracking",p.cracking,"bar",mode);

  if(c.type==="flowControl" || c.type==="throttleCheck"){

    html+=rangeField(
      "Opening",
      "opening",
      p.opening,
      0,
      100,
      "%",
      "opening",
      mode
    );

    html+=numberField("Maximum Flow","maxFlow",p.maxFlow,"L/min",mode);

    html+=`
      <div class="field">
        <label>Control Mode</label>

          <option value="meter-out" ${p.mode==="meter-out"?"selected":""}>Meter Out</option>
        </select>
      </div>
    `;
  }

  if(c.type==="filter"){

    html+=numberField("Pressure Rating","rating",p.rating,"bar",mode);

    html+=numberField("Load","load",p.load,"N",mode);
    html+=numberField("Friction","friction",p.friction,"N",mode);
    html+=numberField("Position","position",p.position,"mm",mode);
    html+=numberField("Maximum Speed","maxSpeed",p.maxSpeed,"mm/s",mode);
  }

  if(c.type==="motor"){

    html+=numberField("Displacement","displacement",p.displacement,"cc/rev",mode);
    html+=numberField("Load Torque","loadTorque",p.loadTorque,"Nm",mode);
    html+=numberField("Speed Limit","speedLimit",p.speedLimit,"rpm",mode);
  }

  html+=`

function numberField(label,key,value,unit,mode,percent=false){

  let v=value;

  if(percent && typeof v==="number"){
    v=v;
  }

  return `
    <div class="field">
      <label>${label}${unit?` (${unit})`:""}</label>
      <input
        type="number"
        step="any"
        value="${v}"
        onchange="setNumericProperty('${selectedId}','${key}',this.value,${percent})"
      >
    </div>
  `;
}

function rangeField(label,key,value,min,max,unit,updateKey,mode){

  return `
    <div class="field">
      <label>${label}</label>
      <div class="rangeRow">
        <input
          type="range"
          min="${min}"
          max="${max}"
          step="1"
          value="${value}"
          oninput="setProperty('${selectedId}','${key}',Number(this.value),true)"
        >
        <div class="rangeValue">
          <span id="${mode}-${updateKey}-value">${Math.round(value)}</span>${unit}
        </div>
      </div>
    </div>
  `;
}

function setNumericProperty(id,key,value,percent=false){

  const c=getComponent(id);

  if(!c) return;

  pushHistory();

  let v=Number(value);

  if(percent && key==="efficiency"){
    v=clamp(v,0,100)/100;
  }

  if(!Number.isFinite(v)) return;

  c.properties[key]=v;

  render();
}

function setProperty(id,key,value,live=false){

  const c=getComponent(id);

  if(!c) return;

  if(!live) pushHistory();

  c.properties[key]=value;

  renderCanvas();
  renderInspector();
  renderMobileSheet();
}

function fitCircuit(){

  }

  const xs=components.map(c=>c.x);
  const ys=components.map(c=>c.y);

  const minX=Math.min(...xs)-100;
  const maxX=Math.max(...xs)+100;
  const minY=Math.min(...ys)-100;
  const maxY=Math.max(...ys)+100;

  const width=maxX-minX;
  const height=maxY-minY;

  const cw=canvasWrap.clientWidth;
  const ch=canvasWrap.clientHeight;

  zoom=Math.min(cw/width,ch/height);

  zoom=clamp(zoom,.35,1.5);

  panX=(cw-width*zoom)/2-minX*zoom;
  panY=(ch-height*zoom)/2-minY*zoom;

  renderCanvas();
}

/* =========================================================
   HYDRAULIC SOLVER
========================================================= */

function pumpFlow(c){

  const p=c.properties;

  const theoretical=
    (p.displacement*p.rpm)/1000;

  return theoretical*(p.efficiency||.9);
}

function variablePumpFlow(c){

  const p=c.properties;

  const theoretical=
    (p.displacement*p.rpm)/1000;

  return theoretical*
    (clamp(p.swash,0,100)/100)*
    (p.efficiency||.9);
}

function cylinderAreaA(c){

  const bore=c.properties.bore;

  return Math.PI*Math.pow(bore/1000,2)/4;
}

function cylinderAreaB(c){

  const bore=c.properties.bore;
  const rod=c.properties.rod;

  return Math.PI*(
    Math.pow(bore/1000,2)-
    Math.pow(rod/1000,2)
  )/4;
}

function getSystemPressureRaw(){

  const pumps=components.filter(
    c=>c.type==="pump"||c.type==="variablePump"
  );

  if(!pumps.length) return 0;

  let pumpFlow=0;

  pumps.forEach(c=>{
    pumpFlow+=
      c.type==="pump"
      ?pumpFlowFor(c)
      :variablePumpFlow(c);
  });

  const cylinders=components.filter(c=>c.type==="cylinder");

  if(!cylinders.length){

    const relief=components.find(c=>c.type==="relief");

    return relief
      ?Math.min(relief.properties.setting,80)
      :50;
  }

  let required=0;

  cylinders.forEach(c=>{

    const area=cylinderAreaA(c);

    required+=
      c.properties.load/
      Math.max(area,0.00001)/
      100000;
  });

  const flowFactor=clamp(
    pumpFlow/100,
    .15,
    1.2
  );

  let pressure=
    required/flowFactor;

  const relief=components.find(c=>c.type==="relief");

  if(relief){
    pressure=Math.min(
      pressure,
      relief.properties.setting
    );
  }

  return clamp(pressure,0,350);
}

function pumpFlowFor(c){

  let q=pumpFlow(c);

  if(hasFault(c.id,"pumpWear")){
    q*=.55;
  }

  return q;
}

function getSystemFlow(){

  let q=0;

  components.forEach(c=>{

    if(c.type==="pump"){
      q+=pumpFlowFor(c);
    }

    if(c.type==="variablePump"){
      q+=variablePumpFlow(c);
    }
  });

  if(!simulationRunning) q*=.25;

  const filter=components.find(c=>c.type==="filter");

  if(filter && hasFault(filter.id,"blockedFilter")){
    q*=.15;
  }

  const flowControls=
    components.filter(
      c=>c.type==="flowControl"||
         c.type==="throttleCheck"
    );

  flowControls.forEach(c=>{
    q*=clamp(c.properties.opening/100,.02,1);
  });

  const valves=
    components.filter(
      c=>c.type==="valve43"||
         c.type==="valve42"||
         c.type==="proportional"
    );

  valves.forEach(v=>{

    if(v.type==="proportional"){
      q*=clamp(v.properties.command/100,.05,1);
    }

    if(v.type==="valve43"){
      q*=v.properties.position==="center"
        ?0
        :.95;
    }
  });

  return clamp(q,0,500);
}

function getHydraulicPower(){

  const pressure=getSystemPressureRaw();

  const flow=getSystemFlow();

  return pressure*flow/600;
}

/* =========================================================
   CYLINDER SIMULATION
========================================================= */

function simulateCylinder(c,dt){

  const p=c.properties;

  const valve=components.find(
    x=>x.type==="valve43"||
       x.type==="valve42"||
       x.type==="proportional"
  );

  let direction=0;

  if(valve){

    if(valve.type==="proportional"){

      if(valve.properties.command>55)
        direction=1;

      if(valve.properties.command<45)
        direction=-1;
    }
    else{

      if(valve.properties.position==="extend")
        direction=1;

      if(valve.properties.position==="retract")
        direction=-1;
    }
  }

  if(hasFault(c.id,"valveStuck")){
    direction=0;
  }

  const pressure=getSystemPressureRaw();

  const area=
    direction>=0
    ?cylinderAreaA(c)
    :cylinderAreaB(c);

  const force=pressure*100000*area;

  const netForce=
    direction*force-
    direction*p.load-
    direction*p.friction;

  let speed=
    Math.max(0,netForce)/
    Math.max(p.load+p.friction,1)*
    p.maxSpeed;

  speed*=clamp(getSystemFlow()/100,.05,1.5);

  if(hasFault(c.id,"cylinderLeakage")){
    speed*=.65;
  }

  speed=clamp(speed,0,p.maxSpeed);

  if(direction===1){

    p.position+=speed*dt;

    if(p.position>=p.stroke){
      p.position=p.stroke;
    }
  }

  if(direction===-1){

    p.position-=speed*dt;

    if(p.position<=0){
      p.position=0;
    }
  }
}

/* =========================================================
   MOTOR SIMULATION
========================================================= */

function simulateMotor(c,dt){

  const p=c.properties;

  const pressure=getSystemPressureRaw();

  const theoreticalTorque=
    pressure*100000*
    (p.displacement/1e6)/
    (2*Math.PI);

  let torque=
    theoreticalTorque-
    p.loadTorque;

  if(torque<0) torque=0;

  let rpm=
    torque/
    Math.max(p.loadTorque,1)*
    1000;

  rpm=clamp(rpm,0,p.speedLimit);

  c.runtimeRPM=rpm;
}

/* =========================================================
   SIMULATION LOOP
========================================================= */

function toggleSimulation(){

  simulationRunning=!simulationRunning;

  updateSimulationUI();

  if(simulationRunning){

    if(!animationFrame){
      animationFrame=requestAnimationFrame(simulationLoop);
    }

    toast("Simulation running");

  }else{

    toast("Simulation paused");
  }
}

let lastFrame=performance.now();

function simulationLoop(now){

  const dt=Math.min(
    (now-lastFrame)/1000,
    .05
  );

  lastFrame=now;

  if(simulationRunning){

    simulationTime+=dt;

    components.forEach(c=>{

      if(c.type==="cylinder"){
        simulateCylinder(c,dt);
      }

      if(c.type==="motor"){
        simulateMotor(c,dt);
      }
    });

    renderCanvas();
    updateLiveDisplays();
  }

  animationFrame=requestAnimationFrame(simulationLoop);
}

function resetSimulation(){

  simulationTime=0;

  components.forEach(c=>{

    if(c.type==="cylinder"){
      c.properties.position=100;
    }

    if(c.type==="motor"){
      c.runtimeRPM=0;
    }
  });

  render();
  toast("Simulation reset");
}

  const desktopState=
    document.getElementById("desktopState");

    );
  }
}

/* =========================================================
   DIAGNOSTICS
========================================================= */

let faults={};

function hasFault(id,fault){
  return !!faults[id]?.includes(fault);
}

function injectFault(id,fault){

  if(!faults[id]){
    faults[id]=[];
  }

  if(!faults[id].includes(fault)){
    faults[id].push(fault);
  }
}

function clearFaults(){
  faults={};
}

function diagnostics(){

  const results=[];

  const pumps=
    components.filter(
      c=>c.type==="pump"||c.type==="variablePump"
    );

  const tanks=
    components.filter(c=>c.type==="tank");

  const cylinders=
    components.filter(c=>c.type==="cylinder");

  const relief=
    components.find(c=>c.type==="relief");

  if(!pumps.length){
    results.push({
      type:"bad",
      text:"No pump detected."
    });
  }

  if(!tanks.length){
    results.push({
      type:"bad",
      text:"No hydraulic tank detected."
    });
  }

  if(pumps.length && !tanks.length){
    results.push({
      type:"bad",
      text:"Pump has no visible reservoir."
    });
  }

  if(!components.length){
    results.push({
      type:"warn",
      text:"Circuit is empty."
    });
  }

  if(pumps.length && cylinders.length){

    const flow=getSystemFlow();

    if(flow<1){

      results.push({
        type:"bad",
        text:"Very low flow. Check pump, valve position and restrictions."
      });
    }
  }

  if(relief){

    const pressure=getSystemPressureRaw();

    if(pressure>=relief.properties.setting*.98){

      results.push({
        type:"warn",
        text:"System pressure is approaching relief setting."
      });
    }
  }

  components.forEach(c=>{

    if(hasFault(c.id,"pumpWear")){
      results.push({
        type:"warn",
        text:`${componentName(c.type)}: pump wear fault active.`
      });
    }

    if(hasFault(c.id,"blockedFilter")){
      results.push({
        type:"bad",
        text:`${componentName(c.type)}: blocked filter fault active.`
      });
    }

    if(hasFault(c.id,"cylinderLeakage")){
      results.push({
        type:"warn",
        text:`${componentName(c.type)}: internal leakage fault active.`
      });
    }

    if(hasFault(c.id,"valveStuck")){
      results.push({
        type:"bad",
        text:`${componentName(c.type)}: valve stuck fault active.`
      });
    }
  });

  if(!results.length){

    results.push({
      type:"good",
      text:"No major diagnostic faults detected."
    });
  }

  return results;
}

function renderDiagnosticsHTML(){

  return diagnostics().map(r=>
    `<div class="diagnostic ${r.type}">${r.text}</div>`
  ).join("");
}

function runDiagnostics(){

  const results=diagnostics();

  const message=results
    .map(r=>
      (r.type==="bad"?"❌ ":
       r.type==="warn"?"⚠️ ":"✅ ")+
      r.text
    )
    .join("\n");

  alert(
    "HYDRAULIC STUDIO DIAGNOSTICS\n\n"+
    message
  );

  if(window.innerWidth<=850){

    if(mobileTab==="monitor"){
      renderMobileSheet();
    }else{
      setMobileTab("monitor");
    }
  }
}

/* =========================================================
   EXAMPLE CIRCUIT
========================================================= */

function loadExample(){

  pushHistory();

  components=[];
  connections=[];

  const add=(type,x,y,props={})=>{

    const c={
      id:uid(),
      type,
      x,
      y,
      rotation:0,
      properties:{
        ...clone(componentDefs[type].defaults),
        ...props
      }
    };

    components.push(c);

    return c;
  };

  const tank=add("tank",120,430);

  const pump=add(
    "variablePump",
    270,
    430,
    {
      displacement:32,
      rpm:1450,
      swash:75,
      compensator:250
    }
  );

  const filter=add("filter",420,430);

  const valve=add(
    "valve43",
    590,
    430,
    {
      position:"extend",
      centre:"closed",
      flowRating:120
    }
  );

  const cylinder=add(
    "cylinder",
    800,
    360,
    {
      bore:100,
      rod:50,
      stroke:500,
      load:50000,
      friction:1500,
      position:100
    }
  );

  const relief=add(
    "relief",
    590,
    580,
    {
      setting:210
    }
  );

  const gauge=add("gauge",430,300);

  const flowmeter=add("flowmeter",690,300);

  connections=[
    wire(tank,"T",pump.id,"IN"),
    wire(pump,"OUT",filter.id,"IN"),
    wire(filter,"OUT",valve.id,"P"),
    wire(valve,"A",cylinder.id,"A"),
    wire(cylinder,"B",valve.id,"B"),
    wire(valve,"T",tank.id,"T"),
    wire(pump,"OUT",relief.id,"P"),
    wire(relief,"T",tank.id,"T"),
    wire(pump,"OUT",gauge.id,"P"),
    wire(valve,"A",flowmeter.id,"IN"),
    wire(flowmeter.id,"OUT",cylinder.id,"A")
  ];

  /*
    Remove duplicate accidental flowmeter/cylinder wire.
  */
  connections=connections.filter((w,i,a)=>
    i===a.findIndex(x=>
      JSON.stringify(x.a)===JSON.stringify(w.a) &&
      JSON.stringify(x.b)===JSON.stringify(w.b)
    )
  );

  selectedId=valve.id;

  fitCircuit();
  render();

  toast("Example hydraulic circuit loaded");
}

function wire(a,ap,b,bp){

  const aid=
    typeof a==="string"
    ?a
    :a.id;

  const bid=
    typeof b==="string"
    ?b
    :b.id;

  return {
    id:uid("w"),
    a:{
      component:aid,
      port:ap
    },
    b:{
      component:bid,
      port:bp
    }
  };
}

/* =========================================================
   SAVE / LOAD
========================================================= */

function projectData(){

  return {
    version:4,
    name:"Hydraulic Studio Project",
    components,
    connections,
    faults,
    view:{
      zoom,
      panX,
      panY
    }
  };
}

function saveProject(){

  const data=JSON.stringify(
    projectData(),
    null,
    2
  );

  localStorage.setItem(
    "hydraulicStudioProject",
    data
  );

  document.getElementById("projectText").value=data;

  toast("Project saved");

  /*
    Also provide a downloadable JSON file on desktop.
  */
  if(window.innerWidth>850){

    const blob=new Blob(
      [data],
      {type:"application/json"}
    );

    const url=URL.createObjectURL(blob);

    const a=document.createElement("a");

    a.href=url;
    a.download="hydraulic-studio-project.json";

    a.click();

    URL.revokeObjectURL(url);
  }
}

function loadProject(){

  const saved=
    localStorage.getItem(
      "hydraulicStudioProject"
    );

  if(saved){

    try{

      importData(JSON.parse(saved));

      toast("Saved project loaded");

      return;

    }catch(e){}
  }

  document.getElementById("projectText").value="";

  document.getElementById("modal")
    .classList.add("open");
}

function importProject(){

  const text=
    document.getElementById("projectText").value;

  try{

    importData(JSON.parse(text));

    closeModal();

    toast("Project imported");

  }catch(e){

    alert("Invalid project JSON.");
  }
}

function importData(data){

  pushHistory();

  components=clone(data.components||[]);
  connections=clone(data.connections||[]);
  faults=clone(data.faults||{});

  if(data.view){

    zoom=data.view.zoom||1;
    panX=data.view.panX||0;
    panY=data.view.panY||0;
  }

  selectedId=null;

  render();
}

function closeModal(){

  document.getElementById("modal")
    .classList.remove("open");
}

/* =========================================================
   STATUS
========================================================= */

function updateStatus(){

  const status=document.getElementById("statusText");
  const metrics=document.getElementById("statusMetrics");

  if(status){

    status.textContent=
      simulationRunning
      ?"Simulation running"
      :"Ready";
  }

  if(metrics){

    metrics.textContent=
      `${components.length} components • ${connections.length} connections`;
  }

  updateSelectedBadge();
  updateSimulationUI();
}

/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener("keydown",e=>{

  const tag=e.target.tagName;

  if(
    tag==="INPUT"||
    tag==="TEXTAREA"||
    tag==="SELECT"
  ) return;

  if(
    (e.ctrlKey||e.metaKey) &&
    e.key.toLowerCase()==="z"
  ){

    e.preventDefault();
    undo();
  }

  if(
    (e.ctrlKey||e.metaKey) &&
    e.key.toLowerCase()==="y"
  ){

    e.preventDefault();
    redo();
  }

  if(
    e.key==="Delete"||
    e.key==="Backspace"
  ){

    deleteSelected();
  }

  if(e.code==="Space"){

    e.preventDefault();
    toggleSimulation();
  }

  if(e.key==="Escape"){
    cancelConnection();
    closeMobileSheet();
  }
});

/* =========================================================
   BASIC TWO-FINGER PINCH ZOOM
========================================================= */

let touches=[];

svg.addEventListener("touchstart",e=>{

  if(e.touches.length===2){

    touches=[
      {
        x:e.touches[0].clientX,
        y:e.touches[0].clientY
      },
      {
        x:e.touches[1].clientX,
        y:e.touches[1].clientY
      }
    ];
  }
},{passive:false});

svg.addEventListener("touchmove",e=>{

  if(e.touches.length!==2) return;

  e.preventDefault();

  const a=e.touches[0];
  const b=e.touches[1];

  const dx=a.clientX-b.clientX;
  const dy=a.clientY-b.clientY;

  const distance=Math.sqrt(
    dx*dx+dy*dy
  );

  if(!window.lastPinchDistance){
    window.lastPinchDistance=distance;
    return;
  }

  const delta=distance-window.lastPinchDistance;

  if(Math.abs(delta)>1){

    zoom=clamp(
      zoom*(1+delta*.002),
      .35,
      3
    );

    renderCanvas();
  }

  window.lastPinchDistance=distance;

},{passive:false});

svg.addEventListener("touchend",()=>{

  window.lastPinchDistance=null;

},{passive:false});

========================================================= */

window.addEventListener("resize",()=>{

  renderCanvas();

  if(window.innerWidth<=850){
    renderMobileSheet();
  }
});

  }

}

init();
