<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Hydraulic Studio</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:#0b1020;color:#e5e7eb}
button,input,select{font:inherit}
button{cursor:pointer}

#app{
 width:100%;
 height:100%;
 display:flex;
 flex-direction:column;
}

#topbar{
 height:58px;
 min-height:58px;
 background:#111827;
 border-bottom:1px solid #263244;
 display:flex;
 align-items:center;
 gap:8px;
 padding:6px 10px;
 z-index:20;
}

.logo{
 font-weight:800;
 font-size:17px;
 color:#fff;
 margin-right:8px;
 white-space:nowrap;
}

.topBtn{
 height:38px;
 border:1px solid #334155;
 background:#1f2937;
 color:#e5e7eb;
 border-radius:7px;
 padding:0 12px;
 font-weight:600;
}
.topBtn:hover{background:#293548}
.topBtn.active{background:#2563eb;border-color:#3b82f6}

#modeSwitch{
 display:flex;
 margin-left:auto;
 border:1px solid #334155;
 border-radius:7px;
 overflow:hidden;
}
#modeSwitch button{
 height:36px;
 border:0;
 padding:0 12px;
 background:#1f2937;
 color:#cbd5e1;
}
#modeSwitch button.active{
 background:#2563eb;
 color:#fff;
}

#workspace{
 flex:1;
 min-height:0;
 display:flex;
}

#library{
 width:255px;
 min-width:255px;
 background:#111827;
 border-right:1px solid #263244;
 display:flex;
 flex-direction:column;
 z-index:10;
}

.panelTitle{
 padding:12px 14px;
 font-size:14px;
 font-weight:800;
 border-bottom:1px solid #263244;
}

#search{
 margin:10px;
 height:38px;
 border-radius:7px;
 border:1px solid #334155;
 background:#0b1220;
 color:#fff;
 padding:0 10px;
 outline:none;
}

#libraryScroll{
 overflow:auto;
 padding:4px 8px 16px;
}

.cat{
 margin:8px 0 4px;
 color:#94a3b8;
 font-size:11px;
 text-transform:uppercase;
 letter-spacing:.08em;
 font-weight:800;
}

.libItem{
 width:100%;
 min-height:52px;
 margin:4px 0;
 border:1px solid #293548;
 background:#172033;
 color:#e5e7eb;
 border-radius:7px;
 display:flex;
 align-items:center;
 gap:9px;
 padding:6px 8px;
 text-align:left;
}
.libItem:hover{
 background:#202c42;
 border-color:#3b82f6;
}
.libIcon{
 width:38px;
 height:38px;
 border-radius:5px;
 background:#0b1220;
 display:flex;
 align-items:center;
 justify-content:center;
 flex-shrink:0;
}
.libName{
 font-size:12px;
 font-weight:700;
}
.libSub{
 font-size:10px;
 color:#94a3b8;
 margin-top:2px;
}

#main{
 flex:1;
 min-width:0;
 min-height:0;
 position:relative;
 background:#f4f6f8;
 overflow:hidden;
}

#canvas{
 position:absolute;
 inset:0;
 width:100%;
 height:100%;
 touch-action:none;
 user-select:none;
}

#rightPanel{
 width:295px;
 min-width:295px;
 background:#111827;
 border-left:1px solid #263244;
 overflow:auto;
 z-index:10;
}

.inspector{
 padding:12px;
}

.section{
 border:1px solid #293548;
 background:#151e2e;
 border-radius:8px;
 padding:10px;
 margin-bottom:10px;
}

.section h3{
 margin:0 0 9px;
 font-size:12px;
 color:#cbd5e1;
 text-transform:uppercase;
 letter-spacing:.06em;
}

.row{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:7px;
 margin-bottom:7px;
}

.field{
 display:flex;
 flex-direction:column;
 gap:4px;
}

.field.full{grid-column:1/-1}

.field label{
 font-size:10px;
 color:#94a3b8;
}

.field input,.field select{
 width:100%;
 height:34px;
 background:#0b1220;
 color:#fff;
 border:1px solid #334155;
 border-radius:5px;
 padding:0 8px;
 outline:none;
}

.smallBtn{
 width:100%;
 height:34px;
 border:1px solid #334155;
 background:#1f2937;
 color:#e5e7eb;
 border-radius:5px;
}
.smallBtn:hover{background:#293548}

.danger{
 border-color:#7f1d1d;
 background:#3f1515;
}
.danger:hover{background:#5b1919}

#bottom{
 height:45px;
 min-height:45px;
 background:#111827;
 border-top:1px solid #263244;
 display:flex;
 align-items:center;
 gap:8px;
 padding:5px 9px;
 z-index:20;
}

.status{
 color:#94a3b8;
 font-size:11px;
 margin-left:auto;
}

#mobileLibrary,#mobileInspector{
 display:none;
}

@media(max-width:900px){
 #library{display:none}
 #rightPanel{display:none}
 #mobileLibrary,#mobileInspector{
  display:block;
  position:absolute;
  top:8px;
  width:42px;
  height:42px;
  z-index:15;
  border:1px solid #334155;
  border-radius:7px;
  background:#111827;
  color:#fff;
 }
 #mobileLibrary{left:8px}
 #mobileInspector{right:8px}
 #bottom{
  overflow-x:auto;
 }
 #bottom .status{display:none}
 .logo{font-size:14px}
 .topBtn{padding:0 9px}
}

#mobileDrawer{
 display:none;
 position:absolute;
 z-index:30;
 left:0;
 top:0;
 bottom:0;
 width:285px;
 background:#111827;
 border-right:1px solid #334155;
 box-shadow:10px 0 30px #0008;
}
#mobileDrawer.open{display:flex;flex-direction:column}

#mobileInspectorDrawer{
 display:none;
 position:absolute;
 z-index:30;
 right:0;
 top:0;
 bottom:0;
 width:300px;
 background:#111827;
 border-left:1px solid #334155;
 box-shadow:-10px 0 30px #0008;
 overflow:auto;
}
#mobileInspectorDrawer.open{display:block}

.drawerClose{
 margin:8px;
 height:38px;
 border:1px solid #334155;
 background:#1f2937;
 color:#fff;
 border-radius:6px;
}

.badge{
 display:inline-block;
 font-size:9px;
 padding:3px 6px;
 border-radius:4px;
 background:#1e3a8a;
 color:#bfdbfe;
}

#valveModal{
 display:none;
 position:fixed;
 inset:0;
 background:#0009;
 z-index:100;
 align-items:center;
 justify-content:center;
 padding:20px;
}
#valveModal.open{display:flex}

.modal{
 width:min(480px,100%);
 max-height:90vh;
 overflow:auto;
 background:#111827;
 border:1px solid #334155;
 border-radius:10px;
 padding:16px;
 box-shadow:0 20px 60px #000;
}

.modal h2{margin:0 0 14px}

.modalActions{
 display:flex;
 gap:8px;
 margin-top:15px;
}
.modalActions button{
 flex:1;
 height:40px;
 border-radius:6px;
 border:1px solid #334155;
 background:#1f2937;
 color:#fff;
}
.modalActions .primary{
 background:#2563eb;
 border-color:#3b82f6;
}

#toast{
 position:fixed;
 left:50%;
 bottom:70px;
 transform:translateX(-50%);
 background:#111827;
 border:1px solid #334155;
 color:#fff;
 padding:9px 14px;
 border-radius:7px;
 z-index:200;
 display:none;
 font-size:12px;
 box-shadow:0 8px 30px #0008;
}

svg text{
 font-family:Arial,Helvetica,sans-serif;
 pointer-events:none;
}

.gridLine{
 stroke:#d7dce2;
 stroke-width:1;
}
.gridMajor{
 stroke:#c4cad2;
 stroke-width:1.2;
}

.connection{
 fill:none;
 stroke-linecap:round;
 stroke-linejoin:round;
 pointer-events:stroke;
}
.connection.soft{stroke:#0ea5e9}
.connection.hard{stroke:#475569}
.connection.steel{stroke:#64748b}
.connection.flexible{stroke:#8b5cf6}

.connection.selected{
 stroke:#f59e0b;
 stroke-width:6;
}

.flowDot{
 fill:#f97316;
 pointer-events:none;
}

.componentBody{
 fill:#fff;
 stroke:#111827;
 stroke-width:2;
}
.componentSelected .componentBody{
 stroke:#2563eb;
 stroke-width:3;
}

.port{
 fill:#fff;
 stroke:#111827;
 stroke-width:2;
}
.port:hover{
 fill:#fbbf24;
}
.port.active{
 fill:#22c55e;
 stroke:#166534;
}

.componentLabel{
 fill:#111827;
 font-size:12px;
 font-weight:700;
 text-anchor:middle;
}

.componentValue{
 fill:#475569;
 font-size:9px;
 text-anchor:middle;
}

.valveBox{
 fill:#fff;
 stroke:#111827;
 stroke-width:2;
}

.simFlow{
 stroke:#f97316 !important;
 stroke-width:5 !important;
 stroke-dasharray:10 8;
 animation:flow 0.7s linear infinite;
}

@keyframes flow{
 to{stroke-dashoffset:-18}
}

.cylinderRod{
 fill:#cbd5e1;
 stroke:#334155;
 stroke-width:2;
}

.pumpSpin{
 transform-box:fill-box;
 transform-origin:center;
 animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

.motorSpin{
 transform-box:fill-box;
 transform-origin:center;
 animation:spin .5s linear infinite;
}

#selectionInfo{
 font-size:11px;
 color:#94a3b8;
 line-height:1.45;
}

#simBadge{
 padding:4px 8px;
 border-radius:5px;
 background:#334155;
 color:#cbd5e1;
 font-size:10px;
 font-weight:800;
}
#simBadge.running{
 background:#166534;
 color:#dcfce7;
}
</style>
</head>

<body>
<div id="app">

<header id="topbar">
 <div class="logo">⚙ Hydraulic Studio</div>

 <button class="topBtn" id="undoBtn">↶</button>
 <button class="topBtn" id="redoBtn">↷</button>
 <button class="topBtn" id="fitBtn">Fit</button>
 <button class="topBtn" id="gridBtn">Grid</button>

 <button class="topBtn" id="saveBtn">Save</button>
 <button class="topBtn" id="loadBtn">Load</button>
 <button class="topBtn" id="exampleBtn">Example</button>

 <div id="modeSwitch">
  <button class="active" data-mode="hydraulic">Hydraulic</button>
  <button data-mode="pneumatic">Pneumatic</button>
 </div>
</header>

<div id="workspace">

 <aside id="library">
  <div class="panelTitle">Component Library</div>
  <input id="search" placeholder="Search components...">
  <div id="libraryScroll"></div>
 </aside>

 <main id="main">

  <button id="mobileLibrary">☰</button>
  <button id="mobileInspector">☷</button>

  <svg id="canvas">
   <defs>
    <pattern id="gridSmall" width="20" height="20" patternUnits="userSpaceOnUse">
     <path d="M20 0H0V20" fill="none" class="gridLine"/>
    </pattern>
    <pattern id="gridLarge" width="100" height="100" patternUnits="userSpaceOnUse">
     <rect width="100" height="100" fill="url(#gridSmall)"/>
     <path d="M100 0H0V100" fill="none" class="gridMajor"/>
    </pattern>
   </defs>

   <rect id="background" x="-100000" y="-100000" width="200000" height="200000" fill="url(#gridLarge)"/>
   <g id="world"></g>
  </svg>

 </main>

 <aside id="rightPanel">
  <div class="panelTitle">Engineering Inspector</div>
  <div class="inspector" id="inspector">
   <div class="section">
    <h3>Selection</h3>
    <div id="selectionInfo">Select a component, port or hose.</div>
   </div>
  </div>
 </aside>

</div>

<footer id="bottom">
 <button class="topBtn active" id="selectTool">Select</button>
 <button class="topBtn" id="hoseTool">Hose</button>
 <button class="topBtn" id="pipeTool">Hard Pipe</button>
 <button class="topBtn" id="deleteTool">Delete</button>
 <button class="topBtn" id="rotateTool">Rotate</button>
 <button class="topBtn" id="simBtn">▶ Simulate</button>
 <span id="simBadge">STOPPED</span>
 <span class="status" id="status">0 components · 0 connections</span>
</footer>

<div id="mobileDrawer">
 <button class="drawerClose" id="closeLibrary">Close Library</button>
 <input id="mobileSearch" class="search" style="margin:0 10px 10px;height:38px;background:#0b1220;border:1px solid #334155;border-radius:6px;color:white;padding:0 10px" placeholder="Search components...">
 <div id="mobileLibraryScroll" style="overflow:auto;padding:4px 8px 16px"></div>
</div>

<div id="mobileInspectorDrawer">
 <button class="drawerClose" id="closeInspector">Close</button>
 <div class="inspector" id="mobileInspectorContent"></div>
</div>

<div id="valveModal">
 <div class="modal">
  <h2>Directional Valve Builder</h2>

  <div class="row">
   <div class="field">
    <label>Valve</label>
    <select id="vType">
     <option value="4/2">4/2</option>
     <option value="4/3">4/3</option>
     <option value="3/2">3/2</option>
     <option value="5/2">5/2</option>
     <option value="2/2">2/2</option>
    </select>
   </div>

   <div class="field">
    <label>Centre</label>
    <select id="vCentre">
     <option value="closed">Closed</option>
     <option value="open">Open</option>
     <option value="tandem">Tandem</option>
     <option value="float">Float</option>
     <option value="pt">P→T</option>
     <option value="ab">A/B→T</option>
    </select>
   </div>
  </div>

  <div class="row">
   <div class="field">
    <label>Actuation</label>
    <select id="vActuation">
     <option>Lever</option>
     <option>Solenoid</option>
     <option>Push Button</option>
     <option>Pilot</option>
     <option>Pedal</option>
    </select>
   </div>

   <div class="field">
    <label>Spring Return</label>
    <select id="vSpring">
     <option value="yes">Yes</option>
     <option value="no">No</option>
    </select>
   </div>
  </div>

  <div class="field full">
   <label>Valve position</label>
   <select id="vPosition">
    <option value="left">Left</option>
    <option value="centre">Centre</option>
    <option value="right">Right</option>
   </select>
  </div>

  <div class="modalActions">
   <button id="cancelValve">Cancel</button>
   <button class="primary" id="createValve">Create Valve</button>
  </div>
 </div>
</div>

<div id="toast"></div>

<script>
"use strict";

/* ============================================================
   HYDRAULIC STUDIO
   Single-file engineering schematic editor
   ============================================================ */

const svg = document.getElementById("canvas");
const world = document.getElementById("world");
const background = document.getElementById("background");

const state = {
 mode:"hydraulic",
 components:[],
 connections:[],
 selected:null,
 selectedConnection:null,
 tool:"select",
 running:false,
 grid:true,
 nextId:1,
 history:[],
 future:[],
 hoseStart:null,
 pointerMap:new Map(),
 drag:null,
 pan:null,
 camera:{x:0,y:0,zoom:1},
 simTime:0,
 lastTime:0
};

const COMPONENTS = [

 {
  category:"Hydraulic Sources",
  items:[
   ["pump","Fixed Displacement Pump","Pump"],
   ["pumpVariable","Variable Displacement Pump","Pump"],
   ["reservoir","Reservoir","Tank"],
   ["accumulator","Accumulator","Energy storage"]
  ]
 },

 {
  category:"Hydraulic Actuators",
  items:[
   ["cylinder","Double Acting Cylinder","Cylinder"],
   ["singleCylinder","Single Acting Cylinder","Cylinder"],
   ["motor","Hydraulic Motor","Motor"]
  ]
 },

 {
  category:"Directional Valves",
  items:[
   ["directional","Directional Valve","4/3"],
   ["check","Check Valve","One-way"],
   ["pilotCheck","Pilot Operated Check","One-way"],
   ["shuttle","Shuttle Valve","OR"],
   ["sequence","Sequence Valve","Pressure"],
   ["counterbalance","Counterbalance Valve","Pressure"]
  ]
 },

 {
  category:"Pressure / Flow",
  items:[
   ["relief","Pressure Relief Valve","Pressure"],
   ["reducing","Pressure Reducing Valve","Pressure"],
   ["flow","Flow Control Valve","Flow"],
   ["needle","Needle Valve","Flow"],
   ["gauge","Pressure Gauge","0–250 bar"],
   ["flowmeter","Flow Meter","L/min"]
  ]
 },

 {
  category:"Filtration",
  items:[
   ["filter","Filter","10 micron"],
   ["strainer","Suction Strainer","Mesh"],
   ["cooler","Oil Cooler","Heat exchanger"],
   ["heater","Oil Heater","Heat"]
  ]
 },

 {
  category:"Pneumatic Sources",
  pneumatic:true,
  items:[
   ["compressor","Compressor","Air source"],
   ["airTank","Air Receiver","Tank"],
   ["frl","FRL Unit","Filter regulator lubricator"]
  ]
 },

 {
  category:"Pneumatic Actuators",
  pneumatic:true,
  items:[
   ["airCylinder","Pneumatic Cylinder","Cylinder"],
   ["airMotor","Pneumatic Motor","Motor"]
  ]
 },

 {
  category:"Pneumatic Valves",
  pneumatic:true,
  items:[
   ["pneumaticValve","Pneumatic Directional Valve","5/2"],
   ["airCheck","Pneumatic Check Valve","One-way"],
   ["airFlow","Pneumatic Flow Control","Flow"],
   ["airRelief","Air Relief Valve","Pressure"]
  ]
 },

 {
  category:"Instrumentation",
  items:[
   ["pressureSwitch","Pressure Switch","Switch"],
   ["tempSensor","Temperature Sensor","Sensor"],
   ["limitSwitch","Limit Switch","Sensor"],
   ["proximity","Proximity Sensor","Sensor"]
  ]
 }
];

/* ============================================================
   BASIC HELPERS
   ============================================================ */

function uid(prefix="C"){
 return prefix + (state.nextId++);
}

function clamp(v,a,b){
 return Math.max(a,Math.min(b,v));
}

function snap(v){
 if(!state.grid)return v;
 return Math.round(v/20)*20;
}

function toast(msg){
 const t=document.getElementById("toast");
 t.textContent=msg;
 t.style.display="block";
 clearTimeout(toast.timer);
 toast.timer=setTimeout(()=>t.style.display="none",1800);
}

function clone(obj){
 return JSON.parse(JSON.stringify(obj));
}

function findComponent(id){
 return state.components.find(c=>c.id===id);
}

function componentTypeName(type){
 const map={
  pump:"Fixed Pump",
  pumpVariable:"Variable Pump",
  reservoir:"Reservoir",
  accumulator:"Accumulator",
  cylinder:"Double Cylinder",
  singleCylinder:"Single Cylinder",
  motor:"Hydraulic Motor",
  directional:"Directional Valve",
  check:"Check Valve",
  pilotCheck:"Pilot Check",
  shuttle:"Shuttle Valve",
  sequence:"Sequence Valve",
  counterbalance:"Counterbalance",
  relief:"Relief Valve",
  reducing:"Reducing Valve",
  flow:"Flow Control",
  needle:"Needle Valve",
  gauge:"Pressure Gauge",
  flowmeter:"Flow Meter",
  filter:"Filter",
  strainer:"Strainer",
  cooler:"Cooler",
  heater:"Heater",
  compressor:"Compressor",
  airTank:"Air Receiver",
  frl:"FRL",
  airCylinder:"Pneumatic Cylinder",
  airMotor:"Pneumatic Motor",
  pneumaticValve:"Pneumatic Valve",
  airCheck:"Air Check",
  airFlow:"Air Flow Control",
  airRelief:"Air Relief",
  pressureSwitch:"Pressure Switch",
  tempSensor:"Temperature Sensor",
  limitSwitch:"Limit Switch",
  proximity:"Proximity Sensor"
 };
 return map[type]||type;
}

/* ============================================================
   CAMERA
   ============================================================ */

function worldToScreen(x,y){
 return {
  x:x*state.camera.zoom+state.camera.x,
  y:y*state.camera.zoom+state.camera.y
 };
}

function screenToWorld(x,y){
 const r=svg.getBoundingClientRect();
 return {
  x:(x-r.left-state.camera.x)/state.camera.zoom,
  y:(y-r.top-state.camera.y)/state.camera.zoom
 };
}

function applyCamera(){
 const z=state.camera.zoom;
 background.setAttribute("transform",`translate(${state.camera.x} ${state.camera.y}) scale(${z})`);
 world.setAttribute("transform",`translate(${state.camera.x} ${state.camera.y}) scale(${z})`);
}

function fitView(){
 if(!state.components.length){
  state.camera={x:svg.clientWidth/2,y:svg.clientHeight/2,zoom:1};
  applyCamera();
  return;
 }

 let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;

 state.components.forEach(c=>{
  minX=Math.min(minX,c.x-100);
  minY=Math.min(minY,c.y-70);
  maxX=Math.max(maxX,c.x+100);
  maxY=Math.max(maxY,c.y+70);
 });

 const w=Math.max(300,maxX-minX);
 const h=Math.max(200,maxY-minY);

 const z=Math.min(
  svg.clientWidth/(w+80),
  svg.clientHeight/(h+80),
  1.4
 );

 state.camera.zoom=clamp(z,.35,1.8);
 state.camera.x=svg.clientWidth/2-(minX+w/2)*state.camera.zoom;
 state.camera.y=svg.clientHeight/2-(minY+h/2)*state.camera.zoom;

 applyCamera();
 render();
}

/* ============================================================
   PORT SYSTEM
   ============================================================ */

function portDefs(c){

 switch(c.type){

  case "pump":
  case "pumpVariable":
  case "compressor":
   return [
    {id:"OUT",x:90,y:0,dir:"out"},
    {id:"IN",x:-90,y:0,dir:"in"}
   ];

  case "reservoir":
  case "airTank":
   return [
    {id:"P",x:0,y:-55,dir:"inout"}
   ];

  case "accumulator":
   return [
    {id:"P",x:0,y:-55,dir:"inout"}
   ];

  case "cylinder":
  case "airCylinder":
   return [
    {id:"A",x:-90,y:0,dir:"inout"},
    {id:"B",x:90,y:0,dir:"inout"}
   ];

  case "singleCylinder":
   return [
    {id:"A",x:-90,y:0,dir:"inout"}
   ];

  case "motor":
  case "airMotor":
   return [
    {id:"A",x:-75,y:0,dir:"inout"},
    {id:"B",x:75,y:0,dir:"inout"}
   ];

  case "directional":
  case "pneumaticValve":
   return [
    {id:"P",x:-90,y:0,dir:"inout"},
    {id:"T",x:90,y:0,dir:"inout"},
    {id:"A",x:0,y:-75,dir:"inout"},
    {id:"B",x:0,y:75,dir:"inout"}
   ];

  case "check":
  case "pilotCheck":
  case "airCheck":
  case "shuttle":
  case "sequence":
  case "counterbalance":
  case "relief":
  case "reducing":
  case "flow":
  case "needle":
  case "airFlow":
  case "airRelief":
  case "filter":
  case "strainer":
  case "cooler":
  case "heater":
   return [
    {id:"A",x:-65,y:0,dir:"inout"},
    {id:"B",x:65,y:0,dir:"inout"}
   ];

  case "gauge":
  case "flowmeter":
  case "pressureSwitch":
  case "tempSensor":
  case "limitSwitch":
  case "proximity":
   return [
    {id:"P",x:0,y:50,dir:"inout"}
   ];

  case "frl":
   return [
    {id:"IN",x:-80,y:0,dir:"in"},
    {id:"OUT",x:80,y:0,dir:"out"}
   ];

  default:
   return [
    {id:"A",x:-60,y:0,dir:"inout"},
    {id:"B",x:60,y:0,dir:"inout"}
   ];
 }
}

function transformPort(c,p){

 let x=p.x;
 let y=p.y;

 if(c.flipX)x=-x;
 if(c.flipY)y=-y;

 const a=(c.rotation||0)*Math.PI/180;
 const rx=x*Math.cos(a)-y*Math.sin(a);
 const ry=x*Math.sin(a)+y*Math.cos(a);

 return {
  x:c.x+rx,
  y:c.y+ry,
  id:p.id,
  dir:p.dir
 };
}

function getPort(c,id){
 const p=portDefs(c).find(x=>x.id===id);
 return p?transformPort(c,p):null;
}

function nearestPort(worldPos,maxDist=28){
 let best=null;
 let bd=maxDist;

 state.components.forEach(c=>{
  portDefs(c).forEach(p=>{
   const q=transformPort(c,p);
   const d=Math.hypot(q.x-worldPos.x,q.y-worldPos.y);
   if(d<bd){
    bd=d;
    best={component:c,port:p};
   }
  });
 });

 return best;
}

  stroke:500,
  displacement:40,
  relief:180,
  reduction:100,

  temperature:35,
  rpm:1500,
  speed:100,
  centre:"closed",
  valveType:"4/3",
  position:"centre",
  actuation:"Lever",
  spring:"yes",
  fault:"none"
 };

 if(type==="pump")p.flow=40;
 if(type==="pumpVariable")p.flow=80;
 if(type==="compressor")p.flow=500;
 if(type==="cylinder"||type==="singleCylinder"||type==="airCylinder"){
  p.bore=80;
  p.rod=40;
  p.stroke=500;
 }
 if(type==="motor"||type==="airMotor"){

  p.rpm=1000;
 }
 if(type==="directional"||type==="pneumaticValve"){
  p.valveType=type==="pneumaticValve"?"5/2":"4/3";
 }
 return p;
}

function createComponent(type,x,y,extra={}){
 const c={
  id:uid(),
  type,
  x:snap(x),
  y:snap(y),

  flipY:false,

  sim:{
   pressure:0,
   flow:0,
   position:0,
   speed:0,
   active:false
  }
 };

 state.components.push(c);
 state.selected=c.id;
 return c;
}

function addComponent(type){

 if(type==="directional"){

}

/* ============================================================
   HISTORY
   ============================================================ */

function snapshot(){
 return {
  components:clone(state.components),
  connections:clone(state.connections),
  nextId:state.nextId
 };
}

function restore(s){
 state.components=clone(s.components);
 state.connections=clone(s.connections);
 state.nextId=s.nextId;
 state.selected=null;
 state.selectedConnection=null;
 render();
}

function historyPush(){
 state.history.push(snapshot());
 if(state.history.length>50)state.history.shift();
 state.future=[];
}

function undo(){
 if(!state.history.length)return;
 state.future.push(snapshot());
 const s=state.history.pop();
 restore(s);
}

function redo(){
 if(!state.future.length)return;
 state.history.push(snapshot());
 const s=state.future.pop();
 restore(s);
}

/* ============================================================
   SVG HELPERS
   ============================================================ */

function el(name,attrs={},text=""){
 const e=document.createElementNS("http://www.w3.org/2000/svg",name);
 Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));
 if(text)e.textContent=text;
 return e;
}

function group(attrs={}){
 return el("g",attrs);
}

/* ============================================================
   SYMBOL DRAWING
   ============================================================ */

function drawSymbol(c,g){

 const s=group({
  transform:`translate(${c.x} ${c.y}) rotate(${c.rotation||0}) scale(${c.flipX?-1:1} ${c.flipY?-1:1})`
 });

 g.appendChild(s);

 const body=el("g",{"class":"componentBody"});

 s.appendChild(body);

 switch(c.type){

  case "pump":
  case "pumpVariable":
   drawPump(body,c);
   break;

  case "compressor":
   drawCompressor(body,c);
   break;

  case "reservoir":
  case "airTank":
   drawTank(body,c);
   break;

  case "accumulator":
   drawAccumulator(body,c);
   break;

  case "cylinder":
  case "airCylinder":
  case "singleCylinder":
   drawCylinder(body,c);
   break;

  case "motor":
  case "airMotor":
   drawMotor(body,c);
   break;

  case "directional":
  case "pneumaticValve":
   drawDirectional(body,c);
   break;

  case "check":
  case "airCheck":
  case "pilotCheck":
   drawCheck(body,c);
   break;

  case "relief":
  case "airRelief":
  case "sequence":
  case "counterbalance":
  case "reducing":
   drawPressureValve(body,c);
   break;

  case "flow":
  case "needle":
  case "airFlow":
   drawFlowValve(body,c);
   break;

  case "filter":
  case "strainer":
   drawFilter(body,c);
   break;

  case "cooler":
   drawCooler(body,c);
   break;

  case "heater":
   drawHeater(body,c);
   break;

  case "gauge":
  case "flowmeter":
  case "pressureSwitch":
   drawGauge(body,c);
   break;

  case "tempSensor":
  case "limitSwitch":
  case "proximity":
   drawSensor(body,c);
   break;

  case "frl":
   drawFRL(body,c);
   break;

  default:
   drawGeneric(body,c);
 }

 const label=el("text",{
  x:0,
  y:90,
  class:"componentLabel"
 },c.label);

 s.appendChild(label);

 const val=el("text",{
  x:0,
  y:104,
  class:"componentValue"
 },valueText(c));

 s.appendChild(val);

 if(c.sim.active && state.running){
  const active=el("circle",{cx:0,cy:-48,r:5,fill:"#22c55e"});
  s.appendChild(active);
 }

 const ports=group();

 portDefs(c).forEach(p=>{
  const q=transformPort(c,p);
  const localX=p.x;
  const localY=p.y;

  const port=el("circle",{
   cx:localX,
   cy:localY,
   r:7,
   class:"port"+(state.hoseStart &&
     state.hoseStart.component===c.id &&
     state.hoseStart.port===p.id ? " active":""),
   "data-component":c.id,
   "data-port":p.id
  });

  port.addEventListener("pointerdown",e=>{
   e.stopPropagation();
   handlePortPointer(c,p,e);
  });

  ports.appendChild(port);

  const txt=el("text",{
   x:localX,
   y:localY-10,
   "font-size":"8",
   fill:"#475569",
   "text-anchor":"middle"
  },p.id);

  ports.appendChild(txt);
 });

 s.appendChild(ports);

 s.addEventListener("pointerdown",e=>{
  if(state.tool==="hose"||state.tool==="pipe")return;
  e.stopPropagation();
  selectComponent(c.id);

  if(state.tool==="delete"){
   deleteComponent(c.id);
   return;
  }

  if(state.tool==="rotate"){
   historyPush();
   c.rotation=(c.rotation+90)%360;
   render();
   return;
  }

  if(e.button!==2){
   startComponentDrag(c,e);
  }
 });

 s.addEventListener("dblclick",e=>{
  e.stopPropagation();

  if(c.type==="directional"||c.type==="pneumaticValve"){
   openValveBuilder(c);
  }else{
   selectComponent(c.id);
  }
 });

}

/* ============================================================
   CONNECTIONS
   ============================================================ */

function handlePortPointer(c,p,e){

 if(state.tool==="delete"){
  deletePortConnections(c.id,p.id);
  return;
 }

 if(!state.hoseStart){
  state.hoseStart={component:c.id,port:p.id};
  render();
  toast(`Start: ${c.label} ${p.id} — select another port`);
  return;
 }

 if(
  state.hoseStart.component===c.id &&
  state.hoseStart.port===p.id
 ){
  state.hoseStart=null;
  render();
  return;
 }

 const a=state.hoseStart;

 if(connectionExists(a.component,a.port,c.id,p.id)){
  toast("Those ports are already connected");
  state.hoseStart=null;
  render();
  return;
 }

 historyPush();

 state.connections.push({
  id:uid("H"),
  from:{component:a.component,port:a.port},
  to:{component:c.id,port:p.id},
  type:state.tool==="pipe"?"hard":"soft",
  diameter:state.tool==="pipe"?16:12,
  length:1000,
  rating:250,
  flow:0,
  pressureDrop:0
 });

 state.hoseStart=null;

 render();
 toast("Connection created");
}

function connectionExists(a,ap,b,bp){
 return state.connections.some(h=>
  (h.from.component===a&&h.from.port===ap&&h.to.component===b&&h.to.port===bp) ||
  (h.from.component===b&&h.from.port===bp&&h.to.component===a&&h.to.port===ap)
 );
}

function deletePortConnections(cid,pid){
 const before=state.connections.length;
 if(before===0)return;

 historyPush();

 state.connections=state.connections.filter(h=>
  !(
   (h.from.component===cid&&h.from.port===pid) ||
   (h.to.component===cid&&h.to.port===pid)
  )
 );

 render();

 if(state.connections.length<before)toast("Connection removed");
}

function drawConnections(){

 state.connections.forEach(h=>{

  const a=findComponent(h.from.component);
  const b=findComponent(h.to.component);

  if(!a||!b)return;

  const pa=getPort(a,h.from.port);
  const pb=getPort(b,h.to.port);

  if(!pa||!pb)return;

  const mx=(pa.x+pb.x)/2;

  const d=`M ${pa.x} ${pa.y}
           L ${mx} ${pa.y}
           L ${mx} ${pb.y}
           L ${pb.x} ${pb.y}`;

  const path=el("path",{
   d,
   class:`connection ${h.type}${state.selectedConnection===h.id?" selected":""}${state.running&&h.flow>0.01?" simFlow":""}`,
   "stroke-width":h.type==="soft"?4:3
  });

  path.addEventListener("pointerdown",e=>{
   e.stopPropagation();
   state.selectedConnection=h.id;
   state.selected=null;
   render();
  });

  world.appendChild(path);

  if(state.running&&h.flow>0.01){

   const dx=pb.x-pa.x;
   const dy=pb.y-pa.y;
   const len=Math.hypot(dx,dy);

   if(len>30){
    const t=(state.simTime%1000)/1000;
    const x=pa.x+dx*t;
    const y=pa.y+dy*t;

    world.appendChild(el("circle",{
     cx:x,
     cy:y,
     r:5,
     class:"flowDot"
    }));
   }
  }
 });
}

function render(){

 world.innerHTML="";

 drawConnections();

 state.components.forEach(c=>{

  const g=group({
   "data-id":c.id,
   class:state.selected===c.id?"componentSelected":""
  });

  drawSymbol(c,g);

  world.appendChild(g);
 });

 applyCamera();

 updateStatus();
 updateInspector();
}

function bindInspector(root){

 root.querySelectorAll("[data-field]").forEach(input=>{
  input.addEventListener("change",()=>{
   const c=findComponent(state.selected);
   if(!c)return;

   historyPush();

   const f=input.dataset.field;

   if(f==="label")c.label=input.value;
   else if(f==="x")c.x=snap(Number(input.value)||0);
   else if(f==="y")c.y=snap(Number(input.value)||0);
   else if(f==="rotation")c.rotation=Number(input.value)||0;

   render();
  });
 });

 root.querySelectorAll("[data-param]").forEach(input=>{
  input.addEventListener("change",()=>{
   const c=findComponent(state.selected);
   if(!c)return;

   historyPush();

   const k=input.dataset.param;
   let v=input.value;

   if(input.type==="number")v=Number(v);

   c.params[k]=v;

   render();
  });
 });

 root.querySelectorAll("[data-conn]").forEach(input=>{
  input.addEventListener("change",()=>{
   const h=state.connections.find(x=>x.id===state.selectedConnection);
   if(!h)return;

   historyPush();

   let v=input.value;
   if(input.type==="number")v=Number(v);

   h[input.dataset.conn]=v;
   render();
  });
 });

 root.querySelectorAll("[data-action]").forEach(btn=>{
  btn.addEventListener("click",()=>{
   const a=btn.dataset.action;

   if(a==="flipX"){
    const c=findComponent(state.selected);
    if(c){historyPush();c.flipX=!c.flipX;render();}
   }

   if(a==="flipY"){
    const c=findComponent(state.selected);
    if(c){historyPush();c.flipY=!c.flipY;render();}
   }

   if(a==="deleteComponent")deleteComponent(state.selected);

   if(a==="deleteConnection"){
    historyPush();
    state.connections=state.connections.filter(x=>x.id!==state.selectedConnection);
    state.selectedConnection=null;
    render();
   }

   if(a==="editValve"){
    const c=findComponent(state.selected);
    if(c)openValveBuilder(c);
   }
  });
 });
}

function deleteComponent(id){

 const c=findComponent(id);
 if(!c)return;

 historyPush();

 state.components=state.components.filter(x=>x.id!==id);
 state.connections=state.connections.filter(h=>
  h.from.component!==id&&h.to.component!==id
 );

 state.selected=null;
 render();
 toast(`${c.label} deleted`);
}

/* ============================================================
   DRAGGING
   ============================================================ */

function startComponentDrag(c,e){

 const p=screenToWorld(e.clientX,e.clientY);

 state.drag={
  component:c,
  offsetX:p.x-c.x,
  offsetY:p.y-c.y,
  startX:c.x,
  startY:c.y
 };

 e.currentTarget.setPointerCapture?.(e.pointerId);
}

function continueDrag(e){

 if(!state.drag)return;

 const c=state.drag.component;
 const p=screenToWorld(e.clientX,e.clientY);

 c.x=snap(p.x-state.drag.offsetX);
 c.y=snap(p.y-state.drag.offsetY);

 render();
}

function finishDrag(){

 if(!state.drag)return;

 const d=state.drag;

 if(d.startX!==d.component.x||d.startY!==d.component.y){
  state.history.push({
   components:clone(state.components).map(c=>
    c.id===d.component.id
    ? {...c,x:d.startX,y:d.startY}
    : c
   ),
   connections:clone(state.connections),
   nextId:state.nextId
  });

  if(state.history.length>50)state.history.shift();
  state.future=[];
 }

 state.drag=null;
}

/* ============================================================
   POINTER / TOUCH
   ============================================================ */

svg.addEventListener("pointerdown",e=>{

 state.pointerMap.set(e.pointerId,{x:e.clientX,y:e.clientY});

 if(e.target===svg||e.target===background){

  if(state.tool==="select"){
   state.selected=null;
   state.selectedConnection=null;
   render();
  }

  state.pan={
   x:e.clientX,
   y:e.clientY,
   cameraX:state.camera.x,
   cameraY:state.camera.y
  };

  svg.setPointerCapture?.(e.pointerId);
 }
});

svg.addEventListener("pointermove",e=>{

 state.pointerMap.set(e.pointerId,{x:e.clientX,y:e.clientY});

 if(state.drag){
  continueDrag(e);
  return;
 }

 if(state.pan&&state.pointerMap.size===1){
  state.camera.x=state.pan.cameraX+(e.clientX-state.pan.x);
  state.camera.y=state.pan.cameraY+(e.clientY-state.pan.y);
  applyCamera();
 }
});

svg.addEventListener("pointerup",e=>{

 state.pointerMap.delete(e.pointerId);

 if(state.drag){
  finishDrag();
 }

 if(state.pointerMap.size===0){
  state.pan=null;
 }
});

svg.addEventListener("pointercancel",e=>{
 state.pointerMap.delete(e.pointerId);
 state.drag=null;
 state.pan=null;
});

svg.addEventListener("wheel",e=>{
 e.preventDefault();

 const before=screenToWorld(e.clientX,e.clientY);
 const factor=e.deltaY<0?1.1:.9;

 state.camera.zoom=clamp(state.camera.zoom*factor,.25,3);

 const after=screenToWorld(e.clientX,e.clientY);

 state.camera.x+=(after.x-before.x)*state.camera.zoom;
 state.camera.y+=(after.y-before.y)*state.camera.zoom;

 applyCamera();
},{passive:false});

function renderLibrary(filter=""){

 const targets=[
  document.getElementById("libraryScroll"),
  document.getElementById("mobileLibraryScroll")
 ];

 targets.forEach(target=>{
  if(!target)return;

  target.innerHTML="";

  COMPONENTS.forEach(cat=>{

   if(cat.pneumatic && state.mode!=="pneumatic")return;

   const matches=cat.items.filter(item=>{
    const s=(item[1]+" "+item[2]).toLowerCase();
    return !filter||s.includes(filter.toLowerCase());
   });

   if(!matches.length)return;

   const title=document.createElement("div");
   title.className="cat";
   title.textContent=cat.category;
   target.appendChild(title);

   matches.forEach(item=>{

    const btn=document.createElement("button");
    btn.className="libItem";

    btn.innerHTML=`
     <span class="libIcon">
      <svg width="34" height="34" viewBox="-50 -50 100 100">
       ${miniIcon(item[0])}
      </svg>
     </span>
     <span>
      <div class="libName">${item[1]}</div>
      <div class="libSub">${item[2]}</div>
     </span>
    `;

    btn.onclick=()=>addComponent(item[0]);

    target.appendChild(btn);
   });
  });
 });
}

document.getElementById("saveBtn").onclick=()=>{

  version:1,
  mode:state.mode,
  components:state.components,
  connections:state.connections,
  nextId:state.nextId
 };

 const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
 const url=URL.createObjectURL(blob);

 const a=document.createElement("a");
 a.href=url;
 a.download="hydraulic-studio-circuit.json";
 a.click();

 setTimeout(()=>URL.revokeObjectURL(url),1000);

 toast("Circuit saved");
};

document.getElementById("loadBtn").onclick=()=>{

 const input=document.createElement("input");
 input.type="file";
 input.accept=".json,application/json";

 input.onchange=()=>{
  const file=input.files[0];
  if(!file)return;

  const reader=new FileReader();

  reader.onload=()=>{
   try{
    const data=JSON.parse(reader.result);

    historyPush();

    state.components=data.components||[];
    state.connections=data.connections||[];
    state.nextId=data.nextId||1;
    state.mode=data.mode||"hydraulic";

    renderLibrary();
    fitView();

    toast("Circuit loaded");
   }catch(err){
    alert("Could not load that circuit file.");
   }
  };

  reader.readAsText(file);
 };

 input.click();
};

/* ============================================================
   SIMULATION
   ============================================================ */

document.getElementById("simBtn").onclick=()=>{

 state.running=!state.running;

 const btn=document.getElementById("simBtn");
 const badge=document.getElementById("simBadge");

 if(state.running){
  btn.textContent="■ Stop";
  btn.classList.add("active");
  badge.textContent="RUNNING";
  badge.classList.add("running");
  state.lastTime=performance.now();
  requestAnimationFrame(simLoop);
  toast("Simulation running");
 }else{
  btn.textContent="▶ Simulate";
  btn.classList.remove("active");
  badge.textContent="STOPPED";
  badge.classList.remove("running");
  toast("Simulation stopped");
 }

 render();
};

function simLoop(now){

 if(!state.running)return;

 const dt=Math.min(.05,(now-state.lastTime)/1000||0);
 state.lastTime=now;
 state.simTime+=dt*1000;

 simulate(dt);

 render();

 requestAnimationFrame(simLoop);
}

function simulate(dt){

 state.components.forEach(c=>{
  c.sim.pressure=0;
  c.sim.flow=0;
  c.sim.speed=0;
  c.sim.active=false;
 });

 state.connections.forEach(h=>{
  h.flow=0;
  h.pressureDrop=0;
 });

 const pumps=state.components.filter(c=>
  c.type==="pump"||c.type==="pumpVariable"||c.type==="compressor"
 );

 pumps.forEach(p=>{
  if(p.params.fault==="failed"||p.params.fault==="cavitation")return;

  p.sim.active=true;
  p.sim.pressure=Number(p.params.pressure)||0;
  p.sim.flow=Number(p.params.flow)||0;
 });

 propagateFlows();

 simulateActuators(dt);
 calculateConnectionLosses();
}

/* ------------------------------------------------------------
   Hydraulic graph propagation
   ------------------------------------------------------------ */

function propagateFlows(){

 const visited=new Set();
 const queue=[];

 state.components.forEach(c=>{
  if(
   c.type==="pump"||
   c.type==="pumpVariable"||
   c.type==="compressor"
  ){
   if(c.params.fault==="failed")return;

   queue.push({
    id:c.id,
    pressure:Number(c.params.pressure)||0,
    flow:Number(c.params.flow)||0
   });
  }
 });

 while(queue.length){

  const n=queue.shift();

  if(visited.has(n.id))continue;
  visited.add(n.id);

  const c=findComponent(n.id);
  if(!c)continue;

  c.sim.pressure=Math.max(c.sim.pressure,n.pressure);
  c.sim.flow=Math.max(c.sim.flow,n.flow);

  const links=state.connections.filter(h=>
   h.from.component===c.id||h.to.component===c.id
  );

  links.forEach(h=>{

   const otherId=
    h.from.component===c.id
    ?h.to.component
    :h.from.component;

   const other=findComponent(otherId);
   if(!other)return;

   let flow=n.flow;
   let pressure=n.pressure;

   if(h.type==="soft")pressure*=.98;
   if(h.type==="hard")pressure*=.995;
   if(h.type==="steel")pressure*=.997;
   if(h.type==="flexible")pressure*=.97;

   if(h.diameter<8)flow*=.45;
   else if(h.diameter<12)flow*=.7;
   else if(h.diameter<16)flow*=.88;

   flow=Math.max(0,flow);

   if(other.params.fault==="blocked"){
    flow=0;
   }

   if(other.type==="flow"||
      other.type==="needle"||
      other.type==="airFlow"){
    flow=Math.min(flow,Number(other.params.maxFlow)||60);
   }

   if(other.type==="relief"||
      other.type==="airRelief"){
    if(pressure>Number(other.params.relief)){
     flow*=.35;
    }
   }

   if(other.type==="reducing"){
    pressure=Math.min(pressure,Number(other.params.reduction)||100);
   }

   h.flow=Math.max(h.flow,flow);
   h.pressureDrop=Math.max(0,n.pressure-pressure);

   if(!visited.has(other.id)){
    queue.push({
     id:other.id,
     pressure,
     flow
    });
   }
  });
 }
}

/* ------------------------------------------------------------
   Actuators
   ------------------------------------------------------------ */

function simulateActuators(dt){

 state.components.forEach(c=>{

  if(c.type==="cylinder"||c.type==="singleCylinder"||c.type==="airCylinder"){

   const links=state.connections.filter(h=>
    h.from.component===c.id||h.to.component===c.id
   );

   let fa=0;
   let fb=0;

   links.forEach(h=>{
    const port=
     h.from.component===c.id
     ?h.from.port
     :h.to.port;

    if(port==="A")fa=Math.max(fa,h.flow);
    if(port==="B")fb=Math.max(fb,h.flow);
   });

   const bore=Number(c.params.bore)||80;
   const rod=Number(c.params.rod)||40;
   const area=Math.PI*bore*bore/4;
   const rodArea=Math.PI*rod*rod/4;

   let direction=0;

   const valve=connectedDirectional(c.id);

   if(valve){

    const pos=valve.params.position||"centre";

    if(pos==="left")direction=1;
    if(pos==="right")direction=-1;

    if(pos==="centre")direction=0;

    if(valve.params.centre==="closed"&&pos==="centre"){
     direction=0;
    }
   }else{
    if(fa>fb)direction=1;
    if(fb>fa)direction=-1;
   }

   if(c.params.fault==="leak"){
    direction*=.3;
   }

   const flow=Math.max(fa,fb);

   let speed=0;

   if(area>0){
    speed=(flow*1000000/60)/area;
   }

   speed=clamp(speed,0,1000);

   c.sim.speed=speed;
   c.sim.flow=flow;

   c.sim.position=clamp(
    c.sim.position+direction*dt*Math.max(.1,speed/100),
    0,
    1
   );

   c.sim.pressure=
    Math.max(
     c.sim.pressure,
     direction>0?Math.min(210,fa*3):Math.min(210,fb*3)
    );

   c.sim.active=Math.abs(direction)>0;
  }

  if(c.type==="motor"||c.type==="airMotor"){

   const links=state.connections.filter(h=>
    h.from.component===c.id||h.to.component===c.id
   );

   let flow=0;

   links.forEach(h=>{
    flow=Math.max(flow,h.flow);
   });

   const displacement=Number(c.params.displacement)||40;

   const rpm=flow*1000/displacement;

   c.sim.flow=flow;
   c.sim.speed=rpm;
   c.sim.active=flow>0;

   c.sim.position=(c.sim.position+dt*rpm/60)%1;
  }
}

);
}

function connectedDirectional(cid){

 const links=state.connections.filter(h=>
  h.from.component===cid||h.to.component===cid
 );

 for(const h of links){

  const otherId=
   h.from.component===cid
   ?h.to.component
   :h.from.component;

  const other=findComponent(otherId);

  if(other&&(other.type==="directional"||other.type==="pneumaticValve")){
   return other;
  }
 }

 return null;
}

function calculateConnectionLosses(){

 state.connections.forEach(h=>{

  const d=Math.max(1,Number(h.diameter)||12);
  const L=Math.max(1,Number(h.length)||1000);
  const q=Math.max(0,Number(h.flow)||0);

  const loss=
   .000015*
   L*
   Math.pow(q,1.8)/
   Math.pow(d,4.8);

  h.pressureDrop=Math.max(0,loss);

  if(h.rating&&h.pressureDrop>h.rating){
   h.pressureDrop=h.rating;
  }

  if(
   state.running&&
   state.components.some(c=>c.params.fault==="burst"&&
    (c.id===h.from.component||c.id===h.to.component))
  ){
   h.flow=0;
  }
}

/* ============================================================
   KEYBOARD
   ============================================================ */

document.addEventListener("keydown",e=>{

 if(e.key==="Escape"){
  state.hoseStart=null;
  state.drag=null;
  state.pan=null;
  closeValveBuilder();
  render();
 }

 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"){
  e.preventDefault();
  undo();
 }

 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="y"){
  e.preventDefault();
  redo();
 }

 if(e.key==="Delete"||e.key==="Backspace"){
  if(state.selected)deleteComponent(state.selected);
  else if(state.selectedConnection){
   historyPush();
   state.connections=state.connections.filter(h=>h.id!==state.selectedConnection);
   state.selectedConnection=null;
   render();
  }
 }

 if(e.key.toLowerCase()==="r"&&state.selected){
  const c=findComponent(state.selected);
  historyPush();
  c.rotation=(c.rotation+90)%360;
  render();
 }
});
