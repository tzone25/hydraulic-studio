<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hydraulic Studio">
<title>Hydraulic Studio</title>

<style>
*{box-sizing:border-box}
:root{
  --bg:#080d18;
  --panel:#101827;
  --panel2:#151f31;
  --line:#26344b;
  --text:#e8eef8;
  --muted:#8997ad;
  --accent:#3ea6ff;
  --green:#43d17a;
  --yellow:#f4c95d;
  --red:#ff5964;
  --orange:#ff9f43;
}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
button,input,select{font:inherit}
button{border:1px solid var(--line);background:#172236;color:var(--text);border-radius:7px;padding:7px 10px;cursor:pointer}
button:hover{background:#20304a}
button.active{background:#185c91;border-color:#3ea6ff}
button.danger{border-color:#70333a;color:#ff8b93}
input,select{width:100%;background:#0b1322;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:7px}
#app{display:grid;grid-template-rows:52px 1fr 30px;height:100vh}
#topbar{display:flex;align-items:center;gap:7px;padding:7px 9px;border-bottom:1px solid var(--line);background:#0d1422;overflow-x:auto}
.logo{font-size:17px;font-weight:800;margin-right:8px;white-space:nowrap}
.logo span{color:var(--accent)}
.toolbar-group{display:flex;gap:5px}
.spacer{flex:1}
#main{min-height:0;display:grid;grid-template-columns:225px 1fr 285px}
.panel{background:var(--panel);border-right:1px solid var(--line);min-width:0}
#right{border-right:0;border-left:1px solid var(--line);overflow:auto}
.panel-title{font-weight:700;padding:12px;border-bottom:1px solid var(--line)}
.search{padding:9px;border-bottom:1px solid var(--line)}
#library{padding:8px;overflow:auto;height:calc(100% - 94px)}
.lib-section{margin:7px 0 4px;color:var(--muted);font-size:11px;text-transform:uppercase}
.lib-item{display:flex;align-items:center;gap:8px;padding:9px;margin-bottom:5px;background:#121d2e;border:1px solid #203049;border-radius:7px;cursor:pointer}
.lib-item:hover{border-color:var(--accent)}
.lib-icon{width:27px;height:27px;border-radius:5px;background:#1b2c43;display:grid;place-items:center;font-size:13px}
#workspace{position:relative;overflow:hidden;background:#09101c}
#svg{width:100%;height:100%;display:block;touch-action:none}
.grid{stroke:#18263a;stroke-width:1}
.grid-major{stroke:#22334a;stroke-width:1}
.wire{stroke:#d6e4f7;stroke-width:4;fill:none;stroke-linecap:round}
.wire.pressure{stroke:#4aa9ff}
.wire.return{stroke:#43d17a}
.wire.hot{stroke:#ff9f43}
.wire.fault{stroke:#ff5964}
.component{cursor:pointer}
.component rect,.component circle,.component path,.component line,.component polygon{vector-effect:non-scaling-stroke}
.component-body{fill:#121e30;stroke:#90a1b8;stroke-width:2}
.component.selected .component-body{stroke:#3ea6ff;stroke-width:3}
.component-label{fill:#e9f1fb;font-size:12px;font-weight:600;text-anchor:middle;pointer-events:none}
.port{fill:#f0f5fc;stroke:#182337;stroke-width:2;cursor:crosshair}
.port.connected{fill:#43d17a}
.flow-dot{fill:#fff}
#canvasTools{position:absolute;top:10px;left:10px;display:flex;gap:5px}
#zoomLabel{padding:7px 9px;background:#101a2a;border:1px solid var(--line);border-radius:7px;font-size:12px}
#simBadge{position:absolute;top:10px;right:10px;padding:7px 10px;border-radius:7px;background:#101a2a;border:1px solid var(--line);font-size:12px}
#rightContent{padding:10px}
.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.metric{background:#0b1321;border:1px solid var(--line);padding:8px;border-radius:7px}
.metric small{display:block;color:var(--muted);font-size:10px}
.metric strong{display:block;font-size:16px;margin-top:2px}
.section{border-top:1px solid var(--line);padding:11px 0}
.section:first-child{border-top:0}
.section h3{font-size:12px;margin:0 0 8px;color:#aebbd0;text-transform:uppercase}
.row{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:7px}
.row.one{grid-template-columns:1fr}
label{font-size:11px;color:var(--muted);display:block;margin-bottom:3px}
.value{background:#0b1321;border:1px solid var(--line);border-radius:6px;padding:7px}
.badge{display:inline-block;padding:4px 7px;border-radius:5px;font-size:11px;background:#263349;margin:2px}
.badge.ok{background:#123b29;color:#65e495}
.badge.warn{background:#4b3d13;color:#ffe18a}
.badge.bad{background:#4a1820;color:#ff8c96}
.diag{padding:8px;border-radius:6px;margin-bottom:6px;font-size:11px;background:#111c2c;border-left:3px solid var(--green)}
.diag.warn{border-left-color:var(--yellow)}
.diag.bad{border-left-color:var(--red)}
#status{display:flex;align-items:center;gap:15px;padding:0 10px;background:#0c1422;border-top:1px solid var(--line);font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden}
#status .good{color:var(--green)}
#status .bad{color:var(--red)}
#status .warn{color:var(--yellow)}
#toast{position:absolute;bottom:45px;left:50%;transform:translateX(-50%);background:#16243a;border:1px solid #35506f;padding:9px 14px;border-radius:7px;opacity:0;pointer-events:none;transition:.2s;font-size:12px}
#toast.show{opacity:1}
@media(max-width:850px){
 #main{grid-template-columns:180px 1fr}
 #right{display:none}
 #topbar{gap:4px}
 .logo{font-size:15px}
}
@media(max-width:600px){
 #main{grid-template-columns:1fr}
 #panelLeft{display:none}
}
</style>
</head>

<body>
<div id="app">

<header id="topbar">
  <div class="logo">HYDRAULIC <span>STUDIO</span></div>
  <div class="toolbar-group">
    <button onclick="newProject()">New</button>
    <button onclick="loadExample()">Example</button>
    <button onclick="undo()">↶</button>
    <button onclick="redo()">↷</button>
    <button onclick="saveProject()">Save</button>
    <button onclick="loadProject()">Load</button>
    <button onclick="runDiagnostics()">Diagnostics</button>
  </div>
  <div class="spacer"></div>
  <button id="runBtn" onclick="toggleSimulation()">▶ Run</button>
  <button onclick="resetSimulation()">↺ Reset</button>
</header>

<main id="main">

<aside id="panelLeft" class="panel">
  <div class="panel-title">Component Library</div>
  <div class="search">
    <input id="componentSearch" placeholder="Search components..." oninput="renderLibrary()">
  </div>
  <div id="library"></div>
</aside>

<section id="workspace">

<div id="canvasTools">
  <button onclick="zoomBy(1.15)">＋</button>
  <button onclick="zoomBy(.87)">−</button>
  <button onclick="fitView()">Fit</button>
  <button onclick="clearSelection()">Select</button>
  <span id="zoomLabel">100%</span>
</div>

<div id="simBadge">● STOPPED</div>

<svg id="svg">
  <g id="viewport">
    <g id="gridLayer"></g>
    <g id="wireLayer"></g>
    <g id="componentLayer"></g>
    <g id="animationLayer"></g>
  </g>
</svg>

<div id="toast"></div>
</section>

<aside id="right" class="panel">
  <div class="panel-title">Engineering Panel</div>
  <div id="rightContent"></div>
</aside>

</main>

<footer id="status">
 <span id="statusMode">Design Mode</span>
 <span id="statusPressure">Pressure: 0 bar</span>
 <span id="statusFlow">Flow: 0 L/min</span>
 <span id="statusPower">Power: 0 kW</span>
 <span id="statusMessage" class="good">System ready</span>
</footer>

</div>

<script>
/* =========================================================
   HYDRAULIC STUDIO
   Full standalone hydraulic schematic + simulation engine
   ========================================================= */

const svg=document.getElementById("svg");
const viewport=document.getElementById("viewport");
const gridLayer=document.getElementById("gridLayer");
const wireLayer=document.getElementById("wireLayer");
const componentLayer=document.getElementById("componentLayer");
const animationLayer=document.getElementById("animationLayer");

let components=[];
let wires=[];
let selectedId=null;
let connecting=null;
let running=false;
let history=[];
let future=[];
let simTime=0;
let zoom=1;
let panX=0;
let panY=0;
let dragState=null;
let pointerState=null;

const NS="http://www.w3.org/2000/svg";

const library=[
 ["tank","Reservoir","Tank","hydraulic"],
 ["pump","Fixed Pump","Pump","hydraulic"],
 ["variablePump","Variable Piston Pump","Pump","hydraulic"],
 ["accumulator","Accumulator","Accumulator","hydraulic"],
 ["valve43","4/3 Directional Valve","Valve","valve"],
 ["valve42","4/2 Directional Valve","Valve","valve"],
 ["proportional","Proportional Valve","Valve","valve"],
 ["relief","Relief Valve","Valve","pressure"],
 ["reducing","Pressure Reducing Valve","Valve","pressure"],
 ["sequence","Sequence Valve","Valve","pressure"],
 ["counterbalance","Counterbalance Valve","Valve","pressure"],
 ["check","Check Valve","Valve","flow"],
 ["flowControl","Flow Control Valve","Valve","flow"],
 ["throttleCheck","Throttle Check","Valve","flow"],
 ["filter","Filter","Filter","hydraulic"],
 ["cylinder","Double Acting Cylinder","Actuator","actuator"],
 ["motor","Hydraulic Motor","Actuator","actuator"],
 ["gauge","Pressure Gauge","Sensor","sensor"],
 ["flowmeter","Flow Meter","Sensor","sensor"],
 ["temperature","Temperature Sensor","Sensor","sensor"]
];

const defaults={
 tank:{name:"Reservoir",ports:["T"],width:70,height:80},
 pump:{name:"Fixed Pump",ports:["IN","OUT"],width:100,height:70},
 variablePump:{name:"Variable Piston Pump",ports:["IN","OUT"],width:110,height:75},
 accumulator:{name:"Accumulator",ports:["P"],width:80,height:90},
 valve43:{name:"4/3 Directional Valve",ports:["P","T","A","B"],width:150,height:90},
 valve42:{name:"4/2 Directional Valve",ports:["P","T","A","B"],width:150,height:75},
 proportional:{name:"Proportional Valve",ports:["P","T","A","B"],width:150,height:90},
 relief:{name:"Relief Valve",ports:["IN","OUT"],width:115,height:65},
 reducing:{name:"Pressure Reducing Valve",ports:["IN","OUT"],width:140,height:65},
 sequence:{name:"Sequence Valve",ports:["IN","OUT"],width:120,height:65},
 counterbalance:{name:"Counterbalance Valve",ports:["IN","OUT","PILOT"],width:135,height:70},
 check:{name:"Check Valve",ports:["IN","OUT"],width:100,height:55},
 flowControl:{name:"Flow Control Valve",ports:["IN","OUT"],width:120,height:60},
 throttleCheck:{name:"Throttle Check",ports:["IN","OUT"],width:120,height:60},
 filter:{name:"Filter",ports:["IN","OUT"],width:105,height:60},
 cylinder:{name:"Double Acting Cylinder",ports:["A","B"],width:180,height:80},
 motor:{name:"Hydraulic Motor",ports:["A","B"],width:100,height:85},
 gauge:{name:"Pressure Gauge",ports:["P"],width:70,height:70},
 flowmeter:{name:"Flow Meter",ports:["IN","OUT"],width:100,height:60},
 temperature:{name:"Temperature Sensor",ports:["P"],width:90,height:60}
};

function uid(){
 return "c"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
}

function clone(o){
 return JSON.parse(JSON.stringify(o));
}

function makeComponent(type,x,y){
 const d=defaults[type];
 const c={
  id:uid(),
  type,
  name:d.name,
  x,y,
  rotation:0,
  ports:clone(d.ports),
  params:{},
  state:{},
  fault:null
 };

 switch(type){
  case"pump":
   Object.assign(c.params,{displacement:16,rpm:1450,efficiency:0.9});
   break;
  case"variablePump":
   Object.assign(c.params,{displacement:32,rpm:1450,efficiency:.92,swash:75,compensator:250});
   break;
  case"accumulator":
   Object.assign(c.params,{volume:20,precharge:100,maxPressure:250});
   break;
  case"valve43":
   Object.assign(c.params,{position:"extend",centre:"closed",flowRating:120});
   break;
  case"valve42":
   Object.assign(c.params,{position:"extend",flowRating:120});
   break;
  case"proportional":
   Object.assign(c.params,{command:70,flowRating:120});
   break;
  case"relief":
   Object.assign(c.params,{setting:210,cracking:.5});
   break;
  case"reducing":
   Object.assign(c.params,{setting:120});
   break;
  case"sequence":
   Object.assign(c.params,{setting:100});
   break;
  case"counterbalance":
   Object.assign(c.params,{setting:100,pilotRatio:3});
   break;
  case"check":
   Object.assign(c.params,{cracking:.5});
   break;
  case"flowControl":
   Object.assign(c.params,{opening:100,maxFlow:80,mode:"meter-in"});
   break;
  case"throttleCheck":
   Object.assign(c.params,{opening:100,maxFlow:70,mode:"meter-in"});
   break;
  case"filter":
   Object.assign(c.params,{rating:150,restriction:.3});
   break;
  case"cylinder":
   Object.assign(c.params,{
    bore:100,
    rod:50,
    stroke:500,
    load:50000,
    friction:1500,
    position:100,
    maxSpeed:300
   });
   c.state={position:100,speed:0,pressureA:0,pressureB:0,force:0};
   break;
  case"motor":
   Object.assign(c.params,{displacement:80,loadTorque:100,speedLimit:2500});
   break;
  case"gauge":
   Object.assign(c.params,{});
   break;
  case"flowmeter":
   Object.assign(c.params,{});
   break;
  case"temperature":
   Object.assign(c.params,{});
   break;
 }
 return c;
}

function getC(id){
 return components.find(c=>c.id===id);
}

function portOffset(c,p){
 const w=defaults[c.type].width;
 const h=defaults[c.type].height;

 const positions={
  tank:{T:[w/2,h]},
  pump:{IN:[0,h/2],OUT:[w,h/2]},
  variablePump:{IN:[0,h/2],OUT:[w,h/2]},
  accumulator:{P:[w/2,h]},
  valve43:{P:[0,h*.28],T:[0,h*.72],A:[w,h*.28],B:[w,h*.72]},
  valve42:{P:[0,h*.28],T:[0,h*.72],A:[w,h*.28],B:[w,h*.72]},
  proportional:{P:[0,h*.28],T:[0,h*.72],A:[w,h*.28],B:[w,h*.72]},
  relief:{IN:[0,h/2],OUT:[w,h/2]},
  reducing:{IN:[0,h/2],OUT:[w,h/2]},
  sequence:{IN:[0,h/2],OUT:[w,h/2]},
  counterbalance:{IN:[0,h*.5],OUT:[w,h*.5],PILOT:[w/2,0]},
  check:{IN:[0,h/2],OUT:[w,h/2]},
  flowControl:{IN:[0,h/2],OUT:[w,h/2]},
  throttleCheck:{IN:[0,h/2],OUT:[w,h/2]},
  filter:{IN:[0,h/2],OUT:[w,h/2]},
  cylinder:{A:[0,h*.3],B:[0,h*.7]},
  motor:{A:[0,h/2],B:[w,h/2]},
  gauge:{P:[w/2,h]},
  flowmeter:{IN:[0,h/2],OUT:[w,h/2]},
  temperature:{P:[w/2,h]}
 };

 const q=positions[c.type][p]||[0,0];
 return {
  x:c.x+q[0],
  y:c.y+q[1]
 };
}

function screenToWorld(x,y){
 const r=svg.getBoundingClientRect();
 return {
  x:(x-r.left-panX)/zoom,
  y:(y-r.top-panY)/zoom
 };
}

function updateTransform(){
 viewport.setAttribute("transform",`translate(${panX} ${panY}) scale(${zoom})`);
 document.getElementById("zoomLabel").textContent=Math.round(zoom*100)+"%";
}

function drawGrid(){
 const W=3000,H=2000;
 let s="";
 for(let x=0;x<=W;x+=25)
  s+=`<line x1="${x}" y1="0" x2="${x}" y2="${H}" class="${x%100===0?"grid-major":"grid"}"/>`;
 for(let y=0;y<=H;y+=25)
  s+=`<line x1="0" y1="${y}" x2="${W}" y2="${y}" class="${y%100===0?"grid-major":"grid"}"/>`;
 gridLayer.innerHTML=s;
}

function render(){
 drawGrid();
 renderWires();
 renderComponents();
 updateInspector();
 updateMetrics();
 updateTransform();
}

function renderComponents(){
 componentLayer.innerHTML="";
 components.forEach(c=>{
  const g=document.createElementNS(NS,"g");
  g.classList.add("component");
  if(c.id===selectedId)g.classList.add("selected");
  g.setAttribute("transform",`translate(${c.x} ${c.y}) rotate(${c.rotation||0})`);
  g.dataset.id=c.id;

  const d=defaults[c.type];
  const body=document.createElementNS(NS,"rect");
  body.setAttribute("x",0);
  body.setAttribute("y",0);
  body.setAttribute("width",d.width);
  body.setAttribute("height",d.height);
  body.setAttribute("rx",8);
  body.classList.add("component-body");
  g.appendChild(body);

  drawSymbol(g,c,d);

  const label=document.createElementNS(NS,"text");
  label.setAttribute("x",d.width/2);
  label.setAttribute("y",d.height+18);
  label.classList.add("component-label");
  label.textContent=c.name;
  g.appendChild(label);

  c.ports.forEach(p=>{
   const q=portOffset(c,p);
   const px=q.x-c.x;
   const py=q.y-c.y;
   const circle=document.createElementNS(NS,"circle");
   circle.setAttribute("cx",px);
   circle.setAttribute("cy",py);
   circle.setAttribute("r",5);
   circle.classList.add("port");

   if(wires.some(w=>
    (w.a.cid===c.id&&w.a.port===p)||
    (w.b.cid===c.id&&w.b.port===p)
   ))circle.classList.add("connected");

   circle.dataset.cid=c.id;
   circle.dataset.port=p;
   circle.addEventListener("pointerdown",portPointerDown);
   g.appendChild(circle);

   const t=document.createElementNS(NS,"text");
   t.setAttribute("x",px+(px<d.width/2?-12:12));
   t.setAttribute("y",py-8);
   t.setAttribute("fill","#8fa1b8");
   t.setAttribute("font-size","9");
   t.textContent=p;
   g.appendChild(t);
  });

  g.addEventListener("pointerdown",componentPointerDown);
  componentLayer.appendChild(g);
 });
}

function drawSymbol(g,c,d){
 const w=d.width,h=d.height;
 const line=(x1,y1,x2,y2)=>{
  const e=document.createElementNS(NS,"line");
  Object.entries({x1,y1,x2,y2,stroke:"#dce8f5","stroke-width":2}).forEach(([k,v])=>e.setAttribute(k,v));
  g.appendChild(e);
 };

 if(c.type==="tank"){
  line(15,25,w-15,25);
  line(15,25,15,h-15);
  line(w-15,25,w-15,h-15);
  const path=document.createElementNS(NS,"path");
  path.setAttribute("d",`M15 ${h*.6} Q35 ${h*.48} 55 ${h*.6} T${w-15} ${h*.6}`);
  path.setAttribute("fill","none");path.setAttribute("stroke","#3ea6ff");path.setAttribute("stroke-width","2");
  g.appendChild(path);
 }
 else if(c.type==="pump"||c.type==="variablePump"){
  const circ=document.createElementNS(NS,"circle");
  circ.setAttribute("cx",w/2);circ.setAttribute("cy",h/2);circ.setAttribute("r",24);
  circ.setAttribute("fill","none");circ.setAttribute("stroke","#dce8f5");circ.setAttribute("stroke-width","2");
  g.appendChild(circ);
  const p=document.createElementNS(NS,"polygon");
  p.setAttribute("points",`${w/2-7},${h/2-9} ${w/2+11},${h/2} ${w/2-7},${h/2+9}`);
  p.setAttribute("fill","#dce8f5");g.appendChild(p);
  if(c.type==="variablePump")line(w/2-28,h/2-27,w/2+28,h/2+27);
 }
 else if(c.type==="accumulator"){
  const r=document.createElementNS(NS,"circle");
  r.setAttribute("cx",w/2);r.setAttribute("cy",h*.55);r.setAttribute("r",27);
  r.setAttribute("fill","none");r.setAttribute("stroke","#dce8f5");r.setAttribute("stroke-width","2");g.appendChild(r);
  line(w/2-20,h*.55,w/2+20,h*.55);
  line(w/2,h*.55,w/2,h*.8);
 }
 else if(["valve43","valve42","proportional"].includes(c.type)){
  const count=c.type==="valve43"?3:2;
  const boxW=w/count;
  for(let i=0;i<count;i++){
   const x=i*boxW;
   const r=document.createElementNS(NS,"rect");
   r.setAttribute("x",x);r.setAttribute("y",10);r.setAttribute("width",boxW);r.setAttribute("height",h-20);
   r.setAttribute("fill","none");r.setAttribute("stroke","#8fa1b8");g.appendChild(r);
  }
  const active=c.params.position||"extend";
  let i=active==="retract"?count-1:active==="center"?1:0;
  if(count===2)i=active==="retract"?1:0;
  const x=i*boxW;
  if(active==="extend"){
   line(x+15,h*.38,x+boxW-15,h*.38);
   line(x+boxW-15,h*.38,x+boxW-30,h*.28);
   line(x+boxW-15,h*.38,x+boxW-30,h*.48);
   line(x+15,h*.62,x+boxW-15,h*.62);
  }else if(active==="retract"){
   line(x+boxW-15,h*.38,x+15,h*.38);
   line(x+15,h*.38,x+30,h*.28);
   line(x+15,h*.38,x+30,h*.48);
   line(x+boxW-15,h*.62,x+15,h*.62);
  }else{
   line(x+18,h/2,x+boxW-18,h/2);
  }
 }
 else if(c.type==="relief"||c.type==="reducing"||c.type==="sequence"||c.type==="counterbalance"){
  line(15,h-15,w-15,15);
  const circ=document.createElementNS(NS,"circle");
  circ.setAttribute("cx",w/2);circ.setAttribute("cy",h/2);circ.setAttribute("r",14);
  circ.setAttribute("fill","none");circ.setAttribute("stroke","#dce8f5");circ.setAttribute("stroke-width","2");g.appendChild(circ);
  line(w/2-7,h/2,w/2+7,h/2);
 }
 else if(["check","flowControl","throttleCheck","filter"].includes(c.type)){
  if(c.type==="filter"){
   line(25,h/2,w-25,h/2);
   line(38,h*.28,w/2,h/2);
   line(w/2,h/2,w-12,h*.72);
  }else{
   const p=document.createElementNS(NS,"polygon");
   p.setAttribute("points",`${w*.35},${h*.25} ${w*.65},${h/2} ${w*.35},${h*.75}`);
   p.setAttribute("fill","none");p.setAttribute("stroke","#dce8f5");p.setAttribute("stroke-width","2");g.appendChild(p);

function renderWires(){

 wires.forEach((w,i)=>{
  const a=portOffset(getC(w.a.cid),w.a.port);

function zoomBy(f,cx=null,cy=null){
 const old=zoom;
 zoom=Math.max(.35,Math.min(2.5,zoom*f));

 if(cx!==null){
  const r=svg.getBoundingClientRect();
  const sx=cx-r.left;
  const sy=cy-r.top;
  panX=sx-(sx-panX)*(zoom/old);
  panY=sy-(sy-panY)*(zoom/old);
 }
 updateTransform();
}

function fitView(){
 if(!components.length)return;
 let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
 components.forEach(c=>{
  const d=defaults[c.type];
  minX=Math.min(minX,c.x);
  minY=Math.min(minY,c.y);
  maxX=Math.max(maxX,c.x+d.width);
  maxY=Math.max(maxY,c.y+d.height+20);
 });

 const r=svg.getBoundingClientRect();
 zoom=Math.min(.95,r.width/(maxX-minX+100),r.height/(maxY-minY+100));
 panX=(r.width-(maxX-minX)*zoom)/2-minX*zoom;
 panY=(r.height-(maxY-minY)*zoom)/2-minY*zoom;
 updateTransform();
}

/* =========================================================
   NETWORK ENGINE
   ========================================================= */

function endpointKey(cid,port){
 return cid+":"+port;
}

function connectedComponents(cid){
 const set=new Set([cid]);
 let changed=true;

 while(changed){
  changed=false;
  wires.forEach(w=>{
   if(set.has(w.a.cid)&&!set.has(w.b.cid)){
    set.add(w.b.cid);changed=true;
   }
   if(set.has(w.b.cid)&&!set.has(w.a.cid)){
    set.add(w.a.cid);changed=true;
   }
  });
 }

 return [...set];
}

function connectedPorts(cid,port){
 const result=[];
 wires.forEach(w=>{
  if(w.a.cid===cid&&w.a.port===port)result.push(w.b);
  if(w.b.cid===cid&&w.b.port===port)result.push(w.a);
 });
 return result;
}

function hasConnection(cid,port){
 return connectedPorts(cid,port).length>0;
}

function hasTankPath(cid,port){
 const visited=new Set();
 const queue=[endpointKey(cid,port)];

 while(queue.length){
  const key=queue.shift();
  if(visited.has(key))continue;
  visited.add(key);

  const [thisCid,thisPort]=key.split(":");
  const c=getC(thisCid);
  if(!c)continue;

  if(c.type==="tank")return true;

  connectedPorts(thisCid,thisPort).forEach(p=>{
   const k=endpointKey(p.cid,p.port);
   if(!visited.has(k))queue.push(k);
  });

  c.ports.forEach(p=>{
   if(p!==thisPort){
    const other=endpointKey(thisCid,p);
    if(!visited.has(other)){
     /*
      Only bridge ports internally when the component
      actually represents a continuous path.
     */
     if(componentInternalConnection(c,thisPort,p))
      queue.push(other);
    }
   }
  });
 }

 return false;
}

function componentInternalConnection(c,a,b){
 if(c.type==="tank")return true;
 if(["pump","filter","check","flowControl","throttleCheck","relief","reducing","sequence","counterbalance","flowmeter"].includes(c.type))
  return (a==="IN"&&b==="OUT")||(a==="OUT"&&b==="IN");

 if(c.type==="motor")return true;

 if(c.type==="gauge"||c.type==="temperature"||c.type==="accumulator")
  return false;

 return false;
}

function pressureAt(cid,port,pressures){
 return pressures[endpointKey(cid,port)]||0;
}

function valveConnections(c){
 let result=[];
 const p=c.params.position||"center";

 if(c.type==="valve43"){
  if(p==="extend")result=[["P","A"],["B","T"]];
  else if(p==="retract")result=[["P","B"],["A","T"]];
  else if(p==="float")result=[["A","T"],["B","T"]];
  else{
   if(c.params.centre==="open")result=[["P","T"],["A","T"],["B","T"]];
   if(c.params.centre==="float")result=[["A","T"],["B","T"]];
  }
 }

 if(c.type==="valve42"){
  if(p==="extend")result=[["P","A"],["B","T"]];
  else result=[["P","B"],["A","T"]];
 }

 if(c.type==="proportional"){
  if(c.params.command>50)result=[["P","A"],["B","T"]];
  else if(c.params.command<50)result=[["P","B"],["A","T"]];
  else result=[];
 }

 return result;
}

function networkPressures(){
 const pressures={};

 components.forEach(c=>{
  c.ports.forEach(p=>pressures[endpointKey(c.id,p)]=0);
 });

 const tanks=components.filter(c=>c.type==="tank");

 tanks.forEach(t=>{
  t.ports.forEach(p=>pressures[endpointKey(t.id,p)]=0);
 });

 /*
  Several relaxation passes. The model is deliberately lightweight
  so it remains responsive on mobile Safari.
 */
 for(let pass=0;pass<15;pass++){

  components.forEach(c=>{
   if(c.type==="pump"||c.type==="variablePump"){
    if(hasConnection(c.id,"IN")&&hasTankPath(c.id,"IN")){
     const q=pumpAvailableFlow(c);
     const load=estimatePumpLoad(c.id,pressures);
     let p=load;
     const max=c.type==="variablePump"?(c.params.compensator||250):250;
     p=Math.min(p,max);
     pressures[endpointKey(c.id,"OUT")]=Math.max(
      pressures[endpointKey(c.id,"OUT")],
      p
     );
    }
   }

   if(c.type==="relief"){
    const pin=pressureAt(c.id,"IN",pressures);
    if(pin>c.params.setting){
     pressures[endpointKey(c.id,"OUT")]=0;
     c.state.open=true;
    }else c.state.open=false;
   }

   if(c.type==="reducing"){
    const pin=pressureAt(c.id,"IN",pressures);
    pressures[endpointKey(c.id,"OUT")]=Math.min(pin,c.params.setting);
   }

   if(c.type==="sequence"){
    const pin=pressureAt(c.id,"IN",pressures);
    pressures[endpointKey(c.id,"OUT")]=pin>=c.params.setting?pin:0;
    c.state.open=pin>=c.params.setting;
   }

   if(c.type==="counterbalance"){
    const pin=pressureAt(c.id,"IN",pressures);
    pressures[endpointKey(c.id,"OUT")]=pin>=c.params.setting?pin:0;
   }

   valveConnections(c).forEach(pair=>{
    const a=endpointKey(c.id,pair[0]);
    const b=endpointKey(c.id,pair[1]);
    const high=Math.max(pressures[a],pressures[b]);
    const low=Math.min(pressures[a],pressures[b]);
    if(pair[1]==="T")pressures[a]=Math.max(pressures[a],high);
    else pressures[b]=Math.max(pressures[b],high);
   });

   if(c.type==="check"){
    const pin=pressures[endpointKey(c.id,"IN")];
    if(pin>c.params.cracking)
     pressures[endpointKey(c.id,"OUT")]=Math.max(
      pressures[endpointKey(c.id,"OUT")],pin-c.params.cracking
     );
   }

   if(c.type==="flowControl"||c.type==="throttleCheck"){
    const pin=pressures[endpointKey(c.id,"IN")];
    const q=flowControlCapacity(c);
    pressures[endpointKey(c.id,"OUT")]=Math.max(0,pin-pressureDropForFlow(q,c));
   }

   if(c.type==="filter"){
    const pin=pressures[endpointKey(c.id,"IN")];
    const drop=filterDrop(c);
    pressures[endpointKey(c.id,"OUT")]=Math.max(0,pin-drop);
   }
  });

  wires.forEach(w=>{
   const a=endpointKey(w.a.cid,w.a.port);
   const b=endpointKey(w.b.cid,w.b.port);
   const avg=Math.max(pressures[a],pressures[b]);
   const low=Math.min(pressures[a],pressures[b]);

   if(Math.abs(pressures[a]-pressures[b])<80){
    pressures[a]=Math.max(pressures[a],low);
    pressures[b]=Math.max(pressures[b],low);
   }
  });
 }

 return pressures;
}

function estimatePumpLoad(cid,pressures){
 let max=0;

 const connected=connectedComponents(cid);

 connected.forEach(id=>{
  const c=getC(id);
  if(!c)return;

  if(c.type==="cylinder"){
   const A=cylinderAreaA(c);
   const required=(c.params.load||0)/Math.max(A,1)/100000;
   max=Math.max(max,required);

   if(c.state.pressureA)max=Math.max(max,c.state.pressureA);
  }

  if(c.type==="motor"){
   const areaEquivalent=Math.max(c.params.displacement||80,1);
   max=Math.max(max,(c.params.loadTorque||100)*20/areaEquivalent);
  }

  if(c.type==="relief")
   max=Math.min(max,c.params.setting||210);
 });

 return Math.max(max,5);
}

function pumpAvailableFlow(c){
 let q=(c.params.displacement||16)*(c.params.rpm||1450)/1000;
 q*=c.params.efficiency||.9;

 if(c.type==="variablePump")
  q*=Math.max(0,Math.min(100,c.params.swash||0))/100;

 if(c.fault==="pumpWear")q*=.55;

 return q;
}

function cylinderAreaA(c){
 return Math.PI*Math.pow((c.params.bore||100)/2,2);
}

function cylinderAreaB(c){
 const bore=c.params.bore||100;
 const rod=c.params.rod||50;
 return Math.PI*(Math.pow(bore/2,2)-Math.pow(rod/2,2));
}

function pressureFromLoad(c){
 const A=cylinderAreaA(c);
 return ((c.params.load||0)/Math.max(A,1))/100000;
}

function cylinderRequiredPressure(c,direction){
 const load=pressureFromLoad(c);
 const friction=(c.params.friction||0)/Math.max(cylinderAreaA(c),1)/100000;

 if(direction==="extend")
  return load+friction+(c.state.pressureB||0)*cylinderAreaB(c)/cylinderAreaA(c);

 return load+friction+(c.state.pressureA||0)*cylinderAreaA(c)/Math.max(cylinderAreaB(c),1);
}

function flowControlCapacity(c){
 const opening=Math.max(0,Math.min(100,c.params.opening||100))/100;
 return (c.params.maxFlow||80)*opening;
}

function pressureDropForFlow(q,c){
 const capacity=Math.max(flowControlCapacity(c),.1);
 return Math.pow(q/capacity,2)*20;
}

function filterDrop(c){
 let restriction=c.params.restriction||.3;
 if(c.fault==="blockedFilter")restriction=3;
 return restriction*12;
}

/* =========================================================
   ACTUATOR ENGINE
   ========================================================= */

function updateCylinder(c,pressures,dt){

 const A=cylinderAreaA(c);
 const B=cylinderAreaB(c);

 const pa=pressureAt(c.id,"A",pressures);
 const pb=pressureAt(c.id,"B",pressures);

 c.state.pressureA=pa;
 c.state.pressureB=pb;

 let direction="stop";
 let valveFlow=0;

 const upstreamA=pa;
 const upstreamB=pb;

 /*
  Determine hydraulic command by looking for connected
  directional valve controlling the cylinder.
 */
 let command=null;

 components.forEach(v=>{
  if(!["valve43","valve42","proportional"].includes(v.type))return;

  const Aports=connectedPorts(v.id,"A").map(x=>x.cid);
  const Bports=connectedPorts(v.id,"B").map(x=>x.cid);

  if(Aports.includes(c.id)||Bports.includes(c.id)){
   if(v.type==="proportional"){
    if(v.params.command>55)command="extend";
    else if(v.params.command<45)command="retract";
    else command="center";
   }else{
    command=v.params.position||"center";
   }
  }
 });

 if(command==="extend"){
  direction="extend";
 }else if(command==="retract"){
  direction="retract";
 }else if(command==="float"){
  direction="float";
 }else if(command==="center"){
  direction="stop";
 }else{
  /*
   If no valve command exists, pressure differential can
   still drive a cylinder in a regenerative/load condition.
  */
  const loadPressure=pressureFromLoad(c);
  if(pa-pb*(B/A)>loadPressure)
   direction="extend";
 }

 if(c.fault==="cylinderLeakage"){
  c.state.leakage=0.35;
 }else c.state.leakage=0;

 if(direction==="float"){
  c.state.speed*=.9;
  c.state.force=(pa*A-pb*B)-(c.params.friction||0);
  return;
 }

 if(direction==="stop"){
  c.state.speed*=.92;
  c.state.force=(pa*A-pb*B)-(c.params.friction||0);
  return;
 }

 let supplyPressure=direction==="extend"?pa:pb;
 let returnPressure=direction==="extend"?pb:pa;

 let required=cylinderRequiredPressure(c,direction);

 let pumpFlow=getSystemFlowRaw();

 let maxFlow=pumpFlow;

 /*
  Meter-in/meter-out restrictions.
 */
 const controls=components.filter(x=>x.type==="flowControl"||x.type==="throttleCheck");

 controls.forEach(fc=>{
  const q=flowControlCapacity(fc);
  if(fc.params.mode==="meter-out")
   maxFlow=Math.min(maxFlow,q);
  else
   maxFlow=Math.min(maxFlow,q);
 });

 if(c.fault==="cylinderLeakage")
  maxFlow*=.65;

 if(required>250){
  maxFlow*=Math.max(.05,250/required);
 }

 const velocityA=maxFlow*1000000/60/Math.max(A,1);
 const velocityB=maxFlow*1000000/60/Math.max(B,1);

 let velocity=Math.min(velocityA,velocityB,c.params.maxSpeed||300);

 /*
  Load direction and available supply pressure.
 */
 const pumpPressure=getSystemPressureRaw();

 if(pumpPressure<required){
  velocity*=Math.max(0,pumpPressure/Math.max(required,1));
 }

 if(direction==="retract")velocity=-velocity;

 const pos=c.state.position??c.params.position??100;

 let next=pos+velocity*dt;

 if(next<0){next=0;velocity=0}
 if(next>(c.params.stroke||500)){next=c.params.stroke||500;velocity=0}

 c.state.position=next;
 c.params.position=next;
 c.state.speed=velocity;

 const loadForce=(c.params.load||0);
 const hydraulicForce=pa*A-pb*B;

 c.state.force=hydraulicForce-(c.params.friction||0)-loadForce;

 /*
  Estimate chamber pressure from required load.
 */
 if(direction==="extend"){
  c.state.pressureA=Math.max(pa,required);
  c.state.pressureB=Math.max(0,returnPressure);
 }else{
  c.state.pressureB=Math.max(pb,required);
  c.state.pressureA=Math.max(0,returnPressure);
 }

 c.state.flowA=Math.abs(velocity*A/1000000*60);
 c.state.flowB=Math.abs(velocity*B/1000000*60);
}

function updateMotor(c,pressures,dt){
 const pa=pressureAt(c.id,"A",pressures);
 const pb=pressureAt(c.id,"B",pressures);

 const dp=Math.max(0,pa-pb);
 const displacement=c.params.displacement||80;

 const torque=(dp*100000*displacement/(2*Math.PI*1000))*.9;
 let rpm=(dp*displacement/100)*.7;

 rpm=Math.min(rpm,c.params.speedLimit||2500);

 c.state.pressureA=pa;
 c.state.pressureB=pb;
 c.state.torque=torque;
 c.state.rpm=rpm;
}

function calculateSystem(){
 const pressures=networkPressures();

 components.forEach(c=>{
  if(c.type==="cylinder")updateCylinder(c,pressures,.05);
  if(c.type==="motor")updateMotor(c,pressures,.05);
 });

 return pressures;
}

/* =========================================================
   FLOW ENGINE
   ========================================================= */

function getWireFlow(w){
 const a=getC(w.a.cid);
 const b=getC(w.b.cid);
 if(!a||!b)return 0;

 const pa=getPortPressure(a,w.a.port);
 const pb=getPortPressure(b,w.b.port);

 const dp=pa-pb;

 if(Math.abs(dp)<.1)return 0;

 let q=Math.sqrt(Math.abs(dp))*3;

 const pump=a.type==="pump"||a.type==="variablePump";
 if(pump)q=Math.min(q,pumpAvailableFlow(a));

 return dp>0?q:-q;
}

function getPortPressure(c,p){
 if(c.type==="tank")return 0;
 if(c.type==="cylinder"){
  if(p==="A")return c.state.pressureA||0;
  if(p==="B")return c.state.pressureB||0;
 }
 if(c.type==="motor"){
  return c.state?.["pressure"+p]||0;
 }

 const pressures=networkPressures();
 return pressureAt(c.id,p,pressures);
}

function getSystemPressureRaw(){
 let max=0;
 components.forEach(c=>{
  if(c.type==="pump"||c.type==="variablePump"){
   max=Math.max(max,pressureFromLoad(
    components.find(x=>x.type==="cylinder")||{params:{load:0,bore:100}}
   ));
  }
 });
 return Math.min(max,250);
}

function getSystemFlowRaw(){
 let q=0;
 components.forEach(c=>{
  if(c.type==="pump"||c.type==="variablePump")
   q+=pumpAvailableFlow(c);
 });
 return q;
}

function getSystemPressure(){
 return getSystemPressureRaw();
}

function getSystemFlow(){
 let q=getSystemFlowRaw();

 const pressure=getSystemPressureRaw();

 const relief=components.find(c=>c.type==="relief");
 if(relief&&pressure>=relief.params.setting){
  q*=.15;
 }

 if(components.some(c=>c.fault==="blockedFilter"))
  q*=.35;

 return q;
}

/* =========================================================
   THERMAL MODEL
   ========================================================= */

function updateTemperature(dt){
 components.forEach(c=>{
  if(c.type==="pump"||c.type==="variablePump"){
   const q=pumpAvailableFlow(c);
   const p=getSystemPressureRaw();
   const hydraulicPower=p*q/600;
   const heat=hydraulicPower*(1-(c.params.efficiency||.9));

   c.state.temperature=(c.state.temperature||45)+heat*dt*.015;
   c.state.temperature-=dt*.02;
   c.state.temperature=Math.max(20,c.state.temperature);
  }
 });
}

/* =========================================================
   DIAGNOSTICS
   ========================================================= */

function diagnostics(){
 const results=[];

 const tanks=components.filter(c=>c.type==="tank");
 const pumps=components.filter(c=>c.type==="pump"||c.type==="variablePump");
 const reliefs=components.filter(c=>c.type==="relief");
 const cylinders=components.filter(c=>c.type==="cylinder");

 if(!tanks.length)
  results.push(["bad","No reservoir/tank is present."]);

 if(!pumps.length)
  results.push(["bad","No hydraulic pump is present."]);

 pumps.forEach(p=>{
  if(!hasConnection(p.id,"IN"))
   results.push(["bad",`${p.name}: suction port is not connected.`]);

  else if(!hasTankPath(p.id,"IN"))
   results.push(["bad",`${p.name}: no hydraulic path to reservoir.`]);

  if(!hasConnection(p.id,"OUT"))
   results.push(["bad",`${p.name}: outlet is not connected.`]);

  if(hasConnection(p.id,"OUT")&&!reliefs.length)
   results.push(["warn",`${p.name}: no relief valve detected.`]);

  if(p.fault==="pumpWear")
   results.push(["warn",`${p.name}: pump wear fault active.`]);
 });

 cylinders.forEach(c=>{
  if(!hasConnection(c.id,"A"))
   results.push(["bad",`${c.name}: A chamber is not connected.`]);

  if(!hasConnection(c.id,"B"))
   results.push(["bad",`${c.name}: B chamber is not connected.`]);

  if(c.fault==="cylinderLeakage")
   results.push(["warn",`${c.name}: internal leakage fault active.`]);
 });

 components.filter(c=>c.type==="filter").forEach(f=>{
  if(f.fault==="blockedFilter")
   results.push(["bad",`${f.name}: filter blockage fault active.`]);
 });

 const pressure=getSystemPressureRaw();

 if(pressure>230)
  results.push(["warn",`System pressure is high: ${pressure.toFixed(1)} bar.`]);

 if(pressure>=250)
  results.push(["bad","System pressure has reached the model limit."]);

 pumps.forEach(p=>{
  if(hasConnection(p.id,"IN")&&!hasTankPath(p.id,"IN"))
   results.push(["bad",`${p.name}: possible cavitation — suction path does not reach tank.`]);
 });

 components.filter(c=>c.type==="valve43").forEach(v=>{
  if(v.params.position==="center"&&v.params.centre==="closed"){
   cylinders.forEach(c=>{
    if(connectedPorts(v.id,"A").some(x=>x.cid===c.id)||
       connectedPorts(v.id,"B").some(x=>x.cid===c.id))
      results.push(["warn",`${v.name}: closed centre will hydraulically hold the actuator.`]);
   });
  }
 });

 components.filter(c=>c.type==="relief").forEach(r=>{
  if(r.state?.open)
   results.push(["warn",`${r.name}: relief valve is currently open.`]);
 });

 if(!results.length)
  results.push(["ok","No major hydraulic faults detected."]);

 return results;
}

function runDiagnostics(){
 const results=diagnostics();

 let html=`<div class="section"><h3>Diagnostics</h3>`;
 results.forEach(r=>{
  html+=`<div class="diag ${r[0]}">${r[1]}</div>`;
 });
 html+=`</div>`;

 document.getElementById("rightContent").innerHTML=html;
 showToast("Diagnostics updated");
}

   </div>

   <option value="valveStuck" ${c.fault==="valveStuck"?"selected":""}>Valve Stuck</option>
  </select>
 </div>
 <div class="section">
  <button class="danger" style="width:100%" onclick="deleteSelected()">Delete Component</button>
 </div>
 `;

 box.innerHTML=html;
}

function propertyEditor(c){
 let h="";

 const field=(label,key,unit="",step="any")=>`
 <div>
  <label>${label} ${unit}</label>
  <input type="number" step="${step}" value="${c.params[key]??""}"
   onchange="setParam('${c.id}','${key}',this.value)">
 </div>`;

 if(c.type==="pump"){
  h+=`<div class="row">${field("Displacement","displacement","cc/rev")}${field("Speed","rpm","rpm")}</div>`;
  h+=`<div class="row">${field("Efficiency","efficiency","","0.01")}</div>`;
 }

 if(c.type==="variablePump"){
  h+=`<div class="row">${field("Displacement","displacement","cc/rev")}${field("Speed","rpm","rpm")}</div>`;
  h+=`<div class="row">${field("Swash","swash","%","1")}${field("Compensator","compensator","bar")}</div>`;
 }

 if(c.type==="accumulator")
  h+=`<div class="row">${field("Volume","volume","L")}${field("Precharge","precharge","bar")}</div>`;

 if(c.type==="valve43"){
  h+=`
  <div class="row one">
   <div><label>Position</label>
   <select onchange="setParam('${c.id}','position',this.value)">
    ${["extend","retract","center","float"].map(x=>`<option ${c.params.position===x?"selected":""}>${x}</option>`).join("")}
   </select></div>
  </div>
  <div class="row one">
   <div><label>Centre condition</label>
   <select onchange="setParam('${c.id}','centre',this.value)">
    ${["closed","open","float"].map(x=>`<option ${c.params.centre===x?"selected":""}>${x}</option>`).join("")}
   </select></div>
  </div>`;
 }

 if(c.type==="valve42"){
  h+=`
  <div class="row one"><div><label>Position</label>
  <select onchange="setParam('${c.id}','position',this.value)">
   <option ${c.params.position==="extend"?"selected":""}>extend</option>
   <option ${c.params.position==="retract"?"selected":""}>retract</option>
  </select></div></div>`;
 }

 if(c.type==="proportional")
  h+=field("Command","command","%","1");

 if(["relief","reducing","sequence"].includes(c.type))
  h+=field("Pressure setting","setting","bar","1");

 if(c.type==="counterbalance")
  h+=`<div class="row">${field("Setting","setting","bar","1")}${field("Pilot ratio","pilotRatio",":1","0.1")}</div>`;

 if(c.type==="check")
  h+=field("Cracking","cracking","bar","0.1");

 if(c.type==="flowControl"||c.type==="throttleCheck")
  h+=`
  <div class="row">${field("Opening","opening","%","1")}${field("Max flow","maxFlow","L/min","1")}</div>
  <div class="row one"><div><label>Control mode</label>
   <select onchange="setParam('${c.id}','mode',this.value)">
    <option ${c.params.mode==="meter-in"?"selected":""}>meter-in</option>
    <option ${c.params.mode==="meter-out"?"selected":""}>meter-out</option>
   </select>
  </div></div>`;

 if(c.type==="filter")
  h+=`<div class="row">${field("Rating","rating","L/min")}${field("Restriction","restriction","","0.1")}</div>`;

 if(c.type==="cylinder")
  h+=`
  <div class="row">${field("Bore","bore","mm","1")}${field("Rod","rod","mm","1")}</div>
  <div class="row">${field("Stroke","stroke","mm","1")}${field("Load","load","N","1")}</div>
  <div class="row">${field("Friction","friction","N","1")}${field("Max speed","maxSpeed","mm/s","1")}</div>`;

 if(c.type==="motor")
  h+=`<div class="row">${field("Displacement","displacement","cc/rev")}${field("Load torque","loadTorque","Nm")}</div>`;

 return h;
}

function liveComponentData(c){
 if(c.type==="cylinder"){
  return `
   <div class="metric-grid">
    <div class="metric"><small>Position</small><strong>${(c.state.position||0).toFixed(1)} mm</strong></div>
    <div class="metric"><small>Speed</small><strong>${(c.state.speed||0).toFixed(1)} mm/s</strong></div>
    <div class="metric"><small>A pressure</small><strong>${(c.state.pressureA||0).toFixed(1)} bar</strong></div>
    <div class="metric"><small>B pressure</small><strong>${(c.state.pressureB||0).toFixed(1)} bar</strong></div>
    <div class="metric"><small>A flow</small><strong>${(c.state.flowA||0).toFixed(1)} L/min</strong></div>
    <div class="metric"><small>B flow</small><strong>${(c.state.flowB||0).toFixed(1)} L/min</strong></div>
   </div>`;
 }

 if(c.type==="pump"||c.type==="variablePump"){
  return `
   <div class="metric-grid">
    <div class="metric"><small>Flow</small><strong>${pumpAvailableFlow(c).toFixed(1)} L/min</strong></div>
    <div class="metric"><small>Pressure</small><strong>${getSystemPressure().toFixed(1)} bar</strong></div>
    <div class="metric"><small>Power</small><strong>${(getSystemPressure()*pumpAvailableFlow(c)/600).toFixed(2)} kW</strong></div>
    <div class="metric"><small>Temperature</small><strong>${(c.state.temperature||45).toFixed(1)} °C</strong></div>
   </div>`;
 }

 if(c.type==="relief"){
  return `<span class="badge ${c.state.open?"warn":"ok"}">${c.state.open?"OPEN":"CLOSED"}</span>`;
 }

 if(c.type==="motor"){
  return `
   <div class="metric-grid">
    <div class="metric"><small>RPM</small><strong>${(c.state.rpm||0).toFixed(0)}</strong></div>
    <div class="metric"><small>Torque</small><strong>${(c.state.torque||0).toFixed(1)} Nm</strong></div>
   </div>`;
 }

 if(c.type==="gauge"){
  return `<div class="value">${getPortPressure(c,"P").toFixed(1)} bar</div>`;
 }

 if(c.type==="flowmeter"){
  return `<div class="value">${getSystemFlow().toFixed(1)} L/min</div>`;
 }

 return `<div class="value">Pressure: ${getPortPressure(c,c.ports[0]).toFixed(1)} bar</div>`;
}

function setName(id,v){
 const c=getC(id);
 if(c){c.name=v;render()}
}

function setParam(id,key,v){
 const c=getC(id);
 if(!c)return;
 pushHistory();
 c.params[key]=isNaN(v)?v:Number(v);
 render();
}

function setFault(id,v){
 const c=getC(id);
 if(!c)return;
 pushHistory();
 c.fault=v||null;
 render();
}

function escapeHtml(s){
 return String(s).replace(/[&<>"']/g,m=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#039;"
 }[m]));
}

/* =========================================================
   SIMULATION LOOP
   ========================================================= */

let lastFrame=performance.now();

function simulationLoop(now){
 const dt=Math.min(.1,(now-lastFrame)/1000);
 lastFrame=now;

 if(running){
  simTime+=dt;

  const pressures=calculateSystem();

  updateTemperature(dt);

  updateAnimation();

  updateMetrics();
  updateInspector();
 }

 requestAnimationFrame(simulationLoop);
}

function toggleSimulation(){
 running=!running;
 updateRunButton();

 if(running)showToast("Simulation running");
 else showToast("Simulation paused");
}

function updateRunButton(){
 const b=document.getElementById("runBtn");
 b.textContent=running?"❚❚ Pause":"▶ Run";

 const badge=document.getElementById("simBadge");
 badge.textContent=running?"● RUNNING":"● STOPPED";
 badge.style.color=running?"#43d17a":"#8997ad";
}

function resetSimulation(){
 running=false;
 simTime=0;

 components.forEach(c=>{
  c.state={};

  if(c.type==="cylinder"){
   c.state.position=c.params.position||100;
   c.state.speed=0;
   c.state.pressureA=0;
   c.state.pressureB=0;
  }
 });

 updateRunButton();
 render();
 showToast("Simulation reset");
}

function updateAnimation(){
 animationLayer.innerHTML="";

 wires.forEach(w=>{
  const flow=getWireFlow(w);
  if(Math.abs(flow)<.2)return;

  const a=portOffset(getC(w.a.cid),w.a.port);
  const b=portOffset(getC(w.b.cid),w.b.port);

  const count=Math.max(1,Math.min(5,Math.round(Math.abs(flow)/25)));

  for(let i=0;i<count;i++){
   const phase=((simTime*(flow>0?1:-1)*.45+i/count)%1+1)%1;

   const x=a.x+(b.x-a.x)*phase;
   const y=a.y+(b.y-a.y)*phase;

   const dot=document.createElementNS(NS,"circle");
   dot.setAttribute("cx",x);
   dot.setAttribute("cy",y);
   dot.setAttribute("r",3);
   dot.classList.add("flow-dot");
   animationLayer.appendChild(dot);
  }
 });
}

/* =========================================================
   METRICS
   ========================================================= */

function updateMetrics(){
 const p=getSystemPressure();
 const q=getSystemFlow();
 const power=p*q/600;

 document.getElementById("statusPressure").textContent=`Pressure: ${p.toFixed(1)} bar`;
 document.getElementById("statusFlow").textContent=`Flow: ${q.toFixed(1)} L/min`;
 document.getElementById("statusPower").textContent=`Power: ${power.toFixed(2)} kW`;

 let msg="System ready";
 let cls="good";

 if(p>230){msg="High system pressure";cls="warn"}
 if(p>=250){msg="Pressure limit reached";cls="bad"}

 const bad=diagnostics().some(x=>x[0]==="bad");
 if(bad){msg="Hydraulic fault detected";cls="bad"}

 const el=document.getElementById("statusMessage");
 el.textContent=msg;
 el.className=cls;
}

   LIBRARY
   ========================================================= */

function renderLibrary(){
 const q=(document.getElementById("componentSearch").value||"").toLowerCase();

 const categories={};
 library.forEach(item=>{
  if(!item[1].toLowerCase().includes(q))return;
  if(!categories[item[3]])categories[item[3]]=[];
  categories[item[3]].push(item);
 });

 let html="";

 Object.entries(categories).forEach(([cat,items])=>{
  html+=`<div class="lib-section">${cat}</div>`;

  items.forEach(item=>{
   html+=`
   <div class="lib-item" onclick="addComponent('${item[0]}',300,250)">
    <div class="lib-icon">${iconFor(item[0])}</div>
    <div>${item[1]}</div>
   </div>`;
  });
 });

 document.getElementById("library").innerHTML=html;
}

function iconFor(type){
 const icons={
  tank:"▱",
  pump:"◉",
  variablePump:"◉",
  accumulator:"○",
  valve43:"▣",
  valve42:"▣",
  proportional:"▤",
  relief:"◇",
  reducing:"◇",
  sequence:"◇",
  counterbalance:"◇",
  check:"▶",
  flowControl:"◁",
  throttleCheck:"◁",
  filter:"⌁",
  cylinder:"▭",
  motor:"◎",
  gauge:"◉",
  flowmeter:"Q",
  temperature:"°"
 };
 return icons[type]||"•";
}

/* =========================================================
   TOAST
   ========================================================= */

let toastTimer;

function showToast(text){
 const t=document.getElementById("toast");
 t.textContent=text;
 t.classList.add("show");
 clearTimeout(toastTimer);
 toastTimer=setTimeout(()=>t.classList.remove("show"),1800);
}

   INITIALISE

renderLibrary();
drawGrid();
loadExample();
requestAnimationFrame(simulationLoop);
updateRunButton();
