l<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hydraulic Studio">
<title>Hydraulic Studio</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:#070b14;color:#e8eefc}
button,input,select{font:inherit}
button{cursor:pointer}
.app{height:100%;display:flex;flex-direction:column}

header{
 height:58px;background:#101727;border-bottom:1px solid #27324a;
 display:flex;align-items:center;gap:10px;padding:8px 12px;
 z-index:20
}
.logo{font-weight:800;font-size:18px;white-space:nowrap}
.logo span{color:#54b8ff}
.header-actions{display:flex;gap:6px;margin-left:auto}
.btn{
 border:1px solid #34425d;background:#172136;color:#dce7fb;
 border-radius:8px;padding:8px 11px;min-height:38px
}
.btn:hover{background:#202d46}
.btn.active{background:#1769a8;border-color:#54b8ff}
.btn.green{background:#155d45;border-color:#31c48d}
.btn.red{background:#6d2530;border-color:#ff6878}
.btn.small{padding:6px 8px;min-height:32px;font-size:12px}
select,input{
 background:#0c1424;color:#e8eefc;border:1px solid #34425d;
 border-radius:7px;padding:7px
}
.layout{flex:1;display:flex;min-height:0}
.sidebar{
 width:285px;background:#0e1524;border-right:1px solid #27324a;
 display:flex;flex-direction:column;z-index:10
}
.sidebar.right{
 border-right:0;border-left:1px solid #27324a;width:315px
}
.panel-title{
 padding:11px 13px;border-bottom:1px solid #27324a;
 font-size:13px;font-weight:bold;text-transform:uppercase;letter-spacing:.5px;color:#93a5c8
}
.library-tabs{display:flex;padding:8px;gap:5px}
.library-tabs button{flex:1}
.library{overflow:auto;padding:8px;display:grid;grid-template-columns:1fr 1fr;gap:7px}
.lib-btn{
 min-height:68px;background:#141e32;border:1px solid #2d3a55;
 border-radius:8px;color:#dce7fb;padding:6px;font-size:11px
}
.lib-btn:hover{border-color:#54b8ff;background:#1a2942}
.lib-symbol{height:35px;display:block}
.workspace{flex:1;position:relative;min-width:0;min-height:0;background:#080d18}
#svg{width:100%;height:100%;display:block;touch-action:none;user-select:none}
.toolbar{
 position:absolute;left:10px;top:10px;display:flex;gap:5px;flex-wrap:wrap;
 max-width:calc(100% - 20px);z-index:5
}
.tool{
 background:#101a2c;border:1px solid #34425d;color:#dce7fb;
 border-radius:7px;padding:7px 9px;font-size:12px
}
.tool.active{background:#1769a8;border-color:#67c5ff}
.status{
 position:absolute;left:10px;bottom:10px;background:#0e1728dd;
 border:1px solid #2c3953;border-radius:8px;padding:7px 10px;
 font-size:11px;color:#9fb0d0;pointer-events:none
}
.mode{
 position:absolute;right:10px;top:10px;z-index:5;
 display:flex;background:#101a2c;border:1px solid #34425d;border-radius:8px;overflow:hidden
}
.mode button{border:0;border-right:1px solid #34425d;background:transparent;color:#9fb0d0;padding:8px 11px}
.mode button:last-child{border:0}
.mode button.active{background:#1769a8;color:white}

.inspector{overflow:auto;flex:1;padding:10px}
.empty{color:#7485a6;font-size:13px;line-height:1.5}
.field{margin-bottom:10px}
.field label{display:block;color:#91a3c5;font-size:11px;margin-bottom:4px}
.field input,.field select{width:100%}
.row{display:flex;gap:6px}
.row>*{flex:1}
.section{
 margin:12px 0 8px;padding-bottom:5px;border-bottom:1px solid #2a3852;
 color:#72c7ff;font-size:11px;text-transform:uppercase;font-weight:bold
}
.stats{
 display:grid;grid-template-columns:1fr 1fr;gap:6px
}
.stat{
 background:#111b2e;border:1px solid #2a3852;border-radius:7px;padding:7px
}
.stat small{display:block;color:#788bab;font-size:10px}
.stat b{display:block;margin-top:3px;font-size:13px}
.bottom-panel{
 height:150px;background:#0d1422;border-top:1px solid #27324a;
 display:flex;flex-direction:column
}
.bottom-tabs{display:flex;border-bottom:1px solid #27324a}
.bottom-tabs button{
 border:0;background:transparent;color:#8fa0c1;padding:8px 13px
}
.bottom-tabs button.active{color:white;background:#162239}
.log{overflow:auto;padding:8px;font:11px monospace;color:#9eb1d2;flex:1}
.mobile-toggle{display:none}

.modal{
 position:fixed;inset:0;background:#0009;display:none;align-items:center;
 justify-content:center;z-index:100;padding:15px
}
.modal.show{display:flex}
.modal-box{
 width:min(680px,100%);max-height:90vh;overflow:auto;background:#101827;
 border:1px solid #34425d;border-radius:12px;box-shadow:0 20px 60px #000b
}
.modal-head{
 display:flex;justify-content:space-between;align-items:center;
 padding:12px 15px;border-bottom:1px solid #2b3850;font-weight:bold
}
.modal-body{padding:15px}
.modal-foot{padding:12px 15px;border-top:1px solid #2b3850;text-align:right}

.sim-btns{display:flex;gap:6px;flex-wrap:wrap}
.warning{
 background:#4d3810;border:1px solid #a98327;color:#ffd978;
 border-radius:7px;padding:8px;font-size:11px;margin-bottom:8px
}
.fault{
 background:#4b1720;border:1px solid #a93b4b;color:#ff9aa5;
 border-radius:7px;padding:8px;font-size:11px;margin-bottom:8px
}

@media(max-width:900px){
 header{height:52px}
 .logo{font-size:15px}
 .header-actions .optional{display:none}
 .sidebar{display:none}
 .sidebar.right{position:absolute;right:0;top:52px;bottom:0;width:min(320px,92vw);display:none;z-index:30}
 .sidebar.right.open{display:flex}
 .mobile-toggle{display:block}
 .bottom-panel{height:125px}
 .toolbar{top:8px;left:8px}
 .tool{padding:6px 7px}
}

@media(max-width:600px){
 .header-actions{gap:3px}
 .header-actions .btn{padding:6px 7px;font-size:11px}
 .mode{top:52px;right:8px}
 .bottom-panel{height:115px}
}
</style>
</head>

<body>
<div class="app">

<header>
 <div class="logo">Hydraulic <span>Studio</span></div>

 <div class="header-actions">
  <button class="btn" id="newBtn">New</button>
  <button class="btn" id="exampleBtn">Example</button>
  <button class="btn" id="undoBtn">↶</button>
  <button class="btn" id="redoBtn">↷</button>
  <button class="btn optional" id="saveBtn">Save</button>
  <button class="btn optional" id="loadBtn">Load</button>
  <button class="btn" id="settingsBtn">⚙</button>
  <button class="btn mobile-toggle" id="inspectorBtn">☰</button>
 </div>
</header>

<div class="layout">

<aside class="sidebar">
 <div class="panel-title">Component Library</div>

 <div class="library-tabs">
  <button class="btn small active" data-lib="hydraulic">Hydraulic</button>
  <button class="btn small" data-lib="pneumatic">Pneumatic</button>
 </div>

 <div class="library" id="library"></div>
</aside>

<main class="workspace">

 <svg id="svg" xmlns="http://www.w3.org/2000/svg">
  <defs>
   <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M20 0H0V20" fill="none" stroke="#18243a" stroke-width="1"/>
   </pattern>

   <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4"
           orient="auto" markerUnits="strokeWidth">
    <path d="M0 0L8 4L0 8Z" fill="#45b9ff"/>
   </marker>

   <filter id="glow">
    <feGaussianBlur stdDeviation="2.5" result="blur"/>
    <feMerge>
     <feMergeNode in="blur"/>
     <feMergeNode in="SourceGraphic"/>
    </feMerge>
   </filter>
  </defs>

  <rect id="background" width="100%" height="100%" fill="url(#grid)"/>
  <g id="world">
   <g id="connections"></g>
   <g id="components"></g>
   <g id="temp"></g>
  </g>
 </svg>

 <div class="toolbar">
  <button class="tool active" data-tool="select">↖ Select</button>
  <button class="tool" data-tool="hose">〰 Hose</button>
  <button class="tool" data-tool="pipe">━ Pipe</button>
  <button class="tool" data-tool="junction">＋ Junction</button>
  <button class="tool" data-tool="label">T Label</button>
  <button class="tool" data-tool="measure">⌁ Measure</button>
  <button class="tool" data-tool="fit">Fit</button>
 </div>

 <div class="mode">
  <button id="functionalBtn" class="active">Functional</button>
  <button id="technicalBtn">Technical</button>
 </div>

 <div class="status" id="status">
  Select a component or choose Hose/Pipe to connect ports.
 </div>
</main>

<aside class="sidebar right" id="rightPanel">
 <div class="panel-title">Engineering Inspector</div>
 <div class="inspector" id="inspector"></div>
</aside>

</div>

<div class="bottom-panel">
 <div class="bottom-tabs">
  <button class="active" data-bottom="analysis">Analysis</button>
  <button data-bottom="faults">Faults</button>
  <button data-bottom="training">Training</button>
  <button data-bottom="log">Log</button>
 </div>
 <div class="log" id="bottomContent"></div>
</div>

</div>

<!-- SETTINGS -->
<div class="modal" id="settingsModal">
 <div class="modal-box">
  <div class="modal-head">
   <span>Hydraulic Studio Settings</span>
   <button class="btn small" data-close="settingsModal">✕</button>
  </div>

  <div class="modal-body">

   <div class="section">Editor</div>

   <div class="row">
    <div class="field">
     <label>Grid size</label>
     <select id="gridSize">
      <option value="10">10 px</option>
      <option value="20" selected>20 px</option>
      <option value="25">25 px</option>
      <option value="50">50 px</option>
     </select>
    </div>

    <div class="field">
     <label>Snap</label>
     <select id="snapSetting">
      <option value="on">On</option>
      <option value="off">Off</option>
     </select>
    </div>
   </div>

   <div class="section">Simulation</div>

   <div class="row">
    <div class="field">
     <label>Simulation speed</label>
     <select id="simSpeed">
      <option value=".25">0.25×</option>
      <option value=".5">0.5×</option>
      <option value="1" selected>1×</option>
      <option value="2">2×</option>
      <option value="4">4×</option>
     </select>
    </div>

    <div class="field">
     <label>Fluid</label>
     <select id="fluid">
      <option>Hydraulic Oil</option>
      <option>Water Glycol</option>
      <option>ATF</option>
      <option>Compressed Air</option>
     </select>
    </div>
   </div>

   <div class="section">View</div>

   <div class="field">
    <label>Schematic mode</label>
    <select id="schematicMode">
     <option value="functional">Functional</option>
     <option value="technical">Technical</option>
    </select>
   </div>

  </div>

  <div class="modal-foot">
   <button class="btn" data-close="settingsModal">Close</button>
  </div>
 </div>
</div>

<!-- DIRECTIONAL VALVE -->
<div class="modal" id="valveModal">
 <div class="modal-box">
  <div class="modal-head">
   <span>Directional Valve Builder</span>
   <button class="btn small" data-close="valveModal">✕</button>
  </div>

  <div class="modal-body">

   <div class="section">Valve</div>

   <div class="row">
    <div class="field">
     <label>Valve type</label>
     <select id="valveType">
      <option>2/2</option>
      <option>3/2</option>
      <option>4/2</option>
      <option selected>4/3</option>
      <option>5/2</option>
      <option>5/3</option>
      <option>6/2</option>
     </select>
    </div>

    <div class="field">
     <label>Centre</label>
     <select id="valveCentre">
      <option value="closed">Closed centre</option>
      <option value="open">Open centre</option>
      <option value="tandem">Tandem centre</option>
      <option value="float">Float centre</option>
      <option value="pt">P → T</option>
      <option value="abT">A/B → T</option>
     </select>
    </div>
   </div>

   <div class="row">
    <div class="field">
     <label>Left actuation</label>
     <select id="actLeft">
      <option>Solenoid</option>
      <option>Manual lever</option>
      <option>Push button</option>
      <option>Roller</option>
      <option>Hydraulic pilot</option>
      <option>Pneumatic pilot</option>
      <option>Spring</option>
      <option>None</option>
     </select>
    </div>

    <div class="field">
     <label>Right actuation</label>
     <select id="actRight">
      <option>Spring</option>
      <option>Solenoid</option>
      <option>Manual lever</option>
      <option>Push button</option>
      <option>Roller</option>
      <option>Hydraulic pilot</option>
      <option>Pneumatic pilot</option>
      <option>None</option>
     </select>
    </div>
   </div>

   <div class="section">Simulation position</div>

   <div class="sim-btns">
    <button class="btn" id="valveLeft">◀ Left</button>
    <button class="btn" id="valveCentreBtn">● Centre</button>
    <button class="btn" id="valveRight">Right ▶</button>
   </div>

  </div>

  <div class="modal-foot">
   <button class="btn green" id="applyValve">Apply Valve</button>
  </div>
 </div>
</div>

<script>
"use strict";

/* =========================================================
   HYDRAULIC STUDIO
   Single-file engineering schematic editor/simulator
   ========================================================= */

const NS="http://www.w3.org/2000/svg";

const svg=document.getElementById("svg");
const world=document.getElementById("world");
const componentsLayer=document.getElementById("components");
const connectionsLayer=document.getElementById("connections");
const tempLayer=document.getElementById("temp");
const libraryEl=document.getElementById("library");
const inspector=document.getElementById("inspector");
const statusEl=document.getElementById("status");
const bottomContent=document.getElementById("bottomContent");

const state={
 mode:"hydraulic",
 view:"functional",
 tool:"select",
 selected:null,
 components:[],
 connections:[],
 labels:[],
 junctions:[],
 running:false,
 paused:false,
 simTime:0,
 simSpeed:1,
 grid:20,
 snap:true,
 history:[],
 redo:[],
 valveEditing:null,
 connectionDraft:null,
 measureStart:null,
 trainingMode:false,
 faults:{},
 warnings:[],
 analysis:{pressure:0,flow:0},
 lastTime:performance.now()
};

const camera={x:0,y:0,zoom:1};

const pointers=new Map();
let gesture=null;
let drag=null;

let uid=1;
const id=()=> "c"+(Date.now().toString(36)+Math.random().toString(36).slice(2,7));

/* =========================================================
   COMPONENT LIBRARY
   ========================================================= */

const LIB={
 hydraulic:[
  ["reservoir","Reservoir","Tank"],
  ["pump-fixed","Fixed Pump","Pump"],
  ["pump-variable","Variable Pump","Pump"],
  ["motor","Hydraulic Motor","Motor"],
  ["cylinder-double","Double Acting Cylinder","Actuator"],
  ["cylinder-single","Single Acting Cylinder","Actuator"],
  ["cylinder-telescopic","Telescopic Cylinder","Actuator"],
  ["valve-4-3","4/3 Directional Valve","Valve"],
  ["valve-4-2","4/2 Directional Valve","Valve"],
  ["valve-3-2","3/2 Directional Valve","Valve"],
  ["valve-2-2","2/2 Shutoff Valve","Valve"],
  ["valve-prop","Proportional Valve","Valve"],
  ["relief","Pressure Relief Valve","Pressure"],
  ["reducing","Pressure Reducing Valve","Pressure"],
  ["sequence","Sequence Valve","Pressure"],
  ["counterbalance","Counterbalance Valve","Pressure"],
  ["check","Check Valve","Flow"],
  ["pilot-check","Pilot Operated Check","Flow"],
  ["flow-control","Flow Control","Flow"],
  ["one-way-flow","One Way Flow Control","Flow"],
  ["needle","Needle Valve","Flow"],
  ["orifice","Orifice","Flow"],
  ["shuttle","Shuttle Valve","Logic"],
  ["two-pressure","Two Pressure Valve","Logic"],
  ["quick-exhaust","Quick Exhaust","Flow"],
  ["filter","Filter","Conditioning"],
  ["cooler","Oil Cooler","Conditioning"],
  ["heater","Oil Heater","Conditioning"],
  ["accumulator","Accumulator","Storage"],
  ["pressure-gauge","Pressure Gauge","Instrumentation"],
  ["flow-meter","Flow Meter","Instrumentation"],
  ["temperature","Temperature Sensor","Instrumentation"],
  ["pressure-sensor","Pressure Sensor","Instrumentation"],
  ["flow-sensor","Flow Sensor","Instrumentation"],
  ["pressure-switch","Pressure Switch","Instrumentation"],
  ["manifold","Manifold","Accessory"],
  ["restrictor","Restrictor","Flow"]
 ],
 pneumatic:[
  ["compressor","Compressor","Air Supply"],
  ["receiver","Air Receiver","Air Supply"],
  ["frl","FRL Unit","Conditioning"],
  ["air-filter","Air Filter","Conditioning"],
  ["air-regulator","Air Regulator","Conditioning"],
  ["lubricator","Lubricator","Conditioning"],
  ["air-motor","Air Motor","Actuator"],
  ["cylinder-double","Double Acting Cylinder","Actuator"],
  ["cylinder-single","Single Acting Cylinder","Actuator"],
  ["valve-5-3","5/3 Directional Valve","Valve"],
  ["valve-5-2","5/2 Directional Valve","Valve"],
  ["valve-4-2","4/2 Directional Valve","Valve"],
  ["valve-3-2","3/2 Directional Valve","Valve"],
  ["valve-2-2","2/2 Valve","Valve"],
  ["check","Check Valve","Flow"],
  ["quick-exhaust","Quick Exhaust","Flow"],
  ["flow-control","Flow Control","Flow"],
  ["one-way-flow","One Way Flow Control","Flow"],
  ["shuttle","Shuttle Valve","Logic"],
  ["two-pressure","Two Pressure Valve","Logic"],
  ["silencer","Silencer","Accessory"],
  ["pressure-gauge","Pressure Gauge","Instrumentation"],
  ["pressure-switch","Pressure Switch","Instrumentation"],
  ["flow-sensor","Flow Sensor","Instrumentation"],
  ["vacuum-generator","Vacuum Generator","Vacuum"],
  ["vacuum-cup","Vacuum Cup","Vacuum"]
 ]
};

/* =========================================================
   DEFAULT PARAMETERS
   ========================================================= */

function defaults(type){
 const d={
  pressure:150,
  flow:40,
  rpm:1450,
  bore:50,
  rod:25,
  stroke:300,
  position:0,
  load:1000,
  diameter:12,
  length:1000,
  rating:250,
  setting:150,
  opening:0,
  restriction:0,
  temperature:45,
  volume:10,
  ratio:1,
  valveType:"4/3",
  centre:"closed",
  actLeft:"Solenoid",
  actRight:"Spring",
  valvePosition:"centre",
  proportional:50,
  leakage:0,
  efficiency:90,
  blocked:false,
  failed:false,
  pressureDrop:0,
  angle:0
 };

 if(type==="pump-fixed"){
  d.flow=40; d.pressure=150; d.rpm=1450; d.efficiency=90;
 }
 if(type==="pump-variable"){
  d.flow=60; d.pressure=180; d.rpm=1450; d.efficiency=88;
 }
 if(type==="compressor"){
  d.pressure=8; d.flow=500; d.rpm=1450;
 }
 if(type.includes("cylinder")){
  d.bore=50;d.rod=25;d.stroke=300;d.load=1000;d.position=0;
 }
 if(type==="motor"||type==="air-motor"){
  d.rpm=0;d.load=100;d.angle=0;
 }
 if(type==="relief")d.setting=150;
 if(type==="reducing")d.setting=100;
 if(type==="sequence")d.setting=100;
 if(type==="counterbalance")d.setting=120;
 if(type==="accumulator")d.pressure=100;
 if(type==="filter")d.pressureDrop=0;
 return d;
}

/* =========================================================
   PORT DEFINITIONS
   ========================================================= */

function portsFor(c){
 const t=c.type;
 if(t==="reservoir") return [
  {id:"T",x:0,y:-50,dir:"top"},
  {id:"R",x:0,y:50,dir:"bottom"}
 ];

 if(t==="pump-fixed"||t==="pump-variable") return [
  {id:"IN",x:-50,y:0,dir:"left"},
  {id:"OUT",x:50,y:0,dir:"right"}
 ];

 if(t==="compressor") return [
  {id:"IN",x:-50,y:0,dir:"left"},
  {id:"OUT",x:50,y:0,dir:"right"}
 ];

 if(t==="motor"||t==="air-motor") return [
  {id:"A",x:-50,y:0,dir:"left"},
  {id:"B",x:50,y:0,dir:"right"}
 ];

 if(t.includes("cylinder")) return [
  {id:"A",x:-70,y:-25,dir:"left"},
  {id:"B",x:-70,y:25,dir:"left"}
 ];

 if(t==="valve-4-3"||t==="valve-4-2"||t==="valve-prop") return [
  {id:"P",x:-75,y:0,dir:"left"},
  {id:"T",x:75,y:0,dir:"right"},
  {id:"A",x:0,y:-50,dir:"top"},
  {id:"B",x:0,y:50,dir:"bottom"}
 ];

 if(t==="valve-5-3"||t==="valve-5-2") return [
  {id:"P",x:-75,y:0,dir:"left"},
  {id:"T",x:75,y:0,dir:"right"},
  {id:"A",x:0,y:-50,dir:"top"},
  {id:"B",x:0,y:50,dir:"bottom"},
  {id:"EX",x:0,y:75,dir:"bottom"}
 ];

 if(t==="valve-3-2") return [
  {id:"P",x:-60,y:0,dir:"left"},
  {id:"A",x:60,y:-35,dir:"right"},
  {id:"T",x:60,y:35,dir:"right"}
 ];

 if(t==="valve-2-2") return [
  {id:"A",x:-60,y:0,dir:"left"},
  {id:"B",x:60,y:0,dir:"right"}
 ];

 if(["relief","reducing","sequence","counterbalance","check",
     "pilot-check","flow-control","one-way-flow","needle",
     "orifice","restrictor","quick-exhaust"].includes(t)){
  return [
   {id:"A",x:-55,y:0,dir:"left"},
   {id:"B",x:55,y:0,dir:"right"}
  ];
 }

 if(t==="shuttle"||t==="two-pressure") return [
  {id:"A",x:-55,y:-30,dir:"left"},
  {id:"B",x:-55,y:30,dir:"left"},
  {id:"OUT",x:55,y:0,dir:"right"}
 ];

 if(["filter","cooler","heater","frl","air-filter",
     "air-regulator","lubricator","silencer"].includes(t)){
  return [
   {id:"A",x:-55,y:0,dir:"left"},
   {id:"B",x:55,y:0,dir:"right"}
  ];
 }

 if(t==="accumulator") return [
  {id:"P",x:0,y:55,dir:"bottom"}
 ];

 if(["pressure-gauge","pressure-sensor","flow-meter",
     "flow-sensor","temperature","pressure-switch"].includes(t)){
  return [{id:"P",x:0,y:45,dir:"bottom"}];
 }

 if(t==="manifold") return [
  {id:"1",x:-70,y:-25,dir:"left"},
  {id:"2",x:-70,y:25,dir:"left"},
  {id:"3",x:70,y:-25,dir:"right"},
  {id:"4",x:70,y:25,dir:"right"}
 ];

 if(t==="receiver") return [
  {id:"IN",x:-45,y:0,dir:"left"},
  {id:"OUT",x:45,y:0,dir:"right"}
 ];

 if(t==="vacuum-generator") return [
  {id:"P",x:-55,y:0,dir:"left"},
  {id:"A",x:55,y:-30,dir:"right"},
  {id:"EX",x:55,y:30,dir:"right"}
 ];

 if(t==="vacuum-cup") return [
  {id:"V",x:0,y:-45,dir:"top"}
 ];

 return [
  {id:"A",x:-50,y:0,dir:"left"},
  {id:"B",x:50,y:0,dir:"right"}
 ];
}

/* =========================================================
   COMPONENT CREATION
   ========================================================= */

function addComponent(type,x=0,y=0){
 const c={
  id:id(),
  type,
  x:snap(x),
  y:snap(y),
  rotation:0,
  flipX:false,
  flipY:false,
  label:componentName(type),
  params:defaults(type),
  sim:{
   pressure:0,
   flow:0,
   speed:0,
   force:0,
   state:"Idle",
   active:false,
   temperature:45
  }
 };

 state.components.push(c);
 selectComponent(c.id);
 pushHistory();
 render();
 return c;
}

function componentName(type){
 const found=[...LIB.hydraulic,...LIB.pneumatic].find(x=>x[0]===type);
 return found?found[1]:type;
}

function renderLibrary(mode=state.mode){

/* =========================================================
   SVG HELPERS
   ========================================================= */

function E(tag,attrs={},children=[]){
 const e=document.createElementNS(NS,tag);
 for(const [k,v] of Object.entries(attrs)){
  if(v!==undefined)e.setAttribute(k,v);
 }
 children.forEach(x=>e.appendChild(x));
 return e;
}

function rect(x,y,w,h,attrs={}){
 return E("rect",{x,y,width:w,height:h,...attrs});
}
function line(x1,y1,x2,y2,attrs={}){
 return E("line",{x1,y1,x2,y2,...attrs});
}
function circle(cx,cy,r,attrs={}){
 return E("circle",{cx,cy,r,...attrs});
}
function text(x,y,t,attrs={}){
 const e=E("text",{x,y,...attrs});
 e.textContent=t;
 return e;
}
function path(d,attrs={}){
 return E("path",{d,...attrs});
}
function polygon(points,attrs={}){
 return E("polygon",{points,...attrs});
}

/* =========================================================
   TRANSFORMS
   ========================================================= */

function componentGroupTransform(c){
 const sx=c.flipX?-1:1;
 const sy=c.flipY?-1:1;
 return `translate(${c.x} ${c.y}) rotate(${c.rotation}) scale(${sx} ${sy})`;
}

function snap(v){
 return state.snap ? Math.round(v/state.grid)*state.grid : v;
}

function worldToScreen(x,y){
 const r=svg.getBoundingClientRect();
 return {
  x:(x-camera.x)*camera.zoom+r.width/2,
  y:(y-camera.y)*camera.zoom+r.height/2
 };
}

function screenToWorld(sx,sy){
 const r=svg.getBoundingClientRect();
 return {
  x:(sx-r.width/2)/camera.zoom+camera.x,
  y:(sy-r.height/2)/camera.zoom+camera.y
 };
}

/* =========================================================
   RENDER
   ========================================================= */

function render(){
 renderWorldTransform();
 renderConnections();
 renderComponents();
 renderInspector();
 updateStatus();
 renderBottom();
}

function renderWorldTransform(){
 world.setAttribute(
  "transform",
  `translate(${svg.clientWidth/2} ${svg.clientHeight/2}) scale(${camera.zoom}) translate(${-camera.x} ${-camera.y})`
 );
}

function getPort(c,pid){
 return portsFor(c).find(p=>p.id===pid);
}

function portWorld(c,p){
 const rad=(c.rotation||0)*Math.PI/180;
 let x=p.x*(c.flipX?-1:1);
 let y=p.y*(c.flipY?-1:1);
 return {
  x:c.x+x*Math.cos(rad)-y*Math.sin(rad),
  y:c.y+x*Math.sin(rad)+y*Math.cos(rad)
 };
}

function renderComponents(){
 componentsLayer.innerHTML="";

 state.components.forEach(c=>{
  const g=E("g",{
   class:"component",
   "data-id":c.id,
   transform:componentGroupTransform(c)
  });

  if(c.id===state.selected){
   g.appendChild(rect(-90,-65,180,130,{
    fill:"#54b8ff11",stroke:"#54b8ff","stroke-width":1.5,
    "stroke-dasharray":"5 4"
   }));
  }

  symbolSVG(c).forEach(x=>g.appendChild(x));

  portsFor(c).forEach(p=>{
   const port=c.sim?.active && c.sim?.flow ? "#45c5ff":"#d5dfef";
   const cc=circle(p.x,p.y,5,{
    class:"port",
    "data-component":c.id,
    "data-port":p.id,
    fill:"#0b1220",
    stroke:port,
    "stroke-width":2
   });
   g.appendChild(cc);

   if(state.view==="technical"){
    g.appendChild(text(p.x+7,p.y+3,p.id,{
     fill:"#7183a5","font-size":8
    }));
   }
  });

  g.appendChild(text(0,60,c.label,{
   fill:c.id===state.selected?"#67c8ff":"#9badca",
   "text-anchor":"middle",
   "font-size":10
  }));

  if(c.sim?.state && state.running){
   g.appendChild(text(0,-50,c.sim.state,{
    fill:c.sim.active?"#55d6a4":"#7183a5",
    "text-anchor":"middle",
    "font-size":8
   }));
  }

  componentsLayer.appendChild(g);
 });
}

function renderConnections(){
 connectionsLayer.innerHTML="";

 state.connections.forEach(w=>{
  const a=state.components.find(c=>c.id===w.from.component);
  const b=state.components.find(c=>c.id===w.to.component);
  if(!a||!b)return;

  const pa=getPort(a,w.from.port);
  const pb=getPort(b,w.to.port);
  if(!pa||!pb)return;

  const A=portWorld(a,pa);
  const B=portWorld(b,pb);

  let d;

  if(w.type==="soft"){
   const dx=B.x-A.x;
   const dy=B.y-A.y;
   const curve=Math.max(40,Math.min(160,Math.hypot(dx,dy)*.35));
   d=`M${A.x} ${A.y} C${A.x+dx*.3} ${A.y+dy*.3-curve} ${B.x-dx*.3} ${B.y-dy*.3+curve} ${B.x} ${B.y}`;
  }else{
   const mid=(A.x+B.x)/2;
   d=`M${A.x} ${A.y} L${mid} ${A.y} L${mid} ${B.y} L${B.x} ${B.y}`;
  }

  const active=(Math.abs(w.flow||0)>0.01);
  const stroke=active?"#35c4ff":"#7d8fae";
  const width=w.type==="soft"?4:3;

  const wire=path(d,{
   fill:"none",
   stroke,
   "stroke-width":width,
   "stroke-linecap":"round",
   "stroke-linejoin":"round",
   opacity:.95,
   class:"wire",
   "data-id":w.id
  });

  connectionsLayer.appendChild(wire);

  if(active){
   const anim=path(d,{
    fill:"none",
    stroke:"#d9f5ff",
    "stroke-width":1.5,
    "stroke-dasharray":"7 10",
    opacity:.9,
    "stroke-linecap":"round"
   });
   anim.style.animation="flowDash 0.7s linear infinite";
   connectionsLayer.appendChild(anim);
  }

  if(state.view==="technical"){
   const mx=(A.x+B.x)/2;
   const my=(A.y+B.y)/2;
   connectionsLayer.appendChild(text(mx,my-6,
    `${w.type==="soft"?"HOSE":"PIPE"} ${w.diameter}mm`,{
     fill:"#7183a5","font-size":8,"text-anchor":"middle"
    }));
  }
 });
}

const style=document.createElement("style");
style.textContent="@keyframes flowDash{to{stroke-dashoffset:-34px}}";
document.head.appendChild(style);

function bindInspector(){
 const c=state.components.find(x=>x.id===state.selected);
 if(!c)return;

 const label=document.getElementById("iLabel");
 if(label)label.onchange=()=>{c.label=label.value;pushHistory();render()};

 const x=document.getElementById("iX");
 const y=document.getElementById("iY");
 if(x)x.onchange=()=>{c.x=Number(x.value)||0;pushHistory();render()};
 if(y)y.onchange=()=>{c.y=Number(y.value)||0;pushHistory();render()};

 ["iBore","iRod","iStroke","iLoad","iPressure","iFlow","iRPM",
  "iSetting","iRestriction"].forEach(idn=>{
  const el=document.getElementById(idn);
  if(el){
   el.onchange=()=>{
    const map={
     iBore:"bore",iRod:"rod",iStroke:"stroke",iLoad:"load",
     iPressure:"pressure",iFlow:"flow",iRPM:"rpm",
     iSetting:"setting",iRestriction:"restriction"
    };
    c.params[map[idn]]=Number(el.value)||0;
    pushHistory();
    render();
   };
  }
 });
}

function connectionCount(cid,pid){
 return state.connections.filter(w=>
  (w.from.component===cid&&w.from.port===pid)||
  (w.to.component===cid&&w.to.port===pid)
 ).length;
}

/* =========================================================
   HISTORY
   ========================================================= */

function snapshot(){
 return JSON.stringify({
  components:state.components,
  connections:state.connections,
  labels:state.labels,
  junctions:state.junctions
 });
}

function restoreSnapshot(s){
 const x=JSON.parse(s);
 state.components=x.components||[];
 state.connections=x.connections||[];
 state.labels=x.labels||[];
 state.junctions=x.junctions||[];
 state.selected=null;
 render();
}

function pushHistory(){
 const s=snapshot();
 if(state.history[state.history.length-1]!==s){
  state.history.push(s);
  if(state.history.length>80)state.history.shift();
 }
 state.redo=[];
}

function undo(){
 if(state.history.length<2)return;
 const current=state.history.pop();
 state.redo.push(current);
 restoreSnapshot(state.history[state.history.length-1]);
}

function redo(){
 if(!state.redo.length)return;
 const s=state.redo.pop();
 state.history.push(s);
 restoreSnapshot(s);
}

/* =========================================================
   POINTER SYSTEM
   ========================================================= */

svg.addEventListener("pointerdown",onPointerDown);
svg.addEventListener("pointermove",onPointerMove);
svg.addEventListener("pointerup",onPointerUp);
svg.addEventListener("pointercancel",onPointerUp);
svg.addEventListener("wheel",onWheel,{passive:false});

function onPointerDown(e){
 e.preventDefault();

 pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});

 if(pointers.size===2){
  drag=null;
  const pts=[...pointers.values()];
  gesture={
   startDist:dist(pts[0],pts[1]),
   startZoom:camera.zoom,
   startX:camera.x,
   startY:camera.y,
   center:{
    x:(pts[0].x+pts[1].x)/2,
    y:(pts[0].y+pts[1].y)/2
   }
  };
  return;
 }

 const port=e.target.closest?.(".port");
 const component=e.target.closest?.(".component");

 if(port){
  const cid=port.dataset.component;
  const pid=port.dataset.port;

  if(state.tool==="hose"||state.tool==="pipe"){
   startOrFinishConnection(cid,pid);
   return;
  }
 }

 if(state.tool==="label"){
  const p=screenToWorld(e.clientX,e.clientY);
  const label=prompt("Label text:");
  if(label){
   state.labels.push({id:id(),x:p.x,y:p.y,text:label});
   pushHistory();
   renderLabels();
  }
  return;
 }

 if(state.tool==="measure"){
  if(!state.measureStart){
   state.measureStart=screenToWorld(e.clientX,e.clientY);
   statusEl.textContent="Select the second point.";
  }else{
   const p=screenToWorld(e.clientX,e.clientY);
   const dx=p.x-state.measureStart.x;
   const dy=p.y-state.measureStart.y;
   const d=Math.hypot(dx,dy);
   alert(`Distance: ${round(d)} px\nHorizontal: ${round(Math.abs(dx))}\nVertical: ${round(Math.abs(dy))}`);
   state.measureStart=null;
   setTool("select");
  }
  return;
 }

 if(component){
  const cid=component.dataset.id;
  selectComponent(cid);

  const c=state.components.find(x=>x.id===cid);

  drag={
   cid,
   startX:c.x,
   startY:c.y,
   pointerStart:screenToWorld(e.clientX,e.clientY),
   history:snapshot()
  };

  try{svg.setPointerCapture(e.pointerId)}catch{}
  return;
 }

 drag={
  pan:true,
  pointerStart:{x:e.clientX,y:e.clientY},
  camX:camera.x,
  camY:camera.y
 };

 try{svg.setPointerCapture(e.pointerId)}catch{}
}

function onPointerMove(e){
 if(!pointers.has(e.pointerId))return;
 pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});

 if(pointers.size>=2&&gesture){
  const pts=[...pointers.values()];
  const d=dist(pts[0],pts[1]);
  const scale=d/gesture.startDist;

  camera.zoom=Math.max(.2,Math.min(3,gesture.startZoom*scale));

  const center={
   x:(pts[0].x+pts[1].x)/2,
   y:(pts[0].y+pts[1].y)/2
  };

  camera.x=gesture.startX-(center.x-gesture.center.x)/camera.zoom;
  camera.y=gesture.startY-(center.y-gesture.center.y)/camera.zoom;

  renderWorldTransform();
  return;
 }

 if(!drag)return;

 if(drag.pan){
  const dx=e.clientX-drag.pointerStart.x;
  const dy=e.clientY-drag.pointerStart.y;
  camera.x=drag.camX-dx/camera.zoom;
  camera.y=drag.camY-dy/camera.zoom;
  renderWorldTransform();
  return;
 }

 const c=state.components.find(x=>x.id===drag.cid);
 if(!c)return;

 const p=screenToWorld(e.clientX,e.clientY);
 c.x=snap(drag.startX+(p.x-drag.pointerStart.x));
 c.y=snap(drag.startY+(p.y-drag.pointerStart.y));

 renderComponents();
 renderConnections();
 renderInspector();
}

function onPointerUp(e){
 pointers.delete(e.pointerId);

 if(pointers.size===0){
  gesture=null;

  if(drag&&!drag.pan){
   pushHistory();
  }

  drag=null;
 }

 try{svg.releasePointerCapture(e.pointerId)}catch{}
}

function onWheel(e){
 e.preventDefault();

 const before=screenToWorld(e.clientX,e.clientY);
 const factor=e.deltaY<0?1.1:.9;
 camera.zoom=Math.max(.2,Math.min(3,camera.zoom*factor));

 const after=screenToWorld(e.clientX,e.clientY);
 camera.x+=before.x-after.x;
 camera.y+=before.y-after.y;

 renderWorldTransform();
}

/* =========================================================
   CONNECTIONS
   ========================================================= */

function startOrFinishConnection(cid,pid){
 if(!state.connectionDraft){
  state.connectionDraft={
   component:cid,
   port:pid,
   type:state.tool==="pipe"?"pipe":"soft"
  };
  statusEl.textContent="Now select the destination port.";
  return;
 }

 const a=state.connectionDraft;

 if(a.component===cid&&a.port===pid){
  state.connectionDraft=null;
  updateStatus();
  return;
 }

 const exists=state.connections.some(w=>
  (w.from.component===a.component&&w.from.port===a.port&&
   w.to.component===cid&&w.to.port===pid)||
  (w.to.component===a.component&&w.to.port===a.port&&
   w.from.component===cid&&w.from.port===pid)
 );

 if(!exists){
  state.connections.push({
   id:id(),
   from:{component:a.component,port:a.port},
   to:{component:cid,port:pid},
   type:a.type,
   diameter:a.type==="pipe"?16:12,
   length:1000,
   rating:250,
   flow:0,
   pressureDrop:0
  });
  pushHistory();
 }

 state.connectionDraft=null;
 render();
}

function deleteConnection(id){
 state.connections=state.connections.filter(x=>x.id!==id);
 pushHistory();
 render();
}

/* =========================================================
   SIMULATION ENGINE
   ========================================================= */

function runSimulation(){
 state.running=true;
 state.paused=false;
 state.simTime=0;
 statusEl.textContent="Simulation running";
 log("Simulation started.");
 requestAnimationFrame(simLoop);
}

function stopSimulation(){
 state.running=false;
 state.paused=false;

 state.components.forEach(c=>{
  c.sim.active=false;
  c.sim.flow=0;
  c.sim.pressure=0;
  c.sim.speed=0;
  c.sim.force=0;
  c.sim.state="Idle";
 });

 state.connections.forEach(w=>{
  w.flow=0;
  w.pressureDrop=0;
 });

 render();
 log("Simulation stopped.");
}

function simLoop(now){
 if(!state.running)return;

 const dt=Math.min(.05,(now-state.lastTime)/1000);
 state.lastTime=now;

 if(!state.paused){
  state.simTime+=dt*state.simSpeed;
  simulate(dt*state.simSpeed);
  renderComponents();
  renderConnections();
  renderInspector();
  renderBottom();
 }

 requestAnimationFrame(simLoop);
}

function simulate(dt){
 state.warnings=[];

 state.components.forEach(c=>{
  c.sim.active=false;
  c.sim.flow=0;
  c.sim.pressure=0;
  c.sim.speed=0;
  c.sim.force=0;
  c.sim.temperature=c.params.temperature||45;
  c.sim.state="Idle";
 });

 state.connections.forEach(w=>{
  w.flow=0;
  w.pressureDrop=0;
 });

 const sources=state.components.filter(c=>
  c.type==="pump-fixed"||
  c.type==="pump-variable"||
  c.type==="compressor"
 );

 sources.forEach(source=>{
  if(source.params.failed){
   source.sim.state="FAULT";
   state.warnings.push(`${source.label}: source failure`);
   return;
  }

  if(source.params.blocked){
   source.sim.state="BLOCKED";
   state.warnings.push(`${source.label}: blocked`);
   return;
  }

  const pressure=source.params.pressure||0;
  const flow=source.params.flow||0;

  source.sim.pressure=pressure;
  source.sim.flow=flow;
  source.sim.speed=source.params.rpm||0;
  source.sim.active=true;
  source.sim.state="Running";

  if(source.type==="pump-fixed"||source.type==="pump-variable"){
   source.sim.temperature=45+Math.min(50,pressure*.04);
  }

  const visited=new Set();
  propagateFrom(source,pressure,flow,visited,dt);
 });

 /* Reservoirs */
 state.components.filter(c=>c.type==="reservoir").forEach(c=>{
  c.sim.state="Tank";
  c.sim.pressure=0;
 });

 /* motors */
 state.components.filter(c=>c.type==="motor"||c.type==="air-motor")
 .forEach(c=>{
  if(c.sim.flow>0&&!c.params.failed){
   c.sim.speed=Math.min(
    c.params.rpm||3000,
    c.sim.flow*35
   );
   c.sim.active=true;
   c.sim.state="Rotating";
   c.params.angle=(c.params.angle||0)+c.sim.speed*dt*6;
  }
 });

 /* cylinders */
 state.components.filter(c=>c.type.includes("cylinder"))
 .forEach(c=>{
  if(c.params.failed){
   c.sim.state="SEAL FAULT";
   state.warnings.push(`${c.label}: cylinder fault`);
   return;
  }

  const bore=c.params.bore||50;
  const rod=c.params.rod||25;
  const area=Math.PI*bore*bore/4;
  const rodArea=Math.PI*rod*rod/4;

  let force=0;
  if(c.sim.pressure>0){
   force=c.sim.pressure*100000*(area/1000000);
  }

  c.sim.force=force;

  if(c.sim.flow>0){
   const q=c.sim.flow/60000;
   const speed=(q/(area/1000000))*1000;
   c.sim.speed=speed;

   let direction=1;

   const valve=findValveFeeding(c.id);
   if(valve&&valve.params.valvePosition==="right")direction=-1;

   if(valve&&valve.params.valvePosition==="centre")direction=0;

   const delta=speed*dt*direction;

   c.params.position=Math.max(
    0,
    Math.min(c.params.stroke||300,(c.params.position||0)+delta)
   );

   c.sim.active=true;
   c.sim.state=direction===0?"Held":direction>0?"Extending":"Retracting";
  }else{
   c.sim.state="Holding";
  }
 });

 /* pressure devices */
 state.components.forEach(c=>{
  if(["relief","reducing","sequence","counterbalance"].includes(c.type)){
   if(c.params.failed){
    c.sim.state="FAULT";
    return;
   }

   if(c.sim.pressure>c.params.setting){
    c.sim.active=true;
    c.sim.state="Opening";
    c.sim.flow=Math.max(0,c.sim.flow*.7);
   }else{
    c.sim.state="Closed";
   }
  }

  if(c.type==="filter"||c.type==="air-filter"){
   if(c.params.blocked){
    c.sim.state="BLOCKED";
    c.sim.flow=0;
   }else{
    c.sim.state="Filtering";
   }
  }

  if(c.type==="pressure-gauge"){
   c.sim.state=round(c.sim.pressure)+" bar";
  }
 });

 updateAnalysis();
}

function propagateFrom(source,pressure,flow,visited,dt){
 const queue=[{
  component:source.id,
  pressure,
  flow
 }];

 while(queue.length){
  const node=queue.shift();

  const key=node.component;
  if(visited.has(key))continue;
  visited.add(key);

  const c=state.components.find(x=>x.id===node.component);
  if(!c)continue;

  if(c.id!==source.id){
   c.sim.pressure=Math.max(c.sim.pressure,node.pressure);
   c.sim.flow=Math.max(c.sim.flow,node.flow);
   c.sim.active=node.flow>0;
   if(node.flow>0)c.sim.state="Flowing";
  }

  const wires=state.connections.filter(w=>
   w.from.component===c.id||w.to.component===c.id
  );

  wires.forEach(w=>{
   const otherId=w.from.component===c.id?w.to.component:w.from.component;
   const other=state.components.find(x=>x.id===otherId);
   if(!other)return;

   const restriction=(w.diameter<10?.35:w.diameter<16?.75:.95);
   let nextFlow=node.flow*restriction;

   if(w.type==="soft")nextFlow*=.98;

   const loss=Math.max(0,node.flow-nextFlow);
   w.flow=nextFlow;
   w.pressureDrop=loss*.08;

   let nextPressure=Math.max(0,node.pressure-w.pressureDrop);

   /* component restrictions */
   if(other.params.blocked){
    nextFlow=0;
    nextPressure=0;
    w.flow=0;
    w.pressureDrop=node.pressure;
    state.warnings.push(`${other.label}: flow blocked`);
   }

   if(other.params.failed){
    nextFlow*=.15;
    state.warnings.push(`${other.label}: component fault`);
   }

   if(["flow-control","one-way-flow","needle","orifice","restrictor"].includes(other.type)){
    nextFlow*=Math.max(.02,1-(other.params.restriction||0)/100);
   }

   if(other.type==="filter"||other.type==="air-filter"){
    nextFlow*=Math.max(.02,1-(other.params.restriction||0)/100);
   }

   if(["relief","reducing","sequence","counterbalance"].includes(other.type)){
    nextPressure=Math.min(nextPressure,other.params.setting||nextPressure);
   }

   /* Directional valve routing */
   if(other.type.startsWith("valve-")||other.type==="valve-prop"){
    if(!valveAllowsFlow(other,c.id)){
     nextFlow=0;
    }
   }

   queue.push({
    component:other.id,
    pressure:nextPressure,
    flow:nextFlow
   });
  });
 }
}

function valveAllowsFlow(v,fromId){
 const pos=v.params.valvePosition||"centre";
 const centre=v.params.centre||"closed";

 if(pos==="centre"){
  if(centre==="closed")return false;
  if(centre==="open")return true;
  if(centre==="tandem")return true;
  if(centre==="float")return true;
  if(centre==="pt")return true;
  if(centre==="abT")return true;
 }

 return true;
}

function findValveFeeding(cid){
 const c=state.components.find(x=>x.id===cid);
 if(!c)return null;

 for(const w of state.connections){
  if(w.from.component===cid||w.to.component===cid){
   const otherId=w.from.component===cid?w.to.component:w.from.component;
   const other=state.components.find(x=>x.id===otherId);
   if(other&&other.type.startsWith("valve-"))return other;
  }
 }
 return null;
}

function updateAnalysis(){
 let pressure=0;
 let flow=0;

 state.components.forEach(c=>{
  pressure=Math.max(pressure,c.sim.pressure||0);
  flow=Math.max(flow,c.sim.flow||0);
 });

 state.analysis.pressure=pressure;
 state.analysis.flow=flow;
}

/* =========================================================
   ANALYSIS
   ========================================================= */

function analysisHTML(){
 const cylinders=state.components.filter(c=>c.type.includes("cylinder"));
 const motors=state.components.filter(c=>c.type==="motor"||c.type==="air-motor");

 let html=`
  <b>System analysis</b><br><br>

  <div class="stats">
   <div class="stat"><small>System Pressure</small><b>${round(state.analysis.pressure)} bar</b></div>
   <div class="stat"><small>System Flow</small><b>${round(state.analysis.flow)} L/min</b></div>
   <div class="stat"><small>Components</small><b>${state.components.length}</b></div>
   <div class="stat"><small>Connections</small><b>${state.connections.length}</b></div>
  </div>
 `;

 cylinders.forEach(c=>{
  const area=Math.PI*(c.params.bore||50)**2/4;
  const rodArea=Math.PI*(c.params.rod||25)**2/4;
  const force=c.sim.pressure*100000*area/1000000;

  html+=`
   <div class="section">${esc(c.label)}</div>
   Pressure: ${round(c.sim.pressure)} bar<br>
   Force: ${round(force)} N<br>
   Position: ${round(c.params.position)} / ${c.params.stroke} mm<br>
   Speed: ${round(c.sim.speed)} mm/s<br>
   Area: ${round(area)} mm²<br>
   Annulus: ${round(area-rodArea)} mm²
  `;
 });

 motors.forEach(c=>{
  html+=`
   <div class="section">${esc(c.label)}</div>
   Pressure: ${round(c.sim.pressure)} bar<br>
   Flow: ${round(c.sim.flow)} L/min<br>
   Speed: ${round(c.sim.speed)} rpm<br>
   Angle: ${round(c.params.angle)}°
  `;
 });

 if(state.warnings.length){
  html+=`<div class="section">Warnings</div>`;
  [...new Set(state.warnings)].slice(0,10).forEach(w=>{
   html+=`<div class="warning">${esc(w)}</div>`;
  });
 }

 return html;
}

/* =========================================================

   ========================================================= */

let bottomTab="analysis";

function renderBottom(){
 if(bottomTab==="analysis"){
  bottomContent.innerHTML=analysisHTML();
 }else if(bottomTab==="faults"){
  let html="<b>Fault simulation</b><br><br>";
  const faulty=state.components.filter(c=>c.params.failed||c.params.blocked);

  if(!faulty.length){
   html+="No active component faults.";
  }else{
   faulty.forEach(c=>{
    html+=`<div class="fault">${esc(c.label)} — ${
     c.params.failed?"Component failure":"Flow blocked"
    }</div>`;
   });
  }

  html+=`<button class="btn small" onclick="clearFaults()">Clear All Faults</button>`;
  bottomContent.innerHTML=html;
 }else if(bottomTab==="training"){
  bottomContent.innerHTML=`
   <b>Training mode</b><br><br>
   Build a circuit from supply → control → actuator → return.

   <button class="btn small" onclick="trainingChallenge()">New Challenge</button>

/* =========================================================

   ========================================================= */

function saveProject(){
 const data={
  version:2,
  name:"Hydraulic Studio Project",
  mode:state.mode,
  view:state.view,
  grid:state.grid,
  snap:state.snap,
  components:state.components,
  connections:state.connections,
  labels:state.labels,
  junctions:state.junctions
 };

 const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
 const a=document.createElement("a");
 a.href=URL.createObjectURL(blob);
 a.download="hydraulic-studio-project.json";
 a.click();
 URL.revokeObjectURL(a.href);

 log("Project saved.");
}

function loadProject(){
 const input=document.createElement("input");
 input.type="file";
 input.accept=".json,application/json";

 input.onchange=()=>{
  const file=input.files[0];
  if(!file)return;

  const reader=new FileReader();

  reader.onload=()=>{
   try{
    const d=JSON.parse(reader.result);

    state.mode=d.mode||"hydraulic";
    state.view=d.view||"functional";
    state.grid=d.grid||20;
    state.snap=d.snap!==false;
    state.components=d.components||[];
    state.connections=d.connections||[];
    state.labels=d.labels||[];
    state.junctions=d.junctions||[];
    state.selected=null;

    pushHistory();
    renderLibrary();
    render();
    log("Project loaded.");
   }catch(err){
    alert("Invalid Hydraulic Studio project file.");
   }
  };

  reader.readAsText(file);
 };

 input.click();
}

/* =========================================================
   EXAMPLE CIRCUIT
   ========================================================= */

function exampleCircuit(){
 state.components=[];
 state.connections=[];
 state.labels=[];
 state.junctions=[];
 state.selected=null;

 const tank=makeRaw("reservoir",-420,100);
 const pump=makeRaw("pump-fixed",-250,0);
 const valve=makeRaw("valve-4-3",0,0);
 const cyl=makeRaw("cylinder-double",300,0);
 const relief=makeRaw("relief",-80,170);
 const gauge=makeRaw("pressure-gauge",80,160);
 const filter=makeRaw("filter",-340,100);

 valve.params.valvePosition="right";
 valve.params.centre="closed";

 connect(tank,"T",pump,"IN","pipe");
 connect(pump,"OUT",filter,"A","pipe");
 connect(filter,"B",valve,"P","pipe");
 connect(valve,"A",cyl,"A","soft");
 connect(valve,"B",cyl,"B","soft");
 connect(valve,"T",tank,"T","pipe");
 connect(filter,"B",relief,"A","pipe");
 connect(relief,"B",tank,"T","pipe");
 connect(filter,"B",gauge,"P","pipe");

 state.components.push(tank,pump,valve,cyl,relief,gauge,filter);

 pushHistory();
 selectComponent(pump.id);
 render();

 log("Example hydraulic circuit created.");
}

function makeRaw(type,x,y){
 return {
  id:id(),
  type,
  x,y,
  rotation:0,
  flipX:false,
  flipY:false,
  label:componentName(type),
  params:defaults(type),
  sim:{
   pressure:0,flow:0,speed:0,force:0,state:"Idle",
   active:false,temperature:45
  }
 };
}

function connect(a,ap,b,bp,type){
 state.connections.push({
  id:id(),
  from:{component:a.id,port:ap},
  to:{component:b.id,port:bp},
  type,
  diameter:type==="pipe"?16:12,
  length:1000,
  rating:250,
  flow:0,
  pressureDrop:0
 });
}

/* =========================================================
   FIT VIEW
   ========================================================= */

function fitView(){
 if(!state.components.length){
  camera.x=0;
  camera.y=0;
  camera.zoom=1;
  renderWorldTransform();
  return;
 }

 let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;

 state.components.forEach(c=>{
  minX=Math.min(minX,c.x-100);
  maxX=Math.max(maxX,c.x+100);
  minY=Math.min(minY,c.y-80);
  maxY=Math.max(maxY,c.y+80);
 });

 const w=maxX-minX;
 const h=maxY-minY;

 const sw=svg.clientWidth;
 const sh=svg.clientHeight;

 camera.zoom=Math.min(
  2.2,
  Math.max(.25,Math.min((sw-80)/w,(sh-80)/h))
 );

 camera.x=(minX+maxX)/2;
 camera.y=(minY+maxY)/2;

 renderWorldTransform();
}

/* =========================================================
   UTILITIES
   ========================================================= */

function round(n){
 return Math.round((Number(n)||0)*100)/100;
}

function esc(s){
 return String(s??"")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;");
}

function dist(a,b){
 return Math.hypot(a.x-b.x,a.y-b.y);
}

function deleteSelected(){
 if(!state.selected)return;

 const c=state.components.find(x=>x.id===state.selected);
 if(!c)return;

 state.connections=state.connections.filter(w=>
  w.from.component!==c.id&&w.to.component!==c.id
 );

 state.components=state.components.filter(x=>x.id!==c.id);
 state.selected=null;

 pushHistory();
 render();

 log(`${c.label} deleted.`);
}

/* keyboard */
document.addEventListener("keydown",e=>{
 if(e.target.matches("input,select,textarea"))return;

 if(e.key==="Delete"||e.key==="Backspace"){
  deleteSelected();
 }

 if(e.key==="Escape"){
  state.connectionDraft=null;
  state.measureStart=null;
  setTool("select");
 }

 if(e.key==="r"||e.key==="R"){
  rotateComponent(90);
 }

 if(e.key==="h"||e.key==="H"){
  flipComponent("x");
 }

 if(e.key==="v"||e.key==="V"){
  flipComponent("y");
 }

 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"){
  e.preventDefault();
  undo();
 }

 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="y"){
  e.preventDefault();
  redo();
 }
});
