<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hydraulic Studio">
<title>Hydraulic Studio</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#080d18;color:#e5e7eb;overflow:hidden}
button,input,select{font:inherit}
button{border:0;color:inherit}
.app{height:100%;display:grid;grid-template-rows:58px 1fr 30px}

.top{
 background:#111827;border-bottom:1px solid #263244;
 display:flex;align-items:center;gap:10px;padding:8px 12px;
 z-index:20
}
.logo{font-weight:800;font-size:17px;white-space:nowrap}
.logo span{color:#60a5fa}
.topSpacer{flex:1}
.btn{
 background:#1f2937;border:1px solid #374151;border-radius:9px;
 padding:8px 12px;cursor:pointer;min-height:38px
}
.btn:hover{background:#273449}
.btn.primary{background:#2563eb;border-color:#3b82f6}
.btn.danger{background:#7f1d1d;border-color:#991b1b}
.btn.small{padding:5px 8px;min-height:32px;font-size:12px}
.runDot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#64748b;margin-right:6px}
.running .runDot{background:#22c55e;box-shadow:0 0 9px #22c55e}

.workspace{
 min-height:0;display:grid;
 grid-template-columns:220px 1fr 280px;
 overflow:hidden
}

.sidebar,.inspector{
 background:#0d1422;border-right:1px solid #263244;overflow:auto;padding:10px
}
.inspector{border-left:1px solid #263244;border-right:0}
.panelTitle{
 font-size:11px;text-transform:uppercase;letter-spacing:.08em;
 color:#94a3b8;margin:6px 4px 9px;font-weight:700
}
.componentGrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.comp{
 background:#172033;border:1px solid #2c3a50;border-radius:9px;
 padding:9px 6px;text-align:center;cursor:pointer;font-size:11px;
 min-height:62px
}
.comp:hover{border-color:#60a5fa;background:#1c2940}
.compIcon{font-size:20px;display:block;margin-bottom:3px}

.canvasWrap{position:relative;min-width:0;min-height:0;background:#0a101b;overflow:hidden}
#canvas{
 width:100%;height:100%;display:block;
 touch-action:none;user-select:none
}
.gridBg{background-color:#0a101b}

.toolbar{
 position:absolute;left:10px;top:10px;right:10px;
 display:flex;gap:6px;align-items:center;pointer-events:none
}
.toolbar>*{pointer-events:auto}
.toolGroup{
 display:flex;gap:5px;background:#111827dd;border:1px solid #263244;
 padding:5px;border-radius:10px;backdrop-filter:blur(8px)
}
.zoomLabel{font-size:11px;color:#94a3b8;padding:8px}

.status{
 background:#0d1422;border-top:1px solid #263244;
 display:flex;align-items:center;gap:14px;padding:0 12px;
 color:#94a3b8;font-size:11px;white-space:nowrap;overflow:hidden
}
.status b{color:#e5e7eb}

.inspector h3{font-size:15px;margin:3px 0 12px}
.empty{color:#64748b;font-size:12px;line-height:1.5}
.field{margin-bottom:9px}
.field label{display:block;font-size:10px;color:#94a3b8;margin-bottom:4px}
.field input,.field select{
 width:100%;background:#111827;color:#e5e7eb;
 border:1px solid #334155;border-radius:7px;padding:8px
}
.row{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.section{
 border-top:1px solid #263244;margin-top:12px;padding-top:11px
}
.metric{
 display:flex;justify-content:space-between;gap:10px;
 padding:5px 0;font-size:11px;border-bottom:1px solid #182235
}
.metric span{color:#94a3b8}
.metric b{color:#e5e7eb;text-align:right}
.badge{
 display:inline-block;padding:4px 7px;border-radius:6px;
 background:#1e293b;color:#cbd5e1;font-size:10px
}
.badge.good{background:#064e3b;color:#86efac}
.badge.warn{background:#78350f;color:#fde68a}
.badge.bad{background:#7f1d1d;color:#fecaca}

.diag{
 padding:7px;border-radius:7px;margin-bottom:5px;
 font-size:11px;background:#111827;border-left:3px solid #475569
}
.diag.good{border-color:#22c55e}
.diag.warn{border-color:#f59e0b}
.diag.bad{border-color:#ef4444}

.mobileNav,.mobileSheet,.mobileHeader{display:none}

.wire{
 fill:none;stroke:#64748b;stroke-width:3;
 vector-effect:non-scaling-stroke;pointer-events:stroke
}
.wire.selected{stroke:#facc15;stroke-width:5}
.wire.flowForward{stroke:#38bdf8}
.wire.flowHigh{stroke:#f97316}
.wire.flowExtreme{stroke:#ef4444}
.wire.returnLine{stroke:#64748b}
.flowDash{stroke-dasharray:10 8;animation:flow 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-18}}

.componentBody{cursor:pointer}
.componentBody.selected{filter:drop-shadow(0 0 7px #facc15)}
.componentText{font-size:10px;fill:#e5e7eb;pointer-events:none}
.port{fill:#111827;stroke:#94a3b8;stroke-width:2;cursor:pointer}
.port.connected{fill:#22c55e}
.port.pressure{fill:#f97316}
.port.return{fill:#64748b}

.flowArrow{
 fill:#38bdf8;pointer-events:none
}
.pressureText{
 font-size:9px;fill:#f8fafc;pointer-events:none;
 paint-order:stroke;stroke:#0a101b;stroke-width:3
}

.modal{
 position:fixed;inset:0;background:#0009;display:none;
 align-items:center;justify-content:center;z-index:100
}
.modal.show{display:flex}
.modalBox{
 width:min(650px,94vw);max-height:85vh;overflow:auto;
 background:#111827;border:1px solid #334155;border-radius:14px;padding:16px
}
.modalBox h2{margin-top:0}
textarea{
 width:100%;height:250px;background:#080d18;color:#dbeafe;
 border:1px solid #334155;border-radius:8px;padding:10px
}

@media(max-width:850px){
 body{overflow:hidden}
 .app{display:block;height:100%;padding-bottom:58px}
 .top,.sidebar,.inspector,.status{display:none}
 .workspace{display:block;height:100%}
 .canvasWrap{height:100%}

 .mobileHeader{
  position:absolute;top:0;left:0;right:0;height:55px;
  z-index:30;display:flex;align-items:center;
  padding:7px 10px;gap:7px;background:#0d1422eF;
  border-bottom:1px solid #263244;backdrop-filter:blur(10px)
 }
 .mobileHeader .logo{font-size:15px}
 .mobileHeader .topSpacer{flex:1}
 .mobileHeader .btn{padding:6px 9px;min-height:36px}

 .toolbar{
  top:65px;left:8px;right:8px;overflow-x:auto
 }
 .toolbar .desktopOnly{display:none}

 .mobileNav{
  position:fixed;display:flex;bottom:0;left:0;right:0;height:58px;
  background:#0d1422;border-top:1px solid #263244;
  z-index:50;padding-bottom:env(safe-area-inset-bottom)
 }
 .navBtn{
  flex:1;background:transparent;color:#94a3b8;
  font-size:10px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px
 }
 .navBtn.active{color:#60a5fa}
 .navIcon{font-size:19px}

 .mobileSheet{
  position:fixed;display:none;z-index:45;
  left:7px;right:7px;bottom:65px;max-height:70vh;
  background:#111827;border:1px solid #334155;border-radius:14px;
  overflow:auto;padding:12px;box-shadow:0 15px 40px #000b
 }
 .mobileSheet.show{display:block}
 .sheetTitle{
  font-weight:800;font-size:14px;margin-bottom:10px;
  display:flex;justify-content:space-between
 }
 .mobileComponents{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
 .mobileComponents .comp{min-height:64px}

 .mobileMetricGrid{
  display:grid;grid-template-columns:1fr 1fr;gap:7px
 }
 .metricCard{
  background:#0b1220;border:1px solid #263244;
  border-radius:9px;padding:8px
 }
 .metricCard span{display:block;color:#94a3b8;font-size:9px}
 .metricCard b{font-size:14px}

 .mobileSheet .row{grid-template-columns:1fr 1fr}
}

svg text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
</style>
</head>

<body>

<div class="app">

<header class="top">
 <div class="logo">Hydraulic <span>Studio</span></div>
 <div class="topSpacer"></div>
 <button class="btn small" onclick="newCircuit()">New</button>
 <button class="btn small" onclick="loadExample()">Example</button>
 <button class="btn small" onclick="saveCircuit()">Save</button>
 <button class="btn small" onclick="loadCircuit()">Load</button>
 <button class="btn primary" id="runBtn" onclick="toggleSimulation()">
  <span class="runDot"></span><span id="runText">Run</span>
 </button>
</header>

<div class="workspace">

<aside class="sidebar">
 <div class="panelTitle">Components</div>
 <div id="componentGrid" class="componentGrid"></div>

 <div class="section">
  <div class="panelTitle">Circuit</div>
  <button class="btn small" style="width:100%;margin-bottom:6px" onclick="loadExample()">Load Example</button>
  <button class="btn small" style="width:100%;margin-bottom:6px" onclick="clearWires()">Clear Wires</button>
  <button class="btn small danger" style="width:100%" onclick="newCircuit()">Clear Circuit</button>
 </div>

 <div class="section">
  <div class="panelTitle">Simulation</div>
  <button class="btn small" id="desktopRun" style="width:100%;margin-bottom:6px" onclick="toggleSimulation()">Start / Stop</button>
  <button class="btn small" style="width:100%" onclick="resetSimulation()">Reset Simulation</button>
 </div>
</aside>

<main class="canvasWrap" id="canvasWrap">

 <div class="mobileHeader">
  <div class="logo">Hydraulic <span>Studio</span></div>
  <div class="topSpacer"></div>
  <button class="btn small" onclick="loadExample()">Example</button>
  <button class="btn small primary" id="mobileRun" onclick="toggleSimulation()">▶</button>
 </div>

 <div class="toolbar">
  <div class="toolGroup">
   <button class="btn small" onclick="zoomOut()">−</button>
   <span class="zoomLabel" id="zoomLabel">100%</span>
   <button class="btn small" onclick="zoomIn()">+</button>
   <button class="btn small" onclick="fitCircuit()">Fit</button>
  </div>
  <div class="toolGroup">
   <button class="btn small" id="flowToggle" onclick="toggleFlowVisual()">Flow ✓</button>
   <button class="btn small" id="pressureToggle" onclick="togglePressureVisual()">Pressure ✓</button>
  </div>
 </div>

 <svg id="canvas" class="gridBg">
  <defs>
   <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M20 0H0V20" fill="none" stroke="#172235" stroke-width="1"/>
   </pattern>
   <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5"
     markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0 0L10 5L0 10z" class="flowArrow"/>
   </marker>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid)"></rect>
  <g id="wireLayer"></g>
  <g id="flowLayer"></g>
  <g id="componentLayer"></g>
  <g id="labelLayer"></g>
 </svg>

</main>

<aside class="inspector" id="inspector"></aside>

</div>

<div class="status">
 <span>Components: <b id="componentCount">0</b></span>
 <span>Connections: <b id="connectionCount">0</b></span>
 <span>Pressure: <b id="statusPressure">0 bar</b></span>
 <span>Flow: <b id="statusFlow">0 L/min</b></span>
 <span>Simulation: <b id="statusSim">Stopped</b></span>
</div>

</div>

<div class="mobileNav">
 <button class="navBtn active" onclick="mobilePanel('components',this)">
  <span class="navIcon">⚙</span>Components
 </button>
 <button class="navBtn" onclick="mobilePanel('circuit',this)">
  <span class="navIcon">⌘</span>Circuit
 </button>
 <button class="navBtn" onclick="mobilePanel('simulate',this)">
  <span class="navIcon">▶</span>Simulate
 </button>
 <button class="navBtn" onclick="mobilePanel('monitor',this)">
  <span class="navIcon">◉</span>Monitor
 </button>
 <button class="navBtn" onclick="mobilePanel('properties',this)">
  <span class="navIcon">☷</span>Properties
 </button>
</div>

<div id="mobileSheet" class="mobileSheet"></div>

<div id="jsonModal" class="modal">
 <div class="modalBox">
  <h2>Hydraulic Studio Data</h2>
  <textarea id="jsonText"></textarea>
  <div style="display:flex;gap:7px;justify-content:flex-end;margin-top:8px">
   <button class="btn" onclick="closeModal()">Cancel</button>
   <button class="btn primary" onclick="importJSON()">Import</button>
  </div>
 </div>
</div>

<script>
/* =========================================================
   HYDRAULIC STUDIO
   Browser-only hydraulic engineering simulator
   No external libraries
========================================================= */

const NS="http://www.w3.org/2000/svg";

let components=[];
let wires=[];
let selectedId=null;
let running=false;
let flowVisual=true;
let pressureVisual=true;
let simTime=0;
let zoom=1;
let panX=0;
let panY=0;
let connectionMode=null;
let history=[];
let historyIndex=-1;
let dragging=null;
let pointerStart=null;
let moved=false;
let lastFrame=performance.now();

const TYPES={
 tank:{
  name:"Tank",icon:"▱",ports:["T"],
  defaults:{name:"Tank",capacity:200}
 },
 pump:{
  name:"Fixed Pump",icon:"◉",ports:["IN","OUT"],
  defaults:{name:"Pump",displacement:16,rpm:1450,efficiency:0.90}
 },
 variablePump:{
  name:"Variable Pump",icon:"◈",ports:["IN","OUT"],
  defaults:{name:"Variable Pump",displacement:32,rpm:1450,efficiency:0.92,swash:75,compensator:250}
 },
 accumulator:{
  name:"Accumulator",icon:"◎",ports:["P"],
  defaults:{name:"Accumulator",volume:20,precharge:100,maxPressure:250}
 },
 valve43:{
  name:"4/3 Valve",icon:"⇄",ports:["P","T","A","B"],
  defaults:{name:"4/3 Directional Valve",position:"extend",centre:"closed",flowRating:120}
 },
 valve42:{
  name:"4/2 Valve",icon:"⇆",ports:["P","T","A","B"],
  defaults:{name:"4/2 Directional Valve",position:"extend",flowRating:120}
 },
 proportional:{
  name:"Proportional Valve",icon:"≋",ports:["P","T","A","B"],
  defaults:{name:"Proportional Valve",command:70,flowRating:120}
 },
 relief:{
  name:"Relief Valve",icon:"↗",ports:["P","T"],
  defaults:{name:"Relief Valve",setting:210,cracking:0.5,flowRating:120}
 },
 reducing:{
  name:"Pressure Reducing",icon:"↓",ports:["IN","OUT","T"],
  defaults:{name:"Reducing Valve",setting:120,flowRating:100}
 },
 sequence:{
  name:"Sequence Valve",icon:"→",ports:["IN","OUT","T"],
  defaults:{name:"Sequence Valve",setting:100,flowRating:100}
 },
 counterbalance:{
  name:"Counterbalance",icon:"⇩",ports:["IN","OUT","PILOT"],
  defaults:{name:"Counterbalance Valve",setting:100,pilotRatio:3,flowRating:80}
 },
 check:{
  name:"Check Valve",icon:"▶",ports:["IN","OUT"],
  defaults:{name:"Check Valve",cracking:0.5,flowRating:120}
 },
 flowControl:{
  name:"Flow Control",icon:"◁",ports:["IN","OUT"],
  defaults:{name:"Flow Control",opening:100,maxFlow:80,mode:"meter-in"}
 },
 throttleCheck:{
  name:"Throttle + Check",icon:"◀",ports:["IN","OUT"],
  defaults:{name:"Throttle Check",opening:100,maxFlow:70,mode:"meter-in"}
 },
 filter:{
  name:"Filter",icon:"▤",ports:["IN","OUT"],
  defaults:{name:"Filter",rating:150,restriction:0.3}
 },
 cylinder:{
  name:"Cylinder",icon:"▯",ports:["A","B"],
  defaults:{name:"Double Acting Cylinder",bore:100,rod:50,stroke:500,load:50000,friction:1500,position:100,maxSpeed:300}
 },
 motor:{
  name:"Hydraulic Motor",icon:"✥",ports:["A","B"],
  defaults:{name:"Hydraulic Motor",displacement:80,loadTorque:100,speedLimit:2500,efficiency:0.90}
 },
 gauge:{
  name:"Pressure Gauge",icon:"◉",ports:["P"],
  defaults:{name:"Pressure Gauge"}
 },
 flowmeter:{
  name:"Flow Meter",icon:"⌁",ports:["IN","OUT"],
  defaults:{name:"Flow Meter"}
 }
};

const typeOrder=[
 "tank","pump","variablePump","accumulator","valve43","valve42",
 "proportional","relief","reducing","sequence","counterbalance",
 "check","flowControl","throttleCheck","filter","cylinder","motor",
 "gauge","flowmeter"
];

const sim={};

function uid(prefix="c"){
 return prefix+"_"+Math.random().toString(36).slice(2,9);
}

function clone(o){
 return JSON.parse(JSON.stringify(o));
}

function fmt(n,d=1){
 if(!isFinite(n))return "—";
 return Number(n).toFixed(d);
}

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}

function el(tag,attrs={}){
 const e=document.createElementNS(NS,tag);
 Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));
 return e;
}

function htmlEscape(s){
 return String(s??"").replace(/[&<>"']/g,m=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
 }[m]));
}

/* =========================================================
   COMPONENT CREATION
========================================================= */

function addComponent(type,x=300,y=250,extra={}){
 const d=clone(TYPES[type].defaults);
 const c={
  id:uid(),
  type,
  x,y,
  rotation:0,
  ...d,
  ...extra
 };
 components.push(c);
 selectComponent(c.id);
 pushHistory();
 render();
 return c;
}

function componentPorts(c){
 const p=TYPES[c.type].ports;
 const w=componentWidth(c);
 const h=componentHeight(c);

 const positions={
  tank:{T:[0,-h/2]},
  pump:{IN:[-w/2,0],OUT:[w/2,0]},
  variablePump:{IN:[-w/2,0],OUT:[w/2,0]},
  accumulator:{P:[-w/2,0]},
  valve43:{P:[-w/2,30],T:[-w/2,-30],A:[w/2,-30],B:[w/2,30]},
  valve42:{P:[-w/2,25],T:[-w/2,-25],A:[w/2,-25],B:[w/2,25]},
  proportional:{P:[-w/2,30],T:[-w/2,-30],A:[w/2,-30],B:[w/2,30]},
  relief:{P:[-w/2,0],T:[w/2,0]},
  reducing:{IN:[-w/2,0],OUT:[w/2,0],T:[0,h/2]},
  sequence:{IN:[-w/2,0],OUT:[w/2,0],T:[0,h/2]},
  counterbalance:{IN:[-w/2,0],OUT:[w/2,0],PILOT:[0,h/2]},
  check:{IN:[-w/2,0],OUT:[w/2,0]},
  flowControl:{IN:[-w/2,0],OUT:[w/2,0]},
  throttleCheck:{IN:[-w/2,0],OUT:[w/2,0]},
  filter:{IN:[-w/2,0],OUT:[w/2,0]},
  cylinder:{A:[-w/2,0],B:[w/2,0]},
  motor:{A:[-w/2,0],B:[w/2,0]},
  gauge:{P:[-w/2,0]},
  flowmeter:{IN:[-w/2,0],OUT:[w/2,0]}
 };

 return Object.fromEntries(
  p.map(name=>[name,positions[c.type]?.[name]||[0,0]])
 );
}

function componentWidth(c){
 return ["valve43","valve42","proportional"].includes(c.type)?150:
        ["cylinder","motor"].includes(c.type)?145:110;
}

function componentHeight(c){
 return ["valve43","valve42","proportional"].includes(c.type)?100:
        ["cylinder","motor"].includes(c.type)?80:
        c.type==="tank"?90:65;
}

function portPoint(c,port){
 const [dx,dy]=componentPorts(c)[port]||[0,0];
 return {x:c.x+dx,y:c.y+dy};
}

function componentAt(x,y){
 for(let i=components.length-1;i>=0;i--){
  const c=components[i];
  const w=componentWidth(c),h=componentHeight(c);
  if(Math.abs(x-c.x)<=w/2+10 && Math.abs(y-c.y)<=h/2+10)return c;
 }
 return null;
}

/* =========================================================
   RENDERING
========================================================= */

function render(){
 renderComponents();
 renderWires();
 updateInspector();
 updateCounts();
 updateMobileIfOpen();
}

function worldToScreen(x,y){
 return {
  x:(x+panX)*zoom,
  y:(y+panY)*zoom
 };
}

function renderComponents(){
 const layer=document.getElementById("componentLayer");
 const labels=document.getElementById("labelLayer");
 layer.innerHTML="";
 labels.innerHTML="";

 components.forEach(c=>{
  const g=el("g",{
   transform:`translate(${c.x},${c.y})`,
   class:"componentBody "+(selectedId===c.id?"selected":"")
  });

  const w=componentWidth(c),h=componentHeight(c);

  let body;

  if(c.type==="tank"){
   body=el("g");
   body.append(
    el("path",{d:`M${-w/2},${-h/2+15} L${-w/2},${h/2-15} Q0,${h/2+5} ${w/2},${h/2-15} L${w/2},${-h/2+15}`,fill:"none",stroke:"#cbd5e1","stroke-width":3}),
    el("path",{d:`M${-w/2},15 Q0,${h/2-5} ${w/2},15 L${w/2},${h/2-15} Q0,${h/2+5} ${-w/2},${h/2-15}Z`,fill:"#1e3a5f",opacity:.75,stroke:"#60a5fa","stroke-width":2})
   );
  }
  else if(["pump","variablePump"].includes(c.type)){
   body=el("g");
   body.append(
    el("circle",{cx:0,cy:0,r:28,fill:"#172033",stroke:"#60a5fa","stroke-width":3}),
    el("path",{d:"M-13 10 L15 0 L-13 -10Z",fill:"#60a5fa"}),
    c.type==="variablePump"?el("path",{d:"M-22 30L22 -30",stroke:"#fbbf24","stroke-width":3}):null
   );
  }
  else if(["valve43","valve42","proportional"].includes(c.type)){
   body=el("g");
   body.append(
    el("rect",{x:-w/2,y:-h/2,width:w,height:h,fill:"#151f31",stroke:"#64748b","stroke-width":2,rx:3}),
    el("line",{x1:-w/6,y1:-h/2,x2:-w/6,y2:h/2,stroke:"#64748b","stroke-width":2}),
    el("line",{x1:w/6,y1:-h/2,x2:w/6,y2:h/2,stroke:"#64748b","stroke-width":2})
   );

   const pos=c.position||"extend";
   let arrow="M-30 20L0 20L0 -20L30 -20";
   if(pos==="retract")arrow="M30 20L0 20L0 -20L-30 -20";
   if(pos==="centre")arrow="M-25 0H25";

   body.append(

function textNode(txt){
 return document.createTextNode(txt);
}

function renderWires(){
 const layer=document.getElementById("wireLayer");
 const flowLayer=document.getElementById("flowLayer");
 layer.innerHTML="";
 flowLayer.innerHTML="";

 wires.forEach((w,index)=>{
  const a=portPoint(getComp(w.from.id),w.from.port);
  const b=portPoint(getComp(w.to.id),w.to.port);

  const path=dPath(a,b);
  const info=simWire(w);

  let cls="wire";
  if(info.flow>0.1){
   if(info.pressure>180)cls+=" flowExtreme";
   else if(info.pressure>80)cls+=" flowHigh";
   else cls+=" flowForward";
   if(flowVisual)cls+=" flowDash";
  }
  else if(info.pressure<5)cls+=" returnLine";

  if(selectedId===w.id)cls+=" selected";

  const line=el("path",{
   d:path,class:cls,
   "marker-end":flowVisual&&Math.abs(info.flow)>0.1?"url(#arrowBlue)":""
  });

  line.addEventListener("click",e=>{
   e.stopPropagation();
   selectedId=w.id;
   updateInspector();
   render();
  });

  layer.append(line);

  if(flowVisual && Math.abs(info.flow)>0.5){
   const mid=curveMid(a,b);
   const t=el("text",{
    x:mid.x,y:mid.y-5,class:"pressureText",
    "text-anchor":"middle"
   });
   t.textContent=fmt(Math.abs(info.flow),1)+" L/min";
   flowLayer.append(t);
  }
 });
}

function dPath(a,b){
 const dx=Math.abs(b.x-a.x);
 const midx=(a.x+b.x)/2;
 return `M${a.x},${a.y} C${midx},${a.y} ${midx},${b.y} ${b.x},${b.y}`;
}

function curveMid(a,b){
 return {x:(a.x+b.x)/2,y:(a.y+b.y)/2};
}

function getComp(id){
 return components.find(c=>c.id===id);
}

function simWire(w){
 const s=sim[w.from.id]?.ports?.[w.from.port];
 const t=sim[w.to.id]?.ports?.[w.to.port];
 if(!s&&!t)return {flow:0,pressure:0};
 return {
  flow:Math.abs((s?.flow||0)+(t?.flow||0))/2,
  pressure:Math.max(s?.pressure||0,t?.pressure||0)
 };
}

/* =========================================================
   SIMULATION NETWORK
========================================================= */

function initSim(){
 Object.keys(sim).forEach(k=>delete sim[k]);

 components.forEach(c=>{
  sim[c.id]={
   pressure:0,
   flow:0,
   force:0,
   velocity:0,
   rpm:0,
   torque:0,
   power:0,
   cavitation:false,
   relief:false,
   ports:{}
  };

  TYPES[c.type].ports.forEach(p=>{
   sim[c.id].ports[p]={
    pressure:0,
    flow:0,
    connected:false
   };
  });
 });
}

function connectedPorts(c,port){
 const list=[];
 wires.forEach(w=>{
  if(w.from.id===c.id&&w.from.port===port)list.push({c:getComp(w.to.id),port:w.to.port});
  if(w.to.id===c.id&&w.to.port===port)list.push({c:getComp(w.from.id),port:w.from.port});
 });
 return list;
}

function wireBetween(c,p){
 return wires.find(w=>
  (w.from.id===c.id&&w.from.port===p)||
  (w.to.id===c.id&&w.to.port===p)
 );
}

function connectedComponent(c,p){
 const others=connectedPorts(c,p);
 return others.length?others[0].c:null;
}

function hasTank(){
 return components.some(c=>c.type==="tank");
}

function hasPump(){
 return components.some(c=>["pump","variablePump"].includes(c.type));
}

function pumpOutput(c){
 let q=c.displacement*c.rpm/1000;
 if(c.type==="variablePump")q*=clamp(c.swash/100,0,1);
 q*=c.efficiency||.9;

 if(simFault("pumpWear"))q*=0.65;

 return Math.max(0,q);
}

function simFault(name){
 return false;
}

/*
  Build pressure connectivity by following open internal
  connections. Tank is the reference node at 0 bar.
*/

function internalLinks(c){
 switch(c.type){

  case"tank":
   return [["T","TANK"]];

  case"pump":
  case"variablePump":
   return [];

  case"valve43":{
   if(c.position==="extend")return [["P","A"],["B","T"]];
   if(c.position==="retract")return [["P","B"],["A","T"]];
   if(c.centre==="float")return [["A","T"],["B","T"]];
   if(c.centre==="tandem")return [["P","T"]];
   return [];
  }

  case"valve42":
   return c.position==="retract"
    ?[["P","B"],["A","T"]]
    :[["P","A"],["B","T"]];

  case"proportional":{
   if(c.command<=2)return [["A","T"],["B","T"]];
   if(c.command>=98)return [["P","A"],["B","T"]];
   return [["P","A"],["B","T"]];
  }

  case"relief":
   return [];

  case"reducing":
   return [];

  case"sequence":
   return [];

  case"counterbalance":
   return [];

  case"check":
   return [];

  case"flowControl":
  case"throttleCheck":
  case"filter":
  case"flowmeter":
   return [[TYPES[c.type].ports[0],TYPES[c.type].ports[1]]];

  default:
   return [];
 }
}

function pressurePathToTank(startId,startPort,visited=new Set()){
 const key=startId+":"+startPort;
 if(visited.has(key))return false;
 visited.add(key);

 const c=getComp(startId);
 if(!c)return false;
 if(c.type==="tank")return true;

 for(const pair of internalLinks(c)){
  if(pair[0]===startPort&&pair[1]==="TANK")return true;
  if(pair[1]===startPort&&pair[0]==="TANK")return true;

  let nextPort=null;
  if(pair[0]===startPort)nextPort=pair[1];
  else if(pair[1]===startPort)nextPort=pair[0];

  if(nextPort){
   for(const x of connectedPorts(c,nextPort)){
    if(pressurePathToTank(x.c.id,x.port,visited))return true;
   }
  }
 }

 for(const x of connectedPorts(c,startPort)){
  if(pressurePathToTank(x.c.id,x.port,visited))return true;
 }

 return false;
}

/* ---------------------------------------------------------
   Quasi-steady hydraulic solve
--------------------------------------------------------- */

function solveHydraulics(dt){

 if(!components.length)return;

 if(!hasTank()||!hasPump()){
  basicNoSystem();
  return;
 }

 // Start with previous values for stability
 components.forEach(c=>{
  if(!sim[c.id])return;
  Object.values(sim[c.id].ports).forEach(p=>{
   p.flow*=0.85;
  });
 });

 const tanks=components.filter(c=>c.type==="tank");
 tanks.forEach(c=>{
  sim[c.id].pressure=0;
  if(sim[c.id].ports.T){
   sim[c.id].ports.T.pressure=0;
  }
 });

 const pumps=components.filter(c=>["pump","variablePump"].includes(c.type));

 let totalPumpFlow=0;

 pumps.forEach(p=>{
  const q=pumpOutput(p);
  totalPumpFlow+=q;
 });

 /*
   Determine demand from actuators.
   Cylinder pressure is found from load + acceleration approximation.
 */
 components.filter(c=>c.type==="cylinder").forEach(c=>{
  const s=sim[c.id];

  const areaA=Math.PI*Math.pow(c.bore/2,2)/100;
  const areaB=Math.PI*(Math.pow(c.bore/2,2)-Math.pow(c.rod/2,2))/100;

  const loadBar=(c.load+c.friction)/areaA/10;

  let connectedA=connectedPorts(c,"A").length>0;
  let connectedB=connectedPorts(c,"B").length>0;

  let pa=s.ports.A.pressure||0;
  let pb=s.ports.B.pressure||0;

  if(connectedA && !connectedB)pa=Math.max(pa,loadBar);
  if(connectedB && !connectedA)pb=Math.max(pb,loadBar*areaA/Math.max(areaB,1));

  if(!connectedA)pa=0;
  if(!connectedB)pb=0;

  // Directional valve path inference
  const valve=components.find(v=>
   ["valve43","valve42","proportional"].includes(v.type)&&
   ((connectedPorts(v,"A").some(x=>x.c.id===c.id))||
    (connectedPorts(v,"B").some(x=>x.c.id===c.id)))
  );

  let direction="none";
  if(valve){
   if(valve.position==="extend")direction="extend";
   if(valve.position==="retract")direction="retract";
  }

  if(direction==="extend"){
   pa=Math.max(pa,loadBar+8);
   pb=Math.min(pb,Math.max(0,pa*.08));
  }
  else if(direction==="retract"){
   pb=Math.max(pb,loadBar*areaA/Math.max(areaB,1)+5);
   pa=Math.min(pa,pb*.08);
  }

  const netForce=pa*10*areaA-pb*10*areaB-c.load-c.friction;
  let velocity=0;

  if(direction==="extend"&&netForce>0)velocity=Math.min(c.maxSpeed,netForce/Math.max(c.load+c.friction,1)*100);
  if(direction==="retract"&&netForce<0)velocity=-Math.min(c.maxSpeed,Math.abs(netForce)/(Math.max(c.load,1))*100);

  // Available flow limits cylinder speed
  let chamberFlow=totalPumpFlow;
  if(valve)chamberFlow*=valve.type==="proportional"?clamp(valve.command/100,0,1):1;

  const speedFromFlowA=chamberFlow*1000000/60/Math.max(areaA*100,1);
  const speedFromFlowB=chamberFlow*1000000/60/Math.max(areaB*100,1);

  if(direction==="extend")velocity=Math.min(velocity||speedFromFlowA,speedFromFlowA,c.maxSpeed);
  if(direction==="retract")velocity=-Math.min(Math.abs(velocity||speedFromFlowB),speedFromFlowB,c.maxSpeed);

  if(!connectedA&&!connectedB)velocity=0;

  if(c.position<=0&&velocity<0)velocity=0;
  if(c.position>=c.stroke&&velocity>0)velocity=0;

  c.position=clamp(c.position+velocity*dt/1000,0,c.stroke);

  s.ports.A.pressure=pa;
  s.ports.B.pressure=pb;
  s.force=netForce;
  s.velocity=velocity;

  s.power=Math.max(0,(pa-pb)*10*Math.abs(chamberFlow)/60000);

  // flow into/out of cylinder
  s.ports.A.flow=direction==="extend"?Math.abs(velocity)*areaA*60/1000:
                  direction==="retract"?-Math.abs(velocity)*areaA*60/1000:0;

  s.ports.B.flow=direction==="retract"?Math.abs(velocity)*areaB*60/1000:
                  direction==="extend"?-Math.abs(velocity)*areaB*60/1000:0;
 });

 /*
   Calculate pump discharge pressure from demand.
   Highest actuator load plus restrictions.
 */
 let demandedPressure=0;

 components.forEach(c=>{
  if(c.type==="cylinder"){
   demandedPressure=Math.max(
    demandedPressure,
    sim[c.id].ports.A.pressure||0,
    sim[c.id].ports.B.pressure||0
   );
  }
 });

 // Add approximate restriction losses along active components
 let restriction=0;

 components.forEach(c=>{
  const sc=sim[c.id];

  if(c.type==="filter"){
   const q=Math.min(totalPumpFlow,150);
   restriction+=c.restriction*Math.pow(q/50,2);
  }

  if(c.type==="flowControl"||c.type==="throttleCheck"){
   const open=clamp(c.opening/100,.01,1);
   restriction+=3*(1/open-1)*Math.pow(Math.min(totalPumpFlow,c.maxFlow)/50,2);
  }
 });

 let relief=components.find(c=>c.type==="relief");

 let systemPressure=Math.max(0,demandedPressure+restriction);

 if(relief){
  if(systemPressure>=relief.setting){
   systemPressure=relief.setting;
   sim[relief.id].relief=true;
  }else{
   sim[relief.id].relief=false;
  }
 }

 systemPressure=clamp(systemPressure,0,400);

 // Pressure reducing / sequence effects
 components.filter(c=>c.type==="reducing").forEach(c=>{
  const out=connectedPorts(c,"OUT");
  out.forEach(x=>{
   if(sim[x.c.id]?.ports[x.port])
    sim[x.c.id].ports[x.port].pressure=Math.min(
     sim[x.c.id].ports[x.port].pressure||systemPressure,
     c.setting
    );
  });
 });

 components.filter(c=>c.type==="sequence").forEach(c=>{
  if(systemPressure<c.setting){
   sim[c.id].blocked=true;
  }else sim[c.id].blocked=false;
 });

 // Assign network pressure
 pumps.forEach(p=>{
  const s=sim[p.id];
  s.pressure=systemPressure;
  s.flow=totalPumpFlow;

  if(s.ports.OUT){
   s.ports.OUT.pressure=systemPressure;
   s.ports.OUT.flow=totalPumpFlow;
  }
  if(s.ports.IN){
   s.ports.IN.pressure=0;
   s.ports.IN.flow=-totalPumpFlow;
  }
 });

 // Propagate pressure through wires and open valve paths
 propagatePressures(systemPressure);

 // Restrictions and component local metrics
 calculateComponentFlows(totalPumpFlow,systemPressure);

 // Reapply actuator calculations after network pressure
 components.filter(c=>c.type==="cylinder").forEach(c=>{
  const s=sim[c.id];
  const pa=s.ports.A.pressure||0;
  const pb=s.ports.B.pressure||0;
  const areaA=Math.PI*Math.pow(c.bore/2,2)/100;
  const areaB=Math.PI*(Math.pow(c.bore/2,2)-Math.pow(c.rod/2,2))/100;

  s.force=pa*10*areaA-pb*10*areaB-c.load-c.friction;
  s.power=Math.max(0,(pa-pb)*10*Math.abs(s.ports.A.flow||0)/60000);
 });

 // Global metrics
 sim.global={
  pressure:systemPressure,
  pumpFlow:totalPumpFlow,
  hydraulicPower:systemPressure*totalPumpFlow/600,
  relief:relief?!!sim[relief.id].relief:false
 };
}

function basicNoSystem(){
 components.forEach(c=>{
  const s=sim[c.id]||{};
  Object.values(s.ports||{}).forEach(p=>{
   p.pressure=0;p.flow=0;
  });
  s.pressure=0;s.flow=0;s.force=0;s.velocity=0;s.power=0;
 });
 sim.global={pressure:0,pumpFlow:0,hydraulicPower:0,relief:false};
}

function propagatePressures(systemPressure){

 // Iterate several times to move pressure around connected network
 for(let pass=0;pass<5;pass++){

  // Pump source
  components.filter(c=>["pump","variablePump"].includes(c.type)).forEach(c=>{
   const s=sim[c.id];
   s.ports.OUT.pressure=systemPressure;
  });

  // Valve internal connections
  components.forEach(c=>{
   const links=internalLinks(c);

   links.forEach(pair=>{
    if(pair[1]==="TANK"||pair[0]==="TANK")return;

    const a=sim[c.id].ports[pair[0]];
    const b=sim[c.id].ports[pair[1]];
    const p=Math.max(a.pressure||0,b.pressure||0);
    a.pressure=p;b.pressure=p;
   });
  });

  // Wires transmit pressure with losses
  wires.forEach(w=>{
   const a=sim[w.from.id].ports[w.from.port];
   const b=sim[w.to.id].ports[w.to.port];

   const ca=getComp(w.from.id);
   const cb=getComp(w.to.id);

   if(ca.type==="tank"||cb.type==="tank"){
    a.pressure=0;b.pressure=0;
    return;
   }

   const pa=a.pressure||0;
   const pb=b.pressure||0;
   const p=Math.max(pa,pb);

   if(p>0){
    a.pressure=p;
    b.pressure=p;
   }
  });

  // Any port with a definite return path is tank referenced
  components.forEach(c=>{
   TYPES[c.type].ports.forEach(p=>{
    if(pressurePathToTank(c.id,p)){
     sim[c.id].ports[p].pressure=Math.min(
      sim[c.id].ports[p].pressure||0,
      0
     );
    }
   });
  });
 }
}

function calculateComponentFlows(totalPumpFlow,systemPressure){

 components.forEach(c=>{
  const s=sim[c.id];
  s.pressure=0;

  Object.entries(s.ports).forEach(([p,v])=>{
   s.pressure=Math.max(s.pressure,v.pressure||0);
  });

  switch(c.type){

   case"tank":
    s.pressure=0;
    s.ports.T.pressure=0;
    s.ports.T.flow=-totalPumpFlow;
    break;

   case"relief":{
    s.ports.P.pressure=systemPressure;
    s.ports.T.pressure=0;
    s.ports.P.flow=s.relief?totalPumpFlow:0;
    s.ports.T.flow=s.relief?-totalPumpFlow:0;
    break;
   }

   case"filter":{
    const q=totalPumpFlow;
    const dp=c.restriction*Math.pow(q/50,2);
    s.ports.IN.pressure=Math.max(0,systemPressure-dp);
    s.ports.OUT.pressure=systemPressure;
    s.ports.IN.flow=q;
    s.ports.OUT.flow=q;
    s.deltaP=dp;
    break;
   }

   case"flowControl":
   case"throttleCheck":{
    const max=c.maxFlow*clamp(c.opening/100,0,1);
    const q=Math.min(totalPumpFlow,max);
    s.ports.IN.flow=q;
    s.ports.OUT.flow=q;
    s.ports.IN.pressure=systemPressure;
    s.ports.OUT.pressure=Math.max(0,systemPressure-2*(q/Math.max(max,1))**2);
    s.deltaP=s.ports.IN.pressure-s.ports.OUT.pressure;
    break;
   }

   case"check":{
    s.ports.IN.pressure=systemPressure;
    s.ports.OUT.pressure=Math.max(0,systemPressure-c.cracking);
    s.ports.IN.flow=totalPumpFlow;
    s.ports.OUT.flow=totalPumpFlow;
    break;
   }

   case"gauge":
    s.pressure=s.ports.P.pressure||systemPressure;
    break;

   case"flowmeter":
    s.flow=Math.abs(s.ports.IN.flow||s.ports.OUT.flow||0);
    break;

   case"motor":
    solveMotor(c,totalPumpFlow);
    break;

   case"accumulator":
    solveAccumulator(c,totalPumpFlow);
    break;

   case"reducing":
    s.ports.IN.pressure=systemPressure;
    s.ports.OUT.pressure=Math.min(systemPressure,c.setting);
    break;

   case"sequence":
    s.ports.IN.pressure=systemPressure;
    s.ports.OUT.pressure=systemPressure>=c.setting?systemPressure:0;
    break;

   case"counterbalance":
    s.ports.IN.pressure=systemPressure;
    s.ports.OUT.pressure=Math.max(0,systemPressure-c.setting);
    break;

   case"valve43":
   case"valve42":
   case"proportional":
    solveValve(c,totalPumpFlow);
    break;
  }

  Object.values(s.ports).forEach(p=>{
   p.connected=true;
  });
 });
}

function solveValve(c,totalPumpFlow){
 const s=sim[c.id];

 const q=c.type==="proportional"
  ?totalPumpFlow*clamp(c.command/100,0,1)
  :Math.min(totalPumpFlow,c.flowRating||120);

 if(c.position==="extend"){
  s.ports.P.pressure=Math.max(s.ports.P.pressure||0,sim.global?.pressure||0);
  s.ports.A.pressure=s.ports.P.pressure;
  s.ports.B.pressure=0;
  s.ports.T.pressure=0;

  s.ports.P.flow=q;
  s.ports.A.flow=q;
  s.ports.B.flow=-q;
  s.ports.T.flow=-q;
 }
 else if(c.position==="retract"){
  s.ports.P.pressure=Math.max(s.ports.P.pressure||0,sim.global?.pressure||0);
  s.ports.B.pressure=s.ports.P.pressure;
  s.ports.A.pressure=0;
  s.ports.T.pressure=0;

  s.ports.P.flow=q;
  s.ports.B.flow=q;
  s.ports.A.flow=-q;
  s.ports.T.flow=-q;
 }
 else{
  if(c.centre==="float"){
   s.ports.P.pressure=sim.global?.pressure||0;
   s.ports.A.pressure=0;
   s.ports.B.pressure=0;
   s.ports.T.pressure=0;
  }else{
   s.ports.P.pressure=sim.global?.pressure||0;
   s.ports.A.pressure=0;
   s.ports.B.pressure=0;
   s.ports.T.pressure=0;
  }

  s.ports.P.flow=0;
  s.ports.A.flow=0;
  s.ports.B.flow=0;
  s.ports.T.flow=0;
 }
}

function solveMotor(c,totalPumpFlow){
 const s=sim[c.id];
 const q=Math.min(totalPumpFlow,300);
 const deltaP=Math.max(0,(s.ports.A.pressure||sim.global?.pressure||0)-(s.ports.B.pressure||0));

 const theoreticalTorque=deltaP*10*c.displacement/(2*Math.PI);
 const torque=theoreticalTorque*(c.efficiency||.9);
 const rpm=Math.min(c.speedLimit,q*1000/c.displacement);

 s.torque=torque;
 s.rpm=rpm;
 s.power=deltaP*q/600;

 s.ports.A.flow=q;
 s.ports.B.flow=-q;
}

function solveAccumulator(c,totalPumpFlow){
 const s=sim[c.id];
 const p=s.ports.P.pressure||0;
 s.energyPressure=p;
 s.charging=p>c.precharge;
}

/* =========================================================
   DIAGNOSTICS
========================================================= */

function diagnostics(){
 const d=[];

 if(!hasTank())
  d.push(["bad","NO TANK","Circuit has no tank/reference return."]);

 if(!hasPump())
  d.push(["bad","NO PUMP","No hydraulic pump is present."]);

 if(hasPump()&&hasTank()){
  const q=sim.global?.pumpFlow||0;
  const p=sim.global?.pressure||0;

  if(p>300)
   d.push(["bad","EXCESSIVE PRESSURE",`System pressure ${fmt(p)} bar exceeds 300 bar.`]);

  if(sim.global?.relief)
   d.push(["warn","RELIEF VALVE OPEN",`Relief is dumping flow at ${fmt(p)} bar.`]);

  if(q>250)
   d.push(["warn","HIGH PUMP FLOW",`${fmt(q)} L/min is being generated.`]);

  if(p<1&&q>1)
   d.push(["warn","LOW LOAD PRESSURE","Pump is flowing but system pressure is very low."]);
 }

 components.forEach(c=>{
  const s=sim[c.id];
  if(!s)return;

  if(c.type==="cylinder"){
   if(!connectedPorts(c,"A").length&&!connectedPorts(c,"B").length)
    d.push(["bad","CYLINDER DISCONNECTED",c.name]);

   if(Math.abs(s.velocity)>c.maxSpeed*.95)
    d.push(["warn","CYLINDER HIGH SPEED",`${c.name}: ${fmt(s.velocity,0)} mm/s`]);

   if(c.position<=1&&s.velocity<0)
    d.push(["warn","CYLINDER AT RETRACT END",c.name]);

   if(c.position>=c.stroke-1&&s.velocity>0)
    d.push(["warn","CYLINDER AT EXTEND END",c.name]);
  }

  if(c.type==="filter"){
   const q=Math.abs(s.ports.IN?.flow||0);
   const dp=s.deltaP||0;

   if(dp>5)
    d.push(["warn","FILTER PRESSURE DROP",`${c.name}: ${fmt(dp,1)} bar`]);

   if(q>120)
    d.push(["warn","FILTER FLOW HIGH",`${c.name}: ${fmt(q,1)} L/min`]);
  }

  if(c.type==="valve43"||c.type==="valve42"){
   if(c.position==="centre")
    d.push(["warn","DIRECTIONAL VALVE CENTRED",c.name]);
  }

  if(c.type==="motor"&&s.torque<c.loadTorque&&s.rpm>10)
   d.push(["warn","MOTOR TORQUE LIMIT",`${c.name}: available ${fmt(s.torque,1)} Nm`]);
 });

 if(!d.length)
  d.push(["good","SYSTEM OK","No major simulation faults detected."]);

 return d;
}

 });

function componentMetrics(c,s){
 if(c.type==="cylinder"){
  const areaA=Math.PI*Math.pow(c.bore/2,2)/100;
  const areaB=Math.PI*(Math.pow(c.bore/2,2)-Math.pow(c.rod/2,2))/100;
  const pa=s.ports.A?.pressure||0;
  const pb=s.ports.B?.pressure||0;

  return `
   ${metric("A pressure",fmt(pa)+" bar")}
   ${metric("B pressure",fmt(pb)+" bar")}
   ${metric("Cap area",fmt(areaA,1)+" cm²")}
   ${metric("Rod area",fmt(areaB,1)+" cm²")}
   ${metric("Force",fmt(s.force||0,0)+" N")}
   ${metric("Velocity",fmt(s.velocity||0,1)+" mm/s")}
   ${metric("Position",fmt(c.position,1)+" mm")}
   ${metric("Hydraulic power",fmt((s.power||0),2)+" kW")}
  `;
 }

 if(c.type==="pump"||c.type==="variablePump"){
  return `
   ${metric("Pressure",fmt(s.pressure||0)+" bar")}
   ${metric("Theoretical flow",fmt(c.displacement*c.rpm/1000,1)+" L/min")}
   ${metric("Actual flow",fmt(s.flow||0,1)+" L/min")}
   ${metric("Displacement",c.displacement+" cc/rev")}
   ${metric("Speed",c.rpm+" rpm")}
   ${metric("Hydraulic power",fmt((s.pressure||0)*(s.flow||0)/600,2)+" kW")}
   ${metric("Efficiency",fmt((c.efficiency||0)*100,0)+" %")}
  `;
 }

 if(c.type==="motor"){
  return `
   ${metric("A pressure",fmt(s.ports.A?.pressure||0)+" bar")}
   ${metric("B pressure",fmt(s.ports.B?.pressure||0)+" bar")}
   ${metric("ΔP",fmt((s.ports.A?.pressure||0)-(s.ports.B?.pressure||0))+" bar")}
   ${metric("Torque",fmt(s.torque||0,1)+" Nm")}
   ${metric("Speed",fmt(s.rpm||0,0)+" rpm")}
   ${metric("Power",fmt(s.power||0,2)+" kW")}
  `;
 }

 if(c.type==="relief"){
  return `
   ${metric("Pressure",fmt(s.ports.P?.pressure||0)+" bar")}
   ${metric("Setting",c.setting+" bar")}
   ${metric("State",s.relief?"OPEN":"CLOSED")}
   ${metric("Dump flow",fmt(Math.abs(s.ports.P?.flow||0),1)+" L/min")}
  `;
 }

 if(c.type==="flowControl"||c.type==="throttleCheck"){
  return `
   ${metric("In pressure",fmt(s.ports.IN?.pressure||0)+" bar")}
   ${metric("Out pressure",fmt(s.ports.OUT?.pressure||0)+" bar")}
   ${metric("ΔP",fmt(s.deltaP||0)+" bar")}
   ${metric("Flow",fmt(Math.abs(s.ports.IN?.flow||0),1)+" L/min")}
   ${metric("Opening",c.opening+" %")}
  `;
 }

 if(c.type==="filter"){
  return `
   ${metric("In pressure",fmt(s.ports.IN?.pressure||0)+" bar")}
   ${metric("Out pressure",fmt(s.ports.OUT?.pressure||0)+" bar")}
   ${metric("Pressure drop",fmt(s.deltaP||0)+" bar")}
   ${metric("Flow",fmt(Math.abs(s.ports.IN?.flow||0),1)+" L/min")}
  `;
 }

 return `
  ${metric("Pressure",fmt(s.pressure||0)+" bar")}
  ${metric("Flow",fmt(Math.abs(s.flow||0),1)+" L/min")}
 `;
}

function portMetrics(c,s){
 return Object.keys(TYPES[c.type].ports).length?
 Object.entries(s.ports||{}).map(([p,v])=>

/* =========================================================
   CONNECTION SYSTEM
========================================================= */

function screenToWorld(clientX,clientY){
 const rect=document.getElementById("canvas").getBoundingClientRect();
 return {
  x:(clientX-rect.left)/zoom-panX,
  y:(clientY-rect.top)/zoom-panY
 };
}

function nearestPort(x,y,max=18){
 let best=null,dist=max;

 components.forEach(c=>{
  Object.keys(componentPorts(c)).forEach(p=>{
   const q=portPoint(c,p);
   const d=Math.hypot(q.x-x,q.y-y);
   if(d<dist){
    dist=d;
    best={id:c.id,port:p};
   }
  });
 });

 return best;
}

function componentPointerDown(e,c){
 e.stopPropagation();

 const p=screenToWorld(e.clientX,e.clientY);
 const port=nearestPort(p.x,p.y,13);

 if(port&&port.id===c.id){
  if(!connectionMode){
   connectionMode=port;
   document.getElementById("canvas").style.cursor="crosshair";
  }else{
   if(connectionMode.id!==port.id){
    createWire(connectionMode,port);
   }
   connectionMode=null;
   document.getElementById("canvas").style.cursor="default";
  }
  return;
 }

 selectedId=c.id;
 dragging={
  c,
  offsetX:p.x-c.x,
  offsetY:p.y-c.y
 };
 pointerStart={x:e.clientX,y:e.clientY};
 moved=false;
 c.__dragging=true;
}

function createWire(a,b){
 if(!a||!b||a.id===b.id)return;

 const duplicate=wires.some(w=>
  (w.from.id===a.id&&w.from.port===a.port&&w.to.id===b.id&&w.to.port===b.port)||
  (w.from.id===b.id&&w.from.port===b.port&&w.to.id===a.id&&w.to.port===a.port)
 );
 if(duplicate)return;

 wires.push({
  id:uid("w"),
  from:{...a},
  to:{...b}
 });

 pushHistory();
 render();
}

function clearWires(){
 wires=[];
 selectedId=null;
 pushHistory();
 render();
}

/* =========================================================
   CANVAS POINTER / ZOOM
========================================================= */

const canvas=document.getElementById("canvas");

canvas.addEventListener("pointermove",e=>{
 if(dragging){
  const p=screenToWorld(e.clientX,e.clientY);
  dragging.c.x=p.x-dragging.offsetX;
  dragging.c.y=p.y-dragging.offsetY;

  if(pointerStart && Math.hypot(e.clientX-pointerStart.x,e.clientY-pointerStart.y)>4)moved=true;
  render();
 }
});

canvas.addEventListener("pointerup",e=>{
 if(dragging){
  dragging.c.__dragging=false;
  dragging=null;
  pushHistory();
 }
});

canvas.addEventListener("pointerdown",e=>{
 if(e.target!==canvas)return;

 const p=screenToWorld(e.clientX,e.clientY);
 const port=nearestPort(p.x,p.y,14);

 if(port){
  connectionMode=port;
  return;
 }

 selectedId=null;
 updateInspector();
 render();
});

let pinchStart=null;

canvas.addEventListener("touchstart",e=>{
 if(e.touches.length===2){
  pinchStart={
   dist:distanceTouches(e.touches[0],e.touches[1]),
   zoom
  };
 }
},{passive:false});

canvas.addEventListener("touchmove",e=>{
 if(e.touches.length===2&&pinchStart){
  e.preventDefault();
  const d=distanceTouches(e.touches[0],e.touches[1]);
  zoom=clamp(pinchStart.zoom*d/pinchStart.dist,.35,2.5);
  updateZoom();
  render();
 }
},{passive:false});

canvas.addEventListener("touchend",e=>{
 if(e.touches.length<2)pinchStart=null;
});

function distanceTouches(a,b){
 return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
}

function zoomIn(){
 zoom=clamp(zoom*1.15,.35,2.5);
 updateZoom();
 render();
}

function zoomOut(){
 zoom=clamp(zoom/1.15,.35,2.5);
 updateZoom();
 render();
}

function updateZoom(){
 document.getElementById("zoomLabel").textContent=Math.round(zoom*100)+"%";
}

function fitCircuit(){
 if(!components.length)return;

 const xs=components.map(c=>c.x),ys=components.map(c=>c.y);
 const minX=Math.min(...xs)-180,maxX=Math.max(...xs)+180;
 const minY=Math.min(...ys)-130,maxY=Math.max(...ys)+130;

 const rect=document.getElementById("canvas").getBoundingClientRect();
 const zx=rect.width/(maxX-minX);
 const zy=rect.height/(maxY-minY);

 zoom=clamp(Math.min(zx,zy),.35,1.4);
 panX=-minX+(rect.width/zoom-(maxX-minX))/2;
 panY=-minY+(rect.height/zoom-(maxY-minY))/2;

 updateZoom();
 render();
}

function toggleSimulation(){
 running=!running;

 document.body.classList.toggle("running",running);
 document.getElementById("runText").textContent=running?"Stop":"Run";
 document.getElementById("statusSim").textContent=running?"Running":"Stopped";
 document.getElementById("mobileRun").textContent=running?"■":"▶";

 if(running){
  if(!Object.keys(sim).length)initSim();
 }
}

function resetSimulation(){
 components.forEach(c=>{
  if(c.type==="cylinder")c.position=Number(c.position)||0;
 });

 initSim();
 simTime=0;
 render();
}

function animationLoop(now){
 const dt=Math.min(50,now-lastFrame);
 lastFrame=now;

 if(running){
  simTime+=dt/1000;

  solveHydraulics(dt);

  // smooth local values
  components.forEach(c=>{
   const s=sim[c.id];
   if(!s)return;
   s.pressure*=.94;
   s.pressure+=(Math.max(...Object.values(s.ports).map(p=>p.pressure||0),0))*.06;
  });

  render();
 }

 requestAnimationFrame(animationLoop);
}

requestAnimationFrame(animationLoop);

/* =========================================================
   HISTORY
========================================================= */

function snapshot(){
 return JSON.stringify({components,wires});
}

function pushHistory(){
 const snap=snapshot();

 if(history[historyIndex]===snap)return;

 history=history.slice(0,historyIndex+1);
 history.push(snap);

 if(history.length>50)history.shift();

 historyIndex=history.length-1;
}

function restoreSnap(s){
 const data=JSON.parse(s);
 components=data.components||[];
 wires=data.wires||[];
 selectedId=null;
 initSim();
 render();
}

function undo(){
 if(historyIndex<=0)return;
 historyIndex--;
 restoreSnap(history[historyIndex]);
}

function redo(){
 if(historyIndex>=history.length-1)return;
 historyIndex++;
 restoreSnap(history[historyIndex]);
}

/* =========================================================
   SAVE / LOAD
========================================================= */

function saveCircuit(){
 const data={
  version:5,
  app:"Hydraulic Studio",
  date:new Date().toISOString(),
  components,
  wires
 };

 localStorage.setItem("hydraulicStudioCircuit",JSON.stringify(data));

 // Also expose import/export text
 document.getElementById("jsonText").value=JSON.stringify(data,null,2);
 document.getElementById("jsonModal").classList.add("show");
}

function loadCircuit(){
 const raw=localStorage.getItem("hydraulicStudioCircuit");

 if(!raw){
  alert("No saved circuit found on this device.");
  return;
 }

 try{
  const data=JSON.parse(raw);
  components=data.components||[];
  wires=data.wires||[];
  selectedId=null;
  initSim();
  pushHistory();
  render();
  fitCircuit();
 }catch(e){
  alert("Could not load circuit.");
 }
}

function importJSON(){
 try{
  const data=JSON.parse(document.getElementById("jsonText").value);
  components=data.components||[];
  wires=data.wires||[];
  closeModal();
  selectedId=null;
  initSim();
  pushHistory();
  render();
  fitCircuit();
 }catch(e){
  alert("Invalid circuit data.");
 }
}

function closeModal(){
 document.getElementById("jsonModal").classList.remove("show");
}

function newCircuit(){
 if(!confirm("Clear the current circuit?"))return;

 components=[];
 wires=[];
 selectedId=null;
 initSim();
 pushHistory();
 render();
}

function loadExample(){
 components=[];
 wires=[];
 selectedId=null;

 const tank=addRaw("tank",170,350,{name:"Main Tank"});
 const pump=addRaw("variablePump",350,350,{
  name:"Variable Piston Pump",
  displacement:32,
  rpm:1450,
  efficiency:.92,
  swash:75,
  compensator:250
 });

 const filter=addRaw("filter",500,350,{
  name:"Return/Pressure Filter",
  rating:150,
  restriction:.3
 });

 const valve=addRaw("valve43",690,350,{
  name:"4/3 Directional Valve",
  position:"extend",
  centre:"closed",
  flowRating:120
 });

 const cyl=addRaw("cylinder",930,330,{
  name:"Main Cylinder",
  bore:100,
  rod:50,
  stroke:500,
  load:50000,
  friction:1500,
  position:100,
  maxSpeed:300
 });

 const relief=addRaw("relief",500,510,{
  name:"Main Relief Valve",
  setting:210,
  cracking:.5,
  flowRating:120
 });

 const gauge=addRaw("gauge",350,220,{
  name:"Pump Pressure Gauge"
 });

 const flow=addRaw("flowmeter",800,470,{
  name:"Cylinder Flow Meter"
 });

 createWireRaw(pump,"OUT",filter,"IN");
 createWireRaw(filter,"OUT",valve,"P");

 createWireRaw(valve,"A",cyl,"A");
 createWireRaw(valve,"B",cyl,"B");

 createWireRaw(valve,"T",tank,"T");
 createWireRaw(cyl,"B",valve,"B");

 createWireRaw(pump,"IN",tank,"T");

 createWireRaw(relief,"P",filter,"OUT");
 createWireRaw(relief,"T",tank,"T");

 createWireRaw(gauge,"P",pump,"OUT");

 createWireRaw(flow,"IN",valve,"A");
 createWireRaw(flow,"OUT",cyl,"A");

 initSim();
 pushHistory();
 render();
 setTimeout(fitCircuit,50);
}

function addRaw(type,x,y,extra={}){
 const c={
  id:uid(),
  type,
  x,y,
  rotation:0,
  ...clone(TYPES[type].defaults),
  ...extra
 };
 components.push(c);
 return c;
}

function createWireRaw(a,ap,b,bp){
 wires.push({
  id:uid("w"),
  from:{id:a.id,port:ap},
  to:{id:b.id,port:bp}
 });
}

/* =========================================================
   COMPONENT LIBRARY
========================================================= */

function buildLibrary(){
 const grid=document.getElementById("componentGrid");

 grid.innerHTML=typeOrder.map(t=>
  `<button class="comp" onclick="addComponent('${t}',300-panX,250-panY)">
   <span class="compIcon">${TYPES[t].icon}</span>${TYPES[t].name}
  </button>`
 ).join("");
}

/* =========================================================
   COUNTERS / STATUS
========================================================= */

function updateCounts(){
 document.getElementById("componentCount").textContent=components.length;
 document.getElementById("connectionCount").textContent=wires.length;

 document.getElementById("statusPressure").textContent=
  fmt(sim.global?.pressure||0)+" bar";

 document.getElementById("statusFlow").textContent=
  fmt(sim.global?.pumpFlow||0,1)+" L/min";
}

function toggleFlowVisual(){
 flowVisual=!flowVisual;
 document.getElementById("flowToggle").textContent="Flow "+(flowVisual?"✓":"×");
 render();
}

function togglePressureVisual(){
 pressureVisual=!pressureVisual;
 document.getElementById("pressureToggle").textContent="Pressure "+(pressureVisual?"✓":"×");
 render();
}

/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener("keydown",e=>{
 const key=e.key.toLowerCase();

 if((e.ctrlKey||e.metaKey)&&key==="z"){
  e.preventDefault();undo();
 }

 if((e.ctrlKey||e.metaKey)&&key==="y"){
  e.preventDefault();redo();
 }

 if(e.key==="Delete"||e.key==="Backspace"){
  if(selectedId)deleteSelected();
 }

 if(e.code==="Space"){
  e.preventDefault();
  toggleSimulation();
 }
});

/* =========================================================
   INITIALISE
========================================================= */

buildLibrary();
initSim();
pushHistory();
render();

/* Automatically load example if nothing exists */
if(!localStorage.getItem("hydraulicStudioCircuit")){
 loadExample();
}else{
 render();
}

/*
  NOTE:
  This simulator is a browser-based engineering approximation.
  It models hydraulic relationships using a quasi-steady network
  solver rather than a commercial CFD/FluidSIM-grade physical solver.
*/
</script>
