<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Hydraulic Studio</title>

<style>
*{box-sizing:border-box}
html,body{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;
 font-family:Arial,Helvetica,sans-serif;
 background:#0b1020;
 color:#e5e7eb;
}
button,input,select{font:inherit}
button{cursor:pointer}

#app{
 width:100%;
 height:100%;
 display:flex;
 flex-direction:column;
}

#topbar{
 height:58px;
 min-height:58px;
 background:#111827;
 border-bottom:1px solid #263244;
 display:flex;
 align-items:center;
 gap:8px;
 padding:6px 10px;
 z-index:20;
}

.logo{
 font-weight:800;
 font-size:17px;
 color:#fff;
 margin-right:8px;
 white-space:nowrap;
}

.topBtn{
 height:38px;
 border:1px solid #334155;
 background:#1f2937;
 color:#e5e7eb;
 border-radius:7px;
 padding:0 12px;
 font-weight:600;
}
.topBtn:hover{background:#293548}
.topBtn.active{
 background:#2563eb;
 border-color:#3b82f6;
}

#modeSwitch{
 display:flex;
 margin-left:auto;
 border:1px solid #334155;
 border-radius:7px;
 overflow:hidden;
}
#modeSwitch button{
 height:36px;
 border:0;
 padding:0 12px;
 background:#1f2937;
 color:#cbd5e1;
}
#modeSwitch button.active{
 background:#2563eb;
 color:#fff;
}

#workspace{
 flex:1;
 min-height:0;
 display:flex;
}

#library{
 width:255px;
 min-width:255px;
 background:#111827;
 border-right:1px solid #263244;
 display:flex;
 flex-direction:column;
 z-index:10;
}

.panelTitle{
 padding:12px 14px;
 font-size:14px;
 font-weight:800;
 border-bottom:1px solid #263244;
}

#search{
 margin:10px;
 height:38px;
 border-radius:7px;
 border:1px solid #334155;
 background:#0b1220;
 color:#fff;
 padding:0 10px;
 outline:none;
}

#libraryScroll{
 overflow:auto;
 padding:4px 8px 16px;
}

.cat{
 margin:8px 0 4px;
 color:#94a3b8;
 font-size:11px;
 text-transform:uppercase;
 letter-spacing:.08em;
 font-weight:800;
}

.libItem{
 width:100%;
 min-height:52px;
 margin:4px 0;
 border:1px solid #293548;
 background:#172033;
 color:#e5e7eb;
 border-radius:7px;
 display:flex;
 align-items:center;
 gap:9px;
 padding:6px 8px;
 text-align:left;
}
.libItem:hover{
 background:#202c42;
 border-color:#3b82f6;
}
.libIcon{
 width:38px;
 height:38px;
 border-radius:5px;
 background:#0b1220;
 display:flex;
 align-items:center;
 justify-content:center;
 flex-shrink:0;
}
.libName{
 font-size:12px;
 font-weight:700;
}
.libSub{
 font-size:10px;
 color:#94a3b8;
 margin-top:2px;
}

#main{
 flex:1;
 min-width:0;
 min-height:0;
 position:relative;
 background:#f4f6f8;
 overflow:hidden;
}

#canvas{
 position:absolute;
 inset:0;
 width:100%;
 height:100%;
 touch-action:none;
 user-select:none;
}

#rightPanel{
 width:295px;
 min-width:295px;
 background:#111827;
 border-left:1px solid #263244;
 overflow:auto;
 z-index:10;
}

.inspector{
 padding:12px;
}

.section{
 border:1px solid #293548;
 background:#151e2e;
 border-radius:8px;
 padding:10px;
 margin-bottom:10px;
}

.section h3{
 margin:0 0 9px;
 font-size:12px;
 color:#cbd5e1;
 text-transform:uppercase;
 letter-spacing:.06em;
}

.row{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:7px;
 margin-bottom:7px;
}

.field{
 display:flex;
 flex-direction:column;
 gap:4px;
}

.field.full{grid-column:1/-1}

.field label{
 font-size:10px;
 color:#94a3b8;
}

.field input,
.field select{
 width:100%;
 height:34px;
 background:#0b1220;
 color:#fff;
 border:1px solid #334155;
 border-radius:5px;
 padding:0 8px;
 outline:none;
}

.smallBtn{
 width:100%;
 height:34px;
 border:1px solid #334155;
 background:#1f2937;
 color:#e5e7eb;
 border-radius:5px;
}
.smallBtn:hover{background:#293548}

.danger{
 border-color:#7f1d1d;
 background:#3f1515;
}
.danger:hover{background:#5b1919}

#bottom{
 height:45px;
 min-height:45px;
 background:#111827;
 border-top:1px solid #263244;
 display:flex;
 align-items:center;
 gap:8px;
 padding:5px 9px;
 z-index:20;
}

.status{
 color:#94a3b8;
 font-size:11px;
 margin-left:auto;
 white-space:nowrap;
}

#mobileLibrary,
#mobileInspector{
 display:none;
}

@media(max-width:900px){

 #library,
 #rightPanel{
  display:none;
 }

 #mobileLibrary,
 #mobileInspector{
  display:block;
  position:absolute;
  top:8px;
  width:42px;
  height:42px;
  z-index:15;
  border:1px solid #334155;
  border-radius:7px;
  background:#111827;
  color:#fff;
 }

 #mobileLibrary{left:8px}
 #mobileInspector{right:8px}

 #bottom{
  overflow-x:auto;
 }

 #bottom .status{
  display:none;
 }

 .logo{
  font-size:14px;
 }

 .topBtn{
  padding:0 9px;
 }
}

#mobileDrawer{
 display:none;
 position:absolute;
 z-index:30;
 left:0;
 top:0;
 bottom:0;
 width:285px;
 background:#111827;
 border-right:1px solid #334155;
 box-shadow:10px 0 30px #0008;
}

#mobileDrawer.open{
 display:flex;
 flex-direction:column;
}

#mobileInspectorDrawer{
 display:none;
 position:absolute;
 z-index:30;
 right:0;
 top:0;
 bottom:0;
 width:300px;
 background:#111827;
 border-left:1px solid #334155;
 box-shadow:-10px 0 30px #0008;
 overflow:auto;
}

#mobileInspectorDrawer.open{
 display:block;
}

.drawerClose{
 margin:8px;
 height:38px;
 border:1px solid #334155;
 background:#1f2937;
 color:#fff;
 border-radius:6px;
}

#valveModal{
 display:none;
 position:fixed;
 inset:0;
 background:#0009;
 z-index:100;
 align-items:center;
 justify-content:center;
 padding:20px;
}

#valveModal.open{
 display:flex;
}

.modal{
 width:min(480px,100%);
 max-height:90vh;
 overflow:auto;
 background:#111827;
 border:1px solid #334155;
 border-radius:10px;
 padding:16px;
 box-shadow:0 20px 60px #000;
}

.modal h2{
 margin:0 0 14px;
}

.modalActions{
 display:flex;
 gap:8px;
 margin-top:15px;
}

.modalActions button{
 flex:1;
 height:40px;
 border-radius:6px;
 border:1px solid #334155;
 background:#1f2937;
 color:#fff;
}

.modalActions .primary{
 background:#2563eb;
 border-color:#3b82f6;
}

#toast{
 position:fixed;
 left:50%;
 bottom:70px;
 transform:translateX(-50%);
 background:#111827;
 border:1px solid #334155;
 color:#fff;
 padding:9px 14px;
 border-radius:7px;
 z-index:200;
 display:none;
 font-size:12px;
 box-shadow:0 8px 30px #0008;
}

svg text{
 font-family:Arial,Helvetica,sans-serif;
 pointer-events:none;
}

.gridLine{
 stroke:#d7dce2;
 stroke-width:1;
}

.gridMajor{
 stroke:#c4cad2;
 stroke-width:1.2;
}

.connection{
 fill:none;
 stroke-linecap:round;
 stroke-linejoin:round;
 pointer-events:stroke;
}

.connection.soft{stroke:#0ea5e9}
.connection.hard{stroke:#475569}
.connection.steel{stroke:#64748b}
.connection.flexible{stroke:#8b5cf6}

.connection.selected{
 stroke:#f59e0b;
 stroke-width:6;
}

.flowDot{
 fill:#f97316;
 pointer-events:none;
}

.componentBody{
 fill:#fff;
 stroke:#111827;
 stroke-width:2;
}

.componentSelected .componentBody{
 stroke:#2563eb;
 stroke-width:3;
}

.port{
 fill:#fff;
 stroke:#111827;
 stroke-width:2;
 cursor:pointer;
}

.port:hover{
 fill:#fbbf24;
}

.port.active{
 fill:#22c55e;
 stroke:#166534;
}

.componentLabel{
 fill:#111827;
 font-size:12px;
 font-weight:700;
 text-anchor:middle;
}

.componentValue{
 fill:#475569;
 font-size:9px;
 text-anchor:middle;
}

.valveBox{
 fill:#fff;
 stroke:#111827;
 stroke-width:2;
}

.simFlow{
 stroke:#f97316 !important;
 stroke-width:5 !important;
 stroke-dasharray:10 8;
 animation:flow .7s linear infinite;
}

@keyframes flow{
 to{stroke-dashoffset:-18}
}

.cylinderRod{
 fill:#cbd5e1;
 stroke:#334155;
 stroke-width:2;
}

.pumpSpin{
 transform-box:fill-box;
 transform-origin:center;
 animation:spin .8s linear infinite;
}

.motorSpin{
 transform-box:fill-box;
 transform-origin:center;
 animation:spin .5s linear infinite;
}

@keyframes spin{
 to{transform:rotate(360deg)}
}

#selectionInfo{
 font-size:11px;
 color:#94a3b8;
 line-height:1.45;
}

#simBadge{
 padding:4px 8px;
 border-radius:5px;
 background:#334155;
 color:#cbd5e1;
 font-size:10px;
 font-weight:800;
}

#simBadge.running{
 background:#166534;
 color:#dcfce7;
}
</style>
</head>

<body>

<div id="app">

<header id="topbar">

 <div class="logo">⚙ Hydraulic Studio</div>

 <button class="topBtn" id="undoBtn">↶</button>
 <button class="topBtn" id="redoBtn">↷</button>
 <button class="topBtn" id="fitBtn">Fit</button>
 <button class="topBtn" id="gridBtn">Grid</button>

 <button class="topBtn" id="saveBtn">Save</button>
 <button class="topBtn" id="loadBtn">Load</button>
 <button class="topBtn" id="exampleBtn">Example</button>

 <div id="modeSwitch">
  <button class="active" data-mode="hydraulic">Hydraulic</button>
  <button data-mode="pneumatic">Pneumatic</button>
 </div>

</header>

<div id="workspace">

<aside id="library">

 <div class="panelTitle">Component Library</div>

 <input id="search" placeholder="Search components...">

 <div id="libraryScroll"></div>

</aside>

<main id="main">

 <button id="mobileLibrary">☰</button>
 <button id="mobileInspector">☷</button>

 <svg id="canvas">

  <defs>

   <pattern id="gridSmall"
            width="20"
            height="20"
            patternUnits="userSpaceOnUse">

    <path d="M20 0H0V20"
          fill="none"
          class="gridLine"/>

   </pattern>

   <pattern id="gridLarge"
            width="100"
            height="100"
            patternUnits="userSpaceOnUse">

    <rect width="100"
          height="100"
          fill="url(#gridSmall)"/>

    <path d="M100 0H0V100"
          fill="none"
          class="gridMajor"/>

   </pattern>

  </defs>

  <rect id="background"
        x="-100000"
        y="-100000"
        width="200000"
        height="200000"
        fill="url(#gridLarge)"/>

  <g id="world"></g>

 </svg>

</main>

<aside id="rightPanel">

 <div class="panelTitle">Engineering Inspector</div>

 <div class="inspector" id="inspector">

  <div class="section">

   <h3>Selection</h3>

   <div id="selectionInfo">
    Select a component, port or hose.
   </div>

  </div>

 </div>

</aside>

</div>

<footer id="bottom">

 <button class="topBtn active" id="selectTool">Select</button>
 <button class="topBtn" id="hoseTool">Hose</button>
 <button class="topBtn" id="pipeTool">Hard Pipe</button>
 <button class="topBtn" id="deleteTool">Delete</button>
 <button class="topBtn" id="rotateTool">Rotate</button>
 <button class="topBtn" id="simBtn">▶ Simulate</button>

 <span id="simBadge">STOPPED</span>

 <span class="status" id="status">
  0 components · 0 connections
 </span>

</footer>

</div>

<div id="mobileDrawer">

 <button class="drawerClose" id="closeLibrary">
  Close Library
 </button>

 <input
  id="mobileSearch"
  style="margin:0 10px 10px;height:38px;background:#0b1220;border:1px solid #334155;border-radius:6px;color:white;padding:0 10px"
  placeholder="Search components..."
 >

 <div
  id="mobileLibraryScroll"
  style="overflow:auto;padding:4px 8px 16px">
 </div>

</div>

<div id="mobileInspectorDrawer">

 <button class="drawerClose" id="closeInspector">
  Close
 </button>

 <div
  class="inspector"
  id="mobileInspectorContent">
 </div>

</div>

<div id="valveModal">

 <div class="modal">

  <h2>Directional Valve Builder</h2>

  <div class="row">

   <div class="field">

    <label>Valve</label>

    <select id="vType">

     <option value="4/2">4/2</option>
     <option value="4/3">4/3</option>
     <option value="3/2">3/2</option>
     <option value="5/2">5/2</option>
     <option value="2/2">2/2</option>

    </select>

   </div>

   <div class="field">

    <label>Centre</label>

    <select id="vCentre">

     <option value="closed">Closed</option>
     <option value="open">Open</option>
     <option value="tandem">Tandem</option>
     <option value="float">Float</option>
     <option value="pt">P→T</option>
     <option value="ab">A/B→T</option>

    </select>

   </div>

  </div>

  <div class="row">

   <div class="field">

    <label>Actuation</label>

    <select id="vActuation">

     <option>Lever</option>
     <option>Solenoid</option>
     <option>Push Button</option>
     <option>Pilot</option>
     <option>Pedal</option>

    </select>

   </div>

   <div class="field">

    <label>Spring Return</label>

    <select id="vSpring">

     <option value="yes">Yes</option>
     <option value="no">No</option>

    </select>

   </div>

  </div>

  <div class="field full">

   <label>Valve position</label>

   <select id="vPosition">

    <option value="left">Left</option>
    <option value="centre">Centre</option>
    <option value="right">Right</option>

   </select>

  </div>

  <div class="modalActions">

   <button id="cancelValve">Cancel</button>
   <button class="primary" id="createValve">
    Create Valve
   </button>

  </div>

 </div>

</div>

<div id="toast"></div>

<script>
"use strict";

/* ============================================================
   HYDRAULIC STUDIO
   Clean single-file editor
   ============================================================ */

const svg=document.getElementById("canvas");
const world=document.getElementById("world");
const background=document.getElementById("background");

const state={
 mode:"hydraulic",

 components:[],
 connections:[],

 selected:null,
 selectedConnection:null,

 tool:"select",

 running:false,

 grid:true,

 nextId:1,

 history:[],
 future:[],

 hoseStart:null,

 drag:null,
 pan:null,

 camera:{
  x:0,
  y:0,
  zoom:1
 },

 simTime:0,
 lastTime:0
};

/* ============================================================
   COMPONENT LIBRARY
   ============================================================ */

const COMPONENTS=[

 {
  category:"Hydraulic Sources",
  items:[
   ["pump","Fixed Displacement Pump","Pump"],
   ["pumpVariable","Variable Displacement Pump","Pump"],
   ["reservoir","Reservoir","Tank"],
   ["accumulator","Accumulator","Energy storage"]
  ]
 },

 {
  category:"Hydraulic Actuators",
  items:[
   ["cylinder","Double Acting Cylinder","Cylinder"],
   ["singleCylinder","Single Acting Cylinder","Cylinder"],
   ["motor","Hydraulic Motor","Motor"]
  ]
 },

 {
  category:"Directional Valves",
  items:[
   ["directional","Directional Valve","4/3"],
   ["check","Check Valve","One-way"],
   ["pilotCheck","Pilot Operated Check","One-way"],
   ["shuttle","Shuttle Valve","OR"],
   ["sequence","Sequence Valve","Pressure"],
   ["counterbalance","Counterbalance Valve","Pressure"]
  ]
 },

 {
  category:"Pressure / Flow",
  items:[
   ["relief","Pressure Relief Valve","Pressure"],
   ["reducing","Pressure Reducing Valve","Pressure"],
   ["flow","Flow Control Valve","Flow"],
   ["needle","Needle Valve","Flow"],
   ["gauge","Pressure Gauge","0–250 bar"],
   ["flowmeter","Flow Meter","L/min"]
  ]
 },

 {
  category:"Filtration",
  items:[
   ["filter","Filter","10 micron"],
   ["strainer","Suction Strainer","Mesh"],
   ["cooler","Oil Cooler","Heat exchanger"],
   ["heater","Oil Heater","Heat"]
  ]
 },

 {
  category:"Pneumatic Sources",
  pneumatic:true,
  items:[
   ["compressor","Compressor","Air source"],
   ["airTank","Air Receiver","Tank"],
   ["frl","FRL Unit","Filter regulator lubricator"]
  ]
 },

 {
  category:"Pneumatic Actuators",
  pneumatic:true,
  items:[
   ["airCylinder","Pneumatic Cylinder","Cylinder"],
   ["airMotor","Pneumatic Motor","Motor"]
  ]
 },

 {
  category:"Pneumatic Valves",
  pneumatic:true,
  items:[
   ["pneumaticValve","Pneumatic Directional Valve","5/2"],
   ["airCheck","Pneumatic Check Valve","One-way"],
   ["airFlow","Pneumatic Flow Control","Flow"],
   ["airRelief","Air Relief Valve","Pressure"]
  ]
 },

 {
  category:"Instrumentation",
  items:[
   ["pressureSwitch","Pressure Switch","Switch"],
   ["tempSensor","Temperature Sensor","Sensor"],
   ["limitSwitch","Limit Switch","Sensor"],
   ["proximity","Proximity Sensor","Sensor"]
  ]
 }
];

/* ============================================================
   HELPERS
   ============================================================ */

function uid(prefix="C"){
 return prefix+(state.nextId++);
}

function clamp(v,min,max){
 return Math.max(min,Math.min(max,v));
}

function snap(v){
 if(!state.grid)return v;
 return Math.round(v/20)*20;
}

function clone(obj){
 return JSON.parse(JSON.stringify(obj));
}

function findComponent(id){
 return state.components.find(c=>c.id===id)||null;
}

function toast(message){

 const box=document.getElementById("toast");

 box.textContent=message;
 box.style.display="block";

 clearTimeout(toast.timer);

 toast.timer=setTimeout(()=>{
  box.style.display="none";
 },1800);
}

function escapeAttr(value){

 return String(value)
  .replace(/&/g,"&amp;")
  .replace(/"/g,"&quot;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;");
}

function componentTypeName(type){

 const names={

  pump:"Fixed Pump",
  pumpVariable:"Variable Pump",
  reservoir:"Reservoir",
  accumulator:"Accumulator",

  cylinder:"Double Cylinder",
  singleCylinder:"Single Cylinder",
  motor:"Hydraulic Motor",

  directional:"Directional Valve",
  check:"Check Valve",
  pilotCheck:"Pilot Check",
  shuttle:"Shuttle Valve",
  sequence:"Sequence Valve",
  counterbalance:"Counterbalance Valve",

  relief:"Relief Valve",
  reducing:"Reducing Valve",
  flow:"Flow Control",
  needle:"Needle Valve",

  gauge:"Pressure Gauge",
  flowmeter:"Flow Meter",

  filter:"Filter",
  strainer:"Strainer",
  cooler:"Cooler",
  heater:"Heater",

  compressor:"Compressor",
  airTank:"Air Receiver",
  frl:"FRL",

  airCylinder:"Pneumatic Cylinder",
  airMotor:"Pneumatic Motor",

  pneumaticValve:"Pneumatic Valve",
  airCheck:"Air Check",
  airFlow:"Air Flow Control",
  airRelief:"Air Relief",

  pressureSwitch:"Pressure Switch",
  tempSensor:"Temperature Sensor",
  limitSwitch:"Limit Switch",
  proximity:"Proximity Sensor"
 };

 return names[type]||type;
}

/* ============================================================
   CAMERA
   ============================================================ */

function worldToScreen(x,y){

 return{
  x:x*state.camera.zoom+state.camera.x,
  y:y*state.camera.zoom+state.camera.y
 };
}

function screenToWorld(clientX,clientY){

 const rect=svg.getBoundingClientRect();

 return{
  x:(clientX-rect.left-state.camera.x)/state.camera.zoom,
  y:(clientY-rect.top-state.camera.y)/state.camera.zoom
 };
}

function applyCamera(){

 const transform=
  `translate(${state.camera.x} ${state.camera.y}) scale(${state.camera.zoom})`;

 background.setAttribute(
  "transform",
  transform
 );

 world.setAttribute(
  "transform",
  transform
 );
}

function fitView(){

 if(!state.components.length){

  state.camera={
   x:svg.clientWidth/2,
   y:svg.clientHeight/2,
   zoom:1
  };

  applyCamera();
  render();

  return;
 }

 let minX=Infinity;
 let minY=Infinity;
 let maxX=-Infinity;
 let maxY=-Infinity;

 state.components.forEach(c=>{

  minX=Math.min(minX,c.x-120);
  minY=Math.min(minY,c.y-100);

  maxX=Math.max(maxX,c.x+120);
  maxY=Math.max(maxY,c.y+100);

 });

 const width=Math.max(300,maxX-minX);
 const height=Math.max(200,maxY-minY);

 const zoom=Math.min(
  svg.clientWidth/(width+80),
  svg.clientHeight/(height+80),
  1.4
 );

 state.camera.zoom=clamp(zoom,.3,2);

 state.camera.x=
  svg.clientWidth/2-
  (minX+width/2)*state.camera.zoom;

 state.camera.y=
  svg.clientHeight/2-
  (minY+height/2)*state.camera.zoom;

 applyCamera();
 render();
}

/* ============================================================
   PORTS
   ============================================================ */

function portDefs(c){

 switch(c.type){

  case "pump":
  case "pumpVariable":
  case "compressor":

   return[
    {id:"IN",x:-90,y:0,dir:"inout"},
    {id:"OUT",x:90,y:0,dir:"out"}
   ];

  case "reservoir":
  case "airTank":
  case "accumulator":

   return[
    {id:"P",x:0,y:-55,dir:"inout"}
   ];

  case "cylinder":
  case "airCylinder":

   return[
    {id:"A",x:-90,y:0,dir:"inout"},
    {id:"B",x:90,y:0,dir:"inout"}
   ];

  case "singleCylinder":

   return[
    {id:"A",x:-90,y:0,dir:"inout"}
   ];

  case "motor":
  case "airMotor":

   return[
    {id:"A",x:-75,y:0,dir:"inout"},
    {id:"B",x:75,y:0,dir:"inout"}
   ];

  case "directional":
  case "pneumaticValve":

   return[
    {id:"P",x:-90,y:0,dir:"inout"},
    {id:"T",x:90,y:0,dir:"inout"},
    {id:"A",x:0,y:-75,dir:"inout"},
    {id:"B",x:0,y:75,dir:"inout"}
   ];

  case "check":
  case "pilotCheck":
  case "airCheck":
  case "shuttle":
  case "sequence":
  case "counterbalance":
  case "relief":
  case "reducing":
  case "flow":
  case "needle":
  case "airFlow":
  case "airRelief":
  case "filter":
  case "strainer":
  case "cooler":
  case "heater":

   return[
    {id:"A",x:-65,y:0,dir:"inout"},
    {id:"B",x:65,y:0,dir:"inout"}
   ];

  case "gauge":
  case "flowmeter":
  case "pressureSwitch":
  case "tempSensor":
  case "limitSwitch":

   ];

   ];

  default:

   return[

    {id:"B",x:60,y:0,dir:"inout"}
   ];
 }
}

function transformPort(c,p){

 let x=p.x;
 let y=p.y;

 if(c.flipX)x=-x;
 if(c.flipY)y=-y;

 const angle=(c.rotation||0)*Math.PI/180;

 const rx=
  x*Math.cos(angle)-
  y*Math.sin(angle);

 const ry=
  x*Math.sin(angle)+
  y*Math.cos(angle);

 return{
  x:c.x+rx,
  y:c.y+ry,
  id:p.id,
  dir:p.dir
 };
}

function getPort(c,id){

 const p=portDefs(c).find(x=>x.id===id);

 return p?transformPort(c,p):null;
}

function nearestPort(worldPos,maxDistance=30){

 let best=null;
 let bestDistance=maxDistance;

 state.components.forEach(c=>{

  portDefs(c).forEach(p=>{

   const q=transformPort(c,p);

   const distance=
    Math.hypot(
     q.x-worldPos.x,
     q.y-worldPos.y
    );

   if(distance<bestDistance){

    bestDistance=distance;

    best={
     component:c,
     port:p
    };
   }

  });

 });

 return best;
}

 const c={

  id:uid(),

  type:type,

  x:snap(x),
  y:snap(y),

  rotation:0,

  flipX:false,
  flipY:false,

  label:componentTypeName(type),

  params:{
   ...defaultParams(type),
   ...extra
  },

  sim:{
   pressure:0,
   flow:0,
   position:0,
   speed:0,
   active:false
  }
 };

 state.components.push(c);

 state.selected=c.id;
 state.selectedConnection=null;

 return c;
}

function addComponent(type){

 const centre=screenToWorld(
  svg.clientWidth/2,
  svg.clientHeight/2
 );

 if(type==="directional"){

  openValveBuilder();

  return;
 }

 if(type==="pneumaticValve"){

  const c=createComponent(
   type,
   centre.x,
   centre.y
  );

  historyPush();

  render();

  toast("Pneumatic valve added");

  return;
 }

 createComponent(
  type,
  centre.x,
  centre.y
 );

 historyPush();

 render();

 toast(
  `${componentTypeName(type)} added`
 );
}

let editingValve=null;

function openValveBuilder(existing=null){

 editingValve=existing;

 const modal=document.getElementById("valveModal");

 if(existing){

  document.getElementById("vType").value=
   existing.params.valveType||"4/3";

   existing.params.centre||"closed";

  document.getElementById("vActuation").value=
   existing.params.actuation||"Lever";

  document.getElementById("vSpring").value=
   existing.params.spring||"yes";

  document.getElementById("vPosition").value=
   existing.params.position||"centre";

  document.getElementById("vType").value="4/3";
  document.getElementById("vCentre").value="closed";
  document.getElementById("vActuation").value="Lever";
  document.getElementById("vSpring").value="yes";
  document.getElementById("vPosition").value="centre";

 editingValve=null;

 document
  .getElementById("valveModal")
  .classList.remove("open");
}

   document.getElementById("vType").value,

   document.getElementById("vActuation").value,

 };

 closeValveBuilder();

 render();

 toast("Directional valve created");
};

/* ============================================================
   HISTORY
   ============================================================ */

function snapshot(){

 return{
  components:clone(state.components),
  connections:clone(state.connections),
  nextId:state.nextId
 };
}

function restore(snapshotData){

 state.components=
  clone(snapshotData.components||[]);

 state.connections=
  clone(snapshotData.connections||[]);

 state.nextId=
  snapshotData.nextId||1;

 state.selected=null;
 state.selectedConnection=null;
 state.hoseStart=null;

 render();
}

function historyPush(){

 state.history.push(snapshot());

 if(state.history.length>50){
  state.history.shift();
 }

 state.future=[];
}

function undo(){

 if(!state.history.length){
  return;
 }

 state.future.push(snapshot());

 const previous=state.history.pop();

 restore(previous);
}

function redo(){

 if(!state.future.length){
  return;
 }

 state.history.push(snapshot());

 const next=state.future.pop();

 restore(next);
}

/* ============================================================
   SVG
   ============================================================ */

function el(name,attrs={},text=""){

 const element=
  document.createElementNS(
   "http://www.w3.org/2000/svg",
   name
  );

 Object.entries(attrs).forEach(([key,value])=>{
  element.setAttribute(key,value);
 });

 if(text){
  element.textContent=text;
 }

 return element;
}

function group(attrs={}){

 return el("g",attrs);
}

   ============================================================ */

function drawSymbol(c,parent){

 const transform=
  `translate(${c.x} ${c.y})
   rotate(${c.rotation||0})
   scale(${c.flipX?-1:1} ${c.flipY?-1:1})`;

 const symbol=group({
  transform:transform
 });

 parent.appendChild(symbol);

 switch(c.type){

  case "pump":
  case "pumpVariable":
   drawPump(symbol,c);
   break;

  case "compressor":
   drawCompressor(symbol,c);
   break;

  case "reservoir":
  case "airTank":
   drawTank(symbol,c);
   break;

  case "accumulator":
   drawAccumulator(symbol,c);
   break;

  case "cylinder":
  case "singleCylinder":
  case "airCylinder":
   drawCylinder(symbol,c);
   break;

  case "motor":
  case "airMotor":
   drawMotor(symbol,c);
   break;

  case "directional":
  case "pneumaticValve":
   drawDirectional(symbol,c);
   break;

  case "check":
  case "pilotCheck":
  case "airCheck":
   drawCheck(symbol,c);
   break;

  case "relief":
  case "airRelief":
  case "sequence":
  case "counterbalance":
  case "reducing":
   drawPressureValve(symbol,c);
   break;

  case "flow":
  case "needle":
  case "airFlow":
   drawFlowValve(symbol,c);
   break;

  case "filter":
  case "strainer":
   drawFilter(symbol,c);
   break;

  case "cooler":
   drawCooler(symbol,c);
   break;

  case "heater":
   drawHeater(symbol,c);
   break;

  case "gauge":
  case "flowmeter":
  case "pressureSwitch":
   drawGauge(symbol,c);
   break;

  case "tempSensor":
  case "limitSwitch":
  case "proximity":
   drawSensor(symbol,c);
   break;

  case "frl":
   drawFRL(symbol,c);
   break;

  default:
   drawGeneric(symbol,c);
 }

 drawLabels(symbol,c);
 drawPorts(symbol,c);

 if(c.sim.active&&state.running){

  symbol.appendChild(
   el("circle",{
    cx:0,
    cy:-48,
    r:5,
    fill:"#22c55e"
   })
  );
 }

 symbol.addEventListener("pointerdown",event=>{

  event.stopPropagation();

  if(
   state.tool==="hose"||
   state.tool==="pipe"
  ){
   return;
  }

  selectComponent(c.id);

  if(state.tool==="delete"){

   deleteComponent(c.id);

   return;
  }

  if(state.tool==="rotate"){

   historyPush();

   c.rotation=
    ((c.rotation||0)+90)%360;

   state.tool="select";

   updateToolButtons();

   render();

   return;
  }

  if(event.button===2){
   return;
  }

  startComponentDrag(c,event);
 });

 symbol.addEventListener("dblclick",event=>{

  event.stopPropagation();

  if(
   c.type==="directional"||
   c.type==="pneumaticValve"
  ){

   openValveBuilder(c);

  }

 });

}

function drawPorts(symbol,c){

 const ports=group();

 portDefs(c).forEach(p=>{

  const port=el(
   "circle",
   {
    cx:p.x,
    cy:p.y,
    r:8,
    class:
     "port"+
     (
      state.hoseStart&&
      state.hoseStart.component===c.id&&
      state.hoseStart.port===p.id
       ?" active"
       :""
     ),
    "data-component":c.id,
    "data-port":p.id
   }
  );

  port.addEventListener(
   "pointerdown",
   event=>{
    event.stopPropagation();
    handlePortPointer(c,p,event);
   }
  );

  ports.appendChild(port);

  ports.appendChild(
   el(
    "text",
    {
     x:p.x,
     y:p.y-11,
     "font-size":"8",
     fill:"#475569",
     "text-anchor":"middle"
    },
    p.id
   )
  );

 });

 symbol.appendChild(ports);
}

  c.type==="airCylinder"
 ){
  return `${c.params.bore} / ${c.params.rod} mm · ${c.params.stroke} mm`;
 }

 if(
  c.type==="motor"||
  c.type==="airMotor"
 ){
  return `${c.params.displacement} cc/rev`;
 }

 if(
  c.type==="relief"||
  c.type==="reducing"
 ){
  return `${c.params.relief||c.params.reduction} bar`;

 if(c.type==="gauge"){

 if(c.type==="flowmeter"){

 return "";

/* ============================================================
   CONNECTIONS
   ============================================================ */

function handlePortPointer(c,p,event){

 if(state.tool==="delete"){

  deletePortConnections(c.id,p.id);

  return;
 }

 if(
  state.tool!=="hose"&&
  state.tool!=="pipe"
 ){

  state.tool="hose";
  updateToolButtons();
 }

 if(!state.hoseStart){

  state.hoseStart={
   component:c.id,
   port:p.id
  };

  render();

  toast(
   `Start: ${c.label} ${p.id}`
  );

  return;
 }

 const start=state.hoseStart;

 if(
  start.component===c.id&&
  start.port===p.id
 ){

  state.hoseStart=null;

  render();

  return;
 }

 if(
  connectionExists(
   start.component,
   start.port,
   c.id,
   p.id
  )
 ){

  state.hoseStart=null;

  render();

  toast("Those ports are already connected");

  return;
 }

 const from=findComponent(start.component);

 if(!from){

  state.hoseStart=null;
  render();

  return;
 }

 historyPush();

 state.connections.push({

  id:uid("H"),

  from:{
   component:start.component,
   port:start.port
  },

  to:{
   component:c.id,
   port:p.id
  },

  type:
   state.tool==="pipe"
    ?"hard"
    :"soft",

  diameter:
   state.tool==="pipe"
    ?16
    :12,

  length:1000,
  rating:250,

  flow:0,
  pressureDrop:0
 });

 state.hoseStart=null;

 render();

 toast("Connection created");
}

function connectionExists(a,ap,b,bp){

 return state.connections.some(h=>

  (
   h.from.component===a&&
   h.from.port===ap&&
   h.to.component===b&&
   h.to.port===bp
  )||

  (
   h.from.component===b&&
   h.from.port===bp&&
   h.to.component===a&&
   h.to.port===ap
  )
 );
}

function deletePortConnections(cid,pid){

 const before=
  state.connections.length;

 const remaining=
  state.connections.filter(h=>
   !(
    (
     h.from.component===cid&&
     h.from.port===pid
    )||
    (
     h.to.component===cid&&
     h.to.port===pid
    )
   )
  );

 if(
  remaining.length===before
 ){
  return;
 }

 historyPush();

 state.connections=remaining;

 state.selectedConnection=null;

 render();

 toast("Connection removed");
}

function drawConnections(){

 state.connections.forEach(h=>{

  const a=findComponent(h.from.component);
  const b=findComponent(h.to.component);

  if(!a||!b)return;

  const pa=getPort(a,h.from.port);
  const pb=getPort(b,h.to.port);

  if(!pa||!pb)return;

  const midpointX=
   (pa.x+pb.x)/2;

  const d=
   `M ${pa.x} ${pa.y}
    L ${midpointX} ${pa.y}
    L ${midpointX} ${pb.y}
    L ${pb.x} ${pb.y}`;

  const path=el(
   "path",
   {
    d:d,

    class:
     `connection ${h.type}`+
     (
      state.selectedConnection===h.id
       ?" selected"
       :""
     )+
     (
      state.running&&h.flow>0.01
       ?" simFlow"
       :""
     ),

    "stroke-width":
     h.type==="soft"
      ?4
      :3
   }
  );

  path.addEventListener(
   "pointerdown",
   event=>{

    event.stopPropagation();

    state.selectedConnection=h.id;
    state.selected=null;
    state.hoseStart=null;

    render();
   }
  );

  world.appendChild(path);

  if(
   state.running&&
   h.flow>0.01
  ){

   const dx=pb.x-pa.x;
   const dy=pb.y-pa.y;

   const length=
    Math.hypot(dx,dy);

   if(length>30){

    const progress=
     (state.simTime%1000)/1000;

    const x=
     pa.x+dx*progress;

    const y=
     pa.y+dy*progress;

    world.appendChild(
     el(
      "circle",
      {
       cx:x,
       cy:y,
       r:5,
       class:"flowDot"
      }
     )
    );
   }
  }
 });
}

/* ============================================================
   RENDER
   ============================================================ */

function render(){

 world.innerHTML="";

 drawConnections();

 state.components.forEach(c=>{

  const componentGroup=group({
   "data-id":c.id,
   class:
    state.selected===c.id
     ?"componentSelected"
     :""
  });

  drawSymbol(
   c,
   componentGroup
  );

  world.appendChild(componentGroup);
 });

 applyCamera();

 updateStatus();
 updateInspector();
}

 document.getElementById("status").textContent=

function bindInspector(root){

 root.querySelectorAll(
  "[data-field]"
 ).forEach(input=>{

  input.addEventListener(
   "change",
   ()=>{

    const c=
     findComponent(state.selected);

    if(!c)return;

    historyPush();

    const field=
     input.dataset.field;

    if(field==="label"){

     c.label=input.value;

    }else if(field==="x"){

     c.x=snap(
      Number(input.value)||0
     );

    }else if(field==="y"){

     c.y=snap(
      Number(input.value)||0
     );

    }else if(field==="rotation"){

     c.rotation=
      Number(input.value)||0;
    }

    render();
   }
  );
 });

 root.querySelectorAll(
  "[data-param]"
 ).forEach(input=>{

  input.addEventListener(
   "change",
   ()=>{

    const c=
     findComponent(state.selected);

    if(!c)return;

    historyPush();

    const key=
     input.dataset.param;

    let value=input.value;

    if(input.type==="number"){
     value=Number(value);
    }

    c.params[key]=value;

    render();
   }
  );
 });

 root.querySelectorAll(
  "[data-conn]"
 ).forEach(input=>{

  input.addEventListener(
   "change",
   ()=>{

    const h=
     state.connections.find(
      x=>x.id===state.selectedConnection
     );

    if(!h)return;

    historyPush();

    let value=input.value;

    if(input.type==="number"){
     value=Number(value);
    }

    h[input.dataset.conn]=value;

    render();
   }
  );
 });

 root.querySelectorAll(
  "[data-action]"
 ).forEach(button=>{

  button.addEventListener(
   "click",
   ()=>{

    const action=
     button.dataset.action;

    if(action==="flipX"){

     const c=
      findComponent(state.selected);

     if(c){

      historyPush();

      c.flipX=!c.flipX;

      render();
     }
    }

    if(action==="flipY"){

     const c=
      findComponent(state.selected);

     if(c){

      historyPush();

      c.flipY=!c.flipY;

      render();
     }
    }

    if(action==="deleteComponent"){

     deleteComponent(
      state.selected
     );
    }

    if(action==="deleteConnection"){

     if(!state.selectedConnection){
      return;
     }

     historyPush();

     state.connections=
      state.connections.filter(
       h=>h.id!==state.selectedConnection
      );

     state.selectedConnection=null;

     render();

     toast("Connection deleted");
    }

    if(action==="editValve"){

     const c=
      findComponent(state.selected);

     if(c){
      openValveBuilder(c);
     }
    }
   }
  );
 });
}

function deleteComponent(id){

 const component=
  findComponent(id);

 if(!component)return;

 historyPush();

 state.components=
  state.components.filter(
   c=>c.id!==id
  );

 state.connections=
  state.connections.filter(
   h=>
    h.from.component!==id&&
    h.to.component!==id
  );

 state.selected=null;
 state.selectedConnection=null;
 state.hoseStart=null;

 render();

 );
}

/* ============================================================
   DRAGGING
   ============================================================ */

function startComponentDrag(c,event){

 if(state.tool!=="select"){
  return;
 }

 const position=
  screenToWorld(
   event.clientX,
   event.clientY
  );

 state.drag={

  component:c,

  offsetX:
   position.x-c.x,

  offsetY:
   position.y-c.y,

  startX:c.x,
  startY:c.y,

  pointerId:event.pointerId
 };

 try{
  event.currentTarget.setPointerCapture(
   event.pointerId
  );
 }catch(error){}
}

function continueDrag(event){

 if(!state.drag)return;

 const c=
  state.drag.component;

 const position=
  screenToWorld(
   event.clientX,
   event.clientY
  );

 c.x=
  snap(
   position.x-state.drag.offsetX
  );

 c.y=
  snap(
   position.y-state.drag.offsetY
  );

 render();
}

function finishDrag(){

 if(!state.drag)return;

 const drag=state.drag;

 const moved=
  drag.startX!==drag.component.x||
  drag.startY!==drag.component.y;

 if(moved){

  const after=snapshot();

  state.history.push({
   components:after.components.map(c=>
    c.id===drag.component.id
     ?{
       ...c,
       x:drag.startX,
       y:drag.startY
      }
     :c
   ),

   connections:after.connections,

   nextId:after.nextId
  });

  if(state.history.length>50){
   state.history.shift();
  }

  state.future=[];
 }

 state.drag=null;

 render();
}

/* ============================================================
   POINTER / TOUCH
   ============================================================ */

svg.addEventListener(
 "pointerdown",
 event=>{

  if(event.target!==svg&&
     event.target!==background){
   return;
  }

  if(state.tool==="select"){

   state.selected=null;
   state.selectedConnection=null;
   state.hoseStart=null;

   render();
  }

  state.pan={
   x:event.clientX,
   y:event.clientY,

   cameraX:state.camera.x,
   cameraY:state.camera.y,

   pointerId:event.pointerId
  };

  try{
   svg.setPointerCapture(
    event.pointerId
   );
  }catch(error){}
 }
);

svg.addEventListener(
 "pointermove",
 event=>{

  if(state.drag){

   continueDrag(event);

   return;
  }

  if(
   state.pan&&
   state.pan.pointerId===event.pointerId
  ){

   state.camera.x=
    state.pan.cameraX+
    (
     event.clientX-
     state.pan.x
    );

   state.camera.y=
    state.pan.cameraY+
    (
     event.clientY-
     state.pan.y
    );

   applyCamera();
  }
 }
);

svg.addEventListener(
 "pointerup",
 event=>{

  if(
   state.drag&&
   state.drag.pointerId===event.pointerId
  ){

   finishDrag();
  }

  if(
   state.pan&&
   state.pan.pointerId===event.pointerId
  ){

   state.pan=null;
  }
 }
);

svg.addEventListener(
 "pointercancel",
 event=>{

  if(
   state.drag&&
   state.drag.pointerId===event.pointerId
  ){

   state.drag=null;
   render();
  }

  if(
   state.pan&&
   state.pan.pointerId===event.pointerId
  ){

   state.pan=null;
  }
 }
);

svg.addEventListener(
 "contextmenu",
 event=>{
  event.preventDefault();
 }
);

svg.addEventListener(
 "wheel",
 event=>{

  event.preventDefault();

  const before=
   screenToWorld(
    event.clientX,
    event.clientY
   );

  const factor=
   event.deltaY<0
    ?1.1
    :.9;

  state.camera.zoom=
   clamp(
    state.camera.zoom*factor,
    .25,
    3
   );

  const after=
   screenToWorld(
    event.clientX,
    event.clientY
   );

  state.camera.x+=
   (
    after.x-before.x
   )*
   state.camera.zoom;

  state.camera.y+=
   (
    after.y-before.y
   )*
   state.camera.zoom;

  applyCamera();

 },
 {passive:false}
);

   input.files&&input.files[0];

   new FileReader();

   try{

    const data=
     JSON.parse(
      reader.result
     );

     !Array.isArray(
      data.components
     )||
     !Array.isArray(
      data.connections
     )
    ){

     throw new Error(

 };

};

function simLoop(now){

 if(!state.running){
  return;
 }

 const dt=
  Math.min(
   .05,
   (now-state.lastTime)/1000||0
  );

 state.lastTime=now;

 state.simTime+=
  dt*1000;

 simulate(dt);

 render();

 requestAnimationFrame(
  simLoop
 );
}

function simulate(dt){

 state.components.forEach(c=>{

  c.sim.pressure=0;
  c.sim.flow=0;
  c.sim.speed=0;
  c.sim.active=false;

 });

 state.connections.forEach(h=>{

  h.flow=0;
  h.pressureDrop=0;

 });

 const sources=
  state.components.filter(c=>

   c.type==="pump"||
   c.type==="pumpVariable"||
   c.type==="compressor"
  );

 sources.forEach(source=>{

  if(
   source.params.fault==="failed"||
   source.params.fault==="cavitation"
  ){
   return;
  }

  source.sim.active=true;

  source.sim.pressure=
   Number(
    source.params.pressure
   )||0;

  source.sim.flow=
   Number(
    source.params.flow
   )||0;
 });

 propagateFlows();

 calculateConnectionLosses();

 simulateActuators(dt);
}

/* ============================================================
   FLOW PROPAGATION
   ============================================================ */

function propagateFlows(){

 const queue=[];
 const visited=new Set();

 state.components.forEach(c=>{

  if(
   c.type==="pump"||
   c.type==="pumpVariable"||
   c.type==="compressor"
  ){

   if(
    c.params.fault==="failed"||
    c.params.fault==="cavitation"
   ){
    return;
   }

   queue.push({
    id:c.id,
    pressure:
     Number(c.params.pressure)||0,
    flow:
     Number(c.params.flow)||0
   });
  }
 });

 while(queue.length){

  const node=
   queue.shift();

  const key=
   `${node.id}:${Math.round(node.pressure*10)}:${Math.round(node.flow*10)}`;

  if(visited.has(key)){
   continue;
  }

  visited.add(key);

  const component=
   findComponent(node.id);

  if(!component){
   continue;
  }

  component.sim.pressure=
   Math.max(
    component.sim.pressure,
    node.pressure
   );

  component.sim.flow=
   Math.max(
    component.sim.flow,
    node.flow
   );

  const links=
   state.connections.filter(h=>
    h.from.component===component.id||
    h.to.component===component.id
   );

  links.forEach(connection=>{

   const otherId=
    connection.from.component===
    component.id
     ?connection.to.component
     :connection.from.component;

   const other=
    findComponent(otherId);

   if(!other){
    return;
   }

   let flow=
    Math.max(
     0,
     node.flow
    );

   let pressure=
    Math.max(
     0,
     node.pressure
    );

   const type=
    connection.type;

   if(type==="soft"){
    pressure*=.985;
   }

   if(type==="hard"){
    pressure*=.995;
   }

   if(type==="steel"){
    pressure*=.997;
   }

   if(type==="flexible"){
    pressure*=.98;
   }

   const diameter=
    Number(connection.diameter)||12;

   if(diameter<6){
    flow*=.35;
   }else if(diameter<8){
    flow*=.5;
   }else if(diameter<12){
    flow*=.7;
   }else if(diameter<16){
    flow*=.88;
   }

   if(other.params.fault==="blocked"){
    flow=0;
   }

   if(
    other.type==="filter"||
    other.type==="strainer"
   ){

    if(
     other.params.fault==="blocked"
    ){
     flow=0;
    }else{
     flow*=.95;
    }
   }

   if(
    other.type==="flow"||
    other.type==="needle"||
    other.type==="airFlow"
   ){

    flow=
     Math.min(
      flow,
      Number(
       other.params.maxFlow
      )||60
     );
   }

   if(
    other.type==="reducing"
   ){

    pressure=
     Math.min(
      pressure,
      Number(
       other.params.reduction
      )||100
     );
   }

   if(
    other.type==="relief"||
    other.type==="airRelief"
   ){

    const setting=
     Number(
      other.params.relief
     )||180;

    if(
     pressure>setting
    ){

     flow*=.35;
    }
   }

   if(
    other.params.fault==="leak"
   ){

    flow*=.7;
   }

   if(
    other.params.fault==="burst"
   ){

    flow=0;
   }

   connection.flow=
    Math.max(
     connection.flow,
     flow
    );

   const loss=
    Math.max(
     0,
     node.pressure-pressure
    );

   connection.pressureDrop=
    Math.max(
     connection.pressureDrop,
     loss
    );

   if(flow>0){

    queue.push({
     id:other.id,
     pressure:pressure,
     flow:flow
    });
   }
  });
 }
}

/* ============================================================
   ACTUATORS
   ============================================================ */

function simulateActuators(dt){

 state.components.forEach(c=>{

  if(
   c.type==="cylinder"||
   c.type==="singleCylinder"||
   c.type==="airCylinder"
  ){

   const links=
    state.connections.filter(h=>
     h.from.component===c.id||
     h.to.component===c.id
    );

   let flowA=0;
   let flowB=0;

   links.forEach(h=>{

    const port=
     h.from.component===c.id
      ?h.from.port
      :h.to.port;

    if(port==="A"){

     flowA=
      Math.max(
       flowA,
       h.flow||0
      );
    }

    if(port==="B"){

     flowB=
      Math.max(
       flowB,
       h.flow||0
      );
    }
   });

   const bore=
    Math.max(
     1,
     Number(c.params.bore)||80
    );

   const rod=
    Math.max(
     0,
     Number(c.params.rod)||40
    );

   const area=
    Math.PI*
    bore*
    bore/
    4;

   const annularArea=
    Math.max(
     1,
     area-
     Math.PI*rod*rod/4
    );

   let direction=0;

   const valve=
    connectedDirectional(c.id);

   if(valve){

    const position=
     valve.params.position||
     "centre";

    if(
     valve.params.fault==="stuck"
    ){
     direction=0;
    }else if(position==="left"){
     direction=1;
    }else if(position==="right"){
     direction=-1;
    }else{
     direction=0;
    }

    if(
     position==="centre"&&
     valve.params.centre==="closed"
    ){
     direction=0;
    }

   }else{

    if(flowA>flowB){
     direction=1;
    }else if(flowB>flowA){
     direction=-1;
    }
   }

   if(
    c.params.fault==="leak"
   ){
    direction*=.35;
   }

   if(
    c.params.fault==="overload"
   ){
    direction*=.25;
   }

   const activeFlow=
    direction>0
     ?flowA
     :direction<0
      ?flowB
      :0;

   let speed=0;

   if(activeFlow>0){

    const activeArea=
     direction>0
      ?area
      :annularArea;

    speed=
     (
      activeFlow*
      1000000/
      60
     )/
     activeArea;
   }

   speed=
    clamp(
     speed,
     0,
     1000
    );

   c.sim.flow=
    Math.max(
     flowA,
     flowB
    );

   c.sim.speed=
    speed;

   c.sim.position=
    clamp(
     c.sim.position+
     direction*
     dt*
     Math.max(
      .05,
      speed/100
     ),
     0,
     1
    );

   const pressureA=
    flowA>0
     ?Math.min(
      Number(c.params.pressure)||210,
      flowA*3
     )
     :0;

   const pressureB=
    flowB>0
     ?Math.min(
      Number(c.params.pressure)||210,
      flowB*3
     )
     :0;

   c.sim.pressure=
    Math.max(
     pressureA,
     pressureB
    );

   c.sim.active=
    Math.abs(direction)>0&&
    activeFlow>0;
  }

  if(
   c.type==="motor"||
   c.type==="airMotor"
  ){

   const links=
    state.connections.filter(h=>
     h.from.component===c.id||
     h.to.component===c.id
    );

   let flow=0;

   links.forEach(h=>{
    flow=
     Math.max(
      flow,
      h.flow||0
     );
   });

   const displacement=
    Math.max(
     .1,
     Number(
      c.params.displacement
     )||40
    );

   const rpm=
    flow*
    1000/
    displacement;

   c.sim.flow=flow;
   c.sim.speed=rpm;
   c.sim.active=
    flow>0;

   c.sim.position=
    (
     c.sim.position+
     dt*rpm/60
    )%1;
  }
 });
}

function connectedDirectional(cid){

 const links=
  state.connections.filter(h=>
   h.from.component===cid||
   h.to.component===cid
  );

 for(
  const connection
  of links
 ){

  const otherId=
   connection.from.component===cid
    ?connection.to.component
    :connection.from.component;

  const other=
   findComponent(otherId);

  if(
   other&&
   (
    other.type==="directional"||
    other.type==="pneumaticValve"
   )
  ){

   return other;
  }
 }

 return null;
}

/* ============================================================
   PRESSURE LOSSES
   ============================================================ */

function calculateConnectionLosses(){

 state.connections.forEach(h=>{

  const diameter=
   Math.max(
    1,
    Number(h.diameter)||12
   );

  const length=
   Math.max(
    1,
    Number(h.length)||1000
   );

  const flow=
   Math.max(
    0,
    Number(h.flow)||0
   );

  const loss=
   .000015*
   length*
   Math.pow(flow,1.8)/
   Math.pow(diameter,4.8);

  h.pressureDrop=
   Math.max(
    0,
    loss
   );

  if(
   h.rating&&
   h.pressureDrop>h.rating
  ){

   h.pressureDrop=
    h.rating;
  }

  const from=
   findComponent(
    h.from.component
   );

  const to=
   findComponent(
    h.to.component
   );

  if(
   state.running&&
   (
    (
     from&&
     from.params.fault==="burst"
    )||
    (
     to&&
     to.params.fault==="burst"
    )
   )
  ){

   h.flow=0;
  }
 });
}

/* ============================================================
   KEYBOARD
   ============================================================ */

document.addEventListener(
 "keydown",
 event=>{

  if(event.key==="Escape"){

   state.hoseStart=null;
   state.drag=null;
   state.pan=null;

   closeValveBuilder();

   setTool("select");

   return;
  }

  if(
   (event.ctrlKey||event.metaKey)&&
   event.key.toLowerCase()==="z"
  ){

   event.preventDefault();

   undo();

   return;
  }

  if(
   (event.ctrlKey||event.metaKey)&&
   event.key.toLowerCase()==="y"
  ){

   event.preventDefault();

   redo();

   return;
  }

  if(
   event.key==="Delete"||
   event.key==="Backspace"
  ){

   if(state.selected){

    deleteComponent(
     state.selected
    );

   }else if(
    state.selectedConnection
   ){

    historyPush();

    state.connections=
     state.connections.filter(
      h=>
       h.id!==state.selectedConnection
     );

    state.selectedConnection=null;

    render();
   }

   return;
  }

  if(
   event.key.toLowerCase()==="r"&&
   state.selected
  ){

   const c=
    findComponent(
     state.selected
    );

   if(c){

    historyPush();

    c.rotation=
     ((c.rotation||0)+90)%360;

    render();
   }
  }
 }
);
