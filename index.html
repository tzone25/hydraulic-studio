<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hydraulic Studio">
<meta name="mobile-web-app-capable" content="yes">

<title>Hydraulic Studio</title>

<style>
:root{
  --bg:#0b1020;
  --panel:#111827;
  --panel2:#172033;
  --panel3:#1d2940;
  --line:#2b3954;
  --text:#eef4ff;
  --muted:#94a3b8;
  --accent:#4f8cff;
  --accent2:#6ea8ff;
  --green:#35d07f;
  --yellow:#f5c451;
  --red:#ff5d6c;
  --orange:#ff9b4a;
  --shadow:0 10px 30px rgba(0,0,0,.28);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

button,input,select{
  font:inherit;
}

button{
  color:var(--text);
}

#app{
  width:100%;
  height:100%;
  display:grid;
  grid-template-rows:58px 1fr 28px;
}

/* TOP BAR */

#topbar{
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px 12px;
  background:#0d1425;
  border-bottom:1px solid var(--line);
  z-index:50;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:190px;
}

.logo{
  width:36px;
  height:36px;
  border-radius:10px;
  background:linear-gradient(135deg,#377dff,#6e5bff);
  display:grid;
  place-items:center;
  font-size:20px;
  font-weight:900;
  box-shadow:0 5px 20px rgba(55,125,255,.3);
}

.brandText strong{
  display:block;
  font-size:15px;
}

.brandText span{
  color:var(--muted);
  font-size:10px;
}

.topActions{
  display:flex;
  align-items:center;
  gap:6px;
  margin-left:auto;
}

.btn{
  border:1px solid var(--line);
  background:var(--panel);
  border-radius:8px;
  padding:8px 11px;
  cursor:pointer;
  min-height:38px;
  font-size:12px;
}

.btn:hover{
  background:var(--panel3);
}

.btn.primary{
  background:var(--accent);
  border-color:var(--accent);
  font-weight:700;
}

.btn.success{
  background:#123c2b;
  border-color:#1c6c49;
}

.btn.danger{
  background:#421b24;
  border-color:#70313c;
}

.iconBtn{
  width:40px;
  height:40px;
  padding:0;
  display:grid;
  place-items:center;
  font-size:18px;
}

#main{
  min-height:0;
  display:grid;
  grid-template-columns:230px minmax(0,1fr) 300px;
}

/* DESKTOP LIBRARY */

#library{
  min-width:0;
  background:var(--panel);
  border-right:1px solid var(--line);
  overflow:auto;
  padding:10px;
}

.panelTitle{
  color:var(--muted);
  font-size:10px;
  font-weight:800;
  letter-spacing:1px;
  text-transform:uppercase;
  margin:5px 4px 9px;
}

.search{
  width:100%;
  background:#0c1322;
  border:1px solid var(--line);
  color:var(--text);
  padding:10px;
  border-radius:8px;
  outline:none;
  margin-bottom:10px;
}

.category{
  margin-bottom:14px;
}

.categoryTitle{
  color:#cbd5e1;
  font-size:11px;
  font-weight:800;
  margin:8px 4px;
}

.componentItem{
  display:flex;
  align-items:center;
  gap:9px;
  width:100%;
  padding:8px;
  margin:4px 0;
  border:1px solid transparent;
  background:#141d2e;
  border-radius:8px;
  cursor:pointer;
  text-align:left;
}

.componentItem:hover{
  border-color:var(--accent);
  background:#19263d;
}

.componentIcon{
  width:34px;
  height:34px;
  border-radius:7px;
  background:#0c1424;
  display:grid;
  place-items:center;
  font-size:17px;
  flex:none;
}

.componentInfo strong{
  display:block;
  font-size:11px;
}

.componentInfo span{
  display:block;
  color:var(--muted);
  font-size:9px;
  margin-top:2px;
}

/* WORKSPACE */

#workspace{
  position:relative;
  min-width:0;
  min-height:0;
  overflow:hidden;
  background:#0a1020;
  touch-action:none;
}

#canvas{
  width:100%;
  height:100%;
  display:block;
  touch-action:none;
}

.gridLine{
  stroke:#172238;
  stroke-width:1;
}

.gridMajor{
  stroke:#202d47;
  stroke-width:1;
}

.componentBody{
  fill:#131e31;
  stroke:#71809b;
  stroke-width:2;
}

.componentSelected{
  stroke:var(--accent);
  stroke-width:3;
}

.componentFault{
  stroke:var(--red);
  stroke-width:3;
}

.componentText{
  fill:#eef4ff;
  font-size:12px;
  font-weight:700;
  pointer-events:none;
}

.componentSub{
  fill:#8ea0ba;
  font-size:9px;
  pointer-events:none;
}

.port{
  fill:#0a1020;
  stroke:#dbeafe;
  stroke-width:2;
}

.port.connected{
  fill:var(--green);
  stroke:#d9ffe9;
}

.port.connecting{
  fill:var(--yellow);
  stroke:white;
  stroke-width:3;
}

.wire{
  fill:none;
  stroke:#7890b5;
  stroke-width:3;
}

.wire.active{
  stroke:var(--green);
}

.flowDot{
  fill:#54d8ff;
}

#workspaceTools{
  position:absolute;
  left:12px;
  top:12px;
  display:flex;
  gap:6px;
  z-index:10;
}

.workspaceTool{
  width:42px;
  height:42px;
  border:1px solid var(--line);
  border-radius:9px;
  background:rgba(17,24,39,.94);
  display:grid;
  place-items:center;
  font-size:17px;
  box-shadow:var(--shadow);
}

#connectionHint{
  position:absolute;
  top:12px;
  left:50%;
  transform:translateX(-50%);
  background:#473b13;
  border:1px solid #806d21;
  color:#fff0a8;
  border-radius:999px;
  padding:8px 14px;
  font-size:11px;
  display:none;
  z-index:20;
}

#connectionHint.show{
  display:block;
}

/* RIGHT PANEL */

#inspector{
  background:var(--panel);
  border-left:1px solid var(--line);
  overflow:auto;
  padding:10px;
}

.inspectorSection{
  background:#141d2e;
  border:1px solid var(--line);
  border-radius:9px;
  margin-bottom:10px;
  overflow:hidden;
}

.inspectorHeader{
  padding:10px;
  border-bottom:1px solid var(--line);
  font-size:11px;
  font-weight:800;
}

.inspectorBody{
  padding:10px;
}

.field{
  margin-bottom:9px;
}

.field label{
  display:block;
  color:var(--muted);
  font-size:10px;
  margin-bottom:5px;
}

.field input,
.field select{
  width:100%;
  background:#0c1322;
  border:1px solid var(--line);
  color:var(--text);
  padding:9px;
  border-radius:7px;
  outline:none;
}

.field input[type="range"]{
  padding:0;
}

.segmented{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:4px;
}

.segmented button{
  border:1px solid var(--line);
  background:#0c1322;
  border-radius:7px;
  min-height:38px;
  font-size:10px;
}

.segmented button.active{
  background:var(--accent);
  border-color:var(--accent);
}

.metricGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
}

.metric{
  background:#0c1322;
  border:1px solid var(--line);
  border-radius:8px;
  padding:9px;
}

.metric span{
  color:var(--muted);
  display:block;
  font-size:9px;
}

.metric strong{
  display:block;
  margin-top:3px;
  font-size:16px;
}

.diag{
  padding:8px;
  border-radius:7px;
  margin-bottom:6px;
  font-size:10px;
  border:1px solid var(--line);
}

.diag.good{
  background:#102b20;
  border-color:#1d6044;
}

.diag.warn{
  background:#322913;
  border-color:#6c5622;
}

.diag.bad{
  background:#351820;
  border-color:#6c2a38;
}

/* STATUS */

#status{
  background:#0d1425;
  border-top:1px solid var(--line);
  display:flex;
  align-items:center;
  gap:14px;
  padding:0 10px;
  color:var(--muted);
  font-size:10px;
}

.statusItem{
  display:flex;
  gap:5px;
  align-items:center;
}

.statusDot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--green);
}

.statusDot.off{
  background:#667085;
}

/* MOBILE */

#mobileTop,
#mobileNav,
#mobileSheet{
  display:none;
}

@media(max-width:850px){

  #app{
    display:block;
    position:relative;
    height:100%;
  }

  #topbar,
  #library,
  #inspector,
  #status{
    display:none;
  }

  #main{
    display:block;
    width:100%;
    height:100%;
  }

  #workspace{
    width:100%;
    height:100%;
    padding-top:58px;
    padding-bottom:72px;
  }

  #mobileTop{
    position:fixed;
    display:flex;
    align-items:center;
    top:0;
    left:0;
    right:0;
    height:58px;
    padding:
      env(safe-area-inset-top)
      10px
      6px
      10px;
    box-sizing:content-box;
    background:rgba(11,16,32,.96);
    border-bottom:1px solid var(--line);
    z-index:100;
    backdrop-filter:blur(14px);
  }

  .mobileBrand{
    display:flex;
    align-items:center;
    gap:8px;
  }

  .mobileLogo{
    width:34px;
    height:34px;
    border-radius:9px;
    display:grid;
    place-items:center;
    background:linear-gradient(135deg,#377dff,#6e5bff);
    font-weight:900;
  }

  .mobileBrand strong{
    font-size:14px;
  }

  .mobileBrand small{
    display:block;
    color:var(--muted);
    font-size:9px;
  }

  .mobileTopActions{
    margin-left:auto;
    display:flex;
    gap:6px;
  }

  .mobileTopBtn{
    min-width:42px;
    height:42px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--panel);
    display:grid;
    place-items:center;
    font-size:16px;
  }

  #mobileRun{
    background:#123c2b;
    border-color:#1d6848;
  }

  #mobileRun.running{
    background:#4b1d25;
    border-color:#74323e;
  }

  #workspaceTools{
    left:9px;
    top:68px;
  }

  .workspaceTool{
    width:44px;
    height:44px;
    border-radius:11px;
    font-size:18px;
  }

  #connectionHint{
    top:68px;
    max-width:calc(100% - 120px);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  #mobileNav{
    position:fixed;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    left:0;
    right:0;
    bottom:0;
    height:72px;
    padding-bottom:env(safe-area-inset-bottom);
    background:rgba(13,20,37,.98);
    border-top:1px solid var(--line);
    z-index:100;
    backdrop-filter:blur(14px);
  }

  .mobileNavBtn{
    border:0;
    background:none;
    color:var(--muted);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:4px;
    min-height:44px;
  }

  .mobileNavBtn span:first-child{
    font-size:20px;
  }

  .mobileNavBtn span:last-child{
    font-size:9px;
  }

  .mobileNavBtn.active{
    color:#fff;
  }

  .mobileNavBtn.active span:first-child{
    transform:scale(1.08);
  }

  #mobileSheet{
    position:fixed;
    display:block;
    left:0;
    right:0;
    bottom:0;
    height:auto;
    max-height:78%;
    background:#111827;
    border-top:1px solid var(--line);
    border-radius:18px 18px 0 0;
    z-index:90;
    transform:translateY(105%);
    transition:transform .22s ease;
    box-shadow:0 -20px 50px rgba(0,0,0,.45);
    overflow:hidden;
    padding-bottom:env(safe-area-inset-bottom);
  }

  #mobileSheet.open{
    transform:translateY(0);
  }

  .sheetHandle{
    width:42px;
    height:5px;
    border-radius:10px;
    background:#4b5568;
    margin:8px auto;
  }

  .sheetHeader{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:7px 14px 10px;
    border-bottom:1px solid var(--line);
  }

  .sheetHeader strong{
    font-size:14px;
  }

  .sheetClose{
    width:38px;
    height:38px;
    border-radius:9px;
    border:1px solid var(--line);
    background:var(--panel2);
  }

  .sheetContent{
    overflow:auto;
    max-height:calc(78vh - 70px);
    padding:12px;
    -webkit-overflow-scrolling:touch;
  }

  .mobileComponentSearch{
    margin-bottom:10px;
  }

  .mobileComponentGrid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:8px;
  }

  .mobileComponent{
    min-height:70px;
    border:1px solid var(--line);
    border-radius:11px;
    background:#172033;
    padding:9px;
    display:flex;
    align-items:center;
    gap:9px;
    text-align:left;
  }

  .mobileComponent:active{
    transform:scale(.98);
  }

  .mobileComponent .componentIcon{
    width:42px;
    height:42px;
    font-size:21px;
  }

  .mobileComponent strong{
    display:block;
    font-size:11px;
  }

  .mobileComponent small{
    display:block;
    color:var(--muted);
    font-size:9px;
    margin-top:3px;
  }

  .mobileToolGrid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
  }

  .bigTool{
    min-height:62px;
    border:1px solid var(--line);
    border-radius:11px;
    background:#172033;
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px;
  }

  .bigTool b{
    display:block;
    font-size:12px;
  }

  .bigTool small{
    color:var(--muted);
    display:block;
    margin-top:3px;
    font-size:9px;
  }

  .mobileMetrics{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
  }

  .mobileMetric{
    padding:14px;
    background:#0c1322;
    border:1px solid var(--line);
    border-radius:12px;
  }

  .mobileMetric span{
    color:var(--muted);
    font-size:10px;
  }

  .mobileMetric strong{
    display:block;
    font-size:23px;
    margin-top:5px;
  }

  .mobileMetric small{
    color:var(--muted);
  }

  .mobileRun{
    width:100%;
    min-height:62px;
    border-radius:13px;
    border:1px solid #286e4e;
    background:#123c2b;
    font-size:17px;
    font-weight:800;
    margin-bottom:9px;
  }

  .mobileRun.running{
    background:#481c25;
    border-color:#783440;
  }

  .mobileReset{
    width:100%;
    min-height:50px;
    border-radius:11px;
    border:1px solid var(--line);
    background:#172033;
  }

  .mobileField{
    margin-bottom:13px;
  }

  .mobileField label{
    display:block;
    color:var(--muted);
    font-size:11px;
    margin-bottom:6px;
  }

  .mobileField input,
  .mobileField select{
    width:100%;
    min-height:48px;
    background:#0c1322;
    color:white;
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 12px;
  }

  .mobileField input[type=range]{
    min-height:42px;
    padding:0;
  }

  .mobileSegment{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:6px;
  }

  .mobileSegment button{
    min-height:48px;
    background:#0c1322;
    border:1px solid var(--line);
    border-radius:9px;
    font-size:10px;
    font-weight:700;
  }

  .mobileSegment button.active{
    background:var(--accent);
    border-color:var(--accent);
  }

  .mobileSection{
    padding:12px;
    border:1px solid var(--line);
    border-radius:12px;
    background:#141d2e;
    margin-bottom:9px;
  }

  .mobileSectionTitle{
    font-size:11px;
    font-weight:800;
    margin-bottom:10px;
  }

  .mobileDiag{
    padding:10px;
    border-radius:9px;
    margin-bottom:7px;
    font-size:10px;
  }

  .mobileDiag.good{
    background:#102b20;
    border:1px solid #1d6044;
  }

  .mobileDiag.warn{
    background:#322913;
    border:1px solid #6c5622;
  }

  .mobileDiag.bad{
    background:#351820;
    border:1px solid #6c2a38;
  }

  .mobileActionRow{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
  }

  .mobileActionRow button{
    min-height:48px;
    border-radius:10px;
    border:1px solid var(--line);
    background:#172033;
  }

  .emptyState{
    color:var(--muted);
    text-align:center;
    padding:25px 10px;
    font-size:12px;
  }

  /* bigger SVG ports on mobile */
  .port{
    stroke-width:3;
  }

  .componentText{
    font-size:13px;
  }
}

@media(max-width:390px){
  .mobileComponentGrid{
    grid-template-columns:1fr;
  }

  .mobileTopBtn{
    min-width:38px;
  }

  .mobileBrand strong{
    font-size:13px;
  }
}

/* TOAST */

#toast{
  position:fixed;
  left:50%;
  bottom:85px;
  transform:translate(-50%,20px);
  background:#172033;
  border:1px solid var(--line);
  border-radius:10px;
  padding:10px 15px;
  font-size:11px;
  opacity:0;
  pointer-events:none;
  transition:.2s;
  z-index:300;
  box-shadow:var(--shadow);
}

#toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* MODAL */

#menuOverlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  z-index:200;
  display:none;
}

#menuOverlay.show{
  display:block;
}

#menu{
  position:absolute;
  right:10px;
  top:60px;
  width:240px;
  background:#111827;
  border:1px solid var(--line);
  border-radius:12px;
  box-shadow:var(--shadow);
  padding:7px;
}

.menuItem{
  width:100%;
  min-height:44px;
  border:0;
  background:none;
  text-align:left;
  border-radius:8px;
  padding:8px 10px;
}

.menuItem:hover{
  background:#172033;
}

.hidden{
  display:none!important;
}
</style>
</head>

<body>

<div id="app">

<header id="topbar">
  <div class="brand">
    <div class="logo">⚙</div>
    <div class="brandText">
      <strong>Hydraulic Studio</strong>
      <span>Engineering Hydraulic Simulation</span>
    </div>
  </div>

  <div class="topActions">
    <button class="btn" onclick="newProject()">New</button>
    <button class="btn" onclick="loadExample()">Example</button>
    <button class="btn" onclick="undo()">Undo</button>
    <button class="btn" onclick="redo()">Redo</button>
    <button class="btn" onclick="saveProject()">Save</button>
    <button class="btn" onclick="document.getElementById('fileInput').click()">Load</button>
    <button class="btn" onclick="runDiagnostics()">Diagnostics</button>
    <button id="desktopRun" class="btn success" onclick="toggleSimulation()">▶ Run</button>
  </div>
</header>

<div id="mobileTop">
  <div class="mobileBrand">
    <div class="mobileLogo">⚙</div>
    <div>
      <strong>Hydraulic Studio</strong>
      <small>Hydraulic Engineering</small>
    </div>
  </div>

  <div class="mobileTopActions">
    <button id="mobileRun" class="mobileTopBtn" onclick="toggleSimulation()">▶</button>
    <button class="mobileTopBtn" onclick="openMenu()">⋯</button>
  </div>
</div>

<main id="main">

  <aside id="library">
    <div class="panelTitle">Component Library</div>
    <input id="librarySearch" class="search" placeholder="Search components..." oninput="renderLibrary()">
    <div id="libraryContent"></div>
  </aside>

  <section id="workspace">

    <div id="workspaceTools">
      <button class="workspaceTool" title="Zoom in" onclick="zoomBy(1.2)">＋</button>
      <button class="workspaceTool" title="Zoom out" onclick="zoomBy(.8)">−</button>
      <button class="workspaceTool" title="Fit circuit" onclick="fitView()">⌗</button>
      <button class="workspaceTool" title="Cancel connection" onclick="cancelConnection()">×</button>
    </div>

    <div id="connectionHint">Tap another port to connect</div>

    <svg id="canvas">
      <g id="world">

/* =========================================================
   UTILITIES
========================================================= */

function uid(){
  return "c" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}

function clone(o){
  return JSON.parse(JSON.stringify(o));
}

function escapeHtml(v){
  return String(v)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");
}

function fmt(n,d=1){
  if(!Number.isFinite(n)) return "0";
  return Number(n).toFixed(d);
}

function clamp(v,a,b){
  return Math.max(a,Math.min(b,v));
}

function getC(id){
  return components.find(c=>c.id===id);
}

function componentName(c){
  return c?.name || COMPONENTS[c?.type]?.name || "Component";
}

/* =========================================================
   COMPONENT CREATION
========================================================= */

function makeComponent(type,x=0,y=0){

  const spec = COMPONENTS[type];

  return {
    id:uid(),
    type,
    x,
    y,
    w:130,
    h:80,
    name:spec.name,
    params:clone(spec.defaults),
    fault:null,
    state:{
      pressureA:0,
      pressureB:0,
      flow:0,
      speed:0,
      temperature:25
    }
  };
}

/* =========================================================
   PORT GEOMETRY
========================================================= */

function portOffset(c,p){

  const w=c.w;
  const h=c.h;

  const map = {

    tank:{
      P:{x:w/2,y:0}
    },

    pump:{
      IN:{x:0,y:h/2},
      OUT:{x:w,y:h/2}
    },

    variablePump:{
      IN:{x:0,y:h/2},
      OUT:{x:w,y:h/2}
    },

    accumulator:{
      P:{x:w/2,y:0}
    },

    valve43:{
      P:{x:0,y:h/2-22},
      T:{x:0,y:h/2+22},
      A:{x:w,y:h/2-22},
      B:{x:w,y:h/2+22}
    },

    valve42:{
      P:{x:0,y:h/2-22},
      T:{x:0,y:h/2+22},
      A:{x:w,y:h/2-22},
      B:{x:w,y:h/2+22}
    },

    proportional:{
      P:{x:0,y:h/2-22},
      T:{x:0,y:h/2+22},
      A:{x:w,y:h/2-22},
      B:{x:w,y:h/2+22}
    },

    relief:{
      IN:{x:0,y:h/2},
      OUT:{x:w,y:h/2}
    },

    reducing:{
      IN:{x:0,y:h/2},
      OUT:{x:w,y:h/2}
    },

    sequence:{
      IN:{x:0,y:h/2},
      OUT:{x:w,y:h/2}
    },

    counterbalance:{
      IN:{x:0,y:h/2},
      OUT:{x:w,y:h/2}
    },

    check:{
      IN:{x:0,y:h/2},
      OUT:{x:w,y:h/2}
    },

    flowControl:{
      IN:{x:0,y:h/2},
      OUT:{x:w,y:h/2}
    },

    throttleCheck:{
      IN:{x:0,y:h/2},
      OUT:{x:w,y:h/2}
    },

    filter:{
      IN:{x:0,y:h/2},
      OUT:{x:w,y:h/2}
    },

    cylinder:{
      A:{x:0,y:h/2-18},
      B:{x:0,y:h/2+18}
    },

    motor:{
      A:{x:0,y:h/2-18},
      B:{x:0,y:h/2+18}
    },

    gauge:{
      P:{x:w/2,y:0}
    },

    flowmeter:{
      IN:{x:0,y:h/2},
      OUT:{x:w,y:h/2}
    },

    temperature:{
      P:{x:w/2,y:0}
    }

  };

  return map[c.type]?.[p] || {x:w/2,y:h/2};
}

function worldPort(c,p){

  const o=portOffset(c,p);

  return {
    x:c.x+o.x,
    y:c.y+o.y
  };
}

function screenToWorld(clientX,clientY){

  const r=svg.getBoundingClientRect();

  return {
    x:(clientX-r.left-panX)/zoom,
    y:(clientY-r.top-panY)/zoom
  };
}

/* =========================================================
   TRANSFORM / GRID
========================================================= */

function updateTransform(){

  world.setAttribute(
    "transform",
    `translate(${panX},${panY}) scale(${zoom})`
  );
}

function drawGrid(){

  const size=40;
  const major=200;

  let s="";

  for(let x=-2000;x<=4000;x+=size){

    const majorLine=(Math.abs(x)%major===0);

    s+=`<line class="${majorLine?'gridMajor':'gridLine'}"
      x1="${x}" y1="-2000" x2="${x}" y2="4000"/>`;
  }

  for(let y=-2000;y<=4000;y+=size){

    const majorLine=(Math.abs(y)%major===0);

    s+=`<line class="${majorLine?'gridMajor':'gridLine'}"
      x1="-2000" y1="${y}" x2="4000" y2="${y}"/>`;
  }

  grid.innerHTML=s;
}

/* =========================================================
   RENDER
========================================================= */

function render(){

  updateTransform();

  componentsLayer.innerHTML="";
  wiresLayer.innerHTML="";

  renderWires();
  renderComponents();

  document.getElementById("componentCount").textContent=components.length;
  document.getElementById("connectionCount").textContent=connections.length;

  updateInspector();
  updateMobileSheetIfOpen();
}

function renderComponents(){

  for(const c of components){

    const g=document.createElementNS("http://www.w3.org/2000/svg","g");

    g.setAttribute("transform",`translate(${c.x},${c.y})`);
    g.dataset.id=c.id;
    g.classList.add("component");

    const selected=c.id===selectedId;

    let body=document.createElementNS("http://www.w3.org/2000/svg","rect");

    body.setAttribute("x",0);
    body.setAttribute("y",0);
    body.setAttribute("width",c.w);
    body.setAttribute("height",c.h);
    body.setAttribute("rx",8);

    body.setAttribute(
      "class",
      c.fault ? "componentBody componentFault" :
      selected ? "componentBody componentSelected" :
      "componentBody"
    );

    g.appendChild(body);

    drawSymbol(g,c);

    const title=document.createElementNS("http://www.w3.org/2000/svg","text");

    title.setAttribute("x",c.w/2);
    title.setAttribute("y",c.h-12);
    title.setAttribute("text-anchor","middle");
    title.setAttribute("class","componentText");
    title.textContent=c.name.length>18
      ? c.name.slice(0,18)+"…"
      : c.name;

    g.appendChild(title);

    for(const p of COMPONENTS[c.type].ports){

      const po=portOffset(c,p);

      const circle=document.createElementNS(
        "http://www.w3.org/2000/svg","circle"
      );

      circle.setAttribute("cx",po.x);
      circle.setAttribute("cy",po.y);

      circle.setAttribute(
        "r",
        window.innerWidth<=850 ? 9 : 6
      );

      const connected=connections.some(
        w=>
          (w.a.id===c.id&&w.a.port===p) ||
          (w.b.id===c.id&&w.b.port===p)
      );

      circle.setAttribute(
        "class",
        "port"+
        (connected?" connected":"")+
        (connectingPort &&
          connectingPort.id===c.id &&
          connectingPort.port===p
          ?" connecting":"")
      );

      circle.dataset.component=c.id;
      circle.dataset.port=p;

      circle.addEventListener(
        "pointerdown",
        e=>{
          e.stopPropagation();
          portPointerDown(c.id,p,e);
        }
      );

      g.appendChild(circle);

      const label=document.createElementNS(
        "http://www.w3.org/2000/svg","text"
      );

      label.setAttribute("x",po.x);
      label.setAttribute("y",po.y-10);
      label.setAttribute("text-anchor","middle");
      label.setAttribute("fill","#8ea0ba");
      label.setAttribute("font-size",window.innerWidth<=850?9:8);
      label.textContent=p;

      g.appendChild(label);
    }

    g.addEventListener(
      "pointerdown",
      e=>componentPointerDown(c,e)
    );

    componentsLayer.appendChild(g);
  }
}

/* =========================================================
   COMPONENT SYMBOLS
========================================================= */

function line(parent,x1,y1,x2,y2,cls=""){
  const l=document.createElementNS(
    "http://www.w3.org/2000/svg","line"
  );

  l.setAttribute("x1",x1);
  l.setAttribute("y1",y1);
  l.setAttribute("x2",x2);
  l.setAttribute("y2",y2);

  l.setAttribute("stroke","#dce8ff");
  l.setAttribute("stroke-width","2");

  if(cls) l.setAttribute("class",cls);

  parent.appendChild(l);

  return l;
}

function drawSymbol(g,c){

  const w=c.w;
  const h=c.h;

  if(c.type==="tank"){

    line(g,25,25,105,25);
    line(g,30,25,30,58);
    line(g,100,25,100,58);

    const t=document.createElementNS(
      "http://www.w3.org/2000/svg","text"
    );

    t.setAttribute("x",w/2);
    t.setAttribute("y",50);
    t.setAttribute("text-anchor","middle");
    t.setAttribute("fill","#54d8ff");
    t.setAttribute("font-size","12");
    t.textContent="TANK";

    g.appendChild(t);

  }else if(c.type==="pump"||c.type==="variablePump"){

    const circle=document.createElementNS(
      "http://www.w3.org/2000/svg","circle"
    );

    circle.setAttribute("cx",w/2);
    circle.setAttribute("cy",h/2);
    circle.setAttribute("r",25);
    circle.setAttribute("fill","none");
    circle.setAttribute("stroke","#dce8ff");
    circle.setAttribute("stroke-width","2");

    g.appendChild(circle);

    const poly=document.createElementNS(
      "http://www.w3.org/2000/svg","polygon"
    );

    poly.setAttribute(
      "points",
      `${w/2-9},${h/2-10} ${w/2+13},${h/2} ${w/2-9},${h/2+10}`
    );

    poly.setAttribute("fill","#54d8ff");

    g.appendChild(poly);

    if(c.type==="variablePump"){
      line(g,43,16,88,64);
      line(g,48,16,93,64);
    }

  }else if(
    c.type==="valve43" ||
    c.type==="valve42" ||
    c.type==="proportional"
  ){

    const boxes=c.type==="valve43"?3:2;

    const bw=w/boxes;

    for(let i=0;i<boxes;i++){

      const r=document.createElementNS(
        "http://www.w3.org/2000/svg","rect"
      );

      r.setAttribute("x",i*bw);
      r.setAttribute("y",10);
      r.setAttribute("width",bw);
      r.setAttribute("height",h-20);
      r.setAttribute("fill","none");
      r.setAttribute("stroke","#dce8ff");
      r.setAttribute("stroke-width","1.5");

      g.appendChild(r);
    }

    const pos=c.params.position;

    if(pos==="extend"){
      line(g,15,h/2,45,h/2);
      line(g,45,h/2,65,h/2-15);
      line(g,65,h/2-15,95,h/2-15);
    }else if(pos==="retract"){
      line(g,95,h/2,65,h/2+15);
      line(g,65,h/2+15,45,h/2);
      line(g,45,h/2,15,h/2);
    }else{
      line(g,45,h/2,85,h/2);
    }

    if(c.type==="proportional"){
      const txt=document.createElementNS(
        "http://www.w3.org/2000/svg","text"
      );

      txt.setAttribute("x",w/2);
      txt.setAttribute("y",h/2+5);
      txt.setAttribute("text-anchor","middle");
      txt.setAttribute("fill","#f5c451");
      txt.setAttribute("font-size","10");

      txt.textContent=(c.params.command||0)+"%";

      g.appendChild(txt);
    }

  }else if(
    c.type==="relief"||
    c.type==="reducing"||
    c.type==="sequence"||
    c.type==="counterbalance"
  ){

    const d=document.createElementNS(
      "http://www.w3.org/2000/svg","polygon"
    );

    d.setAttribute(
      "points",
      `${w/2},12 ${w-18},${h/2} ${w/2},${h-12} 18,${h/2}`
    );

    d.setAttribute("fill","none");
    d.setAttribute("stroke","#dce8ff");
    d.setAttribute("stroke-width","2");

    g.appendChild(d);

    line(g,35,h/2,w-35,h/2);

    const t=document.createElementNS(
      "http://www.w3.org/2000/svg","text"
    );

    t.setAttribute("x",w/2);
    t.setAttribute("y",h/2-7);
    t.setAttribute("text-anchor","middle");
    t.setAttribute("fill","#f5c451");
    t.setAttribute("font-size","9");

    t.textContent=
      c.params.setting!==undefined
      ? c.params.setting+" bar"
      :"VALVE";

    g.appendChild(t);

  }else if(
    c.type==="check"||
    c.type==="flowControl"||
    c.type==="throttleCheck"||
    c.type==="filter"
  ){

    line(g,20,h/2,w-20,h/2);

    if(c.type==="check"){

      const poly=document.createElementNS(
        "http://www.w3.org/2000/svg","polygon"
      );

      poly.setAttribute(
        "points",
        `${w/2-15},${h/2-13} ${w/2+10},${h/2} ${w/2-15},${h/2+13}`
      );

      poly.setAttribute("fill","#54d8ff");

      g.appendChild(poly);

      line(g,w/2+10,h/2-17,w/2+10,h/2+17);

    }else if(c.type==="filter"){

      for(let i=-15;i<=15;i+=8){
        line(g,w/2+i,h/2-14,w/2+i,h/2+14);
      }

    }else{

      line(g,w/2-18,h/2-18,w/2+18,h/2+18);

      const t=document.createElementNS(
        "http://www.w3.org/2000/svg","text"
      );

      t.setAttribute("x",w/2);
      t.setAttribute("y",h/2-8);
      t.setAttribute("text-anchor","middle");
      t.setAttribute("fill","#54d8ff");
      t.setAttribute("font-size","9");

      t.textContent=
        Math.round(c.params.opening||100)+"%";

      g.appendChild(t);
    }

  }else if(c.type==="cylinder"){

    line(g,18,h/2,55,h/2);

    const rect=document.createElementNS(
      "http://www.w3.org/2000/svg","rect"
    );

    rect.setAttribute("x",55);
    rect.setAttribute("y",22);
    rect.setAttribute("width",45);
    rect.setAttribute("height",36);
    rect.setAttribute("fill","none");
    rect.setAttribute("stroke","#dce8ff");
    rect.setAttribute("stroke-width","2");

    g.appendChild(rect);

    line(g,100,h/2,118,h/2);

    line(g,65,22,65,58);

  }else if(c.type==="motor"){

    const circle=document.createElementNS(
      "http://www.w3.org/2000/svg","circle"
    );

    circle.setAttribute("cx",w/2);
    circle.setAttribute("cy",h/2);
    circle.setAttribute("r",25);
    circle.setAttribute("fill","none");
    circle.setAttribute("stroke","#dce8ff");
    circle.setAttribute("stroke-width","2");

    g.appendChild(circle);

    const t=document.createElementNS(
      "http://www.w3.org/2000/svg","text"
    );

    t.setAttribute("x",w/2);
    t.setAttribute("y",h/2+6);
    t.setAttribute("text-anchor","middle");
    t.setAttribute("fill","#54d8ff");
    t.setAttribute("font-size","18");
    t.textContent="↻";

    g.appendChild(t);

  }else{

    const t=document.createElementNS(
      "http://www.w3.org/2000/svg","text"
    );

    t.setAttribute("x",w/2);
    t.setAttribute("y",h/2+7);
    t.setAttribute("text-anchor","middle");
    t.setAttribute("fill","#54d8ff");
    t.setAttribute("font-size","24");
    t.textContent=COMPONENTS[c.type].icon;

    g.appendChild(t);
  }
}

/* =========================================================
   WIRES
========================================================= */

function renderWires(){

  for(const w of connections){

    const a=getC(w.a.id);
    const b=getC(w.b.id);

    if(!a||!b) continue;

    const p1=worldPort(a,w.a.port);
    const p2=worldPort(b,w.b.port);

    const mid=(p1.x+p2.x)/2;

    const path=document.createElementNS(
      "http://www.w3.org/2000/svg","path"
    );

    path.setAttribute(
      "d",
      `M ${p1.x} ${p1.y}
       C ${mid} ${p1.y},
         ${mid} ${p2.y},
         ${p2.x} ${p2.y}`
    );

    path.setAttribute(
      "class",
      "wire"+(running?" active":"")
    );

    wiresLayer.appendChild(path);

    if(running){

      const flow=Math.abs(getWireFlow(w));

      const count=clamp(Math.round(flow/15),1,5);

      for(let i=0;i<count;i++){

        const dot=document.createElementNS(
          "http://www.w3.org/2000/svg","circle"
        );

        dot.setAttribute("r",3.5);
        dot.setAttribute("class","flowDot");

        const length=path.getTotalLength();

        const progress=
          ((performance.now()/700)+(i/count))%1;

        const point=path.getPointAtLength(
          progress*length
        );

        dot.setAttribute("cx",point.x);
        dot.setAttribute("cy",point.y);

        wiresLayer.appendChild(dot);
      }
    }
  }
}

/* =========================================================
   ADD / DELETE / HISTORY
========================================================= */

function addComponent(type){

  const rect=svg.getBoundingClientRect();

  const centre=screenToWorld(
    rect.left+rect.width/2,
    rect.top+rect.height/2
  );

  const c=makeComponent(
    type,
    Math.round((centre.x-65)/20)*20,
    Math.round((centre.y-40)/20)*20
  );

  components.push(c);

  selectedId=c.id;

  pushHistory();

  render();

  showToast(componentName(c)+" added");

  if(window.innerWidth<=850){
    setTimeout(()=>setMobileTab("properties"),80);
  }
}

function deleteSelected(){

  if(!selectedId) return;

  connections=connections.filter(
    w=>w.a.id!==selectedId && w.b.id!==selectedId
  );

  components=components.filter(
    c=>c.id!==selectedId
  );

  selectedId=null;

  pushHistory();
  render();
}

function pushHistory(){

  history=history.slice(0,historyIndex+1);

  history.push({
    components:clone(components),
    connections:clone(connections)
  });

  if(history.length>50){
    history.shift();
  }else{
    historyIndex++;
  }
}

function undo(){

  if(historyIndex<=0) return;

  historyIndex--;

  const h=history[historyIndex];

  components=clone(h.components);
  connections=clone(h.connections);

  selectedId=null;

  render();
}

function redo(){

  if(historyIndex>=history.length-1) return;

  historyIndex++;

  const h=history[historyIndex];

  components=clone(h.components);
  connections=clone(h.connections);

  selectedId=null;

  render();
}

/* =========================================================
   POINTER / TOUCH
========================================================= */

function componentPointerDown(c,e){

  if(e.button!==undefined && e.button!==0) return;

  if(pointerMode!=="select") return;

  e.stopPropagation();

  selectedId=c.id;

  activePointer=e.pointerId;

  dragStart={
    x:e.clientX,
    y:e.clientY,
    cx:c.x,
    cy:c.y
  };

  try{
    e.currentTarget.setPointerCapture(e.pointerId);
  }catch{}

  render();

  const move=ev=>{

    if(ev.pointerId!==activePointer) return;

    const dx=(ev.clientX-dragStart.x)/zoom;
    const dy=(ev.clientY-dragStart.y)/zoom;

    c.x=Math.round((dragStart.cx+dx)/10)*10;
    c.y=Math.round((dragStart.cy+dy)/10)*10;

    render();
  };

  const up=ev=>{

    if(ev.pointerId!==activePointer) return;

    document.removeEventListener("pointermove",move);
    document.removeEventListener("pointerup",up);

    activePointer=null;
    dragStart=null;

    pushHistory();
  };

  document.addEventListener("pointermove",move);
  document.addEventListener("pointerup",up);
}

function portPointerDown(id,port,e){

  if(connectingPort){

    if(
      connectingPort.id===id &&
      connectingPort.port===port
    ){
      cancelConnection();
      return;
    }

    if(
      hasConnection(
        connectingPort.id,
        connectingPort.port,
        id,
        port
      )
    ){
      showToast("Ports already connected");
      cancelConnection();
      return;
    }

    connections.push({
      id:uid(),
      a:{
        id:connectingPort.id,
        port:connectingPort.port
      },
      b:{
        id,
        port
      }
    });

    pushHistory();

    showToast("Hydraulic connection created");

    connectingPort=null;

    document.getElementById(
      "connectionHint"
    ).classList.remove("show");

    render();

    return;
  }

  connectingPort={id,port};

  document.getElementById(
    "connectionHint"
  ).classList.add("show");

  render();

  showToast("Now tap another port");
}

function cancelConnection(){

  connectingPort=null;

  document.getElementById(
    "connectionHint"
  ).classList.remove("show");

  render();
}

function hasConnection(id1,p1,id2,p2){

  return connections.some(w=>
    (w.a.id===id1&&w.a.port===p1&&w.b.id===id2&&w.b.port===p2) ||
    (w.a.id===id2&&w.a.port===p2&&w.b.id===id1&&w.b.port===p1)
  );
}

/* =========================================================
   WORKSPACE BACKGROUND
========================================================= */

svg.addEventListener("pointerdown",e=>{

  if(e.target!==svg) return;

  selectedId=null;

  if(connectingPort){
    cancelConnection();
    return;
  }

  render();
});

function zoomBy(f){

  zoom=clamp(zoom*f,.35,2.8);

  updateTransform();
  render();
}

function fitView(){

  if(!components.length){

    zoom=1;
    panX=window.innerWidth/2;
    panY=window.innerHeight/2;

    updateTransform();

    return;
  }

  let minX=Infinity;
  let minY=Infinity;
  let maxX=-Infinity;
  let maxY=-Infinity;

  for(const c of components){

    minX=Math.min(minX,c.x);
    minY=Math.min(minY,c.y);

    maxX=Math.max(maxX,c.x+c.w);
    maxY=Math.max(maxY,c.y+c.h);
  }

  const r=svg.getBoundingClientRect();

  const pad=100;

  const sx=(r.width-pad)/(maxX-minX+1);
  const sy=(r.height-pad)/(maxY-minY+1);

  zoom=clamp(Math.min(sx,sy),.35,1.5);

  panX=r.width/2-(minX+maxX)/2*zoom;
  panY=r.height/2-(minY+maxY)/2*zoom;

  updateTransform();
  render();
}

/* =========================================================
   GRAPH / HYDRAULIC NETWORK
========================================================= */

function connectedComponents(id){

  const ids=new Set([id]);

  let changed=true;

  while(changed){

    changed=false;

    for(const w of connections){

      if(ids.has(w.a.id)&&!ids.has(w.b.id)){
        ids.add(w.b.id);
        changed=true;
      }

      if(ids.has(w.b.id)&&!ids.has(w.a.id)){
        ids.add(w.a.id);
        changed=true;
      }
    }
  }

  return [...ids].map(getC).filter(Boolean);
}

function connectedPorts(id,port){

  const out=[];

  for(const w of connections){

    if(w.a.id===id&&w.a.port===port){
      out.push(w.b);
    }

    if(w.b.id===id&&w.b.port===port){
      out.push(w.a);
    }
  }

  return out;
}

function endpointKey(id,port){
  return id+":"+port;
}

/* =========================================================
   HYDRAULIC PATH LOGIC
========================================================= */

function componentInternalConnection(c,p1,p2){

  if(c.type==="tank") return false;

  if(c.type==="pump"){
    return p1==="IN"&&p2==="OUT" || p1==="OUT"&&p2==="IN";
  }

  if(c.type==="variablePump"){
    return p1==="IN"&&p2==="OUT" || p1==="OUT"&&p2==="IN";
  }

  if(
    [
      "relief",
      "reducing",
      "sequence",
      "counterbalance",
      "check",
      "flowControl",
      "throttleCheck",
      "filter",
      "flowmeter"
    ].includes(c.type)
  ){
    return (
      (p1==="IN"&&p2==="OUT") ||
      (p1==="OUT"&&p2==="IN")
    );
  }

  if(
    ["valve43","valve42","proportional"].includes(c.type)
  ){
    const pairs=valveConnections(c);

    return pairs.some(
      p=>
        (p[0]===p1&&p[1]===p2) ||
        (p[0]===p2&&p[1]===p1)
    );
  }

  if(c.type==="cylinder"){
    return false;
  }

  if(c.type==="motor"){
    return false;
  }

  return false;
}

function valveConnections(c){

  if(c.type==="valve43"){

    if(c.params.position==="extend"){

      return [
        ["P","A"],
        ["B","T"]
      ];

    }

    if(c.params.position==="retract"){

      return [
        ["P","B"],
        ["A","T"]
      ];
    }

    if(c.params.centre==="open"){

      return [
        ["P","T"],
        ["P","A"],
        ["P","B"]
      ];
    }

    if(c.params.centre==="float"){

      return [
        ["A","T"],
        ["B","T"]
      ];
    }

    return [];
  }

  if(c.type==="valve42"){

    if(c.params.position==="retract"){

      return [
        ["P","B"],
        ["A","T"]
      ];
    }

    return [
      ["P","A"],
      ["B","T"]
    ];
  }

  if(c.type==="proportional"){

    const cmd=Number(c.params.command)||0;

    if(cmd>50){

      return [
        ["P","A"],
        ["B","T"]
      ];
    }

    if(cmd<50){

      return [
        ["P","B"],
        ["A","T"]
      ];
    }

    return [];
  }

  return [];
}

function hasTankPath(startId,startPort){

  const queue=[
    {id:startId,port:startPort}
  ];

  const visited=new Set();

  while(queue.length){

    const current=queue.shift();

    const key=endpointKey(
      current.id,
      current.port
    );

    if(visited.has(key)) continue;

    visited.add(key);

    const c=getC(current.id);

    if(!c) continue;

    if(c.type==="tank") return true;

    for(const next of connectedPorts(
      current.id,
      current.port
    )){
      queue.push(next);
    }

    for(const p of COMPONENTS[c.type].ports){

      if(p!==current.port &&
         componentInternalConnection(
           c,
           current.port,
           p
         )){
        queue.push({
          id:c.id,
          port:p
        });
      }
    }
  }

  return false;
}

/* =========================================================
   PRESSURE / FLOW ENGINE
========================================================= */

function pumpAvailableFlow(c){

  if(c.fault==="pumpWear"){

    return (
      Number(c.params.displacement)*
      Number(c.params.rpm)/1000*
      .55
    );
  }

  let swash=1;

  if(c.type==="variablePump"){
    swash=clamp(
      Number(c.params.swash)/100,
      0,
      1
    );
  }

  const displacement=
    Number(c.params.displacement)||0;

  const rpm=
    Number(c.params.rpm)||0;

  const efficiency=
    Number(c.params.efficiency)||.9;

  return displacement*rpm/1000*efficiency*swash;
}

function cylinderAreaA(c){

  const d=Number(c.params.bore)||100;

  return Math.PI*d*d/4/1e6;
}

function cylinderAreaB(c){

  const d=Number(c.params.bore)||100;
  const rod=Number(c.params.rod)||50;

  return Math.PI*(d*d-rod*rod)/4/1e6;
}

function pressureFromLoad(c){

  const force=
    (Number(c.params.load)||0)+
    (Number(c.params.friction)||0);

  return force/Math.max(
    cylinderAreaA(c),
    .000001
  )/1e5;
}

function cylinderRequiredPressure(c){

  return pressureFromLoad(c);
}

function flowControlCapacity(c){

  const opening=
    clamp(
      Number(c.params.opening)||0,
      0,
      100
    )/100;

  const max=
    Number(c.params.maxFlow)||0;

  return max*opening;
}

function pressureDropForFlow(c,flow){

  if(c.type==="filter"){

    if(c.fault==="blockedFilter"){
      return 60+flow*.5;
    }

    return flow*
      Number(c.params.restriction||.3);
  }

  if(
    c.type==="flowControl"||
    c.type==="throttleCheck"
  ){

    const capacity=flowControlCapacity(c);

    if(flow<=capacity) return 2;

    return (flow-capacity)*2;
  }

  if(c.type==="check"){
    return Math.max(
      0,
      Number(c.params.cracking)||.5
    );
  }

  return 1;
}

function estimatePumpLoad(c){

  const pressure=getSystemPressureRaw();

  const flow=pumpAvailableFlow(c);

  return pressure*flow/600;
}

function networkPressures(){

  const result={};

  for(const c of components){

    result[c.id]={
      ports:{},
      flow:0
    };
  }

  const pump=components.find(
    c=>c.type==="pump"||
       c.type==="variablePump"
  );

  if(!pump){
    return result;
  }

  let pressure=0;

  const cylinders=components.filter(
    c=>c.type==="cylinder"
  );

  for(const cyl of cylinders){

    const required=
      cylinderRequiredPressure(cyl);

    pressure=Math.max(
      pressure,
      required
    );
  }

  const relief=components.find(
    c=>c.type==="relief"
  );

  if(relief){
    pressure=Math.min(
      pressure,
      Number(relief.params.setting)||210
    );
  }

  const variable=components.find(
    c=>c.type==="variablePump"
  );

  if(variable){

    const compensator=
      Number(variable.params.compensator)||250;

    if(pressure>compensator){
      pressure=compensator;
    }
  }

  pressure=Math.max(0,pressure);

  for(const c of components){

    const p={};

    for(const port of COMPONENTS[c.type].ports){

      if(port==="T"||
         c.type==="tank"){

        p[port]=0;

      }else{

        p[port]=pressure;
      }
    }

    result[c.id].ports=p;
  }

  simulation.pressure=pressure;

  return result;
}

function calculateSystem(){

  const pump=
    components.find(
      c=>c.type==="pump"||
         c.type==="variablePump"
    );

  let totalFlow=0;

  if(pump){
    totalFlow=pumpAvailableFlow(pump);
  }

  const cylinders=
    components.filter(
      c=>c.type==="cylinder"
    );

  let demandedFlow=0;

  for(const c of cylinders){

    let target=0;

    const valves=components.filter(
      x=>
        x.type==="valve43"||
        x.type==="valve42"||
        x.type==="proportional"
    );

    if(valves.some(
      v=>v.params.position==="extend"||
         (v.type==="proportional" &&
          Number(v.params.command)>50)
    )){
      target=1;
    }

    if(valves.some(
      v=>v.params.position==="retract"||
         (v.type==="proportional" &&
          Number(v.params.command)<50)
    )){
      target=-1;
    }

    if(
      c.fault==="cylinderLeakage"
    ){
      target*=.65;
    }

    const area=
      target>=0
      ?cylinderAreaA(c)
      :cylinderAreaB(c);

    demandedFlow+=
      Math.abs(
        area*
        (Number(c.params.maxSpeed)||300)*
        60000/1000
      );
  }

  if(cylinders.length){

    totalFlow=Math.min(
      totalFlow,
      Math.max(demandedFlow,1)
    );
  }

  simulation.flow=Math.max(
    0,
    totalFlow
  );

  const pressure=getSystemPressureRaw();

  simulation.power=
    pressure*
    simulation.flow/
    600;

  return simulation;
}

function getSystemPressureRaw(){

  const pump=
    components.find(
      c=>c.type==="pump"||
         c.type==="variablePump"
    );

  if(!pump) return 0;

  let p=0;

  const cylinders=
    components.filter(
      c=>c.type==="cylinder"
    );

  for(const c of cylinders){

    p=Math.max(
      p,
      cylinderRequiredPressure(c)
    );
  }

  const relief=
    components.find(
      c=>c.type==="relief"
    );

  if(relief){

    const setting=
      Number(relief.params.setting)||210;

    if(p>=setting){
      simulation.reliefOpen=true;
      p=setting;
    }else{
      simulation.reliefOpen=false;
    }
  }

  const variable=
    components.find(
      c=>c.type==="variablePump"
    );

  if(variable){

    const comp=
      Number(variable.params.compensator)||250;

    p=Math.min(p,comp);
  }

  return Math.max(0,p);
}

function getSystemFlowRaw(){

  return simulation.flow||0;
}

function getSystemPressure(){

  return getSystemPressureRaw();
}

function getSystemFlow(){

  return getSystemFlowRaw();
}

function getWireFlow(w){

  const a=getC(w.a.id);
  const b=getC(w.b.id);

  if(!a||!b) return 0;

  const flow=getSystemFlowRaw();

  if(
    a.type==="tank"||
    b.type==="tank"
  ){
    return flow;
  }

  return flow;
}

function getPortPressure(id,port){

  const c=getC(id);

  if(!c) return 0;

  if(c.type==="tank") return 0;

  if(port==="T") return 0;

  return getSystemPressureRaw();
}

/* =========================================================
   CYLINDER / MOTOR
========================================================= */

function updateCylinder(c,dt){

  let direction=0;

  const valves=
    components.filter(
      x=>
        x.type==="valve43"||
        x.type==="valve42"||
        x.type==="proportional"
    );

  for(const v of valves){

    if(v.type==="proportional"){

      const cmd=
        Number(v.params.command)||0;

      if(cmd>55) direction=1;
      else if(cmd<45) direction=-1;

    }else{

      if(v.params.position==="extend")
        direction=1;

      if(v.params.position==="retract")
        direction=-1;
    }
  }

  if(!direction){
    c.state.speed=0;
    return;
  }

  const available=
    getSystemFlowRaw();

  const area=
    direction>0
    ?cylinderAreaA(c)
    :cylinderAreaB(c);

  let speed=
    available/
    Math.max(area*60000/1000,.0001);

  speed=
    Math.min(
      speed,
      Number(c.params.maxSpeed)||300
    );

  if(c.fault==="cylinderLeakage"){
    speed*=.65;
  }

  c.state.speed=
    direction*speed;

  c.params.position+=
    c.state.speed*dt/1000;

  c.params.position=
    clamp(
      c.params.position,
      0,
      Number(c.params.stroke)||500
    );

  c.state.pressureA=
    direction>0
    ?getSystemPressureRaw()
    :0;

  c.state.pressureB=
    direction<0
    ?getSystemPressureRaw()
    :0;

  c.state.flow=available;
}

function updateMotor(c,dt){

  const pressure=
    getSystemPressureRaw();

  const displacement=
    Number(c.params.displacement)||80;

  const theoretical=
    pressure*displacement/
    600;

  let speed=
    pressure*8;

  speed=
    Math.min(
      speed,
      Number(c.params.speedLimit)||2500
    );

  if(
    Math.abs(theoretical)<
    Number(c.params.loadTorque)||100
  ){
    speed*=.2;
  }

  c.state.speed=speed;
  c.state.pressureA=pressure;
  c.state.flow=getSystemFlowRaw();
}

/* =========================================================
   TEMPERATURE
========================================================= */

function updateTemperature(dt){

  const pressure=
    getSystemPressureRaw();

  const flow=
    getSystemFlowRaw();

  let heat=
    25+
    pressure*.04+
    flow*.03;

  if(simulation.reliefOpen){
    heat+=15;
  }

  if(heat>100){
    heat=100;
  }

  simulation.temperature=
    simulation.temperature+
    (heat-simulation.temperature)*
    Math.min(dt/2000,1);

  for(const c of components){

    if(
      c.type==="temperature"||
      c.type==="pump"||
      c.type==="variablePump"
    ){
      c.state.temperature=
        simulation.temperature;
    }
  }
}

/* =========================================================
   DIAGNOSTICS
========================================================= */

function diagnostics(){

  const list=[];

  const pump=
    components.find(
      c=>c.type==="pump"||
         c.type==="variablePump"
    );

  const tank=
    components.find(
      c=>c.type==="tank"
    );

  const cylinder=
    components.find(
      c=>c.type==="cylinder"
    );

  if(!tank){
    list.push({
      type:"bad",
      text:"No reservoir/tank detected."
    });
  }

  if(!pump){
    list.push({
      type:"bad",
      text:"No hydraulic pump detected."
    });
  }

  if(pump&&tank){

    if(
      !hasTankPath(
        pump.id,
        "IN"
      )
    ){

      list.push({
        type:"bad",
        text:"Pump inlet does not appear connected to tank."
      });
    }else{

      list.push({
        type:"good",
        text:"Pump inlet has a tank return path."
      });
    }
  }

  if(pump){

    const flow=pumpAvailableFlow(pump);

    if(flow<=0){

      list.push({
        type:"bad",
        text:"Pump is producing little or no flow."
      });

    }else{

      list.push({
        type:"good",
        text:
          "Pump theoretical available flow: "+
          fmt(flow,1)+" L/min."
      });
    }

    if(
      pump.fault==="pumpWear"
    ){

      list.push({
        type:"warn",
        text:"Pump wear fault is active."
      });
    }
  }

  const filter=
    components.find(
      c=>c.type==="filter"
    );

  if(filter){

    if(filter.fault==="blockedFilter"){

      list.push({
        type:"bad",
        text:"Filter is blocked. High restriction expected."
      });

    }else{

      list.push({
        type:"good",
        text:"Filter present in circuit."
      });
    }
  }

  if(cylinder){

    const required=
      cylinderRequiredPressure(cylinder);

    const actual=
      getSystemPressureRaw();

    if(actual>=required){

      list.push({
        type:"good",
        text:
          "Cylinder load pressure satisfied: "+
          fmt(required,1)+" bar."
      });

    }else{

      list.push({
        type:"warn",
        text:
          "Cylinder requires approximately "+
          fmt(required,1)+" bar."
      });
    }

    if(
      cylinder.fault==="cylinderLeakage"
    ){

      list.push({
        type:"bad",
        text:"Cylinder internal leakage fault is active."
      });
    }
  }

  const relief=
    components.find(
      c=>c.type==="relief"
    );

  if(relief){

    const setting=
      Number(relief.params.setting)||210;

    if(getSystemPressureRaw()>=setting){

      list.push({
        type:"warn",
        text:
          "Relief valve is at or near its setting."
      });

    }else{

      list.push({
        type:"good",
        text:
          "Relief valve setting: "+
          fmt(setting,0)+" bar."
      });
    }
  }

  if(!list.length){

    list.push({
      type:"good",
      text:"No obvious diagnostic conditions detected."
    });
  }

  return list;
}

function setName(id,value){

  const c=getC(id);

  if(!c) return;

  c.name=value||COMPONENTS[c.type].name;

  pushHistory();
  render();
}

function setParam(id,key,value){

  const c=getC(id);

  if(!c) return;

  if(
    typeof value==="string" &&
    !isNaN(value) &&
    value.trim()!==""
  ){
    c.params[key]=Number(value);
  }else{
    c.params[key]=value;
  }

  if(key==="position" &&
     ["extend","retract"].includes(value)){
    c.params.position=value;
  }

  pushHistory();
  calculateSystem();
  render();
}

function setFault(id,value){

  const c=getC(id);

  if(!c) return;

  c.fault=value||null;

  pushHistory();
  render();

  showToast(
    c.fault
    ?"Fault injected: "+c.fault
    :"Fault cleared"
  );
}

function saveProject(){

  const data={
    version:4,
    app:"Hydraulic Studio",
    components,
    connections
  };

  const blob=new Blob(
    [JSON.stringify(data,null,2)],
    {type:"application/json"}
  );

  const url=URL.createObjectURL(blob);

  const a=document.createElement("a");

  a.href=url;
  a.download="hydraulic-studio-project.json";

  a.click();

  URL.revokeObjectURL(url);

  showToast("Project saved");
}

document
  .getElementById("fileInput")
  .addEventListener("change",e=>{

    const file=e.target.files[0];

    if(!file) return;

    const reader=new FileReader();

    reader.onload=()=>{

      try{

        const data=
          JSON.parse(reader.result);

        components=
          Array.isArray(data.components)
          ?data.components:[ ];

        connections=
          Array.isArray(data.connections)
          ?data.connections:[ ];

        selectedId=null;

        pushHistory();
        render();

        showToast("Project loaded");

      }catch(err){

        alert("Could not load project.");
      }
    };

    reader.readAsText(file);

    e.target.value="";
  });

function newProject(){

  if(
    components.length &&
    !confirm("Start a new project? Unsaved changes will be lost.")
  ){
    return;
  }

  components=[];
  connections=[];
  selectedId=null;

  zoom=1;
  panX=0;
  panY=0;

  history=[];
  historyIndex=-1;

  pushHistory();

  render();

  showToast("New project created");
}

/* =========================================================
   SIMULATION
========================================================= */

function simulationStep(dt){

  calculateSystem();

  for(const c of components){

    if(c.type==="cylinder"){
      updateCylinder(c,dt);
    }

    if(c.type==="motor"){
      updateMotor(c,dt);
    }
  }

  updateTemperature(dt);

  simulation.tankLevel=
    clamp(
      simulation.tankLevel,
      0,
      100
    );
}

function simulationLoop(now){

  const dt=
    Math.min(
      now-lastTime,
      100
    );

  lastTime=now;

  if(running){

    simulationStep(dt);

    updateMetrics();

    renderWires();

    if(
      selectedId &&
      getC(selectedId)
    ){
      updateInspector();
    }
  }

  requestAnimationFrame(simulationLoop);
}

function toggleSimulation(){

  running=!running;

  updateRunButton();

  if(running){

    showToast("Simulation running");

  }else{

    showToast("Simulation paused");
  }
}

function updateRunButton(){

  const desktop=
    document.getElementById("desktopRun");

  const mobile=
    document.getElementById("mobileRun");

  if(running){

    desktop.textContent="■ Stop";
    desktop.classList.remove("success");
    desktop.classList.add("danger");

    mobile.textContent="■";
    mobile.classList.add("running");

    document
      .getElementById("statusDot")
      .classList.remove("off");

    document
      .getElementById("statusText")
      .textContent="Simulation running";

  }else{

    desktop.textContent="▶ Run";
    desktop.classList.remove("danger");
    desktop.classList.add("success");

    mobile.textContent="▶";
    mobile.classList.remove("running");

    document
      .getElementById("statusDot")
      .classList.add("off");

    document
      .getElementById("statusText")
      .textContent="Simulation stopped";
  }
}

function resetSimulation(){

  for(const c of components){

    if(c.type==="cylinder"){

      c.params.position=100;

      c.state.pressureA=0;
      c.state.pressureB=0;
      c.state.flow=0;
      c.state.speed=0;
    }

    if(c.type==="motor"){

      c.state.speed=0;
      c.state.flow=0;
      c.state.pressureA=0;
      c.state.pressureB=0;
    }
  }

  simulation={
    pressure:0,
    flow:0,
    power:0,
    temperature:25,
    tankLevel:75,
    cavitation:false,
    reliefOpen:false
  };

  render();

  showToast("Simulation reset");
}

function renderMobileComponents(){

  const box=
    document.getElementById(
      "mobileComponentGrid"
    );

  if(!box) return;

  const search=
    (
      document.getElementById(
        "mobileComponentSearch"
      )?.value||""
    ).toLowerCase();

  let html="";

  const cats={};

  Object.entries(COMPONENTS).forEach(
    ([type,spec])=>{

      if(
        search &&
        !(
          spec.name.toLowerCase().includes(search)||
          type.toLowerCase().includes(search)
        )
      ){
        return;
      }

      if(!cats[spec.category]){
        cats[spec.category]=[];
      }

      cats[spec.category].push(
        [type,spec]
      );
    }
  );

  for(const [category,items] of Object.entries(cats)){

    html+=`
      <div style="grid-column:1/-1;color:#94a3b8;font-size:10px;font-weight:800;margin-top:7px">
        ${category}
      </div>
    `;

    for(const [type,spec] of items){

      html+=`

        <button
          class="mobileComponent"
          onclick="addComponent('${type}')"
        >

          <span class="componentIcon">
            ${spec.icon}
          </span>

          <span>
            <strong>${escapeHtml(spec.name)}</strong>
            <small>Tap to add</small>
          </span>

        </button>
      `;
    }
  }

  box.innerHTML=
    html ||
    `<div class="emptyState">
      No components found.
    </div>`;
}

   KEYBOARD
========================================================= */

document.addEventListener("keydown",e=>{

  if(
    e.key==="Delete"||
    e.key==="Backspace"
  ){

    const active=
      document.activeElement;

    if(
      active &&
      (
        active.tagName==="INPUT"||
        active.tagName==="SELECT"||
        active.tagName==="TEXTAREA"
      )
    ){
      return;
    }

    deleteSelected();
  }

  if(
    (e.ctrlKey||e.metaKey)&&
    e.key.toLowerCase()==="z"
  ){

    e.preventDefault();

    if(e.shiftKey){
      redo();
    }else{
      undo();
    }
  }

  if(
    (e.ctrlKey||e.metaKey)&&
    e.key.toLowerCase()==="y"
  ){

    e.preventDefault();
    redo();
  }

  if(
    e.code==="Space" &&
    document.activeElement.tagName!=="INPUT"
  ){

    e.preventDefault();
    toggleSimulation();
  }

  if(e.key==="Escape"){
    cancelConnection();
    closeMenu();
  }
});

/* =========================================================
   RESPONSIVE
========================================================= */

window.addEventListener(
  "resize",
  ()=>{
    render();
  }
);

/* =========================================================
   MOBILE SWIPE / SHEET CLOSE
========================================================= */

let sheetTouchStartY=null;

document
  .getElementById("mobileSheet")
  .addEventListener(
    "touchstart",
    e=>{
      sheetTouchStartY=
        e.touches[0].clientY;
    },
    {passive:true}
  );

document
  .getElementById("mobileSheet")
  .addEventListener(
    "touchend",
    e=>{

      if(sheetTouchStartY===null) return;

      const y=e.changedTouches[0].clientY;

      if(
        y-sheetTouchStartY>70
      ){
        closeMobileSheet();
      }

      sheetTouchStartY=null;
    },
    {passive:true}
  );

/* =========================================================
   INITIALISE
========================================================= */

drawGrid();

renderLibrary();

loadExample();

updateRunButton();

requestAnimationFrame(
  simulationLoop
);

/* Start with clean desktop view / closed mobile sheet */

if(window.innerWidth<=850){

  closeMobileSheet();

  mobileTab="components";

  updateMobileNav();

}else{

  fitView();
}

</script>

</html>
